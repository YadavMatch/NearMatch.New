ncreate policy matches_member_update on matches\n    for update using (user_low = auth.uid() or user_high = auth.uid())\n    with check (user_low = auth.uid() or user_high = auth.uid());\n\n-- ---------- messages ----------\ndrop policy if exists messages_member_select on messages;\ncreate policy messages_member_select on messages\n    for select using (is_match_member(match_id));\n\ndrop policy if exists messages_member_insert on messages;\ncreate policy messages_member_insert on messages\n    for insert with check (\n        sender_id = auth.uid()\n        and is_match_member(match_id)\n        and exists (select 1 from matches m where m.id = match_id and m.is_active)\n    );\n\n-- Only the recipient marks a message read.\ndrop policy if exists messages_mark_read on messages;\ncreate policy messages_mark_read on messages\n    for update using (is_match_member(match_id) and sender_id \u003c> auth.uid())\n    with check (is_match_member(match_id) and sender_id \u003c> auth.uid());\n\n-- ---------- blocks / reports / devices ----------\ndrop policy if exists blocks_own on blocks;\ncreate policy blocks_own on blocks\n    for all using (blocker_id = auth.uid()) with check (blocker_id = auth.uid());\n\ndrop policy if exists reports_insert_own on reports;\ncreate policy reports_insert_own on reports\n    for insert with check (reporter_id = auth.uid());\n\n-- Reporters cannot read the moderation queue back.\ndrop policy if exists reports_select_own on reports;\ncreate policy reports_select_own on reports\n    for select using (reporter_id = auth.uid());\n\ndrop policy if exists devices_own on devices;\ncreate policy devices_own on devices\n    for all using (profile_id = auth.uid()) with check (profile_id = auth.uid());\n"}, {"p": "supabase/migrations/20261115091000_match_trigger.sql", "l": "sql", "n": 60, "c": "-- NearMatch: create a match the instant a like becomes mutual.\n--\n-- Doing this in the database means a match cannot be missed if two likes land\n-- concurrently, and the client gets it over realtime without waiting on the API.\n\ncreate or replace function create_match_on_reciprocal_like()\nreturns trigger\nlanguage plpgsql security definer set search_path = public as $$\ndeclare\n    v_low  uuid;\n    v_high uuid;\nbegin\n    if new.action not in ('like', 'superlike') then\n        return new;\n    end if;\n\n    -- Did the target already like the actor?\n    if not exists (\n        select 1 from swipes s\n         where s.actor_id = new.target_id\n           and s.target_id = new.actor_id\n           and s.action in ('like', 'superlike')\n    ) then\n        return new;\n    end if;\n\n    if new.actor_id \u003c new.target_id then\n        v_low := new.actor_id; v_high := new.target_id;\n    else\n        v_low := new.target_id; v_high := new.actor_id;\n    end if;\n\n    insert into matches (user_low, user_high)\n    values (v_low, v_high)\n    on conflict (user_low, user_high) do update\n        set is_active = true, unmatched_by = null, unmatched_at = null;\n\n    return new;\nend $$;\n\ndrop trigger if exists swipes_create_match on swipes;\ncreate trigger swipes_create_match after insert on swipes\n    for each row execute function create_match_on_reciprocal_like();\n\n-- Blocking closes the conversation immediately.\ncreate or replace function close_match_on_block()\nreturns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n    update matches\n       set is_active = false, unmatched_by = new.blocker_id, unmatched_at = now()\n     where (user_low = least(new.blocker_id, new.blocked_id)\n            and user_high = greatest(new.blocker_id, new.blocked_id));\n    return new;\nend $$;\n\ndrop trigger if exists blocks_close_match on blocks;\ncreate trigger blocks_close_match after insert on blocks\n    for each row execute function close_match_on_block();\n"}, {"p": "supabase/migrations/20261115091100_nearby_rpc.sql", "l": "sql", "n": 69, "c": "-- NearMatch: nearby_profiles RPC.\n--\n-- Mirrors app/matching/filters.py. Exposed as a security-definer function so a\n-- signed-in client can page discovery without read access to the profiles table.\n\ncreate or replace function nearby_profiles(\n    p_limit int default 20\n)\nreturns table (\n    id             uuid,\n    display_name   text,\n    age            int,\n    gender         gender_t,\n    bio            text,\n    job_title      text,\n    city           text,\n    interests      text[],\n    last_active_at timestamptz,\n    distance_km    double precision,\n    photo_count    bigint\n)\nlanguage sql stable security definer set search_path = public as $$\n    with me as (\n        select p.id, p.gender, p.location, p.interests\n          from profiles p\n         where p.id = auth.uid()\n    ),\n    prefs as (\n        select coalesce(pr.min_age, 18)        as min_age,\n               coalesce(pr.max_age, 99)        as max_age,\n               coalesce(pr.max_distance_km, 50) as max_distance_km,\n               coalesce(pr.show_me, '{everyone}'::interested_in_t[]) as show_me\n          from preferences pr where pr.profile_id = auth.uid()\n    )\n    select c.id,\n           c.display_name,\n           date_part('year', age(c.dob))::int,\n           c.gender,\n           c.bio,\n           c.job_title,\n           c.city,\n           c.interests,\n           c.last_active_at,\n           st_distance(c.location, me.location) / 1000.0,\n           (select count(*) from profile_photos ph where ph.profile_id = c.id)\n      from profiles c\n     cross join me\n     cross join prefs\n     where c.id \u003c> me.id\n       and c.is_onboarded and c.is_visible\n       and not c.is_banned and not c.is_deleted\n       and c.location is not null and me.location is not null\n       and st_dwithin(c.location, me.location, prefs.max_distance_km * 1000.0)\n       and date_part('year', age(c.dob))::int between prefs.min_age - 2 and prefs.max_age + 2\n       and ('everyone' = any(prefs.show_me::text[]) or c.gender::text = any(prefs.show_me::text[]))\n       and ('everyone' = any(c.interested_in::text[]) or me.gender::text = any(c.interested_in::text[]))\n       and not exists (select 1 from swipes s where s.actor_id = me.id and s.target_id = c.id)\n       and not exists (\n            select 1 from blocks b\n             where (b.blocker_id = me.id and b.blocked_id = c.id)\n                or (b.blocker_id = c.id and b.blocked_id = me.id))\n       and exists (select 1 from profile_photos ph where ph.profile_id = c.id)\n     order by c.location \u003c-> me.location\n     limit least(greatest(p_limit, 1), 50);\n$$;\n\nrevoke all on function nearby_profiles(int) from public;\ngrant execute on function nearby_profiles(int) to authenticated;\n"}, {"p": "supabase/migrations/20261115091200_storage.sql", "l": "sql", "n": 47, "c": "-- NearMatch: photo storage bucket + policies.\n--\n-- Objects are keyed \"\u003cprofile_id>/\u003ctimestamp>.\u003cext>\", so ownership is the first\n-- path segment. The bucket is private: the API hands out short-lived signed URLs.\n\ninsert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types)\nvalues ('profile-photos', 'profile-photos', false, 8388608,\n        array['image/jpeg', 'image/png', 'image/webp', 'image/heic'])\non conflict (id) do update\n    set file_size_limit = excluded.file_size_limit,\n        allowed_mime_types = excluded.allowed_mime_types,\n        public = false;\n\ndrop policy if exists photos_insert_own_folder on storage.objects;\ncreate policy photos_insert_own_folder on storage.objects\n    for insert to authenticated\n    with check (\n        bucket_id = 'profile-photos'\n        and (storage.foldername(name))[1] = auth.uid()::text\n    );\n\ndrop policy if exists photos_update_own_folder on storage.objects;\ncreate policy photos_update_own_folder on storage.objects\n    for update to authenticated\n    using (bucket_id = 'profile-photos' and (storage.foldername(name))[1] = auth.uid()::text);\n\ndrop policy if exists photos_delete_own_folder on storage.objects;\ncreate policy photos_delete_own_folder on storage.objects\n    for delete to authenticated\n    using (bucket_id = 'profile-photos' and (storage.foldername(name))[1] = auth.uid()::text);\n\ndrop policy if exists photos_read_own_or_matched on storage.objects;\ncreate policy photos_read_own_or_matched on storage.objects\n    for select to authenticated\n    using (\n        bucket_id = 'profile-photos'\n        and (\n            (storage.foldername(name))[1] = auth.uid()::text\n            or exists (\n                select 1 from matches m\n                 where m.is_active\n                   and ((m.user_low = auth.uid() and m.user_high::text = (storage.foldername(name))[1])\n                     or (m.user_high = auth.uid() and m.user_low::text = (storage.foldername(name))[1]))\n            )\n        )\n    );\n"}, {"p": "supabase/migrations/20261115091300_realtime.sql", "l": "sql", "n": 16, "c": "-- NearMatch: realtime publication for live chat and match toasts.\n-- RLS still applies to realtime, so a client only receives rows it may read.\ndo $$\nbegin\n    if not exists (select 1 from pg_publication where pubname = 'supabase_realtime') then\n        create publication supabase_realtime;\n    end if;\nend $$;\n\nalter publication supabase_realtime add table messages;\nalter publication supabase_realtime add table matches;\n\n-- Needed so UPDATE/DELETE events carry the old row for RLS evaluation.\nalter table messages replica identity full;\nalter table matches  replica identity full;\n"}, {"p": "supabase/migrations/20261115091500_protect_moderation_columns.sql", "l": "sql", "n": 47, "c": "-- NearMatch: stop a user editing their own moderation flags.\n--\n-- `profiles_update_own` lets a user update their own row, which is right for\n-- bio, name and interests — but it also let them clear is_banned or\n-- is_deleted straight through PostgREST. RLS cannot express \"this column is\n-- off limits\": an UPDATE policy sees the old row in USING and the new row in\n-- WITH CHECK, never both at once. A BEFORE UPDATE trigger can.\n--\n-- Only the `authenticated` and `anon` roles are restricted. The API and any\n-- admin tooling connect as a different role and are unaffected.\n\n-- SECURITY INVOKER (the default) is essential here. Under SECURITY DEFINER,\n-- current_user inside the function is the function's OWNER, not the caller,\n-- so the exemption below would match every time and the protection would\n-- silently never run.\ncreate or replace function protect_moderation_columns()\nreturns trigger\nlanguage plpgsql set search_path = public as $$\nbegin\n    -- Restrict ONLY the two client-facing roles. The backend connects as its\n    -- own database user and moderation tooling as postgres; neither should be\n    -- blocked, and neither is reachable from a phone.\n    --\n    -- Keying this off a JWT claim instead would exempt nobody on a direct\n    -- connection, so even an admin UPDATE would be silently reverted.\n    if current_user not in ('authenticated', 'anon') then\n        return new;\n    end if;\n\n    -- Anyone else keeps whatever these were. Assigning the old value is\n    -- silent rather than an error, so a normal profile save still succeeds.\n    new.is_banned  := old.is_banned;\n    new.is_deleted := old.is_deleted;\n    new.id         := old.id;\n    new.dob        := old.dob;   -- age is a safety property, not a preference\n\n    return new;\nend $$;\n\ndrop trigger if exists profiles_protect_moderation on profiles;\ncreate trigger profiles_protect_moderation\n    before update on profiles\n    for each row execute function protect_moderation_columns();\n\ncomment on function protect_moderation_columns() is\n    'Reverts is_banned, is_deleted, id and dob on any update not made by the service role.';\n"}, {"p": "supabase/migrations/20261115091600_rate_limits.sql", "l": "sql", "n": 85, "c": "-- NearMatch: rate limiting that survives more than one API instance.\n--\n-- The first implementation kept counters in process memory. That is correct\n-- with a single API container and silently wrong with two: each instance\n-- enforces its own allowance, so the real limit is N times what was intended.\n--\n-- Postgres is already a shared dependency, so the window lives here. Redis\n-- would be faster; this is correct, which matters more for a safety control.\n\ncreate table if not exists rate_limits (\n    id      bigserial primary key,\n    subject text        not null,   -- usually a profile id\n    scope   text        not null,   -- 'swipe', 'message', ...\n    hit_at  timestamptz not null default now()\n);\n\n-- Supports both the window count and the purge.\ncreate index if not exists rate_limits_window_ix\n    on rate_limits (subject, scope, hit_at desc);\ncreate index if not exists rate_limits_purge_ix on rate_limits (hit_at);\n\n/**\n * Record one hit against a sliding window.\n *\n * Returns the number of hits now in the window and whether this one was\n * allowed. The count, the insert and the purge happen in one statement so two\n * concurrent requests cannot both read \"one under the limit\" and both proceed.\n */\ncreate or replace function rate_limit_hit(\n    p_subject text,\n    p_scope   text,\n    p_limit   int,\n    p_window_seconds int\n)\nreturns table (allowed boolean, used int, retry_after_seconds int)\nlanguage plpgsql as $$\ndeclare\n    v_cutoff timestamptz := now() - make_interval(secs => p_window_seconds);\n    v_used   int;\n    v_oldest timestamptz;\nbegin\n    -- Serialise concurrent callers for this subject+scope.\n    --\n    -- Without this the count and the insert are separate statements, and under\n    -- READ COMMITTED each concurrent transaction counts without seeing the\n    -- others' uncommitted inserts — so six requests against a limit of three\n    -- all pass the check. Measured: 5 of 6 granted. The lock is held only to\n    -- the end of this transaction and is scoped to one subject, so unrelated\n    -- users never contend.\n    perform pg_advisory_xact_lock(hashtext(p_subject || ':' || p_scope)::bigint);\n\n    -- Drop this subject's expired hits; keeps the table from growing forever\n    -- without needing a separate sweep job.\n    delete from rate_limits r\n     where r.subject = p_subject and r.scope = p_scope and r.hit_at \u003c v_cutoff;\n\n    select count(*), min(hit_at) into v_used, v_oldest\n      from rate_limits r\n     where r.subject = p_subject and r.scope = p_scope and r.hit_at >= v_cutoff;\n\n    if v_used >= p_limit then\n        return query select\n            false,\n            v_used,\n            greatest(1, ceil(extract(epoch from (v_oldest + make_interval(secs => p_window_seconds) - now())))::int);\n        return;\n    end if;\n\n    insert into rate_limits (subject, scope) values (p_subject, p_scope);\n    return query select true, v_used + 1, 0;\nend $$;\n\n-- Housekeeping for scopes that go quiet: call from a scheduled job if you\n-- have one. Not required for correctness.\ncreate or replace function purge_rate_limits(p_older_than interval default interval '1 day')\nreturns bigint\nlanguage plpgsql as $$\ndeclare\n    v_deleted bigint;\nbegin\n    delete from rate_limits where hit_at \u003c now() - p_older_than;\n    get diagnostics v_deleted = row_count;\n    return v_deleted;\nend $$;\n"}, {"p": "supabase/seed.sql", "l": "sql", "n": 55, "c": "-- NearMatch demo data: six profiles around Mumbai, for local development.\n-- Coordinates are real neighbourhoods so distances are meaningful.\n\ninsert into auth.users (id, email) values\n  ('11111111-1111-1111-1111-111111111111', 'aarav@example.com'),\n  ('22222222-2222-2222-2222-222222222222', 'diya@example.com'),\n  ('33333333-3333-3333-3333-333333333333', 'kabir@example.com'),\n  ('44444444-4444-4444-4444-444444444444', 'meera@example.com'),\n  ('55555555-5555-5555-5555-555555555555', 'rohan@example.com'),\n  ('66666666-6666-6666-6666-666666666666', 'ananya@example.com')\non conflict (id) do nothing;\n\ninsert into profiles (id, display_name, dob, gender, interested_in, bio, job_title, city, interests, location, is_onboarded, last_active_at) values\n  ('11111111-1111-1111-1111-111111111111', 'Aarav', '1996-04-12', 'male', '{female}',\n   'Filter coffee, long drives and weekend treks in the Sahyadris.', 'Product designer', 'Mumbai',\n   '{coffee,trekking,design,music}',\n   st_setsrid(st_makepoint(72.8296, 19.0544), 4326)::geography, true, now() - interval '10 minutes'),\n\n  ('22222222-2222-2222-2222-222222222222', 'Diya', '1998-09-03', 'female', '{male}',\n   'Reading on the balcony when it rains. Will out-argue you about music.', 'Data analyst', 'Mumbai',\n   '{books,music,coffee,running}',\n   st_setsrid(st_makepoint(72.8347, 19.1136), 4326)::geography, true, now() - interval '2 hours'),\n\n  ('33333333-3333-3333-3333-333333333333', 'Kabir', '1994-01-22', 'male', '{female,nonbinary}',\n   'Half marathon in progress. Cook better than I claim.', 'Backend engineer', 'Mumbai',\n   '{running,cooking,cricket}',\n   st_setsrid(st_makepoint(72.8777, 19.0760), 4326)::geography, true, now() - interval '3 days'),\n\n  ('44444444-4444-4444-4444-444444444444', 'Meera', '1997-11-30', 'female', '{everyone}',\n   'Potter on weekends, lawyer on weekdays. Dog is non-negotiable.', 'Lawyer', 'Mumbai',\n   '{pottery,dogs,books,travel}',\n   st_setsrid(st_makepoint(72.8206, 18.9220), 4326)::geography, true, now() - interval '1 day'),\n\n  ('55555555-5555-5555-5555-555555555555', 'Rohan', '1992-06-15', 'male', '{female}',\n   'Street food cartographer of Mumbai.', 'Chef', 'Mumbai',\n   '{cooking,food,cricket,travel}',\n   st_setsrid(st_makepoint(72.8311, 19.0176), 4326)::geography, true, now() - interval '20 days'),\n\n  -- Pune: deliberately outside a 50 km radius, to prove the distance filter.\n  ('66666666-6666-6666-6666-666666666666', 'Ananya', '1999-02-08', 'female', '{male}',\n   'Classical dancer. Pune based, Mumbai often.', 'Teacher', 'Pune',\n   '{dance,books,travel}',\n   st_setsrid(st_makepoint(73.8567, 18.5204), 4326)::geography, true, now() - interval '5 hours')\non conflict (id) do nothing;\n\ninsert into profile_photos (profile_id, storage_path, position, is_primary)\nselect id, id || '/seed-primary.jpg', 0, true from profiles\non conflict (storage_path) do nothing;\n\ninsert into profile_photos (profile_id, storage_path, position, is_primary)\nselect id, id || '/seed-second.jpg', 1, false from profiles\non conflict (storage_path) do nothing;\n\nupdate preferences set min_age = 24, max_age = 36, max_distance_km = 50, show_me = '{everyone}';\n"}, {"p": "supabase/types/database.types.ts", "l": "typescript", "n": 161, "c": "/**\n * Hand-maintained mirror of the NearMatch schema.\n *\n * Regenerate against a live project with:\n *   supabase gen types typescript --project-id \u003cref> > supabase/types/database.types.ts\n *\n * The frontend only reads `messages` and `matches` directly (for realtime);\n * everything else goes through the API, so those two are what must stay exact.\n */\n\nexport type Gender = 'male' | 'female' | 'nonbinary' | 'other';\nexport type InterestedIn = 'male' | 'female' | 'nonbinary' | 'everyone';\nexport type SwipeAction = 'like' | 'pass' | 'superlike';\nexport type ReportReason =\n  | 'fake_profile'\n  | 'harassment'\n  | 'inappropriate_photos'\n  | 'spam'\n  | 'underage'\n  | 'other';\nexport type ReportStatus = 'open' | 'reviewing' | 'actioned' | 'dismissed';\nexport type Platform = 'ios' | 'android' | 'web';\n\nexport interface ProfileRow {\n  id: string;\n  display_name: string;\n  dob: string;\n  gender: Gender;\n  interested_in: InterestedIn[];\n  bio: string;\n  job_title: string | null;\n  city: string | null;\n  interests: string[];\n  location: unknown | null;\n  location_updated_at: string | null;\n  is_onboarded: boolean;\n  is_visible: boolean;\n  is_banned: boolean;\n  is_deleted: boolean;\n  last_active_at: string;\n  created_at: string;\n  updated_at: string;\n}\n\nexport interface ProfilePhotoRow {\n  id: string;\n  profile_id: string;\n  storage_path: string;\n  position: number;\n  is_primary: boolean;\n  created_at: string;\n}\n\nexport interface PreferencesRow {\n  profile_id: string;\n  min_age: number;\n  max_age: number;\n  max_distance_km: number;\n  show_me: InterestedIn[];\n  hide_profile: boolean;\n  created_at: string;\n  updated_at: string;\n}\n\nexport interface SwipeRow {\n  id: string;\n  actor_id: string;\n  target_id: string;\n  action: SwipeAction;\n  created_at: string;\n}\n\nexport interface MatchRow {\n  id: string;\n  user_low: string;\n  user_high: string;\n  is_active: boolean;\n  last_message_at: string | null;\n  unmatched_by: string | null;\n  unmatched_at: string | null;\n  created_at: string;\n}\n\nexport interface MessageRow {\n  id: string;\n  match_id: string;\n  sender_id: string;\n  body: string;\n  client_id: string | null;\n  sent_at: string;\n  read_at: string | null;\n}\n\nexport interface BlockRow {\n  id: string;\n  blocker_id: string;\n  blocked_id: string;\n  created_at: string;\n}\n\nexport interface ReportRow {\n  id: string;\n  reporter_id: string;\n  reported_id: string;\n  reason: ReportReason;\n  details: string | null;\n  status: ReportStatus;\n  created_at: string;\n}\n\nexport interface DeviceRow {\n  id: string;\n  profile_id: string;\n  expo_push_token: string;\n  platform: Platform;\n  last_seen_at: string;\n  created_at: string;\n}\n\n/** Return shape of the nearby_profiles() RPC. */\nexport interface NearbyProfileRow {\n  id: string;\n  display_name: string;\n  age: number;\n  gender: Gender;\n  bio: string;\n  job_title: string | null;\n  city: string | null;\n  interests: string[];\n  last_active_at: string;\n  distance_km: number;\n  photo_count: number;\n}\n\nexport interface Database {\n  public: {\n    Tables: {\n      profiles: { Row: ProfileRow; Insert: Partial\u003cProfileRow>; Update: Partial\u003cProfileRow> };\n      profile_photos: :{\"total\":7,\"covered\":0,\"skipped\":0,\"pct\":0},\"functions\":{\"total\":0,\"covered\":0,\"skipped\":0,\"pct\":100},\"statements\":{\"total\":7,\"covered\":0,\"skipped\":0,\"pct\":0},\"branches\":{\"total\":0,\"covered\":0,\"skipped\":0,\"pct\":100}}\n,\"/home/user/Claude-NearMatch/frontend/src/types/models.ts\": {\"lines\":{\"total\":0,\"covered\":0,\"skipped\":0,\"pct\":100},\"functions\":{\"total\":0,\"covered\":0,\"skipped\":0,\"pct\":100},\"statements\":{\"total\":0,\"covered\":0,\"skipped\":0,\"pct\":100},\"branches\":{\"total\":0,\"covered\":0,\"skipped\":0,\"pct\":100}}\n}\n"}, {"p": "test_reports/latest/summary.md", "l": "markdown", "n": 63, "c": "# Test run — 2026-11-15\n\nAll suites green. Run on Python 3.13 / Node 22, against Postgres 16.15 with\nPostGIS 3 and the full NearMatch schema.\n\n## Totals\n\n| Suite | Tests | Result |\n|---|---:|---|\n| Backend — unit | 139 | pass |\n| Backend — API integration | 51 | pass |\n| Backend — database (schema, triggers, RPC, RLS) | 56 | pass |\n| Frontend — Jest | 27 | pass |\n| **Total** | **273** | **pass** |\n\nBackend runtime 2.6s; frontend 3.3s.\n\n## Static checks\n\n| Check | Result |\n|---|---|\n| `tsc --noEmit` (frontend) | clean |\n| `eslint .` (frontend) | clean |\n| FastAPI app imports, 25 routes registered | pass |\n| All 14 migrations apply to a clean database | pass |\n\n## Coverage\n\n| Target | Statements |\n|---|---:|\n| `backend/app` | **72%** |\n| `frontend/src` | **5.8%** |\n\nBackend coverage is concentrated where it matters: the matching core\n(`geo`, `scoring`, `filters`, `ranking`) is at or near 100%, and the\nuncovered remainder is mostly repository SQL, which is exercised through the\ndatabase suite rather than through Python.\n\nFrontend coverage is low and should be read as such. Only the pure helpers\n(`format`, `secureStore`) have unit tests. Components, screens and hooks have\nnone — that needs `@testing-library/react-native`, which is not yet a\ndependency. See `test_result.md` for what this leaves unverified.\n\n## What the database suite proves\n\n- A one-sided like creates no match; a reciprocal like creates exactly one,\n  stored in canonical order, regardless of who liked first.\n- `nearby_profiles` honours mutual orientation, distance, blocks in either\n  direction, already-swiped, hidden, banned, no-photos and no-location.\n- PostGIS distance agrees with `app.matching.geo.haversine_km` to 0.1 km\n  (Bandra → Pune, 123.4 km).\n- RLS: a stranger cannot read your profile, your messages, your blocks, your\n  reports or your push tokens; cannot inject a message into your conversation;\n  cannot forge a swipe or a report as you; cannot message a closed\n  conversation; and incoming likes stay hidden until they are mutual.\n- A sent message cannot be rewritten, even by its sender.\n\n## Known failure documented as a test\n\n`test_you_cannot_unban_yourself` asserts the *current* behaviour: RLS allows a\nuser to update their own `profiles` row including `is_banned`. The test exists\nso the gap is visible and a fix is detectable. See `memory/project_context.md`.\n"}, {"p": "test_result.md", "l": "markdown", "n": 146, "c": "# NearMatch — test ledger\n\nRunning record of what is verified, what is assumed, and what is untested.\nUpdated 2026-11-15.\n\nLegend: **verified** — run and observed in this repo · **partial** — covered in\none layer only · **unverified** — written but never executed.\n\n---\n\n## Backend\n\n| Area | Status | Evidence |\n|---|---|---|\n| App imports, 25 routes registered | verified | route table printed at build time |\n| Distance maths | verified | 24 tests; cross-checked against PostGIS to 0.1 km |\n| Compatibility scoring | verified | 38 tests incl. weight-sum invariant |\n| Eligibility gates | verified | 20 tests, one per gate plus mutual-orientation |\n| Deck ranking + diversification | verified | 14 tests |\n| Model validation | verified | 29 tests (age floor, bio cap, MIME allowlist) |\n| JWT verification | verified | 8 tests incl. `alg=none` downgrade and wrong-secret |\n| Rate limiting | verified | 6 tests with an injected clock |\n| Auth on every protected route | verified | parametrised over 8 routes × 2 attacks |\n| Request validation / error envelope | verified | 51 integration tests |\n| Repository SQL | partial | exercised through the database suite, not from Python |\n| Batch photo signing | verified | 8 unit tests: one request per deck, outage degrades |\n| Shared rate limiting | verified | 9 database tests incl. a 6-connection race |\n| Service orchestration | partial | error paths tested; happy paths need a live DB + Supabase |\n| Supabase Storage client | unverified | no Supabase instance in this container |\n| Expo push delivery | unverified | no device, no Expo project |\n\n## Database\n\n| Area | Status | Evidence |\n|---|---|---|\n| All 14 migrations apply cleanly | verified | applied to Postgres 16.15 + PostGIS 3 |\n| Schema constraints | verified | 17 tests (age floor, canonical pairs, photo cap, one primary photo, message dedupe) |\n| Reciprocal-like match trigger | verified | 5 tests incl. concurrency-shaped ordering cases |\n| Block closes an open match | verified | trigger test |\n| `nearby_profiles` RPC | verified | 12 tests, one per exclusion rule |\n| RLS — profile visibility | verified | 7 tests |\n| RLS — like privacy | verified | 4 tests; incoming likes confirmed hidden |\n| RLS — chat isolation | verified | 7 tests incl. injection and forging |\n| RLS — safety tables | verified | 4 tests (blocks, reports, push tokens) |\n| Storage object policies | unverified | needs a real Supabase Storage; SQL applies cleanly |\n| Realtime publication | partial | SQL applies; `wal_level` is not `logical` in the test cluster |\n\n## Frontend\n\n| Area | Status | Evidence |\n|---|---|---|\n| TypeScript compiles | verified | `tsc --noEmit` clean, strict mode |\n| Lint | verified | `eslint .` clean |\n| Format helpers | verified | 18 tests |\n| Session storage adapter | verified | 9 tests incl. keychain-failure fallback |\n| API client | unverified | no tests; types check only |\n| Hooks (deck, chat, matches, preferences) | unverified | no tests |\n| Components and screens | unverified | no tests |\n| App actually renders | **unverified** | `expo start` was never run — see below |\n\n## Cross-cutting\n\n| Property | Status | Evidence |\n|---|---|---|\n| Gates in Python and SQL agree | verified | same exclusions asserted in both suites |\n| Distance maths agrees across layers | verified | 123.4 km Bandra→Pune in both |\n| Location is never stored precisely | verified | snapping is idempotent; API snaps before write |\n| Exact distance never reaches the client | verified | labels contain no decimal point |\n| Photo paths cannot be forged | verified | API rejects a foreign prefix; Storage policy keys on it |\n\n---\n\n## Bugs found and fixed while writing these tests\n\n1. **Privacy — location snapping leaked precision.** `jitter_for_privacy`\n   computed the longitude grid from the *unsnapped* latitude, so the grid width\n   varied per point: two people in one cell kept distinguishable longitudes and\n   the function was not idempotent. Now derived from the snapped latitude.\n   Regression test: `test_snapping_is_idempotent`.\n\n2. **Ranking — diversification did nothing useful.** `diversify` deferred\n   same-band candidates and appended them at the end, recreating the run at the\n   tail. Replaced with a greedy interleave.\n   Regression tests: `TestDiversify` (7 tests).\n\n3. **API — 500 instead of 422.** A partial preferences update that conflicted\n   with stored values (`min_age=40` against a stored `max_age=25`) raised an\n   unhandled pydantic error. Now returns 422 with readable copy.\n   Regression test: `test_a_partial_update_that_conflicts_with_stored_values_is_422`.\n\n## Fixed in the P0/P1 pass (2026-11-15)\n\n| Was | Now | Regression test |\n|---|---|---|\n| Discovery signed one URL per HTTPS call — up to 120 serial round-trips per deck | One batch request per deck | `test_photo_signing.py` (8 tests) |\n| A banned user could clear their own `is_banned` | BEFORE UPDATE trigger reverts `is_banned`, `is_deleted`, `id` and `dob` | `test_rls.py` (4 tests) |\n| Rate limiting was in-process, so N replicas enforced N× the limit | Shared Postgres window with an advisory lock | `test_rate_limits.py` (9 tests) |\n| `list_matches` hardcoded `distance_km=0.0` | Real `ST_Distance` per match | `test_matching_sql.py::TestMatchDistance` |\n| Undo silently closed a match the other person may have joined | Undo refuses once a match exists | `test_matching_sql.py::TestUndoSafety` |\n| `last_message_at` written twice per message | Trigger only | — |\n\nTwo further bugs surfaced while writing those tests and were fixed:\n\n- The protection trigger was `SECURITY DEFINER`, so `current_user` inside it\n  was the function owner, not the caller — the exemption matched every time\n  and the protection never ran. `dob` only *appeared* protected because RLS had\n  independently blocked that particular update.\n- The first rate limiter counted and inserted in separate statements. Under\n  READ COMMITTED six concurrent requests against a limit of three were\n  **5 granted**. Fixed with `pg_advisory_xact_lock`, verified by a concurrency\n  test using six real connections.\n\n## Known gaps, stated plainly\n\n- **The app has never been seen running.** There is no simulator or device in\n  this container, so `npx expo start` was not run. Typecheck and lint pass and\n  the route tree is consistent, but no screen has been rendered. This is the\n  single biggest untested area.\n- **Frontend coverage is 5.8%.** Only pure helpers are tested. Adding\n  `@testing-library/react-native` would make hooks and components testable.\n- **No end-to-end test.** Nothing exercises sign-in → onboarding → swipe →\n  match → chat as one flow against a live stack.\n- **No self-service account deletion.** Still a support-email dead end, and\n  still blocks App Store review.\n- **No photo moderation.** Nothing scans uploads.\n- **Apple Sign In is untested.** It needs a real Apple developer configuration\n  and a physical iOS device.\n- **The batch signing path is unit-tested against a fake, not a live Supabase.**\n  The request shape for the batch endpoint is from the documented API; confirm\n  it against your project before relying on the latency improvement.\n\n## How to re-run everything\n\n```bash\n./scripts/db_test_setup.sh\nexport NEARMATCH_TEST_DSN=\"postgresql://postgres@/nearmatch_test?host=/tmp&port=55432\"\n(cd tests && pytest)\n\ncd frontend && npm ci && npx tsc --noEmit && npx eslint . && npx jest\n```\n\nWithout `NEARMATCH_TEST_DSN` the 71 database tests skip and the other 198\nbackend tests still run.\n\n**Totals: 296 passing** — 147 unit, 51 API, 71 database, 27 frontend.\n"}, {"p": "tests/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "tests/conftest.py", "l": "python", "n": 112, "c": "\"\"\"Shared test fixtures.\n\nUnit and API tests run with no external services. Tests marked `db` need a\nreal Postgres with PostGIS and the NearMatch schema applied; point\nNEARMATCH_TEST_DSN at it, otherwise they skip.\n\"\"\"\nimport os\nimport sys\nfrom datetime import date, datetime, timedelta, timezone\nfrom pathlib import Path\n\nimport pytest\n\nREPO_ROOT = Path(__file__).resolve().parent.parent\nsys.path.insert(0, str(REPO_ROOT / \"backend\"))\n\n# Settings must exist before app modules import them.\nos.environ.setdefault(\"SUPABASE_JWT_SECRET\", \"test-secret-do-not-use-in-production\")\nos.environ.setdefault(\"SUPABASE_URL\", \"http://localhost:54321\")\nos.environ.setdefault(\"ENVIRONMENT\", \"test\")\n\n\n@pytest.fixture\ndef today() -> date:\n    return date(2026, 11, 15)\n\n\n@pytest.fixture\ndef now() -> datetime:\n    return datetime(2026, 11, 15, 12, 0, 0, tzinfo=timezone.utc)\n\n\n@pytest.fixture\ndef mumbai():\n    from app.matching.geo import Coordinates\n\n    return Coordinates(latitude=19.0544, longitude=72.8296)  # Bandra\n\n\n@pytest.fixture\ndef pune():\n    from app.matching.geo import Coordinates\n\n    return Coordinates(latitude=18.5204, longitude=73.8567)\n\n\n@pytest.fixture\ndef viewer():\n    from app.matching.filters import Viewer\n\n    return Viewer(\n        id=\"11111111-1111-1111-1111-111111111111\",\n        gender=\"male\",\n        interested_in=[\"female\"],\n        min_age=24,\n        max_age=36,\n        max_distance_km=50,\n        blocked_ids=set(),\n        swiped_ids=set(),\n    )\n\n\n@pytest.fixture\ndef candidate():\n    from app.matching.filters import Candidate\n\n    return Candidate(\n        id=\"22222222-2222-2222-2222-222222222222\",\n        gender=\"female\",\n        interested_in=[\"male\"],\n        dob=date(1998, 9, 3),\n        distance_km=6.6,\n        is_visible=True,\n        is_onboarded=True,\n    )\n\n\n@pytest.fixture\ndef test_dsn() -> str | None:\n    return os.environ.get(\"NEARMATCH_TEST_DSN\")\n\n\n@pytest.fixture\ndef api_client():\n    \"\"\"FastAPI TestClient with auth stubbed to a known user id.\"\"\"\n    from fastapi.testclient import TestClient\n\n    import server\n    from app.deps import active_user_id, current_user_id\n\n    user_id = \"11111111-1111-1111-1111-111111111111\"\n    server.app.dependency_overrides[current_user_id] = lambda: user_id\n    server.app.dependency_overrides[active_user_id] = lambda: user_id\n\n    with TestClient(server.app) as client:\n        client.test_user_id = user_id  # type: ignore[attr-defined]\n        yield client\n\n    server.app.dependency_overrides.clear()\n\n\n@pytest.fixture\ndef anon_client():\n    \"\"\"TestClient with no auth override, for checking the 401 path.\"\"\"\n    from fastapi.testclient import TestClient\n\n    import server\n\n    server.app.dependency_overrides.clear()\n    with TestClient(server.app) as client:\n        yield client\n"}, {"p": "tests/fixtures/supabase_stubs.sql", "l": "sql", "n": 59, "c": "-- Local stand-ins for the Supabase-managed schemas, so the NearMatch\n-- migrations can be applied and tested against a plain Postgres + PostGIS.\n-- Supabase provides these in a real project; nothing here ships to production.\n\ncreate schema if not exists auth;\ncreate schema if not exists storage;\n\ncreate table if not exists auth.users (\n    id    uuid primary key default gen_random_uuid(),\n    email text unique\n);\n\n-- Test harness sets this GUC to impersonate a signed-in user.\ncreate or replace function auth.uid() returns uuid\nlanguage sql stable as $$\n    select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;\n$$;\n\ncreate or replace function auth.role() returns text\nlanguage sql stable as $$\n    select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), 'anon');\n$$;\n\ncreate table if not exists storage.buckets (\n    id                 text primary key,\n    name               text not null,\n    public             boolean not null default false,\n    file_size_limit    bigint,\n    allowed_mime_types text[]\n);\n\ncreate table if not exists storage.objects (\n    id         uuid primary key default gen_random_uuid(),\n    bucket_id  text references storage.buckets (id),\n    name       text not null,\n    owner      uuid,\n    created_at timestamptz not null default now()\n);\n\ncreate or replace function storage.foldername(name text) returns text[]\nlanguage sql immutable as $$\n    select string_to_array(name, '/');\n$$;\n\ndo $$ begin\n    create role authenticated;\nexception when duplicate_object then null; end $$;\ndo $$ begin\n    create role anon;\nexception when duplicate_object then null; end $$;\ngrant usage on schema public, auth, storage to authenticated, anon;\n\n-- Supabase grants table privileges to authenticated by default; RLS is what\n-- actually restricts rows. Mirror that so RLS tests are meaningful.\ngrant select, insert, update, delete on all tables in schema public to authenticated;\ngrant usage, select on all sequences in schema public to authenticated;\nalter default privileges in schema public\n    grant select, insert, update, delete on tables to authenticated;\n"}, {"p": "tests/integration/test_api_auth.py", "l": "python", "n": 60, "c": "\"\"\"Authentication on every protected route.\"\"\"\nimport time\n\nimport jwt\nimport pytest\n\nfrom app.config import settings\n\nPROTECTED = [\n    (\"GET\", \"/api/v1/me/profile\"),\n    (\"GET\", \"/api/v1/me/preferences\"),\n    (\"GET\", \"/api/v1/discover\"),\n    (\"GET\", \"/api/v1/matches\"),\n    (\"GET\", \"/api/v1/blocks\"),\n    (\"POST\", \"/api/v1/swipes\"),\n    (\"POST\", \"/api/v1/reports\"),\n    (\"POST\", \"/api/v1/devices\"),\n]\n\n\n@pytest.mark.parametrize(\"method,path\", PROTECTED)\ndef test_requires_a_token(anon_client, method, path):\n    response = anon_client.request(method, path, json={})\n    assert response.status_code == 401, f\"{method} {path} is not protected\"\n    assert response.json()[\"error\"][\"code\"] == \"unauthorized\"\n\n\n@pytest.mark.parametrize(\"method,path\", PROTECTED)\ndef test_rejects_a_malformed_authorization_header(anon_client, method, path):\n    response = anon_client.request(\n        method, path, json={}, headers={\"Authorization\": \"Basic abc123\"}\n    )\n    assert response.status_code == 401\n\n\ndef test_rejects_a_forged_token(anon_client):\n    forged = jwt.encode(\n        {\"sub\": \"attacker\", \"aud\": \"authenticated\", \"exp\": int(time.time()) + 60},\n        \"wrong-secret\",\n        algorithm=\"HS256\",\n    )\n    response = anon_client.get(\"/api/v1/me/profile\", headers={\"Authorization\": f\"Bearer {forged}\"})\n    assert response.status_code == 401\n\n\ndef test_rejects_an_expired_token(anon_client):\n    expired = jwt.encode(\n        {\"sub\": \"u1\", \"aud\": \"authenticated\", \"exp\": int(time.time()) - 60},\n        settings.supabase_jwt_secret,\n        algorithm=\"HS256\",\n    )\n    response = anon_client.get(\"/api/v1/me/profile\", headers={\"Authorization\": f\"Bearer {expired}\"})\n    assert response.status_code == 401\n    assert \"expired\" in response.json()[\"error\"][\"message\"].lower()\n\n\ndef test_rejects_an_empty_bearer_token(anon_client):\n    response = anon_client.get(\"/api/v1/me/profile\", headers={\"Authorization\": \"Bearer \"})\n    assert response.status_code == 401\n"}, {"p": "tests/integration/test_api_contracts.py", "l": "python", "n": 210, "c": "\"\"\"Request validation and error shape on the protected routes.\n\nThe data layer is stubbed, so these assert the API contract — status codes,\nerror envelope and validation — not database behaviour.\n\"\"\"\nimport pytest\n\nfrom app.core.errors import AppError\n\n\nclass TestErrorEnvelope:\n    def test_app_errors_use_a_consistent_shape(self, api_client, monkeypatch):\n        from app.services import profile_service\n\n        async def boom(_user_id):\n            raise AppError(\"deliberate failure\")\n\n        monkeypatch.setattr(profile_service, \"get_my_profile\", boom)\n        body = api_client.get(\"/api/v1/me/profile\").json()\n        assert set(body) == {\"error\"}\n        assert set(body[\"error\"]) >= {\"code\", \"message\"}\n\n    def test_a_missing_profile_returns_404_not_500(self, api_client, monkeypatch):\n        from app.core.errors import NotFound\n        from app.services import profile_service\n\n        async def missing(_user_id):\n            raise NotFound(\"No profile yet. Complete onboarding first.\")\n\n        monkeypatch.setattr(profile_service, \"get_my_profile\", missing)\n        response = api_client.get(\"/api/v1/me/profile\")\n        assert response.status_code == 404\n        assert response.json()[\"error\"][\"code\"] == \"not_found\"\n\n\nclass TestSwipeValidation:\n    def test_rejects_an_unknown_action(self, api_client):\n        response = api_client.post(\n            \"/api/v1/swipes\", json={\"target_id\": \"abc\", \"action\": \"sideways\"}\n        )\n        assert response.status_code == 422\n\n    def test_requires_a_target(self, api_client):\n        assert api_client.post(\"/api/v1/swipes\", json={\"action\": \"like\"}).status_code == 422\n\n    @pytest.mark.parametrize(\"action\", [\"like\", \"pass\", \"superlike\"])\n    def test_accepts_each_valid_action(self, api_client, monkeypatch, action):\n        from app.api.v1 import swipes as swipes_route\n        from app.models.swipe import SwipeResult\n\n        async def ok(_actor, _target, act):\n            return SwipeResult(recorded=True, is_match=False)\n\n        monkeypatch.setattr(swipes_route.swipe_service, \"swipe\", ok)\n        response = api_client.post(\n            \"/api/v1/swipes\", json={\"target_id\": \"t1\", \"action\": action}\n        )\n        assert response.status_code == 201, response.text\n\n\nclass TestProfileValidation:\n    def _payload(self, **overrides):\n        payload = {\n            \"display_name\": \"Aarav\",\n            \"dob\": \"1996-04-12\",\n            \"gender\": \"male\",\n            \"interested_in\": [\"female\"],\n            \"bio\": \"Coffee and treks.\",\n            \"interests\": [\"coffee\"],\n        }\n        payload.update(overrides)\n        return payload\n\n    def test_rejects_a_minor_at_the_api_boundary(self, api_client):\n        response = api_client.put(\"/api/v1/me/profile\", json=self._payload(dob=\"2015-01-01\"))\n        assert response.status_code == 422\n\n    def test_rejects_an_unknown_gender(self, api_client):\n        response = api_client.put(\"/api/v1/me/profile\", json=self._payload(gender=\"martian\"))\n        assert response.status_code == 422\n\n    def test_rejects_an_overlong_bio(self, api_client):\n        response = api_client.put(\"/api/v1/me/profile\", json=self._payload(bio=\"x\" * 501))\n        assert response.status_code == 422\n\n\nclass TestLocationValidation:\n    @pytest.mark.parametrize(\n        \"lat,lon\",\n        [(91, 0), (-91, 0), (0, 181), (0, -181)],\n    )\n    def test_rejects_impossible_coordinates(self, api_client, lat, lon):\n        response = api_client.put(\n            \"/api/v1/me/location\", json={\"latitude\": lat, \"longitude\": lon}\n        )\n        assert response.status_code == 422\n\n    def test_accepts_a_real_coordinate(self, api_client, monkeypatch):\n        from app.api.v1 import profiles as profiles_route\n\n        async def ok(_user, _lat, _lon, _city):\n            return None\n\n        monkeypatch.setattr(profiles_route.profile_service, \"update_location\", ok)\n        response = api_client.put(\n            \"/api/v1/me/location\", json={\"latitude\": 19.0544, \"longitude\": 72.8296}\n        )\n        assert response.status_code == 200\n\n\nclass TestPreferencesValidation:\n    def test_rejects_an_under_eighteen_floor(self, api_client):\n        assert api_client.put(\"/api/v1/me/preferences\", json={\"min_age\": 16}).status_code == 422\n\n    def test_rejects_an_oversized_radius(self, api_client):\n        response = api_client.put(\"/api/v1/me/preferences\", json={\"max_distance_km\": 10000})\n        assert response.status_code == 422\n\n    def test_rejects_an_inverted_age_range(self, api_client, monkeypatch):\n        from app.db.repositories import profiles_repo\n\n        async def no_stored_prefs(_user_id):\n            return None\n\n        async def accept(_user_id, prefs):\n            return prefs\n\n        monkeypatch.setattr(profiles_repo, \"get_preferences\", no_stored_prefs)\n        monkeypatch.setattr(profiles_repo, \"upsert_preferences\", accept)\n\n        response = api_client.put(\n            \"/api/v1/me/preferences\", json={\"min_age\": 40, \"max_age\": 25}\n        )\n        assert response.status_code == 422\n        assert response.json()[\"error\"][\"code\"] == \"validation_failed\"\n\n    def test_a_partial_update_that_conflicts_with_stored_values_is_422(\n        self, api_client, monkeypatch\n    ):\n        \"\"\"min_age=40 alone is valid, but not against a stored max_age of 25.\"\"\"\n        from app.db.repositories import profiles_repo\n\n        async def stored(_user_id):\n            return {\n                \"profile_id\": \"u1\",\n                \"min_age\": 18,\n                \"max_age\": 25,\n                \"max_distance_km\": 50,\n                \"show_me\": [\"everyone\"],\n                \"hide_profile\": False,\n            }\n\n        async def accept(_user_id, prefs):\n            return prefs\n\n        monkeypatch.setattr(profiles_repo, \"get_preferences\", stored)\n        monkeypatch.setattr(profiles_repo, \"upsert_preferences\", accept)\n\n        response = api_client.put(\"/api/v1/me/preferences\", json={\"min_age\": 40})\n        assert response.status_code == 422\n\n\nclass TestMessageValidation:\n    def test_rejects_an_empty_message(self, api_client):\n        response = api_client.post(\"/api/v1/matches/m1/messages\", json={\"body\": \"   \"})\n        assert response.status_code == 422\n\n    def test_rejects_an_overlong_message(self, api_client):\n        response = api_client.post(\"/api/v1/matches/m1/messages\", json={\"body\": \"x\" * 2001})\n        assert response.status_code == 422\n\n\nclass TestReportValidation:\n    def test_rejects_an_unknown_reason(self, api_client):\n        response = api_client.post(\n            \"/api/v1/reports\", json={\"reported_id\": \"u2\", \"reason\": \"i_dont_like_them\"}\n        )\n        assert response.status_code == 422\n\n\nclass TestPhotoValidation:\n    def test_rejects_a_non_image_upload(self, api_client):\n        response = api_client.post(\n            \"/api/v1/me/photos/upload-url\", json={\"content_type\": \"application/pdf\"}\n        )\n        assert response.status_code == 422\n\n    def test_refuses_to_register_someone_elses_storage_path(self, api_client):\n        # The path prefix must match the caller's own id.\n        response = api_client.post(\n            \"/api/v1/me/photos\",\n            json={\"storage_path\": \"99999999-9999-9999-9999-999999999999/evil.jpg\"},\n        )\n        assert response.status_code == 422\n        assert response.json()[\"error\"][\"code\"] == \"validation_failed\"\n\n\nclass TestDeviceValidation:\n    def test_rejects_an_unknown_platform(self, api_client):\n        response = api_client.post(\n            \"/api/v1/devices\", json={\"expo_push_token\": \"ExponentPushToken[xxx]\", \"platform\": \"nokia\"}\n        )\n        assert response.status_code == 422\n\n    def test_rejects_a_suspiciously_short_token(self, api_client):\n        response = api_client.post(\n            \"/api/v1/devices\", json={\"expo_push_token\": \"abc\", \"platform\": \"ios\"}\n        )\n        assert response.status_code == 422\n"}, {"p": "tests/integration/test_api_health.py", "l": "python", "n": 40, "c": "\"\"\"Health endpoints and app wiring.\"\"\"\n\n\ndef test_root_points_at_the_api(anon_client):\n    body = anon_client.get(\"/\").json()\n    assert body[\"app\"] == \"NearMatch\"\n    assert body[\"api\"].endswith(\"/health\")\n\n\ndef test_health_is_public(anon_client):\n    response = anon_client.get(\"/api/health\")\n    assert response.status_code == 200\n    assert response.json()[\"status\"] == \"ok\"\n\n\ndef test_every_request_carries_a_correlation_id(anon_client):\n    response = anon_client.get(\"/api/health\")\n    assert response.headers.get(\"X-Request-Id\")\n\n\ndef test_request_ids_are_unique_per_request(anon_client):\n    first = anon_client.get(\"/api/health\").headers[\"X-Request-Id\"]\n    second = anon_client.get(\"/api/health\").headers[\"X-Request-Id\"]\n    assert first != second\n\n\ndef test_readiness_reports_a_down_database_without_crashing(anon_client):\n    # No database is running in this suite, so readiness must degrade, not 500.\n    response = anon_client.get(\"/api/health/ready\")\n    assert response.status_code == 200\n    assert response.json()[\"status\"] in {\"ready\", \"degraded\"}\n\n\ndef test_openapi_schema_builds(anon_client):\n    schema = anon_client.get(\"/openapi.json\").json()\n    assert schema[\"info\"][\"title\"] == \"NearMatch API\"\n    # Guards against a route being silently dropped from the router.\n    for path in (\"/api/v1/discover\", \"/api/v1/swipes\", \"/api/v1/matches\", \"/api/v1/me/profile\"):\n        assert path in schema[\"paths\"], f\"{path} missing from the schema\"\n"}, {"p": "tests/pytest.ini", "l": "plaintext", "n": 11, "c": "[pytest]\ntestpaths = unit integration sql\npython_files = test_*.py\nasyncio_mode = auto\nasyncio_default_fixture_loop_scope = function\naddopts = -q --strict-markers\nmarkers =\n    db: requires a live Postgres with the NearMatch schema (set NEARMATCH_TEST_DSN)\nfilterwarnings =\n    error::DeprecationWarning:app.*\n"}, {"p": "tests/requirements-test.txt", "l": "plaintext", "n": 5, "c": "-r ../backend/requirements.txt\npytest==8.3.4\npytest-asyncio==0.25.0\npytest-cov==6.0.0\n"}, {"p": "tests/sql/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "tests/sql/conftest.py", "l": "python", "n": 106, "c": "\"\"\"Fixtures for the database-backed suite.\n\nThese tests need a real Postgres with PostGIS and the NearMatch schema applied:\n\n    scripts/db_test_setup.sh                      # creates it locally\n    export NEARMATCH_TEST_DSN=postgresql://...    # then run pytest\n\nWithout that variable the whole suite skips rather than failing, so the pure\nunit and API suites stay runnable anywhere.\n\nEvery test runs inside a transaction that is rolled back, so the suite is\nidempotent and leaves no rows behind.\n\"\"\"\nimport os\nimport uuid\nfrom datetime import date\n\nimport pytest\nimport pytest_asyncio\n\nasyncpg = pytest.importorskip(\"asyncpg\")\n\nDSN = os.environ.get(\"NEARMATCH_TEST_DSN\")\n\npytestmark = pytest.mark.db\n\n\n@pytest_asyncio.fixture\nasync def conn():\n    if not DSN:\n        pytest.skip(\"NEARMATCH_TEST_DSN is not set\")\n    connection = await asyncpg.connect(DSN, statement_cache_size=0)\n    transaction = connection.transaction()\n    await transaction.start()\n    try:\n        yield connection\n    finally:\n        await transaction.rollback()\n        await connection.close()\n\n\nclass People:\n    \"\"\"Three throwaway profiles in Mumbai, plus one in Pune.\"\"\"\n\n    def __init__(self) -> None:\n        self.aarav = uuid.uuid4()\n        self.diya = uuid.uuid4()\n        self.kabir = uuid.uuid4()\n        self.ananya = uuid.uuid4()\n\n\n@pytest_asyncio.fixture\nasync def people(conn) -> People:\n    p = People()\n    rows = [\n        # id, name, dob, gender, interested_in, lon, lat\n        (p.aarav, \"TestAarav\", date(1996, 4, 12), \"male\", [\"female\"], 72.8296, 19.0544),\n        (p.diya, \"TestDiya\", date(1998, 9, 3), \"female\", [\"male\"], 72.8347, 19.1136),\n        (p.kabir, \"TestKabir\", date(1994, 1, 22), \"male\", [\"female\"], 72.8777, 19.0760),\n        # Pune: ~123 km from Bandra, outside a 50 km radius.\n        (p.ananya, \"TestAnanya\", date(1999, 2, 8), \"female\", [\"male\"], 73.8567, 18.5204),\n    ]\n    for pid, name, dob, gender, wants, lon, lat in rows:\n        await conn.execute(\"INSERT INTO auth.users (id) VALUES ($1)\", pid)\n        await conn.execute(\n            \"\"\"\n            INSERT INTO profiles (id, display_name, dob, gender, interested_in,\n                                  bio, interests, location, is_onboarded, last_active_at)\n            VALUES ($1, $2, $3, $4::gender_t, $5::interested_in_t[], 'test bio',\n                    '{coffee,books}', ST_SetSRID(ST_MakePoint($6, $7), 4326)::geography,\n                    TRUE, now())\n            \"\"\",\n            pid, name, dob, gender, wants, lon, lat,\n        )\n        await conn.execute(\n            \"INSERT INTO profile_photos (profile_id, storage_path, is_primary) VALUES ($1, $2, TRUE)\",\n            pid, f\"{pid}/test.jpg\",\n        )\n    return p\n\n\nasync def as_user(conn, user_id) -> None:\n    \"\"\"Impersonate a signed-in user for RLS checks.\"\"\"\n    await conn.execute(\"SET LOCAL ROLE authenticated\")\n    await conn.execute(\"SELECT set_config('request.jwt.claim.sub', $1, true)\", str(user_id))\n\n\nasync def as_owner(conn) -> None:\n    \"\"\"Drop back to the privileged role, which bypasses RLS.\"\"\"\n    await conn.execute(\"RESET ROLE\")\n\n\nasync def assert_denied(conn, sql, *args) -> None:\n    \"\"\"Assert RLS rejects a statement, without poisoning the outer transaction.\n\n    A failed statement aborts the surrounding transaction, so every later\n    command in the test errors out. Wrapping the attempt in a nested\n    transaction (a savepoint) rolls back just that statement.\n    \"\"\"\n    import asyncpg\n    import pytest as _pytest\n\n    with _pytest.raises(asyncpg.InsufficientPrivilegeError):\n        async with conn.transaction():\n            await conn.execute(sql, *args)\n"}, {"p": "tests/sql/test_constraints.py", "l": "python", "n": 175, "c": "\"\"\"Schema-level guarantees. These must hold even if the API is bypassed.\"\"\"\nimport uuid\n\nimport asyncpg\nimport pytest\n\npytestmark = pytest.mark.db\n\n\nclass TestAgeFloor:\n    async def test_the_database_refuses_a_minor(self, conn):\n        uid = uuid.uuid4()\n        await conn.execute(\"INSERT INTO auth.users (id) VALUES ($1)\", uid)\n        with pytest.raises(asyncpg.IntegrityConstraintViolationError):\n            await conn.execute(\n                \"\"\"\n                INSERT INTO profiles (id, display_name, dob, gender)\n                VALUES ($1, 'TooYoung', date '2015-01-01', 'other')\n                \"\"\",\n                uid,\n            )\n\n\nclass TestSwipeIntegrity:\n    async def test_cannot_swipe_on_yourself(self, conn, people):\n        with pytest.raises(asyncpg.IntegrityConstraintViolationError):\n            await conn.execute(\n                \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $1, 'like')\",\n                people.aarav,\n            )\n\n    async def test_the_same_pair_cannot_be_swiped_twice(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        with pytest.raises(asyncpg.UniqueViolationError):\n            await conn.execute(\n                \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'pass')\",\n                people.aarav, people.diya,\n            )\n\n\nclass TestMatchIntegrity:\n    async def test_pairs_are_stored_in_a_canonical_order(self, conn, people):\n        low, high = sorted([people.aarav, people.diya], key=str)\n        with pytest.raises(asyncpg.IntegrityConstraintViolationError):\n            # Inserting the reversed pair must be refused, so a pair cannot\n            # exist twice under two orderings.\n            await conn.execute(\n                \"INSERT INTO matches (user_low, user_high) VALUES ($1, $2)\", high, low\n            )\n\n    async def test_a_pair_can_only_match_once(self, conn, people):\n        low, high = sorted([people.aarav, people.diya], key=str)\n        await conn.execute(\"INSERT INTO matches (user_low, user_high) VALUES ($1, $2)\", low, high)\n        with pytest.raises(asyncpg.UniqueViolationError):\n            await conn.execute(\n                \"INSERT INTO matches (user_low, user_high) VALUES ($1, $2)\", low, high\n            )\n\n\nclass TestPhotoRules:\n    async def test_only_one_photo_can_be_primary(self, conn, people):\n        with pytest.raises(asyncpg.UniqueViolationError):\n            await conn.execute(\n                \"\"\"\n                INSERT INTO profile_photos (profile_id, storage_path, is_primary)\n                VALUES ($1, $2, TRUE)\n                \"\"\",\n                people.aarav, f\"{people.aarav}/second-primary.jpg\",\n            )\n\n    async def test_photos_are_capped_at_six(self, conn, people):\n        # One already exists from the fixture.\n        for i in range(5):\n            await conn.execute(\n                \"INSERT INTO profile_photos (profile_id, storage_path) VALUES ($1, $2)\",\n                people.aarav, f\"{people.aarav}/extra{i}.jpg\",\n            )\n        with pytest.raises(asyncpg.PostgresError):\n            await conn.execute(\n                \"INSERT INTO profile_photos (profile_id, storage_path) VALUES ($1, $2)\",\n                people.aarav, f\"{people.aarav}/seventh.jpg\",\n            )\n\n    async def test_deleting_a_profile_removes_its_photos(self, conn, people):\n        await conn.execute(\"DELETE FROM profiles WHERE id = $1\", people.aarav)\n        remaining = await conn.fetchval(\n            \"SELECT count(*) FROM profile_photos WHERE profile_id = $1\", people.aarav\n        )\n        assert remaining == 0\n\n\nclass TestMessageRules:\n    async def test_an_empty_message_is_refused(self, conn, people):\n        low, high = sorted([people.aarav, people.diya], key=str)\n        match_id = await conn.fetchval(\n            \"INSERT INTO matches (user_low, user_high) VALUES ($1, $2) RETURNING id\", low, high\n        )\n        with pytest.raises(asyncpg.IntegrityConstraintViolationError):\n            await conn.execute(\n                \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, '')\",\n                match_id, people.aarav,\n            )\n\n    async def test_a_resend_with_the_same_client_id_is_deduplicated(self, conn, people):\n        low, high = sorted([people.aarav, people.diya], key=str)\n        match_id = await conn.fetchval(\n            \"INSERT INTO matches (user_low, user_high) VALUES ($1, $2) RETURNING id\", low, high\n        )\n        for _ in range(2):\n            await conn.execute(\n                \"\"\"\n                INSERT INTO messages (match_id, sender_id, body, client_id)\n                VALUES ($1, $2, 'hello', 'retry-1')\n                ON CONFLICT DO NOTHING\n                \"\"\",\n                match_id, people.aarav,\n            )\n        count = await conn.fetchval(\"SELECT count(*) FROM messages WHERE match_id = $1\", match_id)\n        assert count == 1\n\n    async def test_sending_a_message_bumps_the_match_timestamp(self, conn, people):\n        low, high = sorted([people.aarav, people.diya], key=str)\n        match_id = await conn.fetchval(\n            \"INSERT INTO matches (user_low, user_high) VALUES ($1, $2) RETURNING id\", low, high\n        )\n        assert await conn.fetchval(\"SELECT last_message_at FROM matches WHERE id = $1\", match_id) is None\n        await conn.execute(\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'hi')\",\n            match_id, people.aarav,\n        )\n        assert await conn.fetchval(\"SELECT last_message_at FROM matches WHERE id = $1\", match_id) is not None\n\n\nclass TestBlockRules:\n    async def test_cannot_block_yourself(self, conn, people):\n        with pytest.raises(asyncpg.IntegrityConstraintViolationError):\n            await conn.execute(\n                \"INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $1)\", people.aarav\n            )\n\n    async def test_blocking_is_idempotent(self, conn, people):\n        for _ in range(2):\n            await conn.execute(\n                \"\"\"\n                INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $2)\n                ON CONFLICT DO NOTHING\n                \"\"\",\n                people.aarav, people.diya,\n            )\n        count = await conn.fetchval(\n            \"SELECT count(*) FROM blocks WHERE blocker_id = $1\", people.aarav\n        )\n        assert count == 1\n\n\nclass TestPreferenceDefaults:\n    async def test_a_new_profile_gets_default_preferences(self, conn, people):\n        row = await conn.fetchrow(\n            \"SELECT min_age, max_age, max_distance_km FROM preferences WHERE profile_id = $1\",\n            people.aarav,\n        )\n        assert row is not None, \"the seed_preferences trigger did not fire\"\n        assert row[\"min_age\"] == 18\n        assert row[\"max_distance_km\"] == 50\n\n    async def test_an_inverted_age_range_is_refused(self, conn, people):\n        with pytest.raises(asyncpg.IntegrityConstraintViolationError):\n            await conn.execute(\n                \"UPDATE preferences SET min_age = 40, max_age = 25 WHERE profile_id = $1\",\n                people.aarav,\n            )\n"}, {"p": "tests/sql/test_matching_sql.py", "l": "python", "n": 248, "c": "\"\"\"The match trigger and the nearby_profiles RPC.\n\nThese are the two pieces of behaviour that live in the database rather than in\nPython, so they can only be verified against a real Postgres.\n\"\"\"\nimport pytest\n\nfrom tests.sql.conftest import as_owner, as_user\n\npytestmark = pytest.mark.db\n\n\nclass TestMatchTrigger:\n    async def test_a_one_sided_like_creates_no_match(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        count = await conn.fetchval(\"SELECT count(*) FROM matches\")\n        assert count == 0\n\n    async def test_a_reciprocal_like_creates_exactly_one_match(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.diya, people.aarav,\n        )\n        rows = await conn.fetch(\"SELECT user_low, user_high, is_active FROM matches\")\n        assert len(rows) == 1\n        assert rows[0][\"is_active\"] is True\n        # Stored in canonical order.\n        assert str(rows[0][\"user_low\"]) \u003c str(rows[0][\"user_high\"])\n\n    async def test_a_pass_against_a_like_creates_no_match(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'pass')\",\n            people.diya, people.aarav,\n        )\n        assert await conn.fetchval(\"SELECT count(*) FROM matches\") == 0\n\n    async def test_a_superlike_also_counts_as_a_like(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'superlike')\",\n            people.aarav, people.diya,\n        )\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.diya, people.aarav,\n        )\n        assert await conn.fetchval(\"SELECT count(*) FROM matches\") == 1\n\n    async def test_the_match_is_independent_of_who_liked_first(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.diya, people.aarav,\n        )\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        assert await conn.fetchval(\"SELECT count(*) FROM matches\") == 1\n\n\nclass TestBlockClosesMatch:\n    async def test_blocking_deactivates_an_existing_match(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.diya, people.aarav,\n        )\n        assert await conn.fetchval(\"SELECT is_active FROM matches\") is True\n\n        await conn.execute(\n            \"INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $2)\",\n            people.aarav, people.diya,\n        )\n        assert await conn.fetchval(\"SELECT is_active FROM matches\") is False\n\n\nclass TestNearbyProfiles:\n    async def _names(self, conn, viewer):\n        await as_user(conn, viewer)\n        rows = await conn.fetch(\"SELECT display_name, distance_km FROM nearby_profiles(20)\")\n        await as_owner(conn)\n        return [r[\"display_name\"] for r in rows]\n\n    async def test_returns_only_people_matching_the_viewers_orientation(self, conn, people):\n        # Aarav wants women. Diya and Ananya are women; Kabir is not.\n        names = await self._names(conn, people.aarav)\n        assert \"TestKabir\" not in names\n\n    async def test_excludes_anyone_beyond_the_distance_limit(self, conn, people):\n        # Ananya is in Pune, ~123 km away, with a 50 km default radius.\n        names = await self._names(conn, people.aarav)\n        assert \"TestDiya\" in names\n        assert \"TestAnanya\" not in names\n\n    async def test_never_returns_the_viewer(self, conn, people):\n        names = await self._names(conn, people.aarav)\n        assert \"TestAarav\" not in names\n\n    async def test_excludes_someone_already_swiped(self, conn, people):\n        assert \"TestDiya\" in await self._names(conn, people.aarav)\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'pass')\",\n            people.aarav, people.diya,\n        )\n        assert \"TestDiya\" not in await self._names(conn, people.aarav)\n\n    async def test_excludes_someone_who_blocked_the_viewer(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $2)\",\n            people.diya, people.aarav,\n        )\n        assert \"TestDiya\" not in await self._names(conn, people.aarav)\n\n    async def test_excludes_someone_the_viewer_blocked(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $2)\",\n            people.aarav, people.diya,\n        )\n        assert \"TestDiya\" not in await self._names(conn, people.aarav)\n\n    async def test_excludes_a_hidden_profile(self, conn, people):\n        await conn.execute(\"UPDATE profiles SET is_visible = FALSE WHERE id = $1\", people.diya)\n        assert \"TestDiya\" not in await self._names(conn, people.aarav)\n\n    async def test_excludes_a_banned_profile(self, conn, people):\n        await conn.execute(\"UPDATE profiles SET is_banned = TRUE WHERE id = $1\", people.diya)\n        assert \"TestDiya\" not in await self._names(conn, people.aarav)\n\n    async def test_excludes_a_profile_with_no_photos(self, conn, people):\n        await conn.execute(\"DELETE FROM profile_photos WHERE profile_id = $1\", people.diya)\n        assert \"TestDiya\" not in await self._names(conn, people.aarav)\n\n    async def test_excludes_a_profile_with_no_location(self, conn, people):\n        await conn.execute(\"UPDATE profiles SET location = NULL WHERE id = $1\", people.diya)\n        assert \"TestDiya\" not in await self._names(conn, people.aarav)\n\n    async def test_orders_by_distance_nearest_first(self, conn, people):\n        # Make Kabir eligible for Aarav so there are two candidates to order.\n        await conn.execute(\n            \"UPDATE profiles SET gender = 'female', interested_in = '{male}' WHERE id = $1\",\n            people.kabir,\n        )\n        await conn.execute(\n            \"UPDATE preferences SET max_distance_km = 200 WHERE profile_id = $1\", people.aarav\n        )\n        await as_user(conn, people.aarav)\n        rows = await conn.fetch(\"SELECT display_name, distance_km FROM nearby_profiles(20)\")\n        await as_owner(conn)\n        distances = [r[\"distance_km\"] for r in rows]\n        assert distances == sorted(distances)\n\n    async def test_distance_matches_the_known_bandra_to_pune_figure(self, conn, people):\n        await conn.execute(\n            \"UPDATE preferences SET max_distance_km = 200 WHERE profile_id = $1\", people.aarav\n        )\n        await as_user(conn, people.aarav)\n        rows = await conn.fetch(\"SELECT display_name, distance_km FROM nearby_profiles(20)\")\n        await as_owner(conn)\n        pune = next(r for r in rows if r[\"display_name\"] == \"TestAnanya\")\n        # Agrees with app.matching.geo.haversine_km to within 0.5 km.\n        assert 122.5 \u003c pune[\"distance_km\"] \u003c 124.0\n\n    async def test_widening_the_radius_reveals_more_people(self, conn, people):\n        narrow = await self._names(conn, people.aarav)\n        await conn.execute(\n            \"UPDATE preferences SET max_distance_km = 200 WHERE profile_id = $1\", people.aarav\n        )\n        wide = await self._names(conn, people.aarav)\n        assert len(wide) > len(narrow)\n        assert \"TestAnanya\" in wide\n\n\nclass TestUndoSafety:\n    \"\"\"Undo must not silently close a conversation the other person joined.\"\"\"\n\n    async def test_an_unmatched_swipe_is_still_undoable(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'pass')\",\n            people.aarav, people.diya,\n        )\n        row = await conn.fetchrow(\n            \"\"\"\n            SELECT target_id FROM swipes\n             WHERE actor_id = $1 AND created_at > now() - interval '3 minutes'\n             ORDER BY created_at DESC LIMIT 1\n            \"\"\",\n            people.aarav,\n        )\n        assert row is not None\n        # No match exists, so the service layer would permit the undo.\n        assert await conn.fetchval(\"SELECT count(*) FROM matches\") == 0\n\n    async def test_a_swipe_that_made_a_match_is_detectable(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.diya, people.aarav,\n        )\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        low, high = sorted([str(people.aarav), str(people.diya)])\n        active = await conn.fetchval(\n            \"SELECT TRUE FROM matches WHERE user_low = $1 AND user_high = $2 AND is_active\",\n            low, high,\n        )\n        # swipe_service.undo refuses when this is true.\n        assert active is True\n\n\nclass TestMatchDistance:\n    async def test_the_match_list_carries_a_real_distance(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.diya, people.aarav,\n        )\n        row = await conn.fetchrow(\n            \"\"\"\n            SELECT ST_Distance(p.location, me.location) / 1000.0 AS distance_km\n              FROM matches m\n              JOIN profiles p\n                ON p.id = CASE WHEN m.user_low = $1 THEN m.user_high ELSE m.user_low END\n             CROSS JOIN (SELECT location FROM profiles WHERE id = $1) me\n             WHERE m.user_low = $1 OR m.user_high = $1\n            \"\"\",\n            people.aarav,\n        )\n        # Bandra to Andheri is about 6.6 km — not the 0.0 the old code sent.\n        assert row is not None\n        assert 6.0 \u003c row[\"distance_km\"] \u003c 7.5\n"}, {"p": "tests/sql/test_rate_limits.py", "l": "python", "n": 119, "c": "\"\"\"Shared rate limiting.\n\nThe window lives in Postgres so the limit holds across API instances. An\nin-process counter enforced N times the intended allowance with N replicas.\n\"\"\"\nimport asyncio\n\nimport pytest\n\npytestmark = pytest.mark.db\n\n\nasync def hit(conn, subject: str, scope: str, limit: int, window: int = 60):\n    row = await conn.fetchrow(\n        \"SELECT allowed, used, retry_after_seconds FROM rate_limit_hit($1, $2, $3, $4)\",\n        subject, scope, limit, window,\n    )\n    return row[\"allowed\"], row[\"used\"], row[\"retry_after_seconds\"]\n\n\nclass TestWindow:\n    async def test_allows_up_to_the_limit(self, conn):\n        for expected in (1, 2, 3):\n            allowed, used, _ = await hit(conn, \"u1\", \"swipe\", 3)\n            assert allowed is True\n            assert used == expected\n\n    async def test_blocks_the_next_one(self, conn):\n        for _ in range(3):\n            await hit(conn, \"u1\", \"swipe\", 3)\n        allowed, used, retry = await hit(conn, \"u1\", \"swipe\", 3)\n        assert allowed is False\n        assert used == 3\n        assert retry > 0\n\n    async def test_tells_the_caller_when_to_retry(self, conn):\n        await hit(conn, \"u1\", \"swipe\", 1, window=60)\n        _, _, retry = await hit(conn, \"u1\", \"swipe\", 1, window=60)\n        assert 0 \u003c retry \u003c= 60\n\n    async def test_a_blocked_hit_is_not_recorded(self, conn):\n        # Otherwise a client hammering the endpoint would extend its own ban.\n        for _ in range(3):\n            await hit(conn, \"u1\", \"swipe\", 3)\n        for _ in range(5):\n            await hit(conn, \"u1\", \"swipe\", 3)\n        _, used, _ = await hit(conn, \"u1\", \"swipe\", 3)\n        assert used == 3\n\n\nclass TestIsolation:\n    async def test_limits_are_per_subject(self, conn):\n        for _ in range(3):\n            await hit(conn, \"u1\", \"swipe\", 3)\n        allowed, used, _ = await hit(conn, \"u2\", \"swipe\", 3)\n        assert allowed is True\n        assert used == 1\n\n    async def test_limits_are_per_scope(self, conn):\n        for _ in range(3):\n            await hit(conn, \"u1\", \"swipe\", 3)\n        allowed, _, _ = await hit(conn, \"u1\", \"message\", 3)\n        assert allowed is True\n\n\nclass TestExpiry:\n    async def test_old_hits_fall_out_of_the_window(self, conn):\n        await hit(conn, \"u1\", \"swipe\", 1, window=60)\n        # Backdate the recorded hit past the window.\n        await conn.execute(\n            \"UPDATE rate_limits SET hit_at = now() - interval '2 minutes' WHERE subject = 'u1'\"\n        )\n        allowed, used, _ = await hit(conn, \"u1\", \"swipe\", 1, window=60)\n        assert allowed is True\n        assert used == 1, \"the expired hit should have been purged\"\n\n    async def test_purge_removes_stale_rows(self, conn):\n        await hit(conn, \"u1\", \"swipe\", 5)\n        await conn.execute(\"UPDATE rate_limits SET hit_at = now() - interval '2 days'\")\n        deleted = await conn.fetchval(\"SELECT purge_rate_limits()\")\n        assert deleted >= 1\n\n\nclass TestConcurrency:\n    async def test_concurrent_hits_cannot_both_slip_through(self, test_dsn):\n        \"\"\"Six simultaneous requests against a limit of three must grant three.\n\n        Without the advisory lock each transaction counts the window without\n        seeing the others' uncommitted inserts, and they all pass the check.\n        Measured before the fix: 5 of 6 granted.\n\n        This test deliberately does NOT use the `conn` fixture. Those six\n        connections commit outside the fixture's transaction, so cleanup has to\n        commit too — a DELETE inside the rolled-back test transaction would\n        leave the rows behind and poison the next run.\n        \"\"\"\n        import asyncpg\n\n        subject = \"race-subject\"\n        cleaner = await asyncpg.connect(test_dsn)\n        await cleaner.execute(\"DELETE FROM rate_limits WHERE subject = $1\", subject)\n\n        conns = await asyncio.gather(*[asyncpg.connect(test_dsn) for _ in range(6)])\n        try:\n            results = await asyncio.gather(\n                *[\n                    c.fetchrow(\n                        \"SELECT allowed FROM rate_limit_hit($1, 'swipe', 3, 60)\", subject\n                    )\n                    for c in conns\n                ]\n            )\n            granted = sum(1 for r in results if r[\"allowed\"])\n            assert granted == 3, f\"expected exactly 3 grants, got {granted}\"\n        finally:\n            await asyncio.gather(*[c.close() for c in conns])\n            await cleaner.execute(\"DELETE FROM rate_limits WHERE subject = $1\", subject)\n            await cleaner.close()\n"}, {"p": "tests/sql/test_rls.py", "l": "python", "n": 288, "c": "\"\"\"Row level security.\n\nThe mobile client reads chat straight from Postgres over realtime, so RLS is\nthe actual security boundary — not the API. Each test here is an attack.\n\"\"\"\nimport asyncpg\nimport pytest\n\nfrom tests.sql.conftest import as_owner, as_user, assert_denied\n\npytestmark = pytest.mark.db\n\n\nasync def make_match(conn, a, b):\n    await conn.execute(\n        \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\", a, b\n    )\n    await conn.execute(\n        \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\", b, a\n    )\n    return await conn.fetchval(\"SELECT id FROM matches LIMIT 1\")\n\n\nclass TestProfileVisibility:\n    async def test_you_can_read_your_own_profile(self, conn, people):\n        await as_user(conn, people.aarav)\n        names = [r[\"display_name\"] for r in await conn.fetch(\"SELECT display_name FROM profiles\")]\n        await as_owner(conn)\n        assert names == [\"TestAarav\"]\n\n    async def test_you_cannot_browse_strangers(self, conn, people):\n        await as_user(conn, people.kabir)\n        names = [r[\"display_name\"] for r in await conn.fetch(\"SELECT display_name FROM profiles\")]\n        await as_owner(conn)\n        # Only himself — no match exists yet.\n        assert names == [\"TestKabir\"]\n\n    async def test_a_match_reveals_the_other_profile(self, conn, people):\n        await make_match(conn, people.aarav, people.diya)\n        await as_user(conn,
