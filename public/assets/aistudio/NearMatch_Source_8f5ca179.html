      \u003c/View>\n          \u003c/>\n        ) : null}\n      \u003c/View>\n\n      \u003cPressable\n        style={styles.body}\n        onPress={onOpenProfile}\n        accessibilityRole=\"button\"\n        accessibilityLabel={`Open ${profile.display_name}'s full profile`}\n      >\n        \u003cView style={styles.headline}>\n          \u003cText style={styles.name} numberOfLines={1}>\n            {profile.display_name}\n            \u003cText style={styles.age}>  {profile.age}\u003c/Text>\n          \u003c/Text>\n          \u003cText style={styles.distance}>{profile.distance_label}\u003c/Text>\n        \u003c/View>\n\n        {profile.job_title ? \u003cText style={styles.job}>{profile.job_title}\u003c/Text> : null}\n        {profile.bio ? (\n          \u003cText style={styles.bio} numberOfLines={3}>\n            {truncate(profile.bio, 180)}\n          \u003c/Text>\n        ) : null}\n\n        {profile.interests.length ? (\n          \u003cView style={styles.chips}>\n            {profile.interests.slice(0, 4).map((tag) => (\n              \u003cChip key={tag} label={prettyInterest(tag)} />\n            ))}\n          \u003c/View>\n        ) : null}\n\n        {reasons.length ? (\n          \u003cView style={styles.reasons}>\n            {reasons.slice(0, 2).map((reason) => (\n              \u003cText key={reason} style={styles.reason}>\n                · {reason}\n              \u003c/Text>\n            ))}\n          \u003c/View>\n        ) : null}\n      \u003c/Pressable>\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  card: {\n    flex: 1,\n    backgroundColor: colors.surface,\n    borderRadius: radius.xl,\n    overflow: 'hidden',\n    ...shadow.card,\n  },\n  photoWrap: { flex: 1, position: 'relative', backgroundColor: colors.surfaceSunken },\n  photo: { width: '100%', height: '100%' },\n  photoFallback: { alignItems: 'center', justifyContent: 'center' },\n  photoFallbackText: { ...typography.title, color: colors.textSubtle },\n  tapZone: { position: 'absolute', top: 0, bottom: 0, width: '30%' },\n  tapLeft: { left: 0 },\n  tapRight: { right: 0 },\n  dots: {\n    position: 'absolute',\n    top: spacing.md,\n    left: 0,\n    right: 0,\n    flexDirection: 'row',\n    justifyContent: 'center',\n    gap: spacing.xs,\n  },\n  dot: {\n    width: 22,\n    height: 3,\n    borderRadius: radius.pill,\n    backgroundColor: 'rgba(255,248,236,0.45)',\n  },\n  dotActive: { backgroundColor: colors.onDark },\n  body: { padding: spacing.base, gap: spacing.sm },\n  headline: { flexDirection: 'row', alignItems: 'baseline', justifyContent: 'space-between' },\n  name: { ...typography.title, color: colors.text, flexShrink: 1 },\n  age: { ...typography.title, fontWeight: '400', color: colors.textMuted },\n  distance: { ...typography.caption, color: colors.textSubtle },\n  job: { ...typography.label, color: colors.secondary },\n  bio: { ...typography.body, color: colors.textMuted },\n  chips: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.xs },\n  reasons: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.sm },\n  reason: { ...typography.caption, color: colors.success },\n});\n"}, {"p": "frontend/src/components/discover/SwipeControls.tsx", "l": "typescript", "n": 99, "c": "import { Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { MIN_TOUCH, colors, shadow, spacing, typography } from '@/theme/tokens';\nimport type { SwipeAction } from '@/types/models';\n\ninterface Props {\n  onSwipe: (action: SwipeAction) => void;\n  disabled?: boolean;\n  remainingLikes?: number | null;\n}\n\nexport function SwipeControls({ onSwipe, disabled = false, remainingLikes }: Props) {\n  return (\n    \u003cView style={styles.wrap}>\n      \u003cView style={styles.row}>\n        \u003cControl\n          label=\"Pass\"\n          glyph=\"✕\"\n          color={colors.nope}\n          onPress={() => onSwipe('pass')}\n          disabled={disabled}\n        />\n        \u003cControl\n          label=\"Super like\"\n          glyph=\"★\"\n          color={colors.superlike}\n          size={MIN_TOUCH + 8}\n          onPress={() => onSwipe('superlike')}\n          disabled={disabled}\n        />\n        \u003cControl\n          label=\"Like\"\n          glyph=\"♥\"\n          color={colors.like}\n          onPress={() => onSwipe('like')}\n          disabled={disabled}\n        />\n      \u003c/View>\n      {typeof remainingLikes === 'number' && remainingLikes \u003c= 10 ? (\n        \u003cText style={styles.quota}>\n          {remainingLikes === 0\n            ? 'No likes left today'\n            : `${remainingLikes} like${remainingLikes === 1 ? '' : 's'} left today`}\n        \u003c/Text>\n      ) : null}\n    \u003c/View>\n  );\n}\n\nfunction Control({\n  label,\n  glyph,\n  color,\n  onPress,\n  disabled,\n  size = MIN_TOUCH + 18,\n}: {\n  label: string;\n  glyph: string;\n  color: string;\n  onPress: () => void;\n  disabled: boolean;\n  size?: number;\n}) {\n  return (\n    \u003cPressable\n      onPress={onPress}\n      disabled={disabled}\n      accessibilityRole=\"button\"\n      accessibilityLabel={label}\n      accessibilityState={{ disabled }}\n      hitSlop={10}\n      style={({ pressed }) => [\n        styles.control,\n        { width: size, height: size, borderRadius: size / 2, borderColor: color },\n        pressed && !disabled && { backgroundColor: colors.surfaceMuted, transform: [{ scale: 0.94 }] },\n        disabled && styles.disabled,\n      ]}\n    >\n      \u003cText style={[styles.glyph, { color }]}>{glyph}\u003c/Text>\n    \u003c/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrap: { gap: spacing.sm, alignItems: 'center' },\n  row: { flexDirection: 'row', alignItems: 'center', justifyContent: 'center', gap: spacing.lg },\n  control: {\n    backgroundColor: colors.surface,\n    borderWidth: 1.5,\n    alignItems: 'center',\n    justifyContent: 'center',\n    ...shadow.raised,\n  },\n  glyph: { fontSize: 22, lineHeight: 26 },\n  disabled: { opacity: 0.4 },\n  quota: { ...typography.caption, color: colors.textSubtle },\n});\n"}, {"p": "frontend/src/components/matches/MatchRow.tsx", "l": "typescript", "n": 79, "c": "import { Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { Avatar } from '@/components/ui/Avatar';\nimport { relativeTime, truncate } from '@/lib/format';\nimport { colors, spacing, typography } from '@/theme/tokens';\nimport type { MatchSummary } from '@/types/models';\n\ninterface Props {\n  match: MatchSummary;\n  onPress: () => void;\n}\n\nexport function MatchRow({ match, onPress }: Props) {\n  const { other, last_message_preview, last_message_at, unread_count } = match;\n  const timestamp = last_message_at ?? match.matched_at;\n\n  return (\n    \u003cPressable\n      onPress={onPress}\n      accessibilityRole=\"button\"\n      accessibilityLabel={\n        unread_count > 0\n          ? `${other.display_name}, ${unread_count} unread messages`\n          : `Chat with ${other.display_name}`\n      }\n      style={({ pressed }) => [styles.row, pressed && styles.pressed]}\n    >\n      \u003cAvatar uri={other.photos[0]?.url} name={other.display_name} size={54} />\n\n      \u003cView style={styles.middle}>\n        \u003cText style={styles.name} numberOfLines={1}>\n          {other.display_name}\n        \u003c/Text>\n        \u003cText style={[styles.preview, unread_count > 0 && styles.previewUnread]} numberOfLines={1}>\n          {last_message_preview\n            ? truncate(last_message_preview, 60)\n            : 'You matched — say hello'}\n        \u003c/Text>\n      \u003c/View>\n\n      \u003cView style={styles.right}>\n        \u003cText style={styles.time}>{relativeTime(timestamp)}\u003c/Text>\n        {unread_count > 0 ? (\n          \u003cView style={styles.badge}>\n            \u003cText style={styles.badgeText}>{unread_count > 9 ? '9+' : unread_count}\u003c/Text>\n          \u003c/View>\n        ) : null}\n      \u003c/View>\n    \u003c/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  row: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    gap: spacing.md,\n    paddingVertical: spacing.md,\n    paddingHorizontal: spacing.base,\n  },\n  pressed: { backgroundColor: colors.surfaceMuted },\n  middle: { flex: 1, gap: 2 },\n  name: { ...typography.bodyStrong, color: colors.text },\n  preview: { ...typography.label, color: colors.textSubtle },\n  previewUnread: { color: colors.text, fontWeight: '600' },\n  right: { alignItems: 'flex-end', gap: spacing.xs },\n  time: { ...typography.caption, color: colors.textSubtle },\n  badge: {\n    minWidth: 20,\n    height: 20,\n    paddingHorizontal: 5,\n    borderRadius: 10,\n    backgroundColor: colors.primary,\n    alignItems: 'center',\n    justifyContent: 'center',\n  },\n  badgeText: { ...typography.caption, color: colors.onPrimary },\n});\n"}, {"p": "frontend/src/components/matches/NewMatchStrip.tsx", "l": "typescript", "n": 57, "c": "import { FlatList, Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { Avatar } from '@/components/ui/Avatar';\nimport { colors, spacing, typography } from '@/theme/tokens';\nimport type { MatchSummary } from '@/types/models';\n\ninterface Props {\n  matches: MatchSummary[];\n  onPress: (matchId: string) => void;\n}\n\nexport function NewMatchStrip({ matches, onPress }: Props) {\n  if (!matches.length) return null;\n\n  return (\n    \u003cView style={styles.wrap}>\n      \u003cText style={styles.heading}>New matches\u003c/Text>\n      \u003cFlatList\n        horizontal\n        data={matches}\n        keyExtractor={(item) => item.id}\n        showsHorizontalScrollIndicator={false}\n        contentContainerStyle={styles.list}\n        renderItem={({ item }) => (\n          \u003cPressable\n            onPress={() => onPress(item.id)}\n            style={styles.item}\n            accessibilityRole=\"button\"\n            accessibilityLabel={`New match with ${item.other.display_name}`}\n          >\n            \u003cView style={styles.ring}>\n              \u003cAvatar uri={item.other.photos[0]?.url} name={item.other.display_name} size={64} />\n            \u003c/View>\n            \u003cText style={styles.name} numberOfLines={1}>\n              {item.other.display_name}\n            \u003c/Text>\n          \u003c/Pressable>\n        )}\n      />\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrap: { gap: spacing.sm, paddingTop: spacing.sm },\n  heading: {\n    ...typography.caption,\n    color: colors.textMuted,\n    textTransform: 'uppercase',\n    paddingHorizontal: spacing.base,\n  },\n  list: { paddingHorizontal: spacing.base, gap: spacing.md },\n  item: { width: 72, alignItems: 'center', gap: spacing.xs },\n  ring: { padding: 3, borderRadius: 40, borderWidth: 2, borderColor: colors.primary },\n  name: { ...typography.caption, color: colors.text },\n});\n"}, {"p": "frontend/src/components/ui/Avatar.tsx", "l": "typescript", "n": 43, "c": "import { Image } from 'expo-image';\nimport { StyleSheet, Text, View } from 'react-native';\n\nimport { initials } from '@/lib/format';\nimport { colors, typography } from '@/theme/tokens';\n\ninterface Props {\n  uri?: string | null;\n  name: string;\n  size?: number;\n}\n\nexport function Avatar({ uri, name, size = 56 }: Props) {\n  const dimension = { width: size, height: size, borderRadius: size / 2 };\n\n  if (!uri) {\n    return (\n      \u003cView style={[styles.fallback, dimension]} accessibilityLabel={`${name}, no photo`}>\n        \u003cText style={[styles.initials, { fontSize: size * 0.36 }]}>{initials(name)}\u003c/Text>\n      \u003c/View>\n    );\n  }\n\n  return (\n    \u003cImage\n      source={{ uri }}\n      style={dimension}\n      contentFit=\"cover\"\n      transition={180}\n      accessibilityLabel={`${name}'s photo`}\n    />\n  );\n}\n\nconst styles = StyleSheet.create({\n  fallback: {\n    backgroundColor: colors.secondarySoft,\n    alignItems: 'center',\n    justifyContent: 'center',\n  },\n  initials: { ...typography.bodyStrong, color: colors.secondary },\n});\n"}, {"p": "frontend/src/components/ui/Banner.tsx", "l": "typescript", "n": 44, "c": "import { Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\ninterface Props {\n  message: string;\n  tone?: 'error' | 'info' | 'success';\n  onDismiss?: () => void;\n}\n\nexport function Banner({ message, tone = 'error', onDismiss }: Props) {\n  return (\n    \u003cView style={[styles.wrap, toneStyles[tone]]} accessibilityRole=\"alert\">\n      \u003cText style={[styles.text, tone === 'error' && { color: colors.danger }]}>{message}\u003c/Text>\n      {onDismiss ? (\n        \u003cPressable onPress={onDismiss} hitSlop={10} accessibilityLabel=\"Dismiss\">\n          \u003cText style={styles.dismiss}>✕\u003c/Text>\n        \u003c/Pressable>\n      ) : null}\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrap: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'space-between',\n    gap: spacing.md,\n    paddingVertical: spacing.md,\n    paddingHorizontal: spacing.base,\n    borderRadius: radius.md,\n    marginHorizontal: spacing.base,\n  },\n  text: { ...typography.label, color: colors.text, flex: 1 },\n  dismiss: { ...typography.label, color: colors.textMuted },\n});\n\nconst toneStyles = {\n  error: { backgroundColor: colors.dangerSoft },\n  info: { backgroundColor: colors.secondarySoft },\n  success: { backgroundColor: colors.successSoft },\n} as const;\n"}, {"p": "frontend/src/components/ui/Button.tsx", "l": "typescript", "n": 91, "c": "import { ActivityIndicator, Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { MIN_TOUCH, colors, radius, spacing, typography } from '@/theme/tokens';\n\ntype Variant = 'primary' | 'secondary' | 'ghost' | 'danger';\n\ninterface Props {\n  label: string;\n  onPress: () => void;\n  variant?: Variant;\n  disabled?: boolean;\n  loading?: boolean;\n  fullWidth?: boolean;\n  accessibilityHint?: string;\n}\n\nexport function Button({\n  label,\n  onPress,\n  variant = 'primary',\n  disabled = false,\n  loading = false,\n  fullWidth = true,\n  accessibilityHint,\n}: Props) {\n  const inactive = disabled || loading;\n\n  return (\n    \u003cPressable\n      onPress={onPress}\n      disabled={inactive}\n      accessibilityRole=\"button\"\n      accessibilityLabel={label}\n      accessibilityHint={accessibilityHint}\n      accessibilityState={{ disabled: inactive, busy: loading }}\n      style={({ pressed }) => [\n        styles.base,\n        fullWidth && styles.fullWidth,\n        variantStyles[variant].container,\n        pressed && !inactive && variantStyles[variant].pressed,\n        inactive && styles.inactive,\n      ]}\n    >\n      {loading ? (\n        \u003cActivityIndicator color={variant === 'primary' ? colors.onPrimary : colors.primary} />\n      ) : (\n        \u003cView style={styles.content}>\n          \u003cText style={[styles.label, variantStyles[variant].label]}>{label}\u003c/Text>\n        \u003c/View>\n      )}\n    \u003c/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  base: {\n    minHeight: MIN_TOUCH + 4,\n    paddingHorizontal: spacing.lg,\n    borderRadius: radius.pill,\n    alignItems: 'center',\n    justifyContent: 'center',\n  },\n  fullWidth: { alignSelf: 'stretch' },\n  content: { flexDirection: 'row', alignItems: 'center', gap: spacing.sm },\n  label: { ...typography.bodyStrong },\n  inactive: { opacity: 0.45 },\n});\n\nconst variantStyles: Record\u003cVariant, { container: object; pressed: object; label: object }> = {\n  primary: {\n    container: { backgroundColor: colors.primary },\n    pressed: { backgroundColor: colors.primaryPressed },\n    label: { color: colors.onPrimary },\n  },\n  secondary: {\n    container: { backgroundColor: colors.surface, borderWidth: 1, borderColor: colors.borderStrong },\n    pressed: { backgroundColor: colors.surfaceMuted },\n    label: { color: colors.text },\n  },\n  ghost: {\n    container: { backgroundColor: 'transparent' },\n    pressed: { backgroundColor: colors.surfaceMuted },\n    label: { color: colors.primary },\n  },\n  danger: {\n    container: { backgroundColor: colors.dangerSoft },\n    pressed: { backgroundColor: '#F0CCC7' },\n    label: { color: colors.danger },\n  },\n};\n"}, {"p": "frontend/src/components/ui/Chip.tsx", "l": "typescript", "n": 54, "c": "import { Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\ninterface Props {\n  label: string;\n  selected?: boolean;\n  onPress?: () => void;\n  tone?: 'default' | 'accent';\n}\n\nexport function Chip({ label, selected = false, onPress, tone = 'default' }: Props) {\n  const content = (\n    \u003cText style={[styles.label, selected && styles.selectedLabel]} numberOfLines={1}>\n      {label}\n    \u003c/Text>\n  );\n  const shape = [styles.chip, tone === 'accent' && styles.accent, selected && styles.selected];\n\n  // Static tags render as a plain View so screen readers do not announce them\n  // as buttons.\n  if (!onPress) {\n    return \u003cView style={shape}>{content}\u003c/View>;\n  }\n\n  return (\n    \u003cPressable\n      onPress={onPress}\n      accessibilityRole=\"button\"\n      accessibilityState={{ selected }}\n      hitSlop={6}\n      style={({ pressed }) => [...shape, pressed && styles.pressed]}\n    >\n      {content}\n    \u003c/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  chip: {\n    paddingVertical: spacing.sm,\n    paddingHorizontal: spacing.base,\n    borderRadius: radius.pill,\n    backgroundColor: colors.surfaceMuted,\n    borderWidth: 1,\n    borderColor: colors.border,\n  },\n  accent: { backgroundColor: colors.secondarySoft, borderColor: colors.secondarySoft },\n  selected: { backgroundColor: colors.primarySoft, borderColor: colors.primary },\n  pressed: { opacity: 0.75 },\n  label: { ...typography.label, color: colors.textMuted },\n  selectedLabel: { color: colors.primaryPressed },\n});\n"}, {"p": "frontend/src/components/ui/EmptyState.tsx", "l": "typescript", "n": 40, "c": "import { StyleSheet, Text, View } from 'react-native';\n\nimport { colors, spacing, typography } from '@/theme/tokens';\n\nimport { Button } from './Button';\n\ninterface Props {\n  title: string;\n  body?: string;\n  actionLabel?: string;\n  onAction?: () => void;\n}\n\nexport function EmptyState({ title, body, actionLabel, onAction }: Props) {\n  return (\n    \u003cView style={styles.wrap}>\n      \u003cText style={styles.title}>{title}\u003c/Text>\n      {body ? \u003cText style={styles.body}>{body}\u003c/Text> : null}\n      {actionLabel && onAction ? (\n        \u003cView style={styles.action}>\n          \u003cButton label={actionLabel} onPress={onAction} variant=\"secondary\" fullWidth={false} />\n        \u003c/View>\n      ) : null}\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrap: {\n    flex: 1,\n    alignItems: 'center',\n    justifyContent: 'center',\n    paddingHorizontal: spacing.xl,\n    gap: spacing.sm,\n  },\n  title: { ...typography.heading, color: colors.text, textAlign: 'center' },\n  body: { ...typography.body, color: colors.textMuted, textAlign: 'center' },\n  action: { marginTop: spacing.base },\n});\n"}, {"p": "frontend/src/components/ui/Screen.tsx", "l": "typescript", "n": 25, "c": "import { StyleSheet, View } from 'react-native';\nimport { SafeAreaView } from 'react-native-safe-area-context';\n\nimport { colors, spacing } from '@/theme/tokens';\n\ninterface Props {\n  children: React.ReactNode;\n  padded?: boolean;\n  edges?: ('top' | 'bottom' | 'left' | 'right')[];\n}\n\nexport function Screen({ children, padded = true, edges = ['top', 'bottom'] }: Props) {\n  return (\n    \u003cSafeAreaView style={styles.safe} edges={edges}>\n      \u003cView style={[styles.inner, padded && styles.padded]}>{children}\u003c/View>\n    \u003c/SafeAreaView>\n  );\n}\n\nconst styles = StyleSheet.create({\n  safe: { flex: 1, backgroundColor: colors.background },\n  inner: { flex: 1 },\n  padded: { paddingHorizontal: spacing.base },\n});\n"}, {"p": "frontend/src/context/AuthProvider.tsx", "l": "typescript", "n": 112, "c": "/**\n * Session + profile gate.\n *\n * Three states drive all routing: signed out, signed in but not onboarded, and\n * ready. Keeping that decision here means screens never have to guess.\n */\nimport { createContext, useCallback, useContext, useEffect, useMemo, useState } from 'react';\nimport type { Session } from '@supabase/supabase-js';\n\nimport { ApiError, api } from '@/lib/api';\nimport { supabase } from '@/lib/supabase';\nimport type { MyProfile } from '@/types/models';\n\nexport type AuthStage = 'loading' | 'signed-out' | 'needs-onboarding' | 'ready';\n\ninterface AuthValue {\n  stage: AuthStage;\n  session: Session | null;\n  profile: MyProfile | null;\n  refreshProfile: () => Promise\u003cvoid>;\n  signOut: () => Promise\u003cvoid>;\n}\n\nconst AuthContext = createContext\u003cAuthValue | null>(null);\n\nexport function AuthProvider({ children }: { children: React.ReactNode }) {\n  const [session, setSession] = useState\u003cSession | null>(null);\n  const [profile, setProfile] = useState\u003cMyProfile | null>(null);\n  const [sessionResolved, setSessionResolved] = useState(false);\n  const [profileResolved, setProfileResolved] = useState(false);\n\n  useEffect(() => {\n    let active = true;\n\n    supabase.auth.getSession().then(({ data }) => {\n      if (!active) return;\n      setSession(data.session);\n      setSessionResolved(true);\n    });\n\n    const { data: subscription } = supabase.auth.onAuthStateChange((_event, next) => {\n      setSession(next);\n      setSessionResolved(true);\n      if (!next) {\n        setProfile(null);\n        setProfileResolved(true);\n      } else {\n        setProfileResolved(false);\n      }\n    });\n\n    return () => {\n      active = false;\n      subscription.subscription.unsubscribe();\n    };\n  }, []);\n\n  const loadProfile = useCallback(async () => {\n    if (!session) {\n      setProfile(null);\n      setProfileResolved(true);\n      return;\n    }\n    try {\n      setProfile(await api.getMyProfile());\n    } catch (error) {\n      // 404 is the expected answer before onboarding finishes.\n      if (error instanceof ApiError && error.status === 404) {\n        setProfile(null);\n      } else if (error instanceof ApiError && error.isAuthError) {\n        await supabase.auth.signOut();\n      } else {\n        setProfile(null);\n      }\n    } finally {\n      setProfileResolved(true);\n    }\n  }, [session]);\n\n  useEffect(() => {\n    // Initial fetch for a newly-established session. loadProfile only calls\n    // setState after its await, so this effect body starts no render cascade.\n    // eslint-disable-next-line react-hooks/set-state-in-effect\n    if (session && !profileResolved) void loadProfile();\n  }, [session, profileResolved, loadProfile]);\n\n  const signOut = useCallback(async () => {\n    await supabase.auth.signOut();\n    setProfile(null);\n  }, []);\n\n  const stage: AuthStage = useMemo(() => {\n    if (!sessionResolved || (session && !profileResolved)) return 'loading';\n    if (!session) return 'signed-out';\n    if (!profile?.is_onboarded) return 'needs-onboarding';\n    return 'ready';\n  }, [sessionResolved, profileResolved, session, profile]);\n\n  const value = useMemo(\n    () => ({ stage, session, profile, refreshProfile: loadProfile, signOut }),\n    [stage, session, profile, loadProfile, signOut],\n  );\n\n  return \u003cAuthContext.Provider value={value}>{children}\u003c/AuthContext.Provider>;\n}\n\nexport function useAuth(): AuthValue {\n  const context = useContext(AuthContext);\n  if (!context) throw new Error('useAuth must be used inside AuthProvider');\n  return context;\n}\n"}, {"p": "frontend/src/hooks/useChat.ts", "l": "typescript", "n": 127, "c": "/**\n * One conversation, with realtime delivery and optimistic sends.\n *\n * Outgoing messages carry a client_id so a retry cannot duplicate them, and so\n * the realtime echo can be matched back to the pending bubble.\n */\nimport { useCallback, useEffect, useRef, useState } from 'react';\n\nimport { ApiError, api } from '@/lib/api';\nimport { supabase } from '@/lib/supabase';\nimport type { Message } from '@/types/models';\n\ntype Pending = Message & { pending?: true; failed?: true };\n\nexport function useChat(matchId: string, myId: string | undefined) {\n  const [messages, setMessages] = useState\u003cPending[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [sending, setSending] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n  const seenIds = useRef(new Set\u003cstring>());\n\n  const load = useCallback(async () => {\n    try {\n      const page = await api.getMessages(matchId);\n      page.forEach((m) => seenIds.current.add(m.id));\n      setMessages(page);\n      setError(null);\n    } catch (err) {\n      setError(err instanceof ApiError ? err.message : 'Could not load this conversation.');\n    } finally {\n      setLoading(false);\n    }\n  }, [matchId]);\n\n  useEffect(() => {\n    // Load the transcript, then subscribe for live inserts. The load is\n    // async, so its setState lands after this effect body returns.\n    // eslint-disable-next-line react-hooks/set-state-in-effect\n    void load();\n\n    const channel = supabase\n      .channel(`chat:${matchId}`)\n      .on(\n        'postgres_changes',\n        { event: 'INSERT', schema: 'public', table: 'messages', filter: `match_id=eq.${matchId}` },\n        (payload) => {\n          const row = payload.new as Record\u003cstring, unknown>;\n          const id = String(row.id);\n          if (seenIds.current.has(id)) return;\n          seenIds.current.add(id);\n\n          const incoming: Pending = {\n            id,\n            match_id: String(row.match_id),\n            sender_id: String(row.sender_id),\n            body: String(row.body),\n            sent_at: String(row.sent_at),\n            read_at: row.read_at ? String(row.read_at) : null,\n            client_id: row.client_id ? String(row.client_id) : null,\n            is_mine: String(row.sender_id) === myId,\n          };\n\n          setMessages((prev) => {\n            // Replace the optimistic bubble if this is our own echo.\n            const withoutPending = incoming.client_id\n              ? prev.filter((m) => m.client_id !== incoming.client_id)\n              : prev;\n            return [...withoutPending, incoming];\n          });\n\n          if (!incoming.is_mine) void api.markRead(matchId).catch(() => undefined);\n        },\n      )\n      .subscribe();\n\n    return () => void supabase.removeChannel(channel);\n  }, [matchId, myId, load]);\n\n  const send = useCallback(\n    async (body: string) => {\n      const trimmed = body.trim();\n      if (!trimmed || !myId) return;\n\n      const clientId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;\n      const optimistic: Pending = {\n        id: `pending-${clientId}`,\n        match_id: matchId,\n        sender_id: myId,\n        body: trimmed,\n        sent_at: new Date().toISOString(),\n        read_at: null,\n        client_id: clientId,\n        is_mine: true,\n        pending: true,\n      };\n      setMessages((prev) => [...prev, optimistic]);\n      setSending(true);\n\n      try {\n        const saved = await api.sendMessage(matchId, trimmed, clientId);\n        seenIds.current.add(saved.id);\n        setMessages((prev) => prev.map((m) => (m.client_id === clientId ? saved : m)));\n      } catch (err) {\n        setMessages((prev) =>\n          prev.map((m) => (m.client_id === clientId ? { ...m, pending: undefined, failed: true } : m)),\n        );\n        setError(err instanceof ApiError ? err.message : 'Message not sent.');\n      } finally {\n        setSending(false);\n      }\n    },\n    [matchId, myId],\n  );\n\n  const retry = useCallback(\n    async (clientId: string) => {\n      const failed = messages.find((m) => m.client_id === clientId);\n      if (!failed) return;\n      setMessages((prev) => prev.filter((m) => m.client_id !== clientId));\n      await send(failed.body);\n    },\n    [messages, send],\n  );\n\n  return { messages, loading, sending, error, send, retry, reload: load };\n}\n"}, {"p": "frontend/src/hooks/useDiscoverDeck.ts", "l": "typescript", "n": 119, "c": "/**\n * Discovery deck with local optimism.\n *\n * A swipe removes the card immediately and posts in the background, so the\n * stack never stutters. A failed swipe puts the card back and reports why.\n */\nimport { useCallback, useEffect, useRef, useState } from 'react';\n\nimport { ApiError, api } from '@/lib/api';\nimport type { DiscoverCard, SwipeAction, SwipeResult } from '@/types/models';\n\nconst REFILL_THRESHOLD = 3;\n\ninterface State {\n  cards: DiscoverCard[];\n  loading: boolean;\n  error: string | null;\n  exhausted: boolean;\n  suggestion: string | null;\n  remainingLikes: number | null;\n}\n\nexport function useDiscoverDeck() {\n  const [state, setState] = useState\u003cState>({\n    cards: [],\n    loading: true,\n    error: null,\n    exhausted: false,\n    suggestion: null,\n    remainingLikes: null,\n  });\n  const fetching = useRef(false);\n\n  const load = useCallback(async (replace: boolean) => {\n    if (fetching.current) return;\n    fetching.current = true;\n    try {\n      const deck = await api.getDeck();\n      setState((prev) => ({\n        ...prev,\n        cards: replace ? deck.cards : dedupe([...prev.cards, ...deck.cards]),\n        loading: false,\n        error: null,\n        exhausted: deck.exhausted,\n        suggestion: deck.suggestion,\n      }));\n    } catch (error) {\n      setState((prev) => ({\n        ...prev,\n        loading: false,\n        error:\n          error instanceof ApiError\n            ? error.message\n            : 'Could not load people nearby. Pull to retry.',\n      }));\n    } finally {\n      fetching.current = false;\n    }\n  }, []);\n\n  useEffect(() => {\n    void load(true);\n  }, [load]);\n\n  const swipe = useCallback(\n    async (action: SwipeAction): Promise\u003cSwipeResult | null> => {\n      const card = state.cards[0];\n      if (!card) return null;\n\n      // Optimistic: drop the card now.\n      setState((prev) => ({ ...prev, cards: prev.cards.slice(1) }));\n\n      try {\n        const result = await api.swipe(card.profile.id, action);\n        setState((prev) => ({ ...prev, remainingLikes: result.remaining_likes }));\n        return result;\n      } catch (error) {\n        // Put it back so the user is not silently skipped past someone.\n        setState((prev) => ({\n          ...prev,\n          cards: [card, ...prev.cards],\n          error: error instanceof ApiError ? error.message : 'That swipe did not go through.',\n        }));\n        return null;\n      }\n    },\n    [state.cards],\n  );\n\n  useEffect(() => {\n    if (!state.loading && !state.exhausted && state.cards.length \u003c= REFILL_THRESHOLD) {\n      void load(false);\n    }\n  }, [state.cards.length, state.loading, state.exhausted, load]);\n\n  const clearError = useCallback(\n    () => setState((prev) => ({ ...prev, error: null })),\n    [],\n  );\n\n  return {\n    ...state,\n    current: state.cards[0] ?? null,\n    next: state.cards[1] ?? null,\n    swipe,\n    reload: () => load(true),\n    clearError,\n  };\n}\n\nfunction dedupe(cards: DiscoverCard[]): DiscoverCard[] {\n  const seen = new Set\u003cstring>();\n  return cards.filter((card) => {\n    if (seen.has(card.profile.id)) return false;\n    seen.add(card.profile.id);\n    return true;\n  });\n}\n"}, {"p": "frontend/src/hooks/useMatches.ts", "l": "typescript", "n": 54, "c": "import { useCallback, useEffect, useState } from 'react';\n\nimport { ApiError, api } from '@/lib/api';\nimport { supabase } from '@/lib/supabase';\nimport type { MatchSummary } from '@/types/models';\n\nexport function useMatches() {\n  const [matches, setMatches] = useState\u003cMatchSummary[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  const load = useCallback(async () => {\n    try {\n      setMatches(await api.getMatches());\n      setError(null);\n    } catch (err) {\n      setError(err instanceof ApiError ? err.message : 'Could not load your matches.');\n    } finally {\n      setLoading(false);\n    }\n  }, []);\n\n  useEffect(() => {\n    // Same shape as useChat: async load, then a realtime subscription.\n    // eslint-disable-next-line react-hooks/set-state-in-effect\n    void load();\n\n    // A new match or message should move the list without a manual refresh.\n    const channel = supabase\n      .channel('matches-feed')\n      .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, () => void load())\n      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () =>\n        void load(),\n      )\n      .subscribe();\n\n    return () => void supabase.removeChannel(channel);\n  }, [load]);\n\n  const unmatch = useCallback(async (matchId: string) => {\n    setMatches((prev) => prev.filter((m) => m.id !== matchId));\n    try {\n      await api.unmatch(matchId);\n    } catch {\n      await load();\n    }\n  }, [load]);\n\n  const newMatches = matches.filter((m) => m.is_new);\n  const conversations = matches.filter((m) => !m.is_new);\n\n  return { matches, newMatches, conversations, loading, error, reload: load, unmatch };\n}\n"}, {"p": "frontend/src/hooks/usePreferences.ts", "l": "typescript", "n": 42, "c": "import { useCallback, useEffect, useState } from 'react';\n\nimport { ApiError, api } from '@/lib/api';\nimport type { Preferences } from '@/types/models';\n\nexport function usePreferences() {\n  const [preferences, setPreferences] = useState\u003cPreferences | null>(null);\n  const [loading, setLoading] = useState(true);\n  const [saving, setSaving] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  useEffect(() => {\n    api\n      .getPreferences()\n      .then(setPreferences)\n      .catch((err) =>\n        setError(err instanceof ApiError ? err.message : 'Could not load your preferences.'),\n      )\n      .finally(() => setLoading(false));\n  }, []);\n\n  const save = useCallback(\n    async (patch: Partial\u003cPreferences>) => {\n      setSaving(true);\n      const previous = preferences;\n      setPreferences((prev) => (prev ? { ...prev, ...patch } : prev));\n      try {\n        setPreferences(await api.updatePreferences(patch));\n        setError(null);\n      } catch (err) {\n        setPreferences(previous);\n        setError(err instanceof ApiError ? err.message : 'Could not save that change.');\n      } finally {\n        setSaving(false);\n      }\n    },\n    [preferences],\n  );\n\n  return { preferences, loading, saving, error, save };\n}\n"}, {"p": "frontend/src/hooks/usePushRegistration.ts", "l": "typescript", "n": 42, "c": "/**\n * Registers the device for match and message notifications.\n *\n * Best effort by design: a user who declines notifications still gets a fully\n * working app, so nothing here throws.\n */\nimport { useEffect } from 'react';\nimport { Platform } from 'react-native';\nimport * as Notifications from 'expo-notifications';\n\nimport { api } from '@/lib/api';\n\nexport function usePushRegistration(enabled: boolean) {\n  useEffect(() => {\n    if (!enabled || Platform.OS === 'web') return;\n\n    let cancelled = false;\n\n    (async () => {\n      try {\n        const existing = await Notifications.getPermissionsAsync();\n        let status = existing.status;\n        if (status !== 'granted') {\n          status = (await Notifications.requestPermissionsAsync()).status;\n        }\n        if (status !== 'granted' || cancelled) return;\n\n        const token = await Notifications.getExpoPushTokenAsync();\n        if (cancelled) return;\n\n        await api.registerDevice(token.data, Platform.OS === 'ios' ? 'ios' : 'android');\n      } catch {\n        // No push today; the app works regardless.\n      }\n    })();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [enabled]);\n}\n"}, {"p": "frontend/src/theme/tokens.ts", "l": "typescript", "n": 102, "c": "/**\n * NearMatch design tokens.\n *\n * The palette is anchored on the warm cream (#FFF8EC) already used by the app\n * icon and splash screen, so the running app and the store assets agree.\n * Keep this file and ../../design_guidelines.json in step.\n */\n\nexport const colors = {\n  // Surfaces\n  background: '#FFF8EC',\n  surface: '#FFFFFF',\n  surfaceMuted: '#FBF1E2',\n  surfaceSunken: '#F4E7D3',\n\n  // Brand — warm terracotta reads as inviting rather than transactional\n  primary: '#E2674A',\n  primaryPressed: '#C8543A',\n  primarySoft: '#FBE3DC',\n  onPrimary: '#FFFFFF',\n\n  // Secondary — deep teal for balance against the warm base\n  secondary: '#1F6F6B',\n  secondarySoft: '#D9ECEA',\n\n  // Text\n  text: '#2B2118',\n  textMuted: '#6F6153',\n  textSubtle: '#9A8B7C',\n  onDark: '#FFF8EC',\n\n  // Status\n  success: '#2E7D52',\n  successSoft: '#DCEFE2',\n  warning: '#B07A14',\n  warningSoft: '#FBEFD4',\n  danger: '#C0392B',\n  dangerSoft: '#F8E1DE',\n\n  // Lines\n  border: '#EADCC7',\n  borderStrong: '#D9C5A8',\n\n  // Swipe affordances\n  like: '#2E7D52',\n  nope: '#C0392B',\n  superlike: '#2F6FB0',\n\n  overlay: 'rgba(43, 33, 24, 0.55)',\n} as const;\n\nexport const spacing = {\n  xxs: 2,\n  xs: 4,\n  sm: 8,\n  md: 12,\n  base: 16,\n  lg: 24,\n  xl: 32,\n  xxl: 48,\n} as const;\n\nexport const radius = {\n  sm: 8,\n  md: 12,\n  lg: 18,\n  xl: 28,\n  pill: 999,\n} as const;\n\nexport const typography = {\n  display: { fontSize: 32, lineHeight: 38, fontWeight: '700' as const, letterSpacing: -0.5 },\n  title: { fontSize: 24, lineHeight: 30, fontWeight: '700' as const, letterSpacing: -0.3 },\n  heading: { fontSize: 19, lineHeight: 25, fontWeight: '600' as const },\n  body: { fontSize: 16, lineHeight: 23, fontWeight: '400' as const },\n  bodyStrong: { fontSize: 16, lineHeight: 23, fontWeight: '600' as const },\n  label: { fontSize: 14, lineHeight: 19, fontWeight: '500' as const },\n  caption: { fontSize: 12, lineHeight: 16, fontWeight: '500' as const, letterSpacing: 0.2 },\n} as const;\n\n/** Shadows are kept soft and warm; hard grey drop shadows fight the cream base. */\nexport const shadow = {\n  card: {\n    shadowColor: '#8A6A45',\n    shadowOpacity: 0.16,\n    shadowRadius: 18,\n    shadowOffset: { width: 0, height: 8 },\n    elevation: 6,\n  },\n  raised: {\n    shadowColor: '#8A6A45',\n    shadowOpacity: 0.1,\n    shadowRadius: 8,\n    shadowOffset: { width: 0, height: 3 },\n    elevation: 3,\n  },\n} as const;\n\n/** Minimum touch target. Anything tappable must meet this. */\nexport const HIT_SLOP = { top: 8, bottom: 8, left: 8, right: 8 } as const;\nexport const MIN_TOUCH = 44;\n"}, {"p": "frontend/src/types/models.ts", "l": "typescript", "n": 110, "c": "/** Shapes returned by the NearMatch API. Mirrors backend/app/models. */\n\nexport type Gender = 'male' | 'female' | 'nonbinary' | 'other';\nexport type InterestedIn = 'male' | 'female' | 'nonbinary' | 'everyone';\nexport type SwipeAction = 'like' | 'pass' | 'superlike';\n\nexport interface Photo {\n  id: string;\n  storage_path: string;\n  url: string | null;\n  position: number;\n  is_primary: boolean;\n}\n\nexport interface PublicProfile {\n  id: string;\n  display_name: string;\n  age: number;\n  gender: Gender;\n  bio: string;\n  job_title: string | null;\n  city: string | null;\n  interests: string[];\n  photos: Photo[];\n  distance_label: string;\n  last_active_label: string | null;\n}\n\nexport interface MyProfile {\n  id: string;\n  display_name: string;\n  dob: string;\n  gender: Gender;\n  interested_in: InterestedIn[];\n  bio: string;\n  job_title: string | null;\n  city: string | null;\n  interests: string[];\n  age: number;\n  photos: Photo[];\n  is_onboarded: boolean;\n  is_visible: boolean;\n  has_location: boolean;\n  created_at: string;\n  updated_at: string | null;\n}\n\nexport interface Preferences {\n  min_age: number;\n  max_age: number;\n  max_distance_km: number;\n  show_me: InterestedIn[];\n  hide_profile: boolean;\n}\n\nexport interface DiscoverCard {\n  profile: PublicProfile;\n  distance_km: number;\n  score: number;\n  reasons: string[];\n  breakdown?: Record\u003cstring, unknown> | null;\n}\n\nexport interface DiscoverDeck {\n  cards: DiscoverCard[];\n  exhausted: boolean;\n  suggestion: string | null;\n}\n\nexport interface SwipeResult {\n  recorded: boolean;\n  is_match: boolean;\n  match_id: string | null;\n  matched_at: string | null;\n  remaining_likes: number | null;\n}\n\nexport interface MatchSummary {\n  id: string;\n  other: PublicProfile;\n  matched_at: string;\n  last_message_at: string | null;\n  last_message_preview: string | null;\n  unread_count: number;\n  is_new: boolean;\n}\n\nexport interface Message {\n  id: string;\n  match_id: string;\n  sender_id: string;\n  body: string;\n  sent_at: string;\n  read_at: string | null;\n  is_mine: boolean;\n  client_id: string | null;\n}\n\nexport type ReportReason =\n  | 'fake_profile'\n  | 'harassment'\n  | 'inappropriate_photos'\n  | 'spam'\n  | 'underage'\n  | 'other';\n\nexport interface ApiErrorBody {\n  error: { code: string; message: string; details?: Record\u003cstring, unknown> };\n}\n"}, {"p": "frontend/tsconfig.json", "l": "json", "n": 10, "c": "{\n  \"extends\": \"expo/tsconfig.base\",\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"paths\": { \"@/*\": [\"./src/*\"] }\n  },\n  \"include\": [\"**/*.ts\", \"**/*.tsx\", \".expo/types/**/*.ts\", \"expo-env.d.ts\"],\n  \"exclude\": [\"node_modules\"]\n}\n"}, {"p": "memory/README.md", "l": "markdown", "n": 19, "c": "# memory/\n\nDurable project context — the things an agent (or a new engineer) needs to\nknow that are not obvious from the code.\n\n| File | Holds |\n|---|---|\n| `project_context.md` | What NearMatch is, who it's for, current state |\n| `domain_glossary.md` | Terms used throughout the codebase |\n| `architecture_decisions.md` | Decisions with their reasoning and alternatives |\n| `matching_rules.md` | How ranking works and why each weight is what it is |\n| `user_preferences.md` | Working preferences for this repo |\n| `session_log/` | What changed, session by session |\n| `decisions/` | Longer ADRs when one needs more than a paragraph |\n\n**This directory is prose, not config.** Nothing here is imported by the app.\nKeep it current — a stale memory file is worse than none, because it is\nbelieved.\n"}, {"p": "memory/architecture_decisions.md", "l": "markdown", "n": 59, "c": "# Architecture decisions\n\nShort entries. Anything needing more room gets a file in `decisions/`.\n\n## Matching runs in SQL, scoring runs in Python\n`nearby_profiles` / `discover_repo` does the filtering, because PostGIS with a\nGiST index keeps \"everyone within 50 km\" cheap, and pulling candidates into\nPython to filter them would not scale past a few thousand profiles.\n\nScoring stays in Python because it changes often, needs to be explainable to\nusers, and is far easier to unit test. The split costs one round-trip per deck.\n\n## Matches are created by a database trigger, not the API\nTwo people can like each other at the same instant. If match creation lived\nonly in the API, each request could miss the other's like and no match would\nform. `create_match_on_reciprocal_like` makes it atomic. The API still creates\nmatches on the swipe path so it can return `is_match` immediately; the trigger\nis the backstop and the `ON CONFLICT` makes the pair idempotent.\n\n## RLS is the security boundary, not the API\nThe client subscribes to `messages` over Supabase Realtime, so it holds a\ndirect Postgres connection. Any rule enforced only in FastAPI would be\nbypassable. Every table has RLS, and `tests/sql/test_rls.py` attacks each one.\n\n## Likes are hidden until mutual\n`swipes` is readable only by the actor. There is deliberately no \"who liked\nyou\" endpoint — it is the feature most often used to drive paid upgrades, and\nexposing it changes the product into something else.\n\n## Locations are snapped to a ~300 m grid before storage\nStoring a precise fix is a safety problem for a location-based dating app. The\ngrid is applied in `profile_service.update_location`, so the precise value is\nnever written. Users see rounded labels, never coordinates.\n\nA subtle part: the longitude grid is computed from the **snapped** latitude. An\nearlier version used the raw latitude, which made the grid width vary per point\n— two people in one cell still got distinguishable longitudes, and the function\nwas not idempotent. Caught by `test_snapping_is_idempotent`.\n\n## Photos bypass the API\n`POST /me/photos/upload-url` returns a signed Supabase Storage URL; the device\nuploads directly and then calls `POST /me/photos` to register the path. Keeps\nmulti-megabyte uploads off the API process. Storage policies key ownership on\nthe first path segment (`\u003cprofile_id>/...`), and the API refuses to register a\npath that is not under the caller's own id.\n\n## Messages carry a client_id\nA retried send on a flaky mobile connection must not post twice. The unique\nindex on `(match_id, sender_id, client_id)` makes the insert idempotent, and\nthe client uses the same id to reconcile its optimistic bubble with the\nrealtime echo.\n\n## Deck diversification interleaves rather than defers\nThe first implementation deferred same-band candidates and appended them at the\nend, which just moved the run to the tail. It now picks, at each position, the\nbest-scoring candidate that keeps the recent window varied. The tail of a deck\nis still single-band once other bands are exhausted — unavoidable, and\ndocumented in the test.\n"}, {"p": "memory/domain_glossary.md", "l": "markdown", "n": 34, "c": "# Glossary\n\n**Deck** — the ordered list of candidates the user swipes through. Built by\n`discover_service.build_deck`, typically 20 cards.\n\n**Band** — a 5 km distance bucket, used only by `diversify` to avoid serving a\nrun of candidates all the same distance away.\n\n**Candidate** — someone who passed every hard filter and is eligible to be\nshown. Scoring happens only on candidates.\n\n**Hard filter / gate** — a yes-or-no rule (age, distance, orientation, block,\nalready-swiped). Failing one removes a candidate entirely. Lives in\n`app/matching/filters.py` and is mirrored in SQL.\n\n**Score** — a 0–1 blend of five weighted components. Only ever reorders\ncandidates; it can never surface someone a gate excluded.\n\n**Reciprocal like** — both people liked each other. This, and only this,\ncreates a match. Enforced by a database trigger so concurrent likes cannot\nmiss each other.\n\n**Canonical pair** — a match is stored once with the lower UUID as `user_low`,\nso the same pair cannot exist twice under two orderings.\n\n**Grey band** — not used in NearMatch. (If you see this term it is from an\nearlier, unrelated draft of this repo.)\n\n**Snapping / jitter** — rounding a coordinate onto a fixed ~300 m grid before\nstoring it, so a stored location cannot be narrowed to a home address.\n\n**Distance label** — the coarse string shown to users (\"7 km away\"). The exact\ndistance is never sent to the client.\n"}, {"p": "memory/matching_rules.md", "l": "markdown", "n": 48, "c": "# How ranking works\n\nTwo stages. **Gates** decide who is eligible; **scores** decide what order.\nA score can never surface someone a gate excluded.\n\n## Gates (`app/matching/filters.py`, mirrored in SQL)\n| Gate | Rule |\n|---|---|\n| self | never show the viewer their own profile |\n| onboarded | profile must be complete |\n| visible | not hidden in settings |\n| banned | moderation flag excludes |\n| blocked | either direction excludes, permanently |\n| already seen | one swipe per pair, ever |\n| underage | hard floor of 18, also a DB check constraint |\n| age range | viewer's band, with a ±2 year grace |\n| distance | within the viewer's max radius |\n| orientation | **mutual** — each must be open to the other's gender |\n| photos | at least one, else there is nothing to judge |\n\n## Scores (`app/matching/scoring.py`)\n| Component | Weight | Why |\n|---|---|---|\n| distance | 0.34 | the whole premise of the app |\n| interests | 0.24 | the strongest signal of an actual conversation |\n| age | 0.16 | preference satisfaction, soft outside the band |\n| activity | 0.14 | matching a dormant account wastes both people's time |\n| completeness | 0.12 | rewards profiles that give others something to go on |\n\nWeights sum to 1.0; a test asserts it, because drift silently rescales\nevery total.\n\n**Distance** decays by half every 25 km, with a cubic taper so the score\nreaches zero exactly at the user's limit rather than cutting off abruptly.\n\n**Interests** is Jaccard overlap, case- and whitespace-insensitive.\n\n**Activity** is a step function, not a curve: a week-old login should not rank\nfar below a one-hour-old one, but a three-month-old one should.\n\n## Tuning notes\n- Raising `distance` weight above ~0.4 makes the deck feel repetitive in dense\n  cities, because everyone within 2 km floods the top.\n- `interests` is the component to raise if users report \"matches but no\n  conversations\".\n- `completeness` exists mostly as an incentive. Dropping it below 0.1 removes\n  any reason to fill in a profile.\n"}, {"p": "memory/project_context.md", "l": "markdown", "n": 55, "c": "# NearMatch — project context\n\n## What it is\nA location-based matching app for mobile. People create a profile with photos,\nshare their location, and swipe through a deck of nearby candidates. When two\npeople like each other, a match opens a chat.\n\n## Identity\n- App name: **NearMatch** · slug `nearmatch` · scheme `nearmatch://`\n- Bundle / package: `com.kumravi253.nearmatch` (iOS and Android)\n- Associated domains: `nearmatch.in`, `www.nearmatch.in`\n- Expo SDK **58**, expo-router with typed routes\n\n## Who it's for\nPrimary market is India (`.in` domain, Mumbai-based seed data). That shapes a\nfew things: distance bands are tuned for dense metros, and email OTP is the\ndefault sign-in with Apple Sign In offered on iOS.\n\n## Stack\n```\nExpo (React Native)  →  FastAPI  →  Supabase Postgres + PostGIS\n                     ↘            ↗\n                       Supabase Auth / Storage / Realtime\n```\n- The client talks to the API for everything **except** realtime chat, which it\n  reads straight from Postgres. That makes RLS the real security boundary.\n- Photos go device → Supabase Storage via a signed URL. Image bytes never pass\n  through the API.\n\n## Current state (2026-11-15)\nFeature-complete for a first release:\n- Email OTP + Apple sign-in, three-step onboarding\n- Discovery deck with distance/interest/age/activity ranking\n- Swipe, reciprocal match detection, match celebration\n- Realtime chat with optimistic sends and read receipts\n- Block, report, unmatch, hide profile\n- Push notifications for matches, likes and messages\n\n**Not built yet:** account deletion is a support-email flow rather than\nself-service; there is no moderation dashboard; photos are not scanned for\nnudity; no payment or premium tier.\n\n## Known gaps worth knowing about\n- **The app has never been rendered.** No simulator was available while it was\n  built. This is the biggest unknown by far.\n- No self-service account deletion — blocks App Store review.\n- No photo moderation of any kind.\n- Frontend test coverage is 5.8%; only pure helpers are covered.\n- The batch photo-signing path is tested against a fake, not a live Supabase.\n  Confirm the batch endpoint's request shape against a real project.\n\nClosed in the P0/P1 pass (see `session_log/2026-11-15.md`): the N+1 signing\nbug, self-unbanning, in-process rate limiting, the zeroed match distance, the\nunsafe undo, and the duplicate `last_message_at` write.\n"}, {"p": "memory/session_log/2026-11-15.md", "l": "markdown", "n": 78, "c": "# 2026-11-15 — initial build\n\nBuilt the app from scratch against the live Expo preview manifest.\n\n## How the spec was recovered\nThe repository was empty apart from a one-line README. The shared preview URL\nwas an Expo Go deep link, so the manifest at\n`warm-connections-1.preview.emergentagent.com` gave: app name, slug, bundle id,\nSDK 58, the plugin list, the `#FFF8EC` theme colour, `nearmatch.in`, Apple Sign\nIn, and the three permission strings (\"Find matches near you\", \"Add photos to\nyour profile\", \"Take a profile photo\"). The web bundle additionally confirmed\n`EXPO_PUBLIC_BACKEND_URL` plus Supabase URL/key, which fixed the architecture.\n\nAn earlier guess in this session — that NearMatch was record deduplication —\nwas wrong and was discarded once the manifest was read.\n\n## Built\nBackend (FastAPI, 25 routes), Supabase schema (14 migrations, RLS on every\ntable), Expo frontend (20 routes/screens), 273 tests.\n\n## Verified, not assumed\n- All 14 migrations applied to a real Postgres 16 + PostGIS.\n- Match trigger, nearby RPC and every RLS policy exercised against that DB.\n- Frontend typechecks and lints clean; 27 Jest tests pass.\n- Distances cross-checked: `haversine_km` and PostGIS `ST_Distance` agree to\n  0.1 km on Bandra→Pune (123.4 km).\n\n## Bugs found by writing the tests\n1. `jitter_for_privacy` derived the longitude grid from the unsnapped latitude,\n   so two people in one grid cell still had distinguishable stored coordinates\n   and snapping was not idempotent — a real weakening of the privacy claim.\n2. `diversify` deferred candidates and appended them at the end, recreating the\n   run it was meant to break up.\n3. `PUT /me/preferences` returned 500 instead of 422 when a partial update\n   conflicted with stored values (min_age=40 over a stored max_age=25).\n\n## Not done\n- `npx expo start` was never run; there is no simulator in this container, so\n  the app has not been seen rendering.\n- Edge function `notify-match` is written but never deployed or invoked.\n- Push notifications are untested end to end (no device, no Expo project).\n\n---\n\n# 2026-11-15 (later) — P0/P1 fixes\n\nFixed the six highest-priority defects recorded in `test_result.md`.\n\n## Fixed\n1. **N+1 photo signing.** `_sign_photos` made one HTTPS call per photo and\n   `to_public` was called per card, so a deck cost up to 120 serial\n   round-trips. Added `supabase.create_signed_urls` (batch), split signing from\n   model-building (`sign_paths` + `_to_photos`), and made `discover_service`\n   and `match_service` sign the whole page in one request.\n2. **Self-unbanning.** A BEFORE UPDATE trigger now reverts `is_banned`,\n   `is_deleted`, `id` and `dob` for the `authenticated` and `anon` roles.\n3. **In-process rate limiting.** Moved to a shared Postgres window.\n4. **Zeroed match distance.** `list_for_user` now computes real `ST_Distance`.\n5. **Unsafe undo.** Refuses once a match exists, rather than silently closing\n   a conversation the other person may already be in.\n6. **Duplicate `last_message_at` write.** Removed; the trigger owns it.\n\n## Two bugs the new tests caught before they shipped\n- The protection trigger was `SECURITY DEFINER`, so `current_user` inside it\n  resolved to the function owner and the exemption matched every caller — the\n  protection never ran. `dob` looked protected only because RLS had separately\n  blocked that update. Removed `SECURITY DEFINER`.\n- The rate limiter counted and inserted in separate statements. Six concurrent\n  requests against a limit of three granted **five**. Fixed with\n  `pg_advisory_xact_lock`, and the concurrency test now uses six real\n  connections and cleans up outside the rolled-back test transaction.\n\n## Numbers\n246 → 269 backend tests. 296 total with the frontend. Backend coverage 71%.\n\n## Still not done\nThe app has still never been rendered on a device.\n"}, {"p": "memory/user_preferences.md", "l": "markdown", "n": 16, "c": "# Working preferences for this repo\n\n- **Verify, don't assert.** Claims about behaviour should be backed by a test\n  that was actually run. If something could not be verified, say so.\n- **Comments explain why, not what.** `# increment i` is noise; \"the longitude\n  grid must come from the snapped latitude or cells leak\" is the point.\n- **Error messages are user-facing copy.** Write them as a person would read\n  them: \"You have used all 100 likes for today. More tomorrow.\" — not\n  \"ERR_QUOTA_EXCEEDED\".\n- **No silent failures in safety paths.** Blocking, reporting and age checks\n  must fail loudly. Notification delivery may fail quietly.\n- **Tests assert achievable properties.** If a property only holds for the\n  first N items, assert that, and say why in the test.\n- Prefer British-neutral phrasing in user copy; avoid slang that does not\n  travel.\n"}, {"p": "scripts/db_test_setup.sh", "l": "bash", "n": 61, "c": "#!/usr/bin/env bash\n#\n# Create a local Postgres + PostGIS database with the NearMatch schema applied,\n# for the `db`-marked tests. Prints the DSN to export.\n#\n#   ./scripts/db_test_setup.sh\n#   export NEARMATCH_TEST_DSN=postgresql://postgres@/nearmatch_test?host=/tmp&port=55432\n#   (cd tests && pytest)\n#\n# Requires: postgresql-16, postgresql-16-postgis-3\nset -euo pipefail\n\nPORT=\"${PGTESTPORT:-55432}\"\nDATADIR=\"${PGTESTDATA:-/var/lib/postgresql/nearmatch_test}\"\nDBNAME=\"${PGTESTDB:-nearmatch_test}\"\nBIN=\"${PGBIN:-/usr/lib/postgresql/16/bin}\"\nROOT=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/..\" && pwd)\"\n\nif [ ! -s \"$DATADIR/PG_VERSION\" ]; then\n  echo \"==> initialising cluster at $DATADIR\"\n  install -d -o postgres -g postgres \"$DATADIR\"\n  su postgres -c \"$BIN/initdb -D $DATADIR -A trust\" >/dev/null\nfi\n\nif ! su postgres -c \"$BIN/pg_isready -h /tmp -p $PORT\" >/dev/null 2>&1; then\n  echo \"==> starting Postgres on port $PORT\"\n  su postgres -c \"$BIN/pg_ctl -D $DATADIR -o '-p $PORT -k /tmp' -l /tmp/nearmatch-pg.log start -w\" >/dev/null\nfi\n\nexport PGHOST=/tmp PGPORT=\"$PORT\" PGUSER=postgres\n\nif ! psql -lqt | cut -d'|' -f1 | grep -qw \"$DBNAME\"; then\n  echo \"==> creating database $DBNAME\"\n  su postgres -c \"$BIN/createdb -h /tmp -p $PORT $DBNAME\"\nfi\n\nexport PGDATABASE=\"$DBNAME\"\n\necho \"==> applying Supabase stand-ins (auth, storage schemas)\"\npsql -v ON_ERROR_STOP=1 -q -f \"$ROOT/tests/fixtures/supabase_stubs.sql\"\n\necho \"==> applying migrations\"\nfor f in \"$ROOT\"/supabase/migrations/*.sql; do\n  printf '    %s\\n' \"$(basename \"$f\")\"\n  psql -v ON_ERROR_STOP=1 -q -f \"$f\"\ndone\n\necho \"==> granting table privileges to the authenticated role (Supabase does this)\"\npsql -q \\\n  -c \"grant select, insert, update, delete on all tables in schema public to authenticated;\" \\\n  -c \"grant usage, select on all sequences in schema public to authenticated;\"\n\ncat \u003c\u003cEOF\n\nReady. Export the DSN and run the suite:\n\n  export NEARMATCH_TEST_DSN=\"postgresql://postgres@/$DBNAME?host=/tmp&port=$PORT\"\n  (cd tests && pytest)\n\nEOF\n"}, {"p": "supabase/.gitignore", "l": "bash", "n": 4, "c": ".branches\n.temp\n.env\n"}, {"p": "supabase/config.toml", "l": "ini", "n": 64, "c": "# Supabase CLI configuration for local development.\n#   supabase start && supabase db reset\nproject_id = \"nearmatch\"\n\n[api]\nenabled = true\nport = 54321\nschemas = [\"public\", \"storage\"]\nextra_search_path = [\"public\", \"extensions\"]\nmax_rows = 100\n\n[db]\nport = 54322\nshadow_port = 54320\nmajor_version = 16\n\n[db.pooler]\nenabled = true\npool_mode = \"transaction\"\n\n[studio]\nenabled = true\nport = 54323\n\n[inbucket]\n# Catches the email OTPs during local development.\nenabled = true\nport = 54324\n\n[storage]\nenabled = true\nfile_size_limit = \"8MiB\"\n\n[auth]\nenabled = true\nsite_url = \"nearmatch://\"\nadditional_redirect_urls = [\"nearmatch://\", \"https://nearmatch.in\", \"exp://localhost:8081\"]\njwt_expiry = 3600\nenable_refresh_token_rotation = true\nrefresh_token_reuse_interval = 10\nenable_signup = true\nenable_anonymous_sign_ins = false\n\n[auth.email]\nenable_signup = true\nenable_confirmations = false\n# NearMatch signs in with a 6-digit code, not a magic link.\notp_length = 6\notp_expiry = 600\n\n[auth.sms]\nenable_signup = false\n\n[auth.external.apple]\nenabled = true\nclient_id = \"env(SUPABASE_AUTH_APPLE_CLIENT_ID)\"\nsecret = \"env(SUPABASE_AUTH_APPLE_SECRET)\"\n\n[realtime]\nenabled = true\n\n[analytics]\nenabled = false\n"}, {"p": "supabase/functions/_shared/cors.ts", "l": "typescript", "n": 6, "c": "export const corsHeaders = {\n  'Access-Control-Allow-Origin': '*',\n  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',\n  'Access-Control-Allow-Methods': 'POST, OPTIONS',\n};\n"}, {"p": "supabase/functions/notify-match/index.ts", "l": "typescript", "n": 74, "c": "/**\n * Push a notification when a match row is created.\n *\n * Wire it to a database webhook on `matches` (INSERT). The API also sends this\n * notification on the swipe path; this function covers matches created by the\n * database trigger when two likes land concurrently and no single request\n * observed the match being made.\n *\n * Deploy: supabase functions deploy notify-match\n */\nimport { createClient } from 'jsr:@supabase/supabase-js@2';\n\nimport { corsHeaders } from '../_shared/cors.ts';\n\nconst EXPO_PUSH_URL = 'https://exp.host/--/api/v2/push/send';\n\ninterface WebhookPayload {\n  type: 'INSERT' | 'UPDATE' | 'DELETE';\n  table: string;\n  record: { id: string; user_low: string; user_high: string } | null;\n}\n\nDeno.serve(async (req: Request) => {\n  if (req.method === 'OPTIONS') {\n    return new Response('ok', { headers: corsHeaders });\n  }\n\n  const secret = req.headers.get('x-webhook-secret');\n  if (secret !== Deno.env.get('WEBHOOK_SECRET')) {\n    return new Response(JSON.stringify({ error: 'unauthorized' }), {\n      status: 401,\n      headers: { ...corsHeaders, 'Content-Type': 'application/json' },\n    });\n  }\n\n  const payload: WebhookPayload = await req.json();\n  if (payload.type !== 'INSERT' || payload.table !== 'matches' || !payload.record) {\n    return new Response(JSON.stringify({ skipped: true }), {\n      headers: { ...corsHeaders, 'Content-Type': 'application/json' },\n    });\n  }\n\n  const supabase = createClient(\n    Deno.env.get('SUPABASE_URL')!,\n    Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!,\n  );\n\n  const participants = [payload.record.user_low, payload.record.user_high];\n  const { data: devices } = await supabase\n    .from('devices')\n    .select('expo_push_token')\n    .in('profile_id', participants);\n\n  const messages = (devices ?? []).map((d: { expo_push_token: string }) => ({\n    to: d.expo_push_token,\n    title: \"It's a match!\",\n    body: 'You both liked each other. Say hello.',\n    data: { type: 'match', matchId: payload.record!.id },\n    sound: 'default',\n  }));\n\n  if (messages.length > 0) {\n    await fetch(EXPO_PUSH_URL, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', accept: 'application/json' },\n      body: JSON.stringify(messages),\n    });\n  }\n\n  return new Response(JSON.stringify({ notified: messages.length }), {\n    headers: { ...corsHeaders, 'Content-Type': 'application/json' },\n  });\n});\n"}, {"p": "supabase/migrations/20261115090000_extensions.sql", "l": "sql", "n": 5, "c": "-- NearMatch: extensions\ncreate extension if not exists \"pgcrypto\";   -- gen_random_uuid()\ncreate extension if not exists \"postgis\";    -- geography(Point) + GiST distance\ncreate extension if not exists \"pg_trgm\";    -- fuzzy name lookup in admin tooling\n"}, {"p": "supabase/migrations/20261115090100_enums.sql", "l": "sql", "n": 26, "c": "-- NearMatch: enumerated domains\ndo $$ begin\n  create type gender_t as enum ('male', 'female', 'nonbinary', 'other');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type interested_in_t as enum ('male', 'female', 'nonbinary', 'everyone');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type swipe_action_t as enum ('like', 'pass', 'superlike');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type report_reason_t as enum\n    ('fake_profile', 'harassment', 'inappropriate_photos', 'spam', 'underage', 'other');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type report_status_t as enum ('open', 'reviewing', 'actioned', 'dismissed');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type platform_t as enum ('ios', 'android', 'web');\nexception when duplicate_object then null; end $$;\n"}, {"p": "supabase/migrations/20261115090200_profiles.sql", "l": "sql", "n": 45, "c": "-- NearMatch: profiles\ncreate table if not exists profiles (\n    id                  uuid primary key references auth.users (id) on delete cascade,\n    display_name        text        not null check (char_length(display_name) between 2 and 40),\n    dob                 date        not null,\n    gender              gender_t    not null,\n    interested_in       interested_in_t[] not null default '{everyone}',\n    bio                 text        not null default '' check (char_length(bio) \u003c= 500),\n    job_title           text        check (char_length(job_title) \u003c= 60),\n    city                text        check (char_length(city) \u003c= 80),\n    interests           text[]      not null default '{}' check (array_length(interests, 1) is null\n                                                                 or array_length(interests, 1) \u003c= 12),\n    location            geography(Point, 4326),\n    location_updated_at timestamptz,\n    is_onboarded        boolean     not null default false,\n    is_visible          boolean     not null default true,\n    is_banned           boolean     not null default false,\n    is_deleted          boolean     not null default false,\n    last_active_at      timestamptz not null default now(),\n    created_at          timestamptz not null default now(),\n    updated_at          timestamptz not null default now(),\n\n    -- Hard floor enforced by the database, not only the API.\n    constraint profiles_adult check (dob \u003c= (current_date - interval '18 years'))\n);\n\n-- The index that makes \"near me\" fast.\ncreate index if not exists profiles_location_gix on profiles using gist (location);\ncreate index if not exists profiles_discoverable_ix\n    on profiles (is_onboarded, is_visible, is_banned, is_deleted)\n    where is_onboarded and is_visible and not is_banned and not is_deleted;\ncreate index if not exists profiles_dob_ix on profiles (dob);\ncreate index if not exists profiles_last_active_ix on profiles (last_active_at desc);\n\ncreate or replace function touch_updated_at() returns trigger\nlanguage plpgsql as $$\nbegin\n    new.updated_at := now();\n    return new;\nend $$;\n\ndrop trigger if exists profiles_touch on profiles;\ncreate trigger profiles_touch before update on profiles\n    for each row execute function touch_updated_at();\n"}, {"p": "supabase/migrations/20261115090300_photos.sql", "l": "sql", "n": 30, "c": "-- NearMatch: profile photos (bytes live in Storage; rows hold the path)\ncreate table if not exists profile_photos (\n    id           uuid primary key default gen_random_uuid(),\n    profile_id   uuid not null references profiles (id) on delete cascade,\n    storage_path text not null unique,\n    position     int  not null default 0,\n    is_primary   boolean not null default false,\n    created_at   timestamptz not null default now()\n);\n\ncreate index if not exists profile_photos_profile_ix on profile_photos (profile_id, position);\n\n-- At most one primary photo per profile.\ncreate unique index if not exists profile_photos_one_primary\n    on profile_photos (profile_id) where is_primary;\n\n-- Cap photos per profile at 6.\ncreate or replace function enforce_photo_cap() returns trigger\nlanguage plpgsql as $$\nbegin\n    if (select count(*) from profile_photos where profile_id = new.profile_id) >= 6 then\n        raise exception 'photo limit reached' using errcode = 'check_violation';\n    end if;\n    return new;\nend $$;\n\ndrop trigger if exists profile_photos_cap on profile_photos;\ncreate trigger profile_photos_cap before insert on profile_photos\n    for each row execute function enforce_photo_cap();\n"}, {"p": "supabase/migrations/20261115090400_preferences.sql", "l": "sql", "n": 30, "c": "-- NearMatch: discovery preferences\ncreate table if not exists preferences (\n    profile_id      uuid primary key references profiles (id) on delete cascade,\n    min_age         int  not null default 18 check (min_age >= 18 and min_age \u003c= 99),\n    max_age         int  not null default 45 check (max_age >= 18 and max_age \u003c= 99),\n    max_distance_km int  not null default 50 check (max_distance_km between 1 and 500),\n    show_me         interested_in_t[] not null default '{everyone}',\n    hide_profile    boolean not null default false,\n    created_at      timestamptz not null default now(),\n    updated_at      timestamptz not null default now(),\n    constraint preferences_age_order check (min_age \u003c= max_age)\n);\n\ndrop trigger if exists preferences_touch on preferences;\ncreate trigger preferences_touch before update on preferences\n    for each row execute function touch_updated_at();\n\n-- Give every new profile default preferences.\ncreate or replace function seed_preferences() returns trigger\nlanguage plpgsql as $$\nbegin\n    insert into preferences (profile_id) values (new.id)\n    on conflict (profile_id) do nothing;\n    return new;\nend $$;\n\ndrop trigger if exists profiles_seed_preferences on profiles;\ncreate trigger profiles_seed_preferences after insert on profiles\n    for each row execute function seed_preferences();\n"}, {"p": "supabase/migrations/20261115090500_swipes.sql", "l": "sql", "n": 16, "c": "-- NearMatch: swipes (one row per actor→target, ever)\ncreate table if not exists swipes (\n    id         uuid primary key default gen_random_uuid(),\n    actor_id   uuid not null references profiles (id) on delete cascade,\n    target_id  uuid not null references profiles (id) on delete cascade,\n    action     swipe_action_t not null,\n    created_at timestamptz not null default now(),\n    constraint swipes_no_self check (actor_id \u003c> target_id),\n    constraint swipes_once unique (actor_id, target_id)\n);\n\n-- Reciprocity lookup: \"has target already liked actor?\"\ncreate index if not exists swipes_reciprocity_ix\n    on swipes (target_id, actor_id) where action in ('like', 'superlike');\ncreate index if not exists swipes_actor_recent_ix on swipes (actor_id, created_at desc);\n"}, {"p": "supabase/migrations/20261115090600_matches.sql", "l": "sql", "n": 18, "c": "-- NearMatch: matches, stored once per pair with the lower uuid first\ncreate table if not exists matches (\n    id              uuid primary key default gen_random_uuid(),\n    user_low        uuid not null references profiles (id) on delete cascade,\n    user_high       uuid not null references profiles (id) on delete cascade,\n    is_active       boolean not null default true,\n    last_message_at timestamptz,\n    unmatched_by    uuid references profiles (id),\n    unmatched_at    timestamptz,\n    created_at      timestamptz not null default now(),\n    constraint matches_ordered check (user_low \u003c user_high),\n    constraint matches_unique_pair unique (user_low, user_high)\n);\n\ncreate index if not exists matches_user_low_ix  on matches (user_low)  where is_active;\ncreate index if not exists matches_user_high_ix on matches (user_high) where is_active;\ncreate index if not exists matches_recent_ix on matches (coalesce(last_message_at, created_at) desc);\n"}, {"p": "supabase/migrations/20261115090700_messages.sql", "l": "sql", "n": 30, "c": "-- NearMatch: chat messages\ncreate table if not exists messages (\n    id         uuid primary key default gen_random_uuid(),\n    match_id   uuid not null references matches (id) on delete cascade,\n    sender_id  uuid not null references profiles (id) on delete cascade,\n    body       text not null check (char_length(body) between 1 and 2000),\n    client_id  text check (char_length(client_id) \u003c= 64),\n    sent_at    timestamptz not null default now(),\n    read_at    timestamptz\n);\n\ncreate index if not exists messages_match_ix on messages (match_id, sent_at desc);\ncreate index if not exists messages_unread_ix on messages (match_id, sender_id) where read_at is null;\n\n-- Makes a retried send idempotent instead of duplicating the message.\ncreate unique index if not exists messages_client_dedupe\n    on messages (match_id, sender_id, client_id) where client_id is not null;\n\n-- Keep matches.last_message_at in step without a second round-trip.\ncreate or replace function bump_match_last_message() returns trigger\nlanguage plpgsql as $$\nbegin\n    update matches set last_message_at = new.sent_at where id = new.match_id;\n    return new;\nend $$;\n\ndrop trigger if exists messages_bump_match on messages;\ncreate trigger messages_bump_match after insert on messages\n    for each row execute function bump_match_last_message();\n"}, {"p": "supabase/migrations/20261115090800_safety.sql", "l": "sql", "n": 38, "c": "-- NearMatch: blocks, reports, devices\ncreate table if not exists blocks (\n    id         uuid primary key default gen_random_uuid(),\n    blocker_id uuid not null references profiles (id) on delete cascade,\n    blocked_id uuid not null references profiles (id) on delete cascade,\n    created_at timestamptz not null default now(),\n    constraint blocks_no_self check (blocker_id \u003c> blocked_id),\n    constraint blocks_unique unique (blocker_id, blocked_id)\n);\n\ncreate index if not exists blocks_blocker_ix on blocks (blocker_id);\ncreate index if not exists blocks_blocked_ix on blocks (blocked_id);\n\ncreate table if not exists reports (\n    id          uuid primary key default gen_random_uuid(),\n    reporter_id uuid not null references profiles (id) on delete cascade,\n    reported_id uuid not null references profiles (id) on delete cascade,\n    reason      report_reason_t not null,\n    details     text check (char_length(details) \u003c= 1000),\n    status      report_status_t not null default 'open',\n    created_at  timestamptz not null default now(),\n    constraint reports_no_self check (reporter_id \u003c> reported_id)\n);\n\ncreate index if not exists reports_open_ix on reports (status, created_at desc);\ncreate index if not exists reports_reported_ix on reports (reported_id);\n\ncreate table if not exists devices (\n    id              uuid primary key default gen_random_uuid(),\n    profile_id      uuid not null references profiles (id) on delete cascade,\n    expo_push_token text not null unique,\n    platform        platform_t not null,\n    last_seen_at    timestamptz not null default now(),\n    created_at      timestamptz not null default now()\n);\n\ncreate index if not exists devices_profile_ix on devices (profile_id);\n"}, {"p": "supabase/migrations/20261115090900_rls.sql", "l": "sql", "n": 149, "c": "-- NearMatch: row level security.\n--\n-- The mobile client talks to Postgres directly for realtime chat, so RLS is the\n-- real boundary — not the API. Every policy below assumes auth.uid() is the\n-- caller. The service role bypasses RLS and is used only by the backend.\n\nalter table profiles       enable row level security;\nalter table profile_photos enable row level security;\nalter table preferences    enable row level security;\nalter table swipes         enable row level security;\nalter table matches        enable row level security;\nalter table messages       enable row level security;\nalter table blocks         enable row level security;\nalter table reports        enable row level security;\nalter table devices        enable row level security;\n\n-- Helper: is the caller part of this match?\ncreate or replace function is_match_member(p_match_id uuid)\nreturns boolean\nlanguage sql stable security definer set search_path = public as $$\n    select exists (\n        select 1 from matches m\n         where m.id = p_match_id\n           and (m.user_low = auth.uid() or m.user_high = auth.uid())\n    );\n$$;\n\n-- Helper: has either side blocked the other?\ncreate or replace function is_blocked_pair(p_other uuid)\nreturns boolean\nlanguage sql stable security definer set search_path = public as $$\n    select exists (\n        select 1 from blocks b\n         where (b.blocker_id = auth.uid() and b.blocked_id = p_other)\n            or (b.blocker_id = p_other and b.blocked_id = auth.uid())\n    );\n$$;\n\n-- ---------- profiles ----------\ndrop policy if exists profiles_select_own on profiles;\ncreate policy profiles_select_own on profiles\n    for select using (id = auth.uid());\n\n-- You may read another profile only once you are matched with them.\n-- Discovery goes through the API (service role), never straight to this table.\ndrop policy if exists profiles_select_matched on profiles;\ncreate policy profiles_select_matched on profiles\n    for select using (\n        exists (\n            select 1 from matches m\n             where m.is_active\n               and ((m.user_low = auth.uid() and m.user_high = profiles.id)\n                 or (m.user_high = auth.uid() and m.user_low = profiles.id))\n        )\n    );\n\ndrop policy if exists profiles_insert_own on profiles;\ncreate policy profiles_insert_own on profiles\n    for insert with check (id = auth.uid());\n\ndrop policy if exists profiles_update_own on profiles;\ncreate policy profiles_update_own on profiles\n    for update using (id = auth.uid()) with check (id = auth.uid());\n\n-- ---------- profile_photos ----------\ndrop policy if exists photos_select on profile_photos;\ncreate policy photos_select on profile_photos\n    for select using (\n        profile_id = auth.uid()\n        or exists (\n            select 1 from matches m\n             where m.is_active\n               and ((m.user_low = auth.uid() and m.user_high = profile_photos.profile_id)\n                 or (m.user_high = auth.uid() and m.user_low = profile_photos.profile_id))\n        )\n    );\n\ndrop policy if exists photos_write_own on profile_photos;\ncreate policy photos_write_own on profile_photos\n    for all using (profile_id = auth.uid()) with check (profile_id = auth.uid());\n\n-- ---------- preferences ----------\ndrop policy if exists preferences_own on preferences;\ncreate policy preferences_own on preferences\n    for all using (profile_id = auth.uid()) with check (profile_id = auth.uid());\n\n-- ---------- swipes ----------\n-- You can see and create your own swipes. You can never read who swiped on you:\n-- that would leak likes before a match.\ndrop policy if exists swipes_own on swipes;\ncreate policy swipes_own on swipes\n    for select using (actor_id = auth.uid());\n\ndrop policy if exists swipes_insert_own on swipes;\ncreate policy swipes_insert_own on swipes\n    for insert with check (actor_id = auth.uid() and not is_blocked_pair(target_id));\n\ndrop policy if exists swipes_delete_own on swipes;\ncreate policy swipes_delete_own on swipes\n    for delete using (actor_id = auth.uid());\n\n-- ---------- matches ----------\ndrop policy if exists matches_member_select on matches;\ncreate policy matches_member_select on matches\n    for select using (user_low = auth.uid() or user_high = auth.uid());\n\n-- Matches are created by the reciprocity trigger, not by clients.\ndrop policy if exists matches_member_update on matches;\
