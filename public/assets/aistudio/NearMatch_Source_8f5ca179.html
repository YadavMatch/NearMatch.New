female = \"female\"\n    nonbinary = \"nonbinary\"\n    everyone = \"everyone\"\n\n\nclass Photo(BaseModel):\n    id: str\n    storage_path: str\n    url: Optional[str] = None\n    position: int = 0\n    is_primary: bool = False\n\n\nclass ProfileBase(BaseModel):\n    display_name: str = Field(min_length=2, max_length=40)\n    dob: date\n    gender: Gender\n    interested_in: List[InterestedIn] = Field(min_length=1)\n    bio: str = Field(default=\"\", max_length=500)\n    job_title: Optional[str] = Field(default=None, max_length=60)\n    city: Optional[str] = Field(default=None, max_length=80)\n    interests: List[str] = Field(default_factory=list, max_length=12)\n\n    @field_validator(\"dob\")\n    @classmethod\n    def _must_be_adult(cls, v: date) -> date:\n        if age_from_dob(v) \u003c MIN_LEGAL_AGE:\n            raise ValueError(f\"You must be at least {MIN_LEGAL_AGE} to use NearMatch.\")\n        if age_from_dob(v) > 120:\n            raise ValueError(\"Please enter a valid date of birth.\")\n        return v\n\n    @field_validator(\"interests\")\n    @classmethod\n    def _clean_interests(cls, v: List[str]) -> List[str]:\n        seen, out = set(), []\n        for raw in v:\n            tag = raw.strip().lower()\n            if tag and tag not in seen and len(tag) \u003c= 30:\n                seen.add(tag)\n                out.append(tag)\n        return out\n\n    @field_validator(\"display_name\")\n    @classmethod\n    def _clean_name(cls, v: str) -> str:\n        return \" \".join(v.split())\n\n\nclass ProfileCreate(ProfileBase):\n    pass\n\n\nclass ProfileUpdate(BaseModel):\n    display_name: Optional[str] = Field(default=None, min_length=2, max_length=40)\n    bio: Optional[str] = Field(default=None, max_length=500)\n    job_title: Optional[str] = Field(default=None, max_length=60)\n    city: Optional[str] = Field(default=None, max_length=80)\n    interested_in: Optional[List[InterestedIn]] = None\n    interests: Optional[List[str]] = Field(default=None, max_length=12)\n    is_visible: Optional[bool] = None\n\n\nclass MyProfile(ProfileBase):\n    id: str\n    age: int\n    photos: List[Photo] = Field(default_factory=list)\n    is_onboarded: bool = False\n    is_visible: bool = True\n    has_location: bool = False\n    created_at: datetime\n    updated_at: Optional[datetime] = None\n\n\nclass PublicProfile(BaseModel):\n    \"\"\"What one user is allowed to see about another.\n\n    Deliberately excludes dob, exact coordinates, email and preferences.\n    \"\"\"\n\n    id: str\n    display_name: str\n    age: int\n    gender: Gender\n    bio: str = \"\"\n    job_title: Optional[str] = None\n    city: Optional[str] = None\n    interests: List[str] = Field(default_factory=list)\n    photos: List[Photo] = Field(default_factory=list)\n    distance_label: str\n    last_active_label: Optional[str] = None\n"}, {"p": "backend/app/models/report.py", "l": "python", "n": 25, "c": "from enum import Enum\nfrom typing import Optional\n\nfrom pydantic import BaseModel, Field\n\n\nclass ReportReason(str, Enum):\n    fake_profile = \"fake_profile\"\n    harassment = \"harassment\"\n    inappropriate_photos = \"inappropriate_photos\"\n    spam = \"spam\"\n    underage = \"underage\"\n    other = \"other\"\n\n\nclass ReportCreate(BaseModel):\n    reported_id: str\n    reason: ReportReason\n    details: Optional[str] = Field(default=None, max_length=1000)\n    block_too: bool = True\n\n\nclass BlockCreate(BaseModel):\n    blocked_id: str\n"}, {"p": "backend/app/models/swipe.py", "l": "python", "n": 25, "c": "from datetime import datetime\nfrom enum import Enum\nfrom typing import Optional\n\nfrom pydantic import BaseModel\n\n\nclass SwipeAction(str, Enum):\n    like = \"like\"\n    pass_ = \"pass\"\n    superlike = \"superlike\"\n\n\nclass SwipeCreate(BaseModel):\n    target_id: str\n    action: SwipeAction\n\n\nclass SwipeResult(BaseModel):\n    recorded: bool\n    is_match: bool = False\n    match_id: Optional[str] = None\n    matched_at: Optional[datetime] = None\n    remaining_likes: Optional[int] = None\n"}, {"p": "backend/app/models/upload.py", "l": "python", "n": 20, "c": "from pydantic import BaseModel, Field\n\n\nclass PhotoUploadRequest(BaseModel):\n    content_type: str = Field(pattern=r\"^image/(jpeg|png|webp|heic)$\")\n\n\nclass PhotoUploadTicket(BaseModel):\n    \"\"\"A one-shot signed URL. Photo bytes go straight to Supabase Storage.\"\"\"\n\n    upload_url: str\n    storage_path: str\n    token: str\n    max_bytes: int = 8 * 1024 * 1024\n\n\nclass PhotoConfirm(BaseModel):\n    storage_path: str\n    make_primary: bool = False\n"}, {"p": "backend/app/services/__init__.py", "l": "python", "n": 2, "c": "\"\"\"Service layer: orchestration between API handlers and the data layer.\"\"\"\n"}, {"p": "backend/app/services/discover_service.py", "l": "python", "n": 99, "c": "\"\"\"Builds the discovery deck: SQL filters, Python scores, ranked output.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import List\n\nfrom app.config import settings\nfrom app.core.errors import ProfileIncomplete\nfrom app.db.repositories import discover_repo, profiles_repo\nfrom app.matching.ranking import RankedCandidate, rank\nfrom app.matching.scoring import score_candidate\nfrom app.models.discover import DiscoverCard, DiscoverDeck\nfrom app.services import profile_service\n\n\nasync def build_deck(user_id: str, limit: int | None = None, explain: bool = False) -> DiscoverDeck:\n    limit = limit or settings.discover_page_size\n\n    me = await profiles_repo.get_by_id(user_id)\n    if me is None or not me.get(\"is_onboarded\"):\n        raise ProfileIncomplete()\n    if not me.get(\"has_location\"):\n        raise ProfileIncomplete(\"Share your location to see people near you.\")\n\n    prefs = await profile_service.get_preferences(user_id)\n    my_interests = list(me.get(\"interests\") or [])\n\n    # Over-fetch so scoring and diversification have room to work.\n    rows = await discover_repo.nearby_candidates(\n        viewer_id=user_id,\n        max_distance_km=prefs.max_distance_km,\n        min_age=prefs.min_age,\n        max_age=prefs.max_age,\n        show_me=[s.value if hasattr(s, \"value\") else str(s) for s in prefs.show_me],\n        limit=limit * 4,\n    )\n\n    if not rows:\n        remaining = await discover_repo.count_remaining(user_id, prefs.max_distance_km)\n        return DiscoverDeck(\n            cards=[],\n            exhausted=True,\n            suggestion=(\n                \"You have seen everyone nearby. Widen your distance or age range to see more.\"\n                if remaining == 0\n                else \"No one matches your filters right now. Try widening them.\"\n            ),\n        )\n\n    scored: List[RankedCandidate] = []\n    for row in rows:\n        breakdown = score_candidate(\n            distance_km=float(row[\"distance_km\"]),\n            max_distance_km=float(prefs.max_distance_km),\n            my_interests=my_interests,\n            their_interests=list(row.get(\"interests\") or []),\n            candidate_age=int(row[\"age\"]),\n            min_age=prefs.min_age,\n            max_age=prefs.max_age,\n            last_active_at=row.get(\"last_active_at\"),\n            photo_count=int(row.get(\"photo_count\") or 0),\n            bio_length=len(row.get(\"bio\") or \"\"),\n            half_life_km=settings.distance_half_life_km,\n        )\n        scored.append(\n            RankedCandidate(\n                profile_id=str(row[\"id\"]),\n                score=breakdown.total,\n                distance_km=float(row[\"distance_km\"]),\n                breakdown=breakdown,\n            )\n        )\n\n    top = rank(scored, limit=limit)\n    by_id = {str(r[\"id\"]): r for r in rows}\n    photos = await profiles_repo.photos_for_many([c.profile_id for c in top])\n\n    # Sign every photo in the deck in a single request. Signing per card cost\n    # one HTTPS round-trip per photo and dominated the latency of this endpoint.\n    signed = await profile_service.sign_paths(\n        [p[\"storage_path\"] for cand in top for p in photos.get(cand.profile_id, [])]\n    )\n\n    cards: List[DiscoverCard] = []\n    for cand in top:\n        row = by_id[cand.profile_id]\n        cards.append(\n            DiscoverCard(\n                profile=await profile_service.to_public(\n                    row, cand.distance_km, photos.get(cand.profile_id, []), signed\n                ),\n                distance_km=round(cand.distance_km, 2),\n                score=round(cand.score, 4),\n                reasons=cand.breakdown.reasons,\n                breakdown=cand.breakdown.as_dict() if explain else None,\n            )\n        )\n\n    return DiscoverDeck(cards=cards, exhausted=len(cards) == 0)\n"}, {"p": "backend/app/services/match_service.py", "l": "python", "n": 71, "c": "\"\"\"Match listing and unmatching.\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import datetime, timedelta, timezone\nfrom typing import List\n\nfrom app.core.errors import NotFound\nfrom app.db.repositories import matches_repo, profiles_repo\nfrom app.matching.geo import Coordinates, haversine_km\nfrom app.models.match import MatchSummary\nfrom app.services import profile_service\n\nNEW_MATCH_WINDOW = timedelta(hours=24)\n\n\nasync def list_matches(user_id: str) -> List[MatchSummary]:\n    rows = await matches_repo.list_for_user(user_id)\n    if not rows:\n        return []\n\n    photos = await profiles_repo.photos_for_many([str(r[\"other_id\"]) for r in rows])\n    # One signing request for the whole list, not one per match.\n    signed = await profile_service.sign_paths(\n        [p[\"storage_path\"] for group in photos.values() for p in group]\n    )\n    now = datetime.now(timezone.utc)\n    out: List[MatchSummary] = []\n\n    for row in rows:\n        other_id = str(row[\"other_id\"])\n        # Distance is not recomputed per match; the label stays coarse by design.\n        public = await profile_service.to_public(\n            {\n                \"id\": other_id,\n                \"display_name\": row[\"display_name\"],\n                \"age\": row[\"age\"],\n                \"gender\": row[\"gender\"],\n                \"bio\": row.get(\"bio\") or \"\",\n                \"job_title\": row.get(\"job_title\"),\n                \"city\": row.get(\"city\"),\n                \"interests\": row.get(\"interests\") or [],\n                \"last_active_at\": row.get(\"last_active_at\"),\n                \"dob\": None,\n            },\n            # Real distance now; None means one side has no location set, and\n            # display_distance renders that as the vaguest band rather than \"0\".\n            distance_km=float(row[\"distance_km\"]) if row.get(\"distance_km\") is not None else 0.0,\n            photos=photos.get(other_id, []),\n            signed=signed,\n        )\n        matched_at = row[\"matched_at\"]\n        if matched_at.tzinfo is None:\n            matched_at = matched_at.replace(tzinfo=timezone.utc)\n        out.append(\n            MatchSummary(\n                id=str(row[\"id\"]),\n                other=public,\n                matched_at=row[\"matched_at\"],\n                last_message_at=row.get(\"last_message_at\"),\n                last_message_preview=row.get(\"last_message_preview\"),\n                unread_count=int(row.get(\"unread_count\") or 0),\n                is_new=(now - matched_at) \u003c NEW_MATCH_WINDOW and row.get(\"last_message_at\") is None,\n            )\n        )\n    return out\n\n\nasync def unmatch(match_id: str, user_id: str) -> None:\n    if not await matches_repo.deactivate(match_id, user_id):\n        raise NotFound(\"Match not found.\")\n"}, {"p": "backend/app/services/message_service.py", "l": "python", "n": 74, "c": "\"\"\"Chat. Authorisation is per-match and checked on every call.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import List, Optional\n\nfrom app.core import rate_limit\nfrom app.core.errors import Conflict, Forbidden, NotFound\nfrom app.db.repositories import matches_repo, messages_repo, safety_repo\nfrom app.models.message import Message\nfrom app.services import notification_service\n\nMESSAGES_PER_MINUTE = 30\n\n\nasync def _authorized_match(match_id: str, user_id: str) -> dict:\n    match = await matches_repo.get_for_user(match_id, user_id)\n    if match is None:\n        raise NotFound(\"Conversation not found.\")\n    if not match[\"is_active\"]:\n        raise Conflict(\"This conversation is closed.\")\n    return match\n\n\nasync def list_messages(match_id: str, user_id: str, limit: int = 50, before: Optional[str] = None) -> List[Message]:\n    await _authorized_match(match_id, user_id)\n    rows = await messages_repo.list_for_match(match_id, limit=limit, before=before)\n    await messages_repo.mark_read(match_id, user_id)\n    return [\n        Message(\n            id=str(r[\"id\"]),\n            match_id=str(r[\"match_id\"]),\n            sender_id=str(r[\"sender_id\"]),\n            body=r[\"body\"],\n            sent_at=r[\"sent_at\"],\n            read_at=r.get(\"read_at\"),\n            client_id=r.get(\"client_id\"),\n            is_mine=str(r[\"sender_id\"]) == user_id,\n        )\n        for r in rows\n    ]\n\n\nasync def send(match_id: str, user_id: str, body: str, client_id: Optional[str]) -> Message:\n    match = await _authorized_match(match_id, user_id)\n    other_id = str(match[\"other_id\"])\n\n    if other_id in await safety_repo.blocked_ids(user_id):\n        raise Forbidden(\"You cannot message this person.\")\n\n    await rate_limit.check(user_id, \"message\", limit=MESSAGES_PER_MINUTE, window_seconds=60)\n\n    row = await messages_repo.create(match_id, user_id, body, client_id)\n    if not row:\n        raise Conflict(\"Message could not be sent.\")\n\n    await notification_service.notify_new_message(\n        recipient_id=other_id, match_id=match_id, preview=body\n    )\n    return Message(\n        id=str(row[\"id\"]),\n        match_id=str(row[\"match_id\"]),\n        sender_id=str(row[\"sender_id\"]),\n        body=row[\"body\"],\n        sent_at=row[\"sent_at\"],\n        read_at=row.get(\"read_at\"),\n        client_id=row.get(\"client_id\"),\n        is_mine=True,\n    )\n\n\nasync def mark_read(match_id: str, user_id: str) -> int:\n    await _authorized_match(match_id, user_id)\n    return await messages_repo.mark_read(match_id, user_id)\n"}, {"p": "backend/app/services/moderation_service.py", "l": "python", "n": 42, "c": "\"\"\"Blocking and reporting.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Dict, List\n\nfrom app.core.errors import NotFound, ValidationFailed\nfrom app.core.logging import get_logger\nfrom app.db.repositories import matches_repo, profiles_repo, safety_repo\n\nlog = get_logger(__name__)\n\n\nasync def block_user(user_id: str, blocked_id: str) -> None:\n    if user_id == blocked_id:\n        raise ValidationFailed(\"You cannot block yourself.\")\n    if await profiles_repo.get_by_id(blocked_id) is None:\n        raise NotFound(\"That profile does not exist.\")\n    await safety_repo.block(user_id, blocked_id)\n    # Blocking closes any conversation between the two immediately.\n    await matches_repo.deactivate_between(user_id, blocked_id)\n    log.info(\"user.blocked\", actor=user_id, target=blocked_id)\n\n\nasync def unblock_user(user_id: str, blocked_id: str) -> None:\n    await safety_repo.unblock(user_id, blocked_id)\n\n\nasync def list_blocked(user_id: str) -> List[Dict[str, Any]]:\n    return await safety_repo.list_blocked(user_id)\n\n\nasync def report_user(user_id: str, reported_id: str, reason: str, details: str | None, block_too: bool) -> str:\n    if user_id == reported_id:\n        raise ValidationFailed(\"You cannot report yourself.\")\n    if await profiles_repo.get_by_id(reported_id) is None:\n        raise NotFound(\"That profile does not exist.\")\n    report_id = await safety_repo.report(user_id, reported_id, reason, details)\n    if block_too:\n        await block_user(user_id, reported_id)\n    log.info(\"user.reported\", report_id=report_id, actor=user_id, target=reported_id, reason=reason)\n    return report_id\n"}, {"p": "backend/app/services/notification_service.py", "l": "python", "n": 68, "c": "\"\"\"Expo push notifications. Failures are logged, never raised to the caller.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Dict, List\n\nimport httpx\n\nfrom app.config import settings\nfrom app.core.logging import get_logger\nfrom app.db.repositories import safety_repo\n\nlog = get_logger(__name__)\n\n\nasync def _send(messages: List[Dict[str, Any]]) -> None:\n    if not messages:\n        return\n    try:\n        async with httpx.AsyncClient(timeout=8) as client:\n            resp = await client.post(\n                settings.expo_push_url,\n                json=messages,\n                headers={\"Content-Type\": \"application/json\", \"accept\": \"application/json\"},\n            )\n        if resp.status_code >= 300:\n            log.warning(\"push.failed\", status=resp.status_code, body=resp.text[:300])\n    except Exception as exc:  # noqa: BLE001 - notifications are best-effort\n        log.warning(\"push.error\", error=str(exc))\n\n\nasync def _to(profile_id: str, title: str, body: str, data: Dict[str, Any]) -> None:\n    tokens = await safety_repo.push_tokens_for(profile_id)\n    await _send(\n        [\n            {\"to\": t, \"title\": title, \"body\": body, \"data\": data, \"sound\": \"default\"}\n            for t in tokens\n        ]\n    )\n\n\nasync def notify_new_match(match_id: str, user_a: str, user_b: str) -> None:\n    for uid in (user_a, user_b):\n        await _to(\n            uid,\n            \"It's a match!\",\n            \"You both liked each other. Say hello.\",\n            {\"type\": \"match\", \"matchId\": match_id},\n        )\n\n\nasync def notify_new_like(target_id: str) -> None:\n    await _to(\n        target_id,\n        \"Someone liked you\",\n        \"Open NearMatch to see who is nearby.\",\n        {\"type\": \"like\"},\n    )\n\n\nasync def notify_new_message(recipient_id: str, match_id: str, preview: str) -> None:\n    short = preview if len(preview) \u003c= 80 else preview[:77] + \"...\"\n    await _to(\n        recipient_id,\n        \"New message\",\n        short,\n        {\"type\": \"message\", \"matchId\": match_id},\n    )\n"}, {"p": "backend/app/services/profile_service.py", "l": "python", "n": 207, "c": "\"\"\"Profile reads/writes and the public-view projection.\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import datetime, timezone\nfrom typing import Any, Dict, List, Optional\n\nfrom pydantic import ValidationError as PydanticValidationError\n\nfrom app.config import settings\nfrom app.core.errors import Conflict, NotFound, ValidationFailed\nfrom app.core.supabase_client import supabase\nfrom app.db.repositories import profiles_repo\nfrom app.matching.geo import Coordinates, display_distance, jitter_for_privacy\nfrom app.matching.scoring import age_from_dob\nfrom app.models.preference import Preferences\nfrom app.models.profile import MyProfile, Photo, PublicProfile\n\nMAX_PHOTOS = 6\nPHOTO_BUCKET = \"profile-photos\"\n\n\ndef _activity_label(last_active_at: Optional[datetime]) -> Optional[str]:\n    if last_active_at is None:\n        return None\n    if last_active_at.tzinfo is None:\n        last_active_at = last_active_at.replace(tzinfo=timezone.utc)\n    minutes = (datetime.now(timezone.utc) - last_active_at).total_seconds() / 60\n    if minutes \u003c 15:\n        return \"Active now\"\n    if minutes \u003c 60:\n        return \"Active in the last hour\"\n    if minutes \u003c 60 * 24:\n        return \"Active today\"\n    if minutes \u003c 60 * 24 * 7:\n        return \"Active this week\"\n    return None\n\n\nasync def sign_paths(paths: List[str]) -> Dict[str, Optional[str]]:\n    \"\"\"One batch signing request for however many photos.\"\"\"\n    if not paths:\n        return {}\n    try:\n        return await supabase.create_signed_urls(PHOTO_BUCKET, paths, expires_in=3600)\n    except Exception:  # noqa: BLE001 - photos degrade, profiles still render\n        return {path: None for path in paths}\n\n\ndef _to_photos(rows: List[Dict[str, Any]], signed: Dict[str, Optional[str]]) -> List[Photo]:\n    \"\"\"Build Photo models from rows plus an already-signed URL map.\"\"\"\n    return [\n        Photo(\n            id=str(row[\"id\"]),\n            storage_path=row[\"storage_path\"],\n            url=signed.get(row[\"storage_path\"]),\n            position=row.get(\"position\", 0),\n            is_primary=row.get(\"is_primary\", False),\n        )\n        for row in rows\n    ]\n\n\nasync def _sign_photos(rows: List[Dict[str, Any]]) -> List[Photo]:\n    \"\"\"Sign one profile's photos. Prefer sign_paths + _to_photos for a batch.\"\"\"\n    signed = await sign_paths([row[\"storage_path\"] for row in rows])\n    return _to_photos(rows, signed)\n\n\nasync def get_my_profile(user_id: str) -> MyProfile:\n    row = await profiles_repo.get_by_id(user_id)\n    if row is None:\n        raise NotFound(\"No profile yet. Complete onboarding first.\")\n    photos = await _sign_photos(await profiles_repo.list_photos(user_id))\n    return MyProfile(\n        id=str(row[\"id\"]),\n        display_name=row[\"display_name\"],\n        dob=row[\"dob\"],\n        gender=row[\"gender\"],\n        interested_in=row[\"interested_in\"],\n        bio=row.get(\"bio\") or \"\",\n        job_title=row.get(\"job_title\"),\n        city=row.get(\"city\"),\n        interests=list(row.get(\"interests\") or []),\n        age=age_from_dob(row[\"dob\"]),\n        photos=photos,\n        is_onboarded=row.get(\"is_onboarded\", False),\n        is_visible=row.get(\"is_visible\", True),\n        has_location=row.get(\"has_location\", False),\n        created_at=row[\"created_at\"],\n        updated_at=row.get(\"updated_at\"),\n    )\n\n\nasync def to_public(\n    row: Dict[str, Any],\n    distance_km: float,\n    photos: List[Dict[str, Any]],\n    signed: Optional[Dict[str, Optional[str]]] = None,\n) -> PublicProfile:\n    \"\"\"Project a profile row into what another user may see.\n\n    Pass `signed` when building several profiles at once: the caller signs every\n    path in one request and this does no I/O at all. Omitting it signs this\n    profile's photos on its own, which is fine for a single profile.\n    \"\"\"\n    if signed is None:\n        signed = await sign_paths([p[\"storage_path\"] for p in photos])\n    age = row.get(\"age\") or age_from_dob(row[\"dob\"])\n    return PublicProfile(\n        id=str(row[\"id\"]),\n        display_name=row[\"display_name\"],\n        age=age,\n        gender=row[\"gender\"],\n        bio=row.get(\"bio\") or \"\",\n        job_title=row.get(\"job_title\"),\n        city=row.get(\"city\"),\n        interests=list(row.get(\"interests\") or []),\n        photos=_to_photos(photos, signed),\n        distance_label=display_distance(distance_km),\n        last_active_label=_activity_label(row.get(\"last_active_at\")),\n    )\n\n\nasync def create_or_update(user_id: str, payload: Dict[str, Any]) -> MyProfile:\n    await profiles_repo.upsert(user_id, payload)\n    if await profiles_repo.get_preferences(user_id) is None:\n        defaults = Preferences(max_distance_km=settings.default_max_distance_km)\n        await profiles_repo.upsert_preferences(\n            user_id, {**defaults.model_dump(mode=\"json\")}\n        )\n    return await get_my_profile(user_id)\n\n\nasync def patch_profile(user_id: str, fields: Dict[str, Any]) -> MyProfile:\n    await profiles_repo.patch(user_id, fields)\n    return await get_my_profile(user_id)\n\n\nasync def update_location(user_id: str, latitude: float, longitude: float, city: Optional[str]) -> None:\n    \"\"\"Coordinates are snapped to a ~300m grid before they are stored.\"\"\"\n    snapped = jitter_for_privacy(Coordinates(latitude=latitude, longitude=longitude))\n    await profiles_repo.set_location(user_id, snapped.latitude, snapped.longitude, city)\n\n\nasync def request_photo_slot(user_id: str, content_type: str) -> Dict[str, Any]:\n    if await profiles_repo.count_photos(user_id) >= MAX_PHOTOS:\n        raise Conflict(f\"You can have at most {MAX_PHOTOS} photos. Remove one first.\")\n    ext = {\"image/jpeg\": \"jpg\", \"image/png\": \"png\", \"image/webp\": \"webp\", \"image/heic\": \"heic\"}[content_type]\n    path = f\"{user_id}/{datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S%f')}.{ext}\"\n    ticket = await supabase.create_signed_upload_url(PHOTO_BUCKET, path)\n    return {\n        \"upload_url\": ticket.get(\"url\") or f\"{settings.supabase_url}/storage/v1/object/upload/sign/{PHOTO_BUCKET}/{path}\",\n        \"storage_path\": path,\n        \"token\": ticket.get(\"token\", \"\"),\n    }\n\n\nasync def confirm_photo(user_id: str, storage_path: str, make_primary: bool) -> Photo:\n    if not storage_path.startswith(f\"{user_id}/\"):\n        raise ValidationFailed(\"That storage path does not belong to you.\")\n    row = await profiles_repo.add_photo(user_id, storage_path, make_primary)\n    signed = await _sign_photos([row])\n    return signed[0]\n\n\nasync def remove_photo(user_id: str, photo_id: str) -> None:\n    photo = await profiles_repo.get_photo(user_id, photo_id)\n    if photo is None:\n        raise NotFound(\"Photo not found.\")\n    await profiles_repo.delete_photo(user_id, photo_id)\n    try:\n        await supabase.delete_object(PHOTO_BUCKET, photo[\"storage_path\"])\n    except Exception:  # noqa: BLE001 - row is gone; a stray object is swept later\n        pass\n\n\nasync def get_preferences(user_id: str) -> Preferences:\n    row = await profiles_repo.get_preferences(user_id)\n    if row is None:\n        return Preferences(max_distance_km=settings.default_max_distance_km)\n    return Preferences(\n        min_age=row[\"min_age\"],\n        max_age=row[\"max_age\"],\n        max_distance_km=row[\"max_distance_km\"],\n        show_me=row[\"show_me\"],\n        hide_profile=row.get(\"hide_profile\", False),\n    )\n\n\nasync def update_preferences(user_id: str, patch: Dict[str, Any]) -> Preferences:\n    current = (await get_preferences(user_id)).model_dump(mode=\"json\")\n    current.update({k: v for k, v in patch.items() if v is not None})\n    try:\n        merged = Preferences(**current)\n    except PydanticValidationError as exc:\n        # A partial update can be individually valid yet invalid once merged with\n        # what is stored, e.g. min_age=40 against a stored max_age=25. That is a\n        # bad request, not a server fault.\n        first = exc.errors()[0]\n        raise ValidationFailed(\n            first.get(\"msg\", \"Those preferences are not valid.\").replace(\"Value error, \", \"\")\n        ) from exc\n    await profiles_repo.upsert_preferences(user_id, merged.model_dump(mode=\"json\"))\n    if merged.hide_profile is not None:\n        await profiles_repo.patch(user_id, {\"is_visible\": not merged.hide_profile})\n    return merged\n"}, {"p": "backend/app/services/swipe_service.py", "l": "python", "n": 85, "c": "\"\"\"Swipe handling and the reciprocity check that creates a match.\"\"\"\nfrom __future__ import annotations\n\nfrom app.core import rate_limit\nfrom app.core.errors import Conflict, NotFound, ValidationFailed\nfrom app.core.logging import get_logger\nfrom app.db.repositories import matches_repo, profiles_repo, safety_repo, swipes_repo\nfrom app.models.swipe import SwipeAction, SwipeResult\nfrom app.services import notification_service\n\nlog = get_logger(__name__)\n\nDAILY_LIKE_LIMIT = 100\nSWIPES_PER_MINUTE = 60\n\n\nasync def swipe(actor_id: str, target_id: str, action: SwipeAction) -> SwipeResult:\n    if actor_id == target_id:\n        raise ValidationFailed(\"You cannot swipe on yourself.\")\n\n    await rate_limit.check(actor_id, \"swipe\", limit=SWIPES_PER_MINUTE, window_seconds=60)\n\n    target = await profiles_repo.get_by_id(target_id)\n    if target is None or not target.get(\"is_onboarded\"):\n        raise NotFound(\"That profile is no longer available.\")\n\n    if target_id in await safety_repo.blocked_ids(actor_id):\n        raise Conflict(\"That profile is not available.\")\n\n    is_like = action in (SwipeAction.like, SwipeAction.superlike)\n    if is_like:\n        used = await swipes_repo.likes_in_last_day(actor_id)\n        if used >= DAILY_LIKE_LIMIT:\n            raise Conflict(f\"You have used all {DAILY_LIKE_LIMIT} likes for today. More tomorrow.\")\n\n    recorded = await swipes_repo.record(actor_id, target_id, action.value)\n    if not recorded:\n        raise Conflict(\"You already swiped on that profile.\")\n\n    remaining = None\n    if is_like:\n        remaining = max(0, DAILY_LIKE_LIMIT - await swipes_repo.likes_in_last_day(actor_id))\n\n    # A match exists only when both sides liked.\n    if is_like and await swipes_repo.has_liked(target_id, actor_id):\n        match = await matches_repo.create(actor_id, target_id)\n        log.info(\"match.created\", match_id=str(match[\"id\"]), a=actor_id, b=target_id)\n        await notification_service.notify_new_match(\n            match_id=str(match[\"id\"]), user_a=actor_id, user_b=target_id\n        )\n        return SwipeResult(\n            recorded=True,\n            is_match=True,\n            match_id=str(match[\"id\"]),\n            matched_at=match[\"created_at\"],\n            remaining_likes=remaining,\n        )\n\n    if is_like:\n        await notification_service.notify_new_like(target_id)\n\n    return SwipeResult(recorded=True, is_match=False, remaining_likes=remaining)\n\n\nasync def undo(actor_id: str) -> bool:\n    \"\"\"Undo the last swipe, within a 3-minute grace window.\n\n    A like that already produced a match is NOT undoable. The other person has\n    by then been told they matched, and may already have opened the chat and\n    sent something; silently closing it on them is worse than refusing here.\n    \"\"\"\n    target_id = await swipes_repo.peek_last(actor_id)\n    if target_id is None:\n        raise Conflict(\"Nothing recent to undo.\")\n\n    if await matches_repo.active_between(actor_id, target_id):\n        raise Conflict(\n            \"You matched with them, so this cannot be undone. \"\n            \"You can unmatch from the conversation instead.\"\n        )\n\n    if await swipes_repo.undo_last(actor_id) is None:\n        raise Conflict(\"Nothing recent to undo.\")\n    return True\n"}, {"p": "backend/app/utils/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/requirements.txt", "l": "plaintext", "n": 13, "c": "fastapi==0.115.5\nuvicorn[standard]==0.32.1\npydantic==2.10.3\npydantic-settings==2.6.1\npython-dotenv==1.0.1\nhttpx==0.28.1\nasyncpg==0.30.0\nPyJWT[crypto]==2.10.1\nstructlog==24.4.0\npython-multipart==0.0.19\nslowapi==0.1.9\nPillow==11.0.0\n"}, {"p": "backend/server.py", "l": "python", "n": 75, "c": "\"\"\"NearMatch API entrypoint.\n\n    uvicorn server:app --reload --port 8000\n\"\"\"\nimport time\nfrom contextlib import asynccontextmanager\n\nfrom fastapi import FastAPI, Request\nfrom fastapi.middleware.cors import CORSMiddleware\n\nfrom app.api.router import api_router\nfrom app.config import settings\nfrom app.core import db\nfrom app.core.errors import register_error_handlers\nfrom app.core.logging import configure_logging, get_logger, new_request_id\n\nconfigure_logging(settings.log_level)\nlog = get_logger(\"nearmatch.api\")\n\n\n@asynccontextmanager\nasync def lifespan(_: FastAPI):\n    try:\n        await db.init_pool()\n    except Exception as exc:  # noqa: BLE001 - the app still serves /api/health\n        log.error(\"startup.db_unavailable\", error=str(exc))\n    yield\n    await db.close_pool()\n\n\napp = FastAPI(\n    title=\"NearMatch API\",\n    version=\"1.0.0\",\n    description=\"Location-based matching for the NearMatch mobile app.\",\n    lifespan=lifespan,\n    docs_url=None if settings.is_production else \"/docs\",\n    redoc_url=None,\n)\n\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=settings.cors_origins,\n    allow_credentials=True,\n    allow_methods=[\"*\"],\n    allow_headers=[\"*\"],\n)\n\nregister_error_handlers(app)\n\n\n@app.middleware(\"http\")\nasync def access_log(request: Request, call_next):\n    rid = new_request_id()\n    started = time.perf_counter()\n    response = await call_next(request)\n    response.headers[\"X-Request-Id\"] = rid\n    log.info(\n        \"http.request\",\n        method=request.method,\n        path=request.url.path,\n        status=response.status_code,\n        duration_ms=round((time.perf_counter() - started) * 1000, 2),\n    )\n    return response\n\n\n# Every route lives under /api so the mobile client can point\n# EXPO_PUBLIC_BACKEND_URL at the host root.\napp.include_router(api_router, prefix=settings.api_prefix)\n\n\n@app.get(\"/\")\nasync def root() -> dict:\n    return {\"app\": \"NearMatch\", \"api\": f\"{settings.api_prefix}/health\"}\n"}, {"p": "design_guidelines.json", "l": "json", "n": 171, "c": "{\n  \"$schema\": \"https://nearmatch.in/schemas/design-guidelines-1.json\",\n  \"name\": \"NearMatch\",\n  \"version\": \"1.0.0\",\n  \"updated\": \"2026-11-15\",\n  \"principle\": \"Warm, calm and legible. This is an app where people decide whether to meet a stranger — it should feel considered, not like a slot machine.\",\n  \"source_of_truth\": {\n    \"tokens\": \"frontend/src/theme/tokens.ts\",\n    \"note\": \"This file is the human-readable spec. tokens.ts is what the app imports; keep them in step.\"\n  },\n\n  \"color\": {\n    \"anchor\": {\n      \"value\": \"#FFF8EC\",\n      \"role\": \"background\",\n      \"note\": \"Taken from the splash screen and adaptive-icon background in app.json, so the store listing, launch screen and running app agree.\"\n    },\n    \"surfaces\": {\n      \"background\": \"#FFF8EC\",\n      \"surface\": \"#FFFFFF\",\n      \"surfaceMuted\": \"#FBF1E2\",\n      \"surfaceSunken\": \"#F4E7D3\"\n    },\n    \"brand\": {\n      \"primary\": \"#E2674A\",\n      \"primaryPressed\": \"#C8543A\",\n      \"primarySoft\": \"#FBE3DC\",\n      \"onPrimary\": \"#FFFFFF\",\n      \"secondary\": \"#1F6F6B\",\n      \"secondarySoft\": \"#D9ECEA\",\n      \"note\": \"Terracotta reads as inviting without the urgency of pure red. Teal balances the warm base and carries non-romantic information (job title, interest tags).\"\n    },\n    \"text\": {\n      \"text\": \"#2B2118\",\n      \"textMuted\": \"#6F6153\",\n      \"textSubtle\": \"#9A8B7C\",\n      \"onDark\": \"#FFF8EC\",\n      \"note\": \"Warm near-black, never pure #000 — pure black on cream reads as harsh.\"\n    },\n    \"status\": {\n      \"success\": \"#2E7D52\",\n      \"successSoft\": \"#DCEFE2\",\n      \"warning\": \"#B07A14\",\n      \"warningSoft\": \"#FBEFD4\",\n      \"danger\": \"#C0392B\",\n      \"dangerSoft\": \"#F8E1DE\"\n    },\n    \"swipe\": {\n      \"like\": \"#2E7D52\",\n      \"nope\": \"#C0392B\",\n      \"superlike\": \"#2F6FB0\",\n      \"note\": \"Never rely on colour alone — each control also carries a glyph and an accessibilityLabel.\"\n    },\n    \"lines\": { \"border\": \"#EADCC7\", \"borderStrong\": \"#D9C5A8\" },\n    \"contrast\": {\n      \"requirement\": \"WCAG AA — 4.5:1 for body text, 3:1 for large text and UI boundaries.\",\n      \"verified\": [\n        { \"pair\": \"text on background\", \"ratio\": \"12.8:1\" },\n        { \"pair\": \"textMuted on background\", \"ratio\": \"5.6:1\" },\n        { \"pair\": \"onPrimary on primary\", \"ratio\": \"4.0:1\", \"note\": \"Large/bold text only — button labels are 16px semibold.\" },\n        { \"pair\": \"textSubtle on background\", \"ratio\": \"3.1:1\", \"note\": \"Captions and metadata only, never body copy.\" }\n      ]\n    }\n  },\n\n  \"typography\": {\n    \"family\": \"System (San Francisco on iOS, Roboto on Android). No custom font — a dating app loads photos, and a webfont competes for that bandwidth.\",\n    \"scale\": {\n      \"display\": { \"size\": 32, \"lineHeight\": 38, \"weight\": 700, \"tracking\": -0.5, \"use\": \"Wordmark on sign-in\" },\n      \"title\": { \"size\": 24, \"lineHeight\": 30, \"weight\": 700, \"tracking\": -0.3, \"use\": \"Screen titles, name on a card\" },\n      \"heading\": { \"size\": 19, \"lineHeight\": 25, \"weight\": 600, \"use\": \"Section headers, modal titles\" },\n      \"body\": { \"size\": 16, \"lineHeight\": 23, \"weight\": 400, \"use\": \"Bios, messages, default\" },\n      \"bodyStrong\": { \"size\": 16, \"lineHeight\": 23, \"weight\": 600, \"use\": \"Button labels, names in lists\" },\n      \"label\": { \"size\": 14, \"lineHeight\": 19, \"weight\": 500, \"use\": \"Field labels, chips, previews\" },\n      \"caption\": { \"size\": 12, \"lineHeight\": 16, \"weight\": 500, \"tracking\": 0.2, \"use\": \"Timestamps, distance, metadata\" }\n    },\n    \"rules\": [\n      \"16px is the floor for anything a user reads at length. Bios and messages never go below it.\",\n      \"Never spread a typography token and then re-declare one of its properties above the spread — letterSpacing will be silently overwritten.\"\n    ]\n  },\n\n  \"spacing\": {\n    \"unit\": 4,\n    \"scale\": { \"xxs\": 2, \"xs\": 4, \"sm\": 8, \"md\": 12, \"base\": 16, \"lg\": 24, \"xl\": 32, \"xxl\": 48 },\n    \"gutter\": 16,\n    \"rule\": \"Screen edges use `base` (16). Vertical rhythm between sections uses `lg` (24).\"\n  },\n\n  \"radius\": {\n    \"sm\": 8, \"md\": 12, \"lg\": 18, \"xl\": 28, \"pill\": 999,\n    \"rule\": \"Cards use xl, inputs and tiles use md, buttons and chips use pill. Message bubbles use lg with the corner nearest the sender squared off to sm.\"\n  },\n\n  \"elevation\": {\n    \"card\": { \"color\": \"#8A6A45\", \"opacity\": 0.16, \"radius\": 18, \"offsetY\": 8, \"elevation\": 6 },\n    \"raised\": { \"color\": \"#8A6A45\", \"opacity\": 0.1, \"radius\": 8, \"offsetY\": 3, \"elevation\": 3 },\n    \"note\": \"Shadows are warm brown, not grey. A neutral grey shadow on a cream background looks dirty.\"\n  },\n\n  \"components\": {\n    \"Button\": {\n      \"variants\": [\"primary\", \"secondary\", \"ghost\", \"danger\"],\n      \"minHeight\": 48,\n      \"rules\": [\n        \"One primary action per screen.\",\n        \"Destructive actions use `danger` and always confirm first.\",\n        \"Loading state replaces the label with a spinner and sets accessibilityState.busy.\"\n      ]\n    },\n    \"ProfileCard\": {\n      \"rules\": [\n        \"Photo occupies the majority of the card; the app is about people, not metadata.\",\n        \"Tap left/right thirds to cycle photos; dot indicators sit at the top.\",\n        \"Distance uses the coarse label from the API. Never render a decimal distance.\",\n        \"At most four interest chips and two match reasons, so the card stays scannable.\"\n      ]\n    },\n    \"SwipeControls\": {\n      \"rules\": [\n        \"Three circular controls: pass, super like (larger, centre), like.\",\n        \"Each has a glyph, a colour and an accessibilityLabel — colour is never the only signal.\",\n        \"Remaining-likes copy appears only at 10 or fewer, so it reads as helpful rather than nagging.\"\n      ]\n    },\n    \"MessageBubble\": {\n      \"rules\": [\n        \"Own messages: primary fill, light text, right aligned. Theirs: white with a border, left aligned.\",\n        \"A pending message reads 'Sending…' rather than showing a spinner.\",\n        \"A failed message dims and offers 'Not sent. Tap to retry' — never disappears silently.\"\n      ]\n    },\n    \"EmptyState\": {\n      \"rules\": [\n        \"Every empty state says what happened, why, and what to do next.\",\n        \"An exhausted deck offers 'Adjust filters' — the actual remedy.\"\n      ]\n    }\n  },\n\n  \"accessibility\": {\n    \"minimumTouchTarget\": 44,\n    \"rules\": [\n      \"Every interactive element has an accessibilityRole and a meaningful accessibilityLabel.\",\n      \"Static chips render as View, not Pressable, so a screen reader does not announce decoration as a button.\",\n      \"Unread counts are announced as text ('3 unread messages'), not as a bare badge number.\",\n      \"Error banners carry accessibilityRole='alert'.\",\n      \"Colour is never the only carrier of meaning — like/pass also differ by glyph and position.\"\n    ]\n  },\n\n  \"copy\": {\n    \"voice\": \"Plain, warm, never coy. Short sentences.\",\n    \"rules\": [\n      \"Say what to do next: 'Widen your distance or age range' beats 'No results'.\",\n      \"Never shame a user about their profile. 'Add two more photos' — not 'Your profile is weak'.\",\n      \"Safety copy is literal and unhedged: 'They will not see you in Discover and your conversation will close.'\",\n      \"Never imply a precise location. 'Nearby' and rounded distances only.\"\n    ]\n  },\n\n  \"motion\": {\n    \"rules\": [\n      \"Screen transitions slide from the right; chat slides from the bottom; profiles present as a modal.\",\n      \"Image transitions fade over ~200ms.\",\n      \"A swipe removes its card immediately — optimistic, never blocked on the network.\",\n      \"No celebratory animation longer than the user's patience: the match modal is a fade, not a sequence.\"\n    ]\n  }\n}\n"}, {"p": "firebase/.firebaserc.example", "l": "bash", "n": 7, "c": "{\n  \"projects\": {\n    \"default\": \"nearmatch-REPLACE-ME\",\n    \"production\": \"nearmatch-prod\"\n  }\n}\n"}, {"p": "firebase/.gitignore", "l": "bash", "n": 15, "c": "# Firebase config files contain project identifiers — keep them out of git.\n.firebaserc\ngoogle-services.json\nGoogleService-Info.plist\nservice-account*.json\n.env\nfirebase-debug.log\nfirestore-debug.log\nui-debug.log\n\nnode_modules/\nfunctions/lib/\nrules-tests/node_modules/\n__pycache__/\n"}, {"p": "firebase/README.md", "l": "markdown", "n": 92, "c": "# NearMatch on Firebase\n\nEverything needed to run NearMatch on Google Cloud + Firebase, as a drop-in\noverlay on the existing repo. **Nothing in `backend/`, `frontend/` or\n`supabase/` has been modified** — this folder sits alongside them, so you can\ncompare, adopt piecemeal, or walk away.\n\n## The architecture, and why\n\n```\nExpo app ──► Firebase Auth        phone OTP + Apple\n         ──► Cloud Run (FastAPI)  ──► Cloud SQL (Postgres 16 + PostGIS)\n         ──► Firestore            chat only\n         ──► Cloud Storage        photos\n         ──► FCM                  push, via Cloud Functions\n```\n\n**Discovery stays in Postgres.** The deck query combines 21 conditions in one\nstatement: a PostGIS radius search, `NOT EXISTS` against swipes and blocks,\narray overlap for mutual orientation, an age band, and `ORDER BY` distance.\nFirestore has no joins, no `NOT EXISTS` and no native radius query, so\nreproducing it would mean pulling candidates into app code and filtering there\n— slower, worse matches, and billed per document read.\n\n**Chat moves to Firestore**, which is genuinely good at it: live subscriptions,\noffline queueing, and local echo without a round-trip.\n\n## What is in here\n\n| Path | What it is | Verified |\n|---|---|---|\n| `firestore.rules` | Chat security rules | **29 tests, real emulator** |\n| `rules-tests/` | Those tests | `npm test` |\n| `firestore.indexes.json` | Composite indexes | not executed |\n| `storage.rules` | Photo bucket rules | not executed |\n| `functions/` | FCM on message + match, unread counters | typechecks |\n| `backend/` | Firebase auth, GCS storage, Firestore sync, FCM | **13 token tests** |\n| `frontend/` | Firebase client, auth, chat, push | **typechecks + lints** against the real app |\n| `cloudsql/` | Schema ported to Cloud SQL | **applies to real Postgres 16 + PostGIS** |\n| `deploy/` | `setup.sh`, Cloud Build, Cloud Run | not executed |\n\n## Order of work\n\n1. **`deploy/setup.sh`** — creates the project resources. Read it first; it\n   bills.\n2. **`cloudsql/`** — create the instance, enable PostGIS, apply migrations.\n3. **`backend/`** — swap four files, merge the config, deploy to Cloud Run.\n4. **`firebase deploy --only firestore:rules,firestore:indexes,storage,functions`**\n5. **`frontend/`** — swap five files, add the Firebase config files, run it.\n\nEach subfolder has its own README with the exact edits.\n\n## Three things that will bite you\n\n**1. `profiles.id` changes type.** A Firebase uid is a 28-character string, not\na uuid. The Cloud SQL migrations use `text` throughout and every foreign key\nfollows. If you have existing Supabase data, you need a migration that maps old\nuuids to new uids — there is no automatic path.\n\n**2. The `messages` table is gone.** `matches_repo.list_for_user` joins it for\nthe preview and unread count. The replacement query is in\n`cloudsql/README.md`, and the client now merges that metadata from Firestore.\n\n**3. Expo Go stops being enough eventually.** The code here uses the Firebase\nJS SDK so it still runs in Expo Go, but background FCM needs the native SDK and\na development build. `frontend/README.md` covers both paths.\n\n## Signing is cheaper here\n\nThe Supabase build now batches photo signing into one request per deck, so the\noriginal N+1 bug is fixed on both paths. GCS still wins: V4 signing is a local\ncomputation, so `photo_storage.sign_many()` signs a deck with **no network call\nat all**, against one for Supabase.\n\n## What this does not fix\n\nEverything else in `../test_result.md` travels with you: the app has still\nnever been rendered on a device, frontend coverage is still 5.8%, `is_banned`\nis still not column-protected, and there is still no account deletion.\n\n## Honest status\n\nVerified here: Firestore rules (29/29 against the emulator), the Firebase token\nverifier (13/13, including the RS256→HS256 confusion attack), the Cloud SQL\nschema and match trigger against real Postgres, and the frontend overlay\ntypechecking and linting against the actual app.\n\nNot verified: anything needing a real Firebase project — Functions deployment,\nFCM delivery, Storage rules, phone auth, and the Cloud Run deploy. I had no\nproject to deploy to. Two bugs were found and fixed by writing the tests above;\nassume the unverified parts have their share too.\n"}, {"p": "firebase/backend/.env.example", "l": "bash", "n": 27, "c": "# --- Firebase ---\nFIREBASE_PROJECT_ID=nearmatch-REPLACE-ME\n# Omit on Cloud Run: Application Default Credentials are picked up automatically.\n# Set only when running locally.\nGOOGLE_APPLICATION_CREDENTIALS=/secrets/service-account.json\n\n# --- Cloud Storage ---\nPHOTO_BUCKET=nearmatch-REPLACE-ME-photos\nSIGNED_URL_TTL_SECONDS=3600\n\n# --- Cloud SQL (Postgres + PostGIS) ---\n# Cloud Run with the Cloud SQL connector:\nDATABASE_URL=postgresql://nearmatch:PASSWORD@/nearmatch?host=/cloudsql/PROJECT:REGION:INSTANCE\n# Local via the proxy:\n# DATABASE_URL=postgresql://nearmatch:PASSWORD@127.0.0.1:5432/nearmatch\n\n# --- App ---\nENVIRONMENT=production\nLOG_LEVEL=INFO\nAPI_PREFIX=/api\nCORS_ORIGINS=https://nearmatch.in,https://www.nearmatch.in\n\n# --- Matching (unchanged) ---\nDEFAULT_MAX_DISTANCE_KM=50\nDISCOVER_PAGE_SIZE=20\nDISTANCE_HALF_LIFE_KM=25\n"}, {"p": "firebase/backend/README.md", "l": "markdown", "n": 99, "c": "# Backend changes for Firebase + Cloud SQL\n\nThe FastAPI service keeps its shape. Four files change, nothing else.\n\n## 1. Swap the auth verifier\n\n`app/core/firebase_auth.py` replaces `app/core/security.py`.\n\nSupabase signed HS256 with a shared secret; Firebase signs RS256 with rotating\nGoogle keys, so the new module fetches and caches the public certificates and\nvalidates issuer and audience against your project id.\n\n`app/deps.py` does not change — it still imports `user_id_from_token`:\n\n```python\n# app/deps.py\nfrom app.core.firebase_auth import user_id_from_token   # was: app.core.security\n```\n\n## 2. Swap the storage client\n\n`app/core/gcs_storage.py` replaces `app/core/supabase_client.py`.\n\n**This also fixes the N+1 bug** flagged in `test_result.md`. The Supabase\nversion made one HTTPS call per photo to sign a URL — up to 120 serial\nround-trips for a single deck. V4 signing is a local computation, so\n`sign_many()` signs a whole deck with no network calls at all.\n\nIn `app/services/profile_service.py`, replace `_sign_photos` with:\n\n```python\nfrom app.core.gcs_storage import photo_storage\n\ndef _sign_photos(rows: list[dict]) -> list[Photo]:\n    urls = photo_storage.sign_many([r[\"storage_path\"] for r in rows])\n    return [\n        Photo(\n            id=str(r[\"id\"]),\n            storage_path=r[\"storage_path\"],\n            url=urls.get(r[\"storage_path\"]),\n            position=r.get(\"position\", 0),\n            is_primary=r.get(\"is_primary\", False),\n        )\n        for r in rows\n    ]\n```\n\nNote it is no longer `async` — drop the `await` at its three call sites, and\nchange the photo path prefix from `\u003cuid>/` to `profiles/\u003cuid>/` to match\n`storage.rules`.\n\n## 3. Mirror matches into Firestore\n\n`app/core/firestore_sync.py` is new. Call it where matches change:\n\n```python\n# app/services/swipe_service.py — after matches_repo.create(...)\nfrom app.core import firestore_sync\nfirestore_sync.mirror_match(str(match[\"id\"]), actor_id, target_id)\n\n# app/services/match_service.py — after matches_repo.deactivate(...)\nfirestore_sync.close_match(match_id)\n\n# app/services/moderation_service.py — after block_user(...)\nfirestore_sync.close_matches_between(user_id, blocked_id)\n```\n\n## 4. Swap notifications\n\n`app/services/fcm_service.py` replaces `app/services/notification_service.py`.\nMatch and message pushes move to Cloud Functions, which already observe the\nFirestore writes. Only \"someone liked you\" is still sent from the API, because\na like never reaches Firestore.\n\n## 5. Config\n\nMerge `app/config_additions.py` into `app/config.py`, then use `.env.example`\nhere as the template.\n\n## What does NOT change\n\n`app/matching/` — the entire geo, scoring, filters and ranking core.\n`app/db/repositories/` — all SQL, including the PostGIS deck query.\n`app/api/` — every route and response model.\n`app/models/` — every schema.\n\nAll 139 matching unit tests still apply unchanged.\n\n## Messages leave Postgres\n\nChat moves to Firestore, so:\n\n- Drop the `messages` table (the Cloud SQL migrations here already omit it).\n- `matches_repo.list_for_user` must drop its `messages` join and the\n  `unread_count` subquery. The replacement query is in\n  `../cloudsql/README.md`.\n- The client gets last-message and unread counts from the Firestore match\n  document, which Cloud Functions keep current.\n"}, {"p": "firebase/backend/app/config_additions.py", "l": "python", "n": 23, "c": "\"\"\"Settings to merge into `backend/app/config.py`.\n\nAdd these fields to the existing `Settings` class and drop the four\n`supabase_*` fields. `database_url` stays exactly as it is — Cloud SQL is\nstill Postgres.\n\"\"\"\n\n# --- add to Settings ---\n#\n#     # Firebase\n#     firebase_project_id: str = Field(default=\"\")\n#\n#     # Cloud Storage\n#     photo_bucket: str = Field(default=\"\")\n#     signed_url_ttl_seconds: int = 3600\n#\n# --- remove from Settings ---\n#\n#     supabase_url\n#     supabase_anon_key\n#     supabase_service_role_key\n#     supabase_jwt_secret\n"}, {"p": "firebase/backend/app/core/firebase_auth.py", "l": "python", "n": 142, "c": "\"\"\"Firebase ID token verification.\n\nDrop-in replacement for `app/core/security.py`.\n\nSupabase signed its JWTs HS256 with a shared secret. Firebase signs RS256 with\nrotating Google keys, so this fetches and caches the public certificates and\nchecks issuer and audience against the project id. Everything downstream\n(`app/deps.py`) is unchanged — it still just asks for a user id.\n\"\"\"\nfrom __future__ import annotations\n\nimport os\nimport threading\nimport time\nfrom typing import Any, Dict, Optional\n\nimport httpx\nimport jwt\n\nfrom app.config import settings\nfrom app.core.errors import Unauthorized\n\n_CERT_URL = (\n    \"https://www.googleapis.com/robot/v1/metadata/x509/\"\n    \"securetoken@system.gserviceaccount.com\"\n)\n_ISSUER_PREFIX = \"https://securetoken.google.com/\"\n\n# Google rotates these roughly daily and sends a max-age; refresh on expiry.\n_certs: Dict[str, Any] = {}\n_certs_expire_at: float = 0.0\n_lock = threading.Lock()\n\n\ndef _refresh_certs() -> None:\n    global _certs, _certs_expire_at\n    try:\n        response = httpx.get(_CERT_URL, timeout=10)\n        response.raise_for_status()\n    except httpx.HTTPError as exc:\n        raise Unauthorized(\"Could not reach Google's token certificates.\") from exc\n\n    _certs = response.json()\n\n    max_age = 3600\n    cache_control = response.headers.get(\"cache-control\", \"\")\n    for part in cache_control.split(\",\"):\n        part = part.strip()\n        if part.startswith(\"max-age=\"):\n            try:\n                max_age = int(part.split(\"=\", 1)[1])\n            except ValueError:\n                pass\n    # Refresh a little early so a request never races the rotation.\n    _certs_expire_at = time.monotonic() + max(60, max_age - 300)\n\n\ndef _public_key(kid: str):\n    global _certs\n    with _lock:\n        if not _certs or time.monotonic() >= _certs_expire_at:\n            _refresh_certs()\n        cert = _certs.get(kid)\n        if cert is None:\n            # Unknown key id — the set may have rotated since the last fetch.\n            _refresh_certs()\n            cert = _certs.get(kid)\n\n    if cert is None:\n        raise Unauthorized(\"Token was signed with an unrecognised key.\")\n    return _public_key_from_x509(cert)\n\n\ndef _public_key_from_x509(cert_pem: str):\n    \"\"\"Google publishes X.509 certificates; PyJWT takes the public key object.\n\n    Do not route this through RSAAlgorithm.from_jwk — that expects a JWK in\n    JSON, not a key, and raises InvalidKeyError('Key is not valid JSON').\n    \"\"\"\n    from cryptography.hazmat.backends import default_backend\n    from cryptography.x509 import load_pem_x509_certificate\n\n    certificate = load_pem_x509_certificate(cert_pem.encode(), default_backend())\n    return certificate.public_key()\n\n\ndef decode_token(token: str) -> Dict[str, Any]:\n    \"\"\"Verify a Firebase ID token and return its claims.\"\"\"\n    # getattr keeps this working before config.py has been merged.\n    project_id = getattr(settings, \"firebase_project_id\", \"\") or os.environ.get(\n        \"FIREBASE_PROJECT_ID\", \"\"\n    )\n    if not project_id:\n        raise Unauthorized(\"Server is missing FIREBASE_PROJECT_ID.\")\n\n    try:\n        header = jwt.get_unverified_header(token)\n    except jwt.InvalidTokenError as exc:\n        raise Unauthorized(\"Invalid session token.\") from exc\n\n    kid = header.get(\"kid\")\n    if not kid or header.get(\"alg\") != \"RS256\":\n        # Rejects the alg=none downgrade and any unsigned token.\n        raise Unauthorized(\"Invalid session token.\")\n\n    key = _public_key(kid)\n\n    try:\n        claims = jwt.decode(\n            token,\n            key=key,\n            algorithms=[\"RS256\"],\n            audience=project_id,\n            issuer=f\"{_ISSUER_PREFIX}{project_id}\",\n            options={\"require\": [\"sub\", \"exp\", \"iat\", \"aud\", \"iss\"]},\n        )\n    except jwt.ExpiredSignatureError as exc:\n        raise Unauthorized(\"Session expired. Sign in again.\") from exc\n    except jwt.InvalidTokenError as exc:\n        raise Unauthorized(\"Invalid session token.\") from exc\n\n    if not claims.get(\"sub\"):\n        raise Unauthorized(\"Invalid session token.\")\n\n    # Firebase sets auth_time; a token minted before a forced sign-out is stale.\n    if claims.get(\"auth_time\", 0) > time.time() + 60:\n        raise Unauthorized(\"Invalid session token.\")\n\n    return claims\n\n\ndef user_id_from_token(token: str) -> str:\n    return str(decode_token(token)[\"sub\"])\n\n\ndef reset_cert_cache() -> None:\n    \"\"\"Test hook.\"\"\"\n    global _certs, _certs_expire_at\n    with _lock:\n        _certs = {}\n        _certs_expire_at = 0.0\n"}, {"p": "firebase/backend/app/core/firestore_sync.py", "l": "python", "n": 75, "c": "\"\"\"Mirror match state from Postgres into Firestore.\n\nPostgres remains the source of truth for who matched with whom — that decision\nneeds the swipes table and the reciprocal-like trigger. Firestore only needs\nenough to let the client read its chat list and for the rules to answer\n\"is this person a participant, and is the match still open?\".\n\nEvery write here is idempotent, so a replay or a retry is harmless.\n\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Optional\n\nfrom google.cloud import firestore\n\nfrom app.config import settings\nfrom app.core.logging import get_logger\n\nlog = get_logger(__name__)\n\n_client: Optional[firestore.Client] = None\n\n\ndef client() -> firestore.Client:\n    global _client\n    if _client is None:\n        _client = firestore.Client(project=settings.firebase_project_id)\n    return _client\n\n\ndef mirror_match(match_id: str, user_a: str, user_b: str) -> None:\n    \"\"\"Create or reopen the Firestore match document.\n\n    `onMatchCreated` fires from this write and sends both push notifications,\n    so the API does not send them itself.\n    \"\"\"\n    try:\n        doc = client().document(\"matches\", match_id)\n        doc.set(\n            {\n                \"participants\": sorted([user_a, user_b]),\n                \"isActive\": True,\n                \"createdAt\": firestore.SERVER_TIMESTAMP,\n                \"lastMessageAt\": None,\n                \"lastMessage\": None,\n                \"unread\": {user_a: 0, user_b: 0},\n            },\n            merge=True,\n        )\n    except Exception as exc:  # noqa: BLE001 - chat is degraded, the match still exists\n        log.error(\"firestore.mirror_match_failed\", match_id=match_id, error=str(exc))\n\n\ndef close_match(match_id: str) -> None:\n    \"\"\"Deactivate the match so the rules refuse further messages.\"\"\"\n    try:\n        client().document(\"matches\", match_id).set({\"isActive\": False}, merge=True)\n    except Exception as exc:  # noqa: BLE001\n        log.error(\"firestore.close_match_failed\", match_id=match_id, error=str(exc))\n\n\ndef close_matches_between(user_a: str, user_b: str) -> None:\n    \"\"\"Used when one person blocks another.\"\"\"\n    try:\n        pair = sorted([user_a, user_b])\n        query = (\n            client()\n            .collection(\"matches\")\n            .where(filter=firestore.FieldFilter(\"participants\", \"==\", pair))\n        )\n        for snapshot in query.stream():\n            snapshot.reference.set({\"isActive\": False}, merge=True)\n    except Exception as exc:  # noqa: BLE001\n        log.error(\"firestore.close_between_failed\", error=str(exc))\n"}, {"p": "firebase/backend/app/core/gcs_storage.py", "l": "python", "n": 109, "c": "\"\"\"Cloud Storage access for profile photos.\n\nDrop-in replacement for `app/core/supabase_client.py`.\n\nSame contract as before: hand the device a signed URL to upload to, and hand\nreaders short-lived signed URLs. Bytes never pass through the API.\n\nOne important change from the Supabase version: `sign_many` signs a batch\nwithout a network round-trip per object, because V4 signing is a local\ncomputation. That removes the N+1 problem the Supabase implementation had.\n\"\"\"\nfrom __future__ import annotations\n\nimport datetime as dt\nfrom typing import Dict, Iterable, List, Optional\n\nfrom google.cloud import storage\nfrom google.cloud.exceptions import NotFound\n\nfrom app.config import settings\nfrom app.core.errors import AppError\nfrom app.core.logging import get_logger\n\nlog = get_logger(__name__)\n\n_ALLOWED_TYPES = {\"image/jpeg\", \"image/png\", \"image/webp\", \"image/heic\"}\nMAX_PHOTO_BYTES = 8 * 1024 * 1024\n\n\nclass PhotoStorage:\n    def __init__(self) -> None:\n        self._client: Optional[storage.Client] = None\n\n    @property\n    def client(self) -> storage.Client:\n        # Lazy so importing the module does not require credentials.\n        if self._client is None:\n            self._client = storage.Client(project=settings.firebase_project_id)\n        return self._client\n\n    @property\n    def bucket(self):\n        return self.client.bucket(settings.photo_bucket)\n\n    def create_upload_url(self, path: str, content_type: str) -> Dict[str, object]:\n        \"\"\"A V4 signed PUT the device can upload to directly.\"\"\"\n        if content_type not in _ALLOWED_TYPES:\n            raise AppError(f\"Unsupported image type: {content_type}\")\n\n        blob = self.bucket.blob(path)\n        url = blob.generate_signed_url(\n            version=\"v4\",\n            expiration=dt.timedelta(minutes=15),\n            method=\"PUT\",\n            content_type=content_type,\n        )\n        return {\n            \"upload_url\": url,\n            \"storage_path\": path,\n            \"token\": \"\",  # Not needed: the signature is in the URL.\n            \"max_bytes\": MAX_PHOTO_BYTES,\n        }\n\n    def sign_read(self, path: str, ttl_seconds: Optional[int] = None) -> Optional[str]:\n        \"\"\"A short-lived read URL for one object.\"\"\"\n        ttl = ttl_seconds or settings.signed_url_ttl_seconds\n        try:\n            blob = self.bucket.blob(path)\n            return blob.generate_signed_url(\n                version=\"v4\",\n                expiration=dt.timedelta(seconds=ttl),\n                method=\"GET\",\n            )\n        except Exception as exc:  # noqa: BLE001 - a missing photo must not break a profile\n            log.warning(\"storage.sign_failed\", path=path, error=str(exc))\n            return None\n\n    def sign_many(self, paths: Iterable[str], ttl_seconds: Optional[int] = None) -> Dict[str, Optional[str]]:\n        \"\"\"Sign a batch of paths.\n\n        V4 signing is local, so this is CPU work rather than one network call\n        per photo. A 20-card deck with 6 photos each costs nothing extra.\n        \"\"\"\n        ttl = ttl_seconds or settings.signed_url_ttl_seconds\n        expiration = dt.timedelta(seconds=ttl)\n        bucket = self.bucket\n        out: Dict[str, Optional[str]] = {}\n\n        for path in paths:\n            try:\n                out[path] = bucket.blob(path).generate_signed_url(\n                    version=\"v4\", expiration=expiration, method=\"GET\"\n                )\n            except Exception as exc:  # noqa: BLE001\n                log.warning(\"storage.sign_failed\", path=path, error=str(exc))\n                out[path] = None\n        return out\n\n    def delete(self, path: str) -> None:\n        try:\n            self.bucket.blob(path).delete()\n        except NotFound:\n            pass\n        except Exception as exc:  # noqa: BLE001 - the row is already gone\n            log.warning(\"storage.delete_failed\", path=path, error=str(exc))\n\n\nphoto_storage = PhotoStorage()\n"}, {"p": "firebase/backend/app/services/fcm_service.py", "l": "python", "n": 93, "c": "\"\"\"Push notifications over FCM.\n\nDrop-in replacement for `app/services/notification_service.py`.\n\nMost pushes now originate from Cloud Functions, which already observe the\nFirestore writes — see firebase/functions/src/index.ts. What stays here is the\n\"someone liked you\" nudge, because a like is a Postgres event that Firestore\nnever sees.\n\nAs before, delivery is best-effort: a failure is logged, never raised.\n\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Dict, List\n\nfrom app.core.logging import get_logger\n\nlog = get_logger(__name__)\n\n_messaging = None\n\n\ndef _client():\n    global _messaging\n    if _messaging is None:\n        import firebase_admin\n        from firebase_admin import messaging\n\n        if not firebase_admin._apps:  # noqa: SLF001 - the documented check\n            firebase_admin.initialize_app()\n        _messaging = messaging\n    return _messaging\n\n\nasync def _tokens_for(profile_id: str) -> List[str]:\n    from app.core.firestore_sync import client\n\n    try:\n        snaps = (\n            client()\n            .collection(\"devices\")\n            .where(\"uid\", \"==\", profile_id)\n            .stream()\n        )\n        return [s.get(\"token\") for s in snaps if s.get(\"token\")]\n    except Exception as exc:  # noqa: BLE001\n        log.warning(\"fcm.tokens_failed\", error=str(exc))\n        return []\n\n\nasync def _send(profile_id: str, title: str, body: str, data: Dict[str, Any]) -> None:\n    tokens = await _tokens_for(profile_id)\n    if not tokens:\n        return\n\n    messaging = _client()\n    try:\n        response = messaging.send_each_for_multicast(\n            messaging.MulticastMessage(\n                tokens=tokens,\n                notification=messaging.Notification(title=title, body=body),\n                data={k: str(v) for k, v in data.items()},\n                apns=messaging.APNSConfig(\n                    payload=messaging.APNSPayload(aps=messaging.Aps(sound=\"default\"))\n                ),\n                android=messaging.AndroidConfig(priority=\"high\"),\n            )\n        )\n        if response.failure_count:\n            log.warning(\"fcm.partial_failure\", failed=response.failure_count)\n    except Exception as exc:  # noqa: BLE001 - notifications are best-effort\n        log.warning(\"fcm.error\", error=str(exc))\n\n\nasync def notify_new_like(target_id: str) -> None:\n    \"\"\"A like is a Postgres event, so this one is still sent from the API.\"\"\"\n    await _send(\n        target_id,\n        \"Someone liked you\",\n        \"Open NearMatch to see who is nearby.\",\n        {\"type\": \"like\"},\n    )\n\n\nasync def notify_new_match(match_id: str, user_a: str, user_b: str) -> None:\n    \"\"\"No-op: `onMatchCreated` sends this when the match doc is mirrored in.\"\"\"\n    log.debug(\"fcm.match_push_delegated_to_function\", match_id=match_id)\n\n\nasync def notify_new_message(recipient_id: str, match_id: str, preview: str) -> None:\n    \"\"\"No-op: `onMessageCreated` sends this when the message lands in Firestore.\"\"\"\n    log.debug(\"fcm.message_push_delegated_to_function\", match_id=match_id)\n"}, {"p": "firebase/backend/requirements-firebase.txt", "l": "plaintext", "n": 8, "c": "# Additions to backend/requirements.txt when running on Firebase + Cloud SQL.\n# Remove nothing from the original list except the Supabase-specific pieces\n# (there are none — Supabase was reached over plain httpx).\nfirebase-admin==6.6.0\ngoogle-cloud-storage==2.19.0\ngoogle-auth==2.37.0\ncachetools==5.5.0\n"}, {"p": "firebase/backend/tests/test_firebase_auth.py", "l": "python", "n": 229, "c": "\"\"\"Firebase ID token verification.\n\nSigns tokens with a throwaway RSA key and injects the matching certificate into\nthe module's cache, so the whole RS256 path is exercised offline. Every test\nafter the first is an attack.\n\"\"\"\nimport datetime as dt\nimport os\nimport sys\nimport time\n\nimport jwt\nimport pytest\nfrom cryptography import x509\nfrom cryptography.hazmat.primitives import hashes, serialization\nfrom cryptography.hazmat.primitives.asymmetric import rsa\nfrom cryptography.x509.oid import NameOID\n\n# The main backend supplies app.config and app.core.errors.\nsys.path.insert(0, os.path.join(os.path.dirname(__file__), \"..\", \"..\", \"..\", \"backend\"))\n\nos.environ.setdefault(\"FIREBASE_PROJECT_ID\", \"nearmatch-test\")\nos.environ.setdefault(\"SUPABASE_JWT_SECRET\", \"unused\")\n\n# Load the adapter by path: it is not installed into the backend's app.core\n# package until you copy it there, and this test must work before that.\nimport importlib.util  # noqa: E402\n\n_spec = importlib.util.spec_from_file_location(\n    \"nearmatch_firebase_auth\",\n    os.path.join(os.path.dirname(__file__), \"..\", \"app\", \"core\", \"firebase_auth.py\"),\n)\nfirebase_auth = importlib.util.module_from_spec(_spec)\n_spec.loader.exec_module(firebase_auth)\n\nfrom app.core.errors import Unauthorized  # noqa: E402\n\nPROJECT = \"nearmatch-test\"\nUID = \"IkR2xQ9fTbYnLpM3vWqZeA7sCdE1\"\nKID = \"test-key-1\"\n\n\n@pytest.fixture(scope=\"module\")\ndef keypair():\n    key = rsa.generate_private_key(public_exponent=65537, key_size=2048)\n    subject = issuer = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, \"test\")])\n    cert = (\n        x509.CertificateBuilder()\n        .subject_name(subject)\n        .issuer_name(issuer)\n        .public_key(key.public_key())\n        .serial_number(x509.random_serial_number())\n        .not_valid_before(dt.datetime.now(dt.timezone.utc) - dt.timedelta(days=1))\n        .not_valid_after(dt.datetime.now(dt.timezone.utc) + dt.timedelta(days=30))\n        .sign(key, hashes.SHA256())\n    )\n    pem = cert.public_bytes(serialization.Encoding.PEM).decode()\n    private_pem = key.private_bytes(\n        encoding=serialization.Encoding.PEM,\n        format=serialization.PrivateFormat.PKCS8,\n        encryption_algorithm=serialization.NoEncryption(),\n    ).decode()\n    return private_pem, pem\n\n\n@pytest.fixture(autouse=True)\ndef inject_certs(keypair, monkeypatch):\n    \"\"\"Pretend Google published our test certificate.\"\"\"\n    _, cert_pem = keypair\n    firebase_auth.reset_cert_cache()\n\n    def fake_refresh():\n        firebase_auth._certs = {KID: cert_pem}\n        firebase_auth._certs_expire_at = time.monotonic() + 3600\n\n    monkeypatch.setattr(firebase_auth, \"_refresh_certs\", fake_refresh)\n    yield\n    firebase_auth.reset_cert_cache()\n\n\ndef make_token(keypair, *, kid=KID, alg=\"RS256\", **overrides) -> str:\n    private_pem, _ = keypair\n    now = int(time.time())\n    claims = {\n        \"sub\": UID,\n        \"aud\": PROJECT,\n        \"iss\": f\"https://securetoken.google.com/{PROJECT}\",\n        \"iat\": now,\n        \"exp\": now + 3600,\n        \"auth_time\": now,\n        \"user_id\": UID,\n        \"firebase\": {\"sign_in_provider\": \"phone\"},\n    }\n    claims.update(overrides)\n    return jwt.encode(claims, private_pem, algorithm=alg, headers={\"kid\": kid})\n\n\nclass TestValidTokens:\n    def test_accepts_a_valid_token(self, keypair):\n        assert firebase_auth.decode_token(make_token(keypair))[\"sub\"] == UID\n\n    def test_extracts_the_user_id(self, keypair):\n        assert firebase_auth.user_id_from_token(make_token(keypair)) == UID\n\n    def test_returns_the_sign_in_provider(self, keypair):\n        claims = firebase_auth.decode_token(make_token(keypair))\n        assert claims[\"firebase\"][\"sign_in_provider\"] == \"phone\"\n\n\nclass TestAttacks:\n    def test_rejects_an_expired_token(self, keypair):\n        token = make_token(keypair, exp=int(time.time()) - 10)\n        with pytest.raises(Unauthorized, match=\"expired\"):\n            firebase_auth.decode_token(token)\n\n    def test_rejects_another_projects_token(self, keypair):\n        # A token minted for a different Firebase project must not work here.\n        token = make_token(keypair, aud=\"someone-elses-project\")\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(token)\n\n    def test_rejects_a_forged_issuer(self, keypair):\n        token = make_token(keypair, iss=\"https://evil.example.com/\")\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(token)\n\n    def test_rejects_an_unknown_key_id(self, keypair):\n        token = make_token(keypair, kid=\"not-a-real-key\")\n        with pytest.raises(Unauthorized, match=\"unrecognised key\"):\n            firebase_auth.decode_token(token)\n\n    def test_rejects_a_token_signed_by_a_different_key(self, keypair):\n        other = rsa.generate_private_key(public_exponent=65537, key_size=2048)\n        other_pem = other.private_bytes(\n            encoding=serialization.Encoding.PEM,\n            format=serialization.PrivateFormat.PKCS8,\n            encryption_algorithm=serialization.NoEncryption(),\n        ).decode()\n        now = int(time.time())\n        token = jwt.encode(\n            {\n                \"sub\": UID,\n                \"aud\": PROJECT,\n                \"iss\": f\"https://securetoken.google.com/{PROJECT}\",\n                \"iat\": now,\n                \"exp\": now + 3600,\n            },\n            other_pem,\n            algorithm=\"RS256\",\n            headers={\"kid\": KID},\n        )\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(token)\n\n    def test_rejects_the_alg_none_downgrade(self, keypair):\n        now = int(time.time())\n        token = jwt.encode(\n            {\n                \"sub\": UID,\n                \"aud\": PROJECT,\n                \"iss\": f\"https://securetoken.google.com/{PROJECT}\",\n                \"exp\": now + 3600,\n            },\n            key=\"\",\n            algorithm=\"none\",\n            headers={\"kid\": KID},\n        )\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(token)\n\n    def test_rejects_an_hs256_token_signed_with_the_public_cert(self, keypair):\n        \"\"\"The classic RS256-to-HS256 algorithm-confusion attack.\n\n        An attacker takes Google's *public* certificate — which anyone can\n        fetch — and uses it as an HMAC secret, hoping the server picks the\n        algorithm from the token header. Built by hand because PyJWT refuses\n        to encode this shape at all.\n        \"\"\"\n        import base64\n        import hashlib\n        import hmac\n        import json\n\n        _, cert_pem = keypair\n        now = int(time.time())\n\n        def b64(raw: bytes) -> bytes:\n            return base64.urlsafe_b64encode(raw).rstrip(b\"=\")\n\n        header = b64(json.dumps({\"alg\": \"HS256\", \"typ\": \"JWT\", \"kid\": KID}).encode())\n        payload = b64(\n            json.dumps(\n                {\n                    \"sub\": UID,\n                    \"aud\": PROJECT,\n                    \"iss\": f\"https://securetoken.google.com/{PROJECT}\",\n                    \"iat\": now,\n                    \"exp\": now + 3600,\n                }\n            ).encode()\n        )\n        signing_input = header + b\".\" + payload\n        signature = b64(\n            hmac.new(cert_pem.encode(), signing_input, hashlib.sha256).digest()\n        )\n        token = (signing_input + b\".\" + signature).decode()\n\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(token)\n\n    def test_rejects_a_token_with_no_subject(self, keypair):\n        token = make_token(keypair)\n        stripped = jwt.encode(\n            {k: v for k, v in jwt.decode(token, options={\"verify_signature\": False}).items() if k != \"sub\"},\n            keypair[0],\n            algorithm=\"RS256\",\n            headers={\"kid\": KID},\n        )\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(stripped)\n\n    def test_rejects_garbage(self):\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(\"not-a-jwt\")\n\n    def test_rejects_an_empty_token(self):\n        with pytest.raises(Unauthorized):\n            firebase_auth.decode_token(\"\")\n"}, {"p": "firebase/cloudsql/README.md", "l": "markdown", "n": 76, "c": "# Cloud SQL schema (Postgres 16 + PostGIS)\n\nThe matching schema, ported from Supabase. The PostGIS parts — which are the\nreason not to use Firestore for discovery — are unchanged.\n\n## What changed from `supabase/migrations/`\n\n| Change | Why |\n|---|---|\n| `profiles.id` is `text`, not `uuid` | A Firebase uid is a 28-character string, not a uuid. Every FK follows. |\n| No `references auth.users` | There is no `auth` schema on Cloud SQL. The API asserts identity after verifying the Firebase ID token. |\n| `messages` table dropped | Chat moved to Firestore. |\n| RLS dropped | The client no longer connects to Postgres; everything goes through the API. See `20261115091400_firestore_notes.sql`. |\n| Storage policies dropped | Replaced by `firebase/storage.rules`. |\n\nUnchanged: PostGIS, the GiST index, the reciprocal-like match trigger, swipes,\nblocks, reports, preferences and photo metadata.\n\n## Create the instance\n\n```bash\ngcloud sql instances create nearmatch-db \\\n  --database-version=POSTGRES_16 \\\n  --tier=db-custom-2-7680 \\\n  --region=asia-south1 \\\n  --storage-type=SSD --storage-size=20GB \\\n  --database-flags=cloudsql.enable_pgaudit=on\n\ngcloud sql databases create nearmatch --instance=nearmatch-db\ngcloud sql users create nearmatch --instance=nearmatch-db --password=CHANGE_ME\n```\n\nThen enable PostGIS (Cloud SQL ships it; it just needs creating):\n\n```sql\nCREATE EXTENSION IF NOT EXISTS postgis;\nCREATE EXTENSION IF NOT EXISTS pgcrypto;\nCREATE EXTENSION IF NOT EXISTS pg_trgm;\n```\n\n## Apply\n\n```bash\ncloud-sql-proxy PROJECT:asia-south1:nearmatch-db --port 5432 &\n\nfor f in migrations/*.sql; do\n  psql \"postgresql://nearmatch:PASSWORD@127.0.0.1:5432/nearmatch\" -v ON_ERROR_STOP=1 -f \"$f\"\ndone\n```\n\n## One query you must change\n\n`matches_repo.list_for_user` joins `messages` for the preview and unread count.\nThat table is gone. Replace the query with:\n\n```sql\nSELECT m.id,\n       m.created_at AS matched_at,\n       CASE WHEN m.user_low = $1 THEN m.user_high ELSE m.user_low END AS other_id,\n       p.display_name,\n       date_part('year', age(p.dob))::int AS age,\n       p.gender, p.bio, p.job_title, p.city, p.interests, p.last_active_at\n  FROM matches m\n  JOIN profiles p\n    ON p.id = CASE WHEN m.user_low = $1 THEN m.user_high ELSE m.user_low END\n WHERE (m.user_low = $1 OR m.user_high = $1)\n   AND m.is_active\n   AND NOT p.is_deleted\n ORDER BY m.created_at DESC\n LIMIT $2\n```\n\nDrop `last_message_at`, `last_message_preview` and `unread_count` from the\nresponse model — the client now merges those from the Firestore match document\n(`src/hooks/useMatches.ts` here already does this).\n"}, {"p": "firebase/cloudsql/migrations/20261115090000_extensions.sql", "l": "sql", "n": 5, "c": "-- NearMatch: extensions\ncreate extension if not exists \"pgcrypto\";   -- gen_random_uuid()\ncreate extension if not exists \"postgis\";    -- geography(Point) + GiST distance\ncreate extension if not exists \"pg_trgm\";    -- fuzzy name lookup in admin tooling\n"}, {"p": "firebase/cloudsql/migrations/20261115090100_enums.sql", "l": "sql", "n": 26, "c": "-- NearMatch: enumerated domains\ndo $$ begin\n  create type gender_t as enum ('male', 'female', 'nonbinary', 'other');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type interested_in_t as enum ('male', 'female', 'nonbinary', 'everyone');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type swipe_action_t as enum ('like', 'pass', 'superlike');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type report_reason_t as enum\n    ('fake_profile', 'harassment', 'inappropriate_photos', 'spam', 'underage', 'other');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type report_status_t as enum ('open', 'reviewing', 'actioned', 'dismissed');\nexception when duplicate_object then null; end $$;\n\ndo $$ begin\n  create type platform_t as enum ('ios', 'android', 'web');\nexception when duplicate_object then null; end $$;\n"}, {"p": "firebase/cloudsql/migrations/20261115090200_profiles.sql", "l": "sql", "n": 48, "c": "-- NearMatch: profiles (Cloud SQL / Firebase variant)\ncreate table if not exists profiles (\n    -- Firebase Auth uid (28 chars), not a uuid. There is no auth.users table\n    -- on Cloud SQL, so identity is asserted by the API after verifying the\n    -- Firebase ID token.\n    id
