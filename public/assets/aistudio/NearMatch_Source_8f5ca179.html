  text primary key check (char_length(id) between 8 and 128),\n    display_name        text        not null check (char_length(display_name) between 2 and 40),\n    dob                 date        not null,\n    gender              gender_t    not null,\n    interested_in       interested_in_t[] not null default '{everyone}',\n    bio                 text        not null default '' check (char_length(bio) \u003c= 500),\n    job_title           text        check (char_length(job_title) \u003c= 60),\n    city                text        check (char_length(city) \u003c= 80),\n    interests           text[]      not null default '{}' check (array_length(interests, 1) is null\n                                                                 or array_length(interests, 1) \u003c= 12),\n    location            geography(Point, 4326),\n    location_updated_at timestamptz,\n    is_onboarded        boolean     not null default false,\n    is_visible          boolean     not null default true,\n    is_banned           boolean     not null default false,\n    is_deleted          boolean     not null default false,\n    last_active_at      timestamptz not null default now(),\n    created_at          timestamptz not null default now(),\n    updated_at          timestamptz not null default now(),\n\n    -- Hard floor enforced by the database, not only the API.\n    constraint profiles_adult check (dob \u003c= (current_date - interval '18 years'))\n);\n\n-- The index that makes \"near me\" fast.\ncreate index if not exists profiles_location_gix on profiles using gist (location);\ncreate index if not exists profiles_discoverable_ix\n    on profiles (is_onboarded, is_visible, is_banned, is_deleted)\n    where is_onboarded and is_visible and not is_banned and not is_deleted;\ncreate index if not exists profiles_dob_ix on profiles (dob);\ncreate index if not exists profiles_last_active_ix on profiles (last_active_at desc);\n\ncreate or replace function touch_updated_at() returns trigger\nlanguage plpgsql as $$\nbegin\n    new.updated_at := now();\n    return new;\nend $$;\n\ndrop trigger if exists profiles_touch on profiles;\ncreate trigger profiles_touch before update on profiles\n    for each row execute function touch_updated_at();\n"}, {"p": "firebase/cloudsql/migrations/20261115090300_photos.sql", "l": "sql", "n": 30, "c": "-- NearMatch: profile photos (bytes live in Storage; rows hold the path)\ncreate table if not exists profile_photos (\n    id           uuid primary key default gen_random_uuid(),\n    profile_id   text not null references profiles (id) on delete cascade,\n    storage_path text not null unique,\n    position     int  not null default 0,\n    is_primary   boolean not null default false,\n    created_at   timestamptz not null default now()\n);\n\ncreate index if not exists profile_photos_profile_ix on profile_photos (profile_id, position);\n\n-- At most one primary photo per profile.\ncreate unique index if not exists profile_photos_one_primary\n    on profile_photos (profile_id) where is_primary;\n\n-- Cap photos per profile at 6.\ncreate or replace function enforce_photo_cap() returns trigger\nlanguage plpgsql as $$\nbegin\n    if (select count(*) from profile_photos where profile_id = new.profile_id) >= 6 then\n        raise exception 'photo limit reached' using errcode = 'check_violation';\n    end if;\n    return new;\nend $$;\n\ndrop trigger if exists profile_photos_cap on profile_photos;\ncreate trigger profile_photos_cap before insert on profile_photos\n    for each row execute function enforce_photo_cap();\n"}, {"p": "firebase/cloudsql/migrations/20261115090400_preferences.sql", "l": "sql", "n": 30, "c": "-- NearMatch: discovery preferences\ncreate table if not exists preferences (\n    profile_id      text primary key references profiles (id) on delete cascade,\n    min_age         int  not null default 18 check (min_age >= 18 and min_age \u003c= 99),\n    max_age         int  not null default 45 check (max_age >= 18 and max_age \u003c= 99),\n    max_distance_km int  not null default 50 check (max_distance_km between 1 and 500),\n    show_me         interested_in_t[] not null default '{everyone}',\n    hide_profile    boolean not null default false,\n    created_at      timestamptz not null default now(),\n    updated_at      timestamptz not null default now(),\n    constraint preferences_age_order check (min_age \u003c= max_age)\n);\n\ndrop trigger if exists preferences_touch on preferences;\ncreate trigger preferences_touch before update on preferences\n    for each row execute function touch_updated_at();\n\n-- Give every new profile default preferences.\ncreate or replace function seed_preferences() returns trigger\nlanguage plpgsql as $$\nbegin\n    insert into preferences (profile_id) values (new.id)\n    on conflict (profile_id) do nothing;\n    return new;\nend $$;\n\ndrop trigger if exists profiles_seed_preferences on profiles;\ncreate trigger profiles_seed_preferences after insert on profiles\n    for each row execute function seed_preferences();\n"}, {"p": "firebase/cloudsql/migrations/20261115090500_swipes.sql", "l": "sql", "n": 16, "c": "-- NearMatch: swipes (one row per actor→target, ever)\ncreate table if not exists swipes (\n    id         uuid primary key default gen_random_uuid(),\n    actor_id   text not null references profiles (id) on delete cascade,\n    target_id  text not null references profiles (id) on delete cascade,\n    action     swipe_action_t not null,\n    created_at timestamptz not null default now(),\n    constraint swipes_no_self check (actor_id \u003c> target_id),\n    constraint swipes_once unique (actor_id, target_id)\n);\n\n-- Reciprocity lookup: \"has target already liked actor?\"\ncreate index if not exists swipes_reciprocity_ix\n    on swipes (target_id, actor_id) where action in ('like', 'superlike');\ncreate index if not exists swipes_actor_recent_ix on swipes (actor_id, created_at desc);\n"}, {"p": "firebase/cloudsql/migrations/20261115090600_matches.sql", "l": "sql", "n": 18, "c": "-- NearMatch: matches, stored once per pair with the lower uuid first\ncreate table if not exists matches (\n    id              uuid primary key default gen_random_uuid(),\n    user_low        text not null references profiles (id) on delete cascade,\n    user_high       text not null references profiles (id) on delete cascade,\n    is_active       boolean not null default true,\n    last_message_at timestamptz,\n    unmatched_by    text references profiles (id),\n    unmatched_at    timestamptz,\n    created_at      timestamptz not null default now(),\n    constraint matches_ordered check (user_low \u003c user_high),\n    constraint matches_unique_pair unique (user_low, user_high)\n);\n\ncreate index if not exists matches_user_low_ix  on matches (user_low)  where is_active;\ncreate index if not exists matches_user_high_ix on matches (user_high) where is_active;\ncreate index if not exists matches_recent_ix on matches (coalesce(last_message_at, created_at) desc);\n"}, {"p": "firebase/cloudsql/migrations/20261115090800_safety.sql", "l": "sql", "n": 38, "c": "-- NearMatch: blocks, reports, devices\ncreate table if not exists blocks (\n    id         uuid primary key default gen_random_uuid(),\n    blocker_id text not null references profiles (id) on delete cascade,\n    blocked_id text not null references profiles (id) on delete cascade,\n    created_at timestamptz not null default now(),\n    constraint blocks_no_self check (blocker_id \u003c> blocked_id),\n    constraint blocks_unique unique (blocker_id, blocked_id)\n);\n\ncreate index if not exists blocks_blocker_ix on blocks (blocker_id);\ncreate index if not exists blocks_blocked_ix on blocks (blocked_id);\n\ncreate table if not exists reports (\n    id          uuid primary key default gen_random_uuid(),\n    reporter_id text not null references profiles (id) on delete cascade,\n    reported_id text not null references profiles (id) on delete cascade,\n    reason      report_reason_t not null,\n    details     text check (char_length(details) \u003c= 1000),\n    status      report_status_t not null default 'open',\n    created_at  timestamptz not null default now(),\n    constraint reports_no_self check (reporter_id \u003c> reported_id)\n);\n\ncreate index if not exists reports_open_ix on reports (status, created_at desc);\ncreate index if not exists reports_reported_ix on reports (reported_id);\n\ncreate table if not exists devices (\n    id              uuid primary key default gen_random_uuid(),\n    profile_id      text not null references profiles (id) on delete cascade,\n    expo_push_token text not null unique,\n    platform        platform_t not null,\n    last_seen_at    timestamptz not null default now(),\n    created_at      timestamptz not null default now()\n);\n\ncreate index if not exists devices_profile_ix on devices (profile_id);\n"}, {"p": "firebase/cloudsql/migrations/20261115091000_match_trigger.sql", "l": "sql", "n": 61, "c": "-- NearMatch: create a match the instant a like becomes mutual.\n-- (Cloud SQL variant: uids are Firebase text ids.)\n--\n-- Doing this in the database means a match cannot be missed if two likes land\n-- concurrently, and the client gets it over realtime without waiting on the API.\n\ncreate or replace function create_match_on_reciprocal_like()\nreturns trigger\nlanguage plpgsql security definer set search_path = public as $$\ndeclare\n    v_low  text;\n    v_high text;\nbegin\n    if new.action not in ('like', 'superlike') then\n        return new;\n    end if;\n\n    -- Did the target already like the actor?\n    if not exists (\n        select 1 from swipes s\n         where s.actor_id = new.target_id\n           and s.target_id = new.actor_id\n           and s.action in ('like', 'superlike')\n    ) then\n        return new;\n    end if;\n\n    if new.actor_id \u003c new.target_id then\n        v_low := new.actor_id; v_high := new.target_id;\n    else\n        v_low := new.target_id; v_high := new.actor_id;\n    end if;\n\n    insert into matches (user_low, user_high)\n    values (v_low, v_high)\n    on conflict (user_low, user_high) do update\n        set is_active = true, unmatched_by = null, unmatched_at = null;\n\n    return new;\nend $$;\n\ndrop trigger if exists swipes_create_match on swipes;\ncreate trigger swipes_create_match after insert on swipes\n    for each row execute function create_match_on_reciprocal_like();\n\n-- Blocking closes the conversation immediately.\ncreate or replace function close_match_on_block()\nreturns trigger\nlanguage plpgsql security definer set search_path = public as $$\nbegin\n    update matches\n       set is_active = false, unmatched_by = new.blocker_id, unmatched_at = now()\n     where (user_low = least(new.blocker_id, new.blocked_id)\n            and user_high = greatest(new.blocker_id, new.blocked_id));\n    return new;\nend $$;\n\ndrop trigger if exists blocks_close_match on blocks;\ncreate trigger blocks_close_match after insert on blocks\n    for each row execute function close_match_on_block();\n"}, {"p": "firebase/cloudsql/migrations/20261115091400_firestore_notes.sql", "l": "sql", "n": 27, "c": "-- NearMatch (Firebase variant): what is deliberately absent.\n--\n-- 1. No `messages` table. Chat lives in Firestore, where the client can read\n--    it live. Firestore security rules replace what RLS did for chat —\n--    see firebase/firestore.rules and its 29 tests.\n--\n-- 2. No row level security. On Supabase the mobile client held a direct\n--    Postgres connection for realtime, so RLS was the security boundary. Here\n--    the client never touches Postgres: every read goes through the API, which\n--    verifies a Firebase ID token first. The boundary moved to two places —\n--    the API, and the Firestore rules.\n--\n--    If you ever expose Postgres directly again, port\n--    supabase/migrations/20261115090900_rls.sql back in. Do not assume the\n--    API alone is enough in that case.\n--\n-- 3. No storage schema or policies. Cloud Storage rules replace them —\n--    see firebase/storage.rules.\n--\n-- This file creates nothing. It exists so the difference is recorded next to\n-- the schema rather than only in a README.\n\ndo $$\nbegin\n    raise notice 'NearMatch Cloud SQL schema applied (chat and photos live in Firebase).';\nend $$;\n"}, {"p": "firebase/deploy/README.md", "l": "markdown", "n": 36, "c": "# Deploying\n\nOrder matters: the API needs the database and the bucket to exist, and the\nFunctions need Firestore.\n\n```bash\nexport PROJECT=nearmatch-REPLACE-ME\n./setup.sh                 # creates everything; review it first\n```\n\nThen follow the manual steps it prints.\n\n## Why `--min-instances=1`\n\nCloud Run cold starts are 2–5 seconds with a Postgres connection pool to\nestablish. The first swipe after an idle period would feel broken. One warm\ninstance is roughly $10–15/month and removes that entirely.\n\n## Why `--allow-unauthenticated`\n\nCloud Run's IAM check is not the auth boundary here — the API verifies a\nFirebase ID token on every route itself (`app/core/firebase_auth.py`). Putting\nIAM in front as well would mean the mobile app needed Google credentials on top\nof Firebase ones.\n\n## Region\n\nEverything is pinned to `asia-south1` (Mumbai), matching the primary market and\nthe `.in` domain. Firestore's location is **permanent once set** — changing it\nlater means a new project.\n\n## What this does not cover\n\nCI, staging, custom domain mapping, Cloud Armor, or budget alerts. Set a budget\nalert before you launch; Firestore and Cloud Run both bill per use.\n"}, {"p": "firebase/deploy/cloudbuild.yaml", "l": "yaml", "n": 54, "c": "# Build and deploy the NearMatch API to Cloud Run.\n#   gcloud builds submit --config firebase/deploy/cloudbuild.yaml\n#\n# Run from the repository root: the Dockerfile lives in backend/.\nsubstitutions:\n  _REGION: asia-south1\n  _SERVICE: nearmatch-api\n  _INSTANCE: nearmatch-db\n\nsteps:\n  - id: build\n    name: gcr.io/cloud-builders/docker\n    args:\n      - build\n      - -t\n      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nearmatch/${_SERVICE}:$SHORT_SHA\n      - -t\n      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nearmatch/${_SERVICE}:latest\n      - -f\n      - backend/Dockerfile\n      - backend\n\n  - id: push\n    name: gcr.io/cloud-builders/docker\n    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/nearmatch/${_SERVICE}']\n\n  - id: deploy\n    name: gcr.io/google.cloud-sdk/cloud-sdk\n    entrypoint: gcloud\n    args:\n      - run\n      - deploy\n      - ${_SERVICE}\n      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/nearmatch/${_SERVICE}:$SHORT_SHA\n      - --region=${_REGION}\n      - --platform=managed\n      - --allow-unauthenticated          # the API does its own Firebase token check\n      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_INSTANCE}\n      - --service-account=nearmatch-api@$PROJECT_ID.iam.gserviceaccount.com\n      - --set-env-vars=FIREBASE_PROJECT_ID=$PROJECT_ID,ENVIRONMENT=production\n      - --set-secrets=DATABASE_URL=nearmatch-db-url:latest\n      - --min-instances=1                # avoids a cold start on the first swipe\n      - --max-instances=10\n      - --cpu=1\n      - --memory=512Mi\n      - --concurrency=80\n      - --timeout=30s\n\nimages:\n  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/nearmatch/${_SERVICE}\n\noptions:\n  logging: CLOUD_LOGGING_ONLY\n"}, {"p": "firebase/deploy/setup.sh", "l": "bash", "n": 83, "c": "#!/usr/bin/env bash\n#\n# One-time Google Cloud setup for NearMatch.\n# Review each command before running — this creates billable resources.\nset -euo pipefail\n\nPROJECT=\"${PROJECT:?set PROJECT=your-gcp-project-id}\"\nREGION=\"${REGION:-asia-south1}\"          # Mumbai\nINSTANCE=\"${INSTANCE:-nearmatch-db}\"\nBUCKET=\"${BUCKET:-${PROJECT}-photos}\"\nSA=\"nearmatch-api@${PROJECT}.iam.gserviceaccount.com\"\n\ngcloud config set project \"$PROJECT\"\n\necho \"==> enabling APIs\"\ngcloud services enable \\\n  run.googleapis.com \\\n  sqladmin.googleapis.com \\\n  firestore.googleapis.com \\\n  storage.googleapis.com \\\n  cloudbuild.googleapis.com \\\n  artifactregistry.googleapis.com \\\n  secretmanager.googleapis.com \\\n  cloudfunctions.googleapis.com \\\n  fcm.googleapis.com \\\n  identitytoolkit.googleapis.com\n\necho \"==> artifact registry\"\ngcloud artifacts repositories create nearmatch \\\n  --repository-format=docker --location=\"$REGION\" || true\n\necho \"==> firestore (native mode)\"\ngcloud firestore databases create --location=\"$REGION\" || true\n\necho \"==> cloud sql (postgres 16)\"\ngcloud sql instances create \"$INSTANCE\" \\\n  --database-version=POSTGRES_16 \\\n  --tier=db-custom-2-7680 \\\n  --region=\"$REGION\" \\\n  --storage-type=SSD --storage-size=20GB || true\ngcloud sql databases create nearmatch --instance=\"$INSTANCE\" || true\n\necho \"==> photo bucket (private, uniform access)\"\ngcloud storage buckets create \"gs://${BUCKET}\" \\\n  --location=\"$REGION\" \\\n  --uniform-bucket-level-access || true\n\necho \"==> service account for the API\"\ngcloud iam service-accounts create nearmatch-api \\\n  --display-name=\"NearMatch API\" || true\n\nfor role in \\\n  roles/cloudsql.client \\\n  roles/datastore.user \\\n  roles/storage.objectAdmin \\\n  roles/firebase.sdkAdminServiceAgent \\\n  roles/iam.serviceAccountTokenCreator      # needed to sign Storage URLs\ndo\n  gcloud projects add-iam-policy-binding \"$PROJECT\" \\\n    --member=\"serviceAccount:${SA}\" --role=\"$role\" >/dev/null\ndone\n\ncat \u003c\u003cEOF\n\nDone. Remaining manual steps:\n\n  1. Store the database URL as a secret:\n       echo -n 'postgresql://nearmatch:PASSWORD@/nearmatch?host=/cloudsql/${PROJECT}:${REGION}:${INSTANCE}' \\\\\n         | gcloud secrets create nearmatch-db-url --data-file=-\n\n  2. Enable PostGIS, then apply ../cloudsql/migrations (see that README).\n\n  3. Enable sign-in providers in the Firebase console:\n       Authentication -> Sign-in method -> Phone, Apple\n\n  4. Deploy rules and functions:\n       firebase deploy --only firestore:rules,firestore:indexes,storage,functions\n\n  5. Deploy the API:\n       gcloud builds submit --config firebase/deploy/cloudbuild.yaml\n\nEOF\n"}, {"p": "firebase/firebase.json", "l": "json", "n": 26, "c": "{\n  \"firestore\": {\n    \"rules\": \"firestore.rules\",\n    \"indexes\": \"firestore.indexes.json\"\n  },\n  \"storage\": {\n    \"rules\": \"storage.rules\"\n  },\n  \"functions\": [\n    {\n      \"source\": \"functions\",\n      \"codebase\": \"default\",\n      \"runtime\": \"nodejs22\",\n      \"ignore\": [\"node_modules\", \".git\", \"**/*.local\"]\n    }\n  ],\n  \"emulators\": {\n    \"auth\": { \"port\": 9099 },\n    \"firestore\": { \"port\": 8080 },\n    \"storage\": { \"port\": 9199 },\n    \"functions\": { \"port\": 5001 },\n    \"ui\": { \"enabled\": true, \"port\": 4000 },\n    \"singleProjectMode\": true\n  }\n}\n"}, {"p": "firebase/firestore.indexes.json", "l": "json", "n": 33, "c": "{\n  \"indexes\": [\n    {\n      \"comment\": \"Chat list: a user's active matches, most recent first.\",\n      \"collectionGroup\": \"matches\",\n      \"queryScope\": \"COLLECTION\",\n      \"fields\": [\n        { \"fieldPath\": \"participants\", \"arrayConfig\": \"CONTAINS\" },\n        { \"fieldPath\": \"isActive\", \"order\": \"ASCENDING\" },\n        { \"fieldPath\": \"lastMessageAt\", \"order\": \"DESCENDING\" }\n      ]\n    },\n    {\n      \"comment\": \"Transcript paging: oldest-to-newest within one match.\",\n      \"collectionGroup\": \"messages\",\n      \"queryScope\": \"COLLECTION\",\n      \"fields\": [\n        { \"fieldPath\": \"sentAt\", \"order\": \"DESCENDING\" }\n      ]\n    },\n    {\n      \"comment\": \"Unread sweep: a recipient's unread messages in one match.\",\n      \"collectionGroup\": \"messages\",\n      \"queryScope\": \"COLLECTION\",\n      \"fields\": [\n        { \"fieldPath\": \"senderId\", \"order\": \"ASCENDING\" },\n        { \"fieldPath\": \"readAt\", \"order\": \"ASCENDING\" }\n      ]\n    }\n  ],\n  \"fieldOverrides\": []\n}\n"}, {"p": "firebase/firestore.rules", "l": "javascript", "n": 96, "c": "rules_version = '2';\n\n// NearMatch — Firestore security rules.\n//\n// Firestore owns CHAT ONLY. Profiles, swipes and match *creation* stay in\n// Postgres behind the API, because the discovery query needs PostGIS and\n// joins that Firestore cannot express.\n//\n// A match document here is a mirror written by the backend (service account,\n// which bypasses these rules). Clients may read their own matches and write\n// messages into them — nothing else.\n//\n// Threat model: a signed-in user is assumed hostile. They may call Firestore\n// directly with any document path and payload.\n\nservice cloud.firestore {\n  match /databases/{database}/documents {\n\n    // ---------- helpers ----------\n    function isSignedIn() {\n      return request.auth != null;\n    }\n\n    function uid() {\n      return request.auth.uid;\n    }\n\n    function matchDoc(matchId) {\n      return get(/databases/$(database)/documents/matches/$(matchId)).data;\n    }\n\n    function isParticipant(matchId) {\n      return isSignedIn() && uid() in matchDoc(matchId).participants;\n    }\n\n    function isActiveMatch(matchId) {\n      return matchDoc(matchId).isActive == true;\n    }\n\n    // ---------- matches ----------\n    // Read-only for participants. All writes come from the backend service\n    // account or Cloud Functions, both of which bypass rules.\n    match /matches/{matchId} {\n      allow get, list: if isSignedIn() && uid() in resource.data.participants;\n      allow create, update, delete: if false;\n\n      // ---------- messages ----------\n      match /messages/{messageId} {\n\n        allow get, list: if isParticipant(matchId);\n\n        // A message may only be created by a participant, attributed to\n        // themselves, into a match that is still open.\n        allow create: if isParticipant(matchId)\n                      && isActiveMatch(matchId)\n                      && request.resource.data.senderId == uid()\n                      && request.resource.data.body is string\n                      && request.resource.data.body.size() > 0\n                      && request.resource.data.body.size() \u003c= 2000\n                      && request.resource.data.sentAt == request.time\n                      && request.resource.data.readAt == null\n                      && request.resource.data.keys().hasOnly(\n                           ['senderId', 'body', 'sentAt', 'readAt', 'clientId']);\n\n        // The ONLY permitted update is the recipient marking a message read.\n        // Nobody — sender included — may rewrite a sent message.\n        allow update: if isParticipant(matchId)\n                      && resource.data.senderId != uid()\n                      && request.resource.data.diff(resource.data)\n                           .affectedKeys().hasOnly(['readAt'])\n                      && request.resource.data.readAt == request.time;\n\n        // Messages are never deleted by a client. Unmatching deactivates the\n        // match; it does not erase the other person's history.\n        allow delete: if false;\n      }\n    }\n\n    // ---------- device tokens ----------\n    // Written by the client so FCM can reach this device. A user may only\n    // touch their own token documents.\n    match /devices/{deviceId} {\n      allow read, write: if isSignedIn()\n                         && request.resource.data.uid == uid()\n                         || (resource != null && resource.data.uid == uid());\n    }\n\n    // ---------- everything else ----------\n    // Profiles, swipes, blocks and reports live in Postgres. If a collection\n    // is not named above, no client may touch it.\n    match /{document=**} {\n      allow read, write: if false;\n    }\n  }\n}\n"}, {"p": "firebase/frontend/.env.example", "l": "bash", "n": 11, "c": "# Cloud Run URL of the FastAPI service. No trailing slash.\nEXPO_PUBLIC_BACKEND_URL=https://nearmatch-api-XXXXX.a.run.app\n\n# Firebase web config (Project settings → General → Your apps → Web)\nEXPO_PUBLIC_FIREBASE_API_KEY=AIza...\nEXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=nearmatch-REPLACE-ME.firebaseapp.com\nEXPO_PUBLIC_FIREBASE_PROJECT_ID=nearmatch-REPLACE-ME\nEXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=nearmatch-REPLACE-ME.appspot.com\nEXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000\nEXPO_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:abcdef\n"}, {"p": "firebase/frontend/README.md", "l": "markdown", "n": 94, "c": "# Frontend changes for Firebase\n\nFive files change. Everything else — all 20 routes, every component, the theme,\nthe API client — is untouched.\n\n| Replace | With |\n|---|---|\n| `src/lib/supabase.ts` | `src/lib/firebase.ts` |\n| `src/context/AuthProvider.tsx` | the version here |\n| `src/hooks/useChat.ts` | the version here (Firestore) |\n| `src/hooks/useMatches.ts` | the version here (API + Firestore merge) |\n| `src/hooks/usePushRegistration.ts` | the version here (FCM) |\n| `app/(auth)/sign-in.tsx`, `verify.tsx` | the versions here (phone + Apple) |\n\n`src/lib/api.ts` needs one import changed:\n\n```ts\nimport { getAccessToken } from './firebase';   // was: './supabase'\n```\n\n`src/lib/secureStore.ts` is reused as-is — Firebase Auth persists through it.\n\n## Two things to decide before you start\n\n**1. Expo Go or a development build?**\n\nThe code here uses the Firebase **JS SDK**, so it still runs in Expo Go. The\ncost is background push: FCM background delivery needs the native SDK.\n\n- *Staying in Expo Go:* add `expo-firebase-recaptcha` and render\n  `\u003cFirebaseRecaptchaVerifierModal>` in `sign-in.tsx` (there is a comment\n  marking the spot). Push works only in the foreground.\n- *Moving to a development build:* install `@react-native-firebase/*`, delete\n  the reCAPTCHA ref, and run `eas build --profile development`. Phone auth then\n  works natively and background push works properly.\n\nI would move to a development build before launch. You need one for FCM anyway.\n\n**2. `useMatches` now takes your uid.**\n\n```tsx\nconst { matches, newMatches, conversations } = useMatches(profile?.id);\n```\n\nTwo call sites: `app/(tabs)/matches.tsx` and `app/chat/[matchId].tsx`.\n\n`chat/[matchId].tsx` already calls `useAuth()`, so only the argument changes.\n`matches.tsx` does **not** — it needs the hook added, or it will not compile:\n\n```tsx\nimport { useAuth } from '@/context/AuthProvider';\nimport { useMatches } from '@/hooks/useMatches';\n\nexport default function Matches() {\n  const { profile } = useAuth();\n  const { newMatches, conversations, loading, error, reload } = useMatches(profile?.id);\n  // ...\n```\n\n(I hit exactly this when typechecking the overlay, so it is not hypothetical.)\n\n## app.json additions\n\n```jsonc\n{\n  \"expo\": {\n    \"ios\": {\n      \"googleServicesFile\": \"./GoogleService-Info.plist\",\n      \"bundleIdentifier\": \"com.kumravi253.nearmatch\"\n    },\n    \"android\": {\n      \"googleServicesFile\": \"./google-services.json\",\n      \"package\": \"com.kumravi253.nearmatch\"\n    },\n    \"plugins\": [\n      // keep everything already there, then add for a development build:\n      \"@react-native-firebase/app\",\n      \"@react-native-firebase/auth\",\n      [\"expo-build-properties\", { \"ios\": { \"useFrameworks\": \"static\" } }]\n    ]\n  }\n}\n```\n\nDownload `GoogleService-Info.plist` and `google-services.json` from the Firebase\nconsole (Project settings → Your apps) and put them at the `frontend/` root.\n**Both belong in `.gitignore`.**\n\n## What stays identical\n\nThe discovery deck, swiping, profile, onboarding, settings and every UI\ncomponent talk to the FastAPI API exactly as before. Only auth, chat transport\nand push change.\n"}, {"p": "firebase/frontend/app/(auth)/sign-in.tsx", "l": "typescript", "n": 173, "c": "/**\n * Sign-in on Firebase Auth.\n *\n * Three routes, in the order that suits the Indian market:\n *   1. Phone OTP  — the default; most users have a number, not an inbox habit\n *   2. Apple      — required by App Store rules once another social login exists\n *   3. Email link — fallback\n *\n * Phone auth needs a reCAPTCHA verifier on web and APNs/SafetyNet on native.\n * With the JS SDK in Expo Go you must use expo-firebase-recaptcha; with a\n * development build and @react-native-firebase it is handled natively.\n */\nimport * as AppleAuthentication from 'expo-apple-authentication';\nimport { useRouter } from 'expo-router';\nimport {\n  OAuthProvider,\n  signInWithCredential,\n  signInWithPhoneNumber,\n  type ConfirmationResult,\n} from 'firebase/auth';\nimport { useEffect, useRef, useState } from 'react';\nimport { Platform, StyleSheet, Text, TextInput, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { auth } from '@/lib/firebase';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\n// Holds the confirmation between this screen and the verify screen.\nexport const phoneConfirmation: { current: ConfirmationResult | null } = { current: null };\n\nexport default function SignIn() {\n  const router = useRouter();\n  const [phone, setPhone] = useState('+91');\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n  const [appleAvailable, setAppleAvailable] = useState(false);\n  const recaptchaRef = useRef\u003cany>(null);\n\n  useEffect(() => {\n    if (Platform.OS !== 'ios') return;\n    void AppleAuthentication.isAvailableAsync().then(setAppleAvailable);\n  }, []);\n\n  const signInWithApple = async () => {\n    setError(null);\n    setBusy(true);\n    try {\n      const credential = await AppleAuthentication.signInAsync({\n        requestedScopes: [\n          AppleAuthentication.AppleAuthenticationScope.FULL_NAME,\n          AppleAuthentication.AppleAuthenticationScope.EMAIL,\n        ],\n      });\n      if (!credential.identityToken) throw new Error('Apple did not return a token.');\n\n      const provider = new OAuthProvider('apple.com');\n      const firebaseCredential = provider.credential({\n        idToken: credential.identityToken,\n      });\n      await signInWithCredential(auth, firebaseCredential);\n      // AuthProvider's onAuthStateChanged handles navigation.\n    } catch (err) {\n      const message = err instanceof Error ? err.message : 'Sign in failed.';\n      if (!/canceled|cancelled|1001/i.test(message)) setError(message);\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  const sendCode = async () => {\n    const number = phone.replace(/\\s+/g, '');\n    if (!/^\\+\\d{8,15}$/.test(number)) {\n      setError('Enter your number with the country code, like +919876543210.');\n      return;\n    }\n    setError(null);\n    setBusy(true);\n    try {\n      phoneConfirmation.current = await signInWithPhoneNumber(\n        auth,\n        number,\n        recaptchaRef.current,\n      );\n      router.push({ pathname: '/(auth)/verify', params: { phone: number } });\n    } catch (err) {\n      setError(err instanceof Error ? err.message : 'Could not send the code.');\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  return (\n    \u003cScreen>\n      {/*\n        In Expo Go, render \u003cFirebaseRecaptchaVerifierModal ref={recaptchaRef}\n        firebaseConfig={...} /> here. With a development build and\n        @react-native-firebase, delete the ref entirely.\n      */}\n      \u003cView style={styles.hero}>\n        \u003cText style={styles.wordmark}>NearMatch\u003c/Text>\n        \u003cText style={styles.tagline}>Meet people who are actually nearby.\u003c/Text>\n      \u003c/View>\n\n      {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n\n      \u003cView style={styles.form}>\n        {appleAvailable ? (\n          \u003c>\n            \u003cAppleAuthentication.AppleAuthenticationButton\n              buttonType={AppleAuthentication.AppleAuthenticationButtonType.SIGN_IN}\n              buttonStyle={AppleAuthentication.AppleAuthenticationButtonStyle.BLACK}\n              cornerRadius={999}\n              style={styles.appleButton}\n              onPress={signInWithApple}\n            />\n            \u003cView style={styles.dividerRow}>\n              \u003cView style={styles.rule} />\n              \u003cText style={styles.dividerText}>or\u003c/Text>\n              \u003cView style={styles.rule} />\n            \u003c/View>\n          \u003c/>\n        ) : null}\n\n        \u003cTextInput\n          value={phone}\n          onChangeText={setPhone}\n          placeholder=\"+91 98765 43210\"\n          placeholderTextColor={colors.textSubtle}\n          keyboardType=\"phone-pad\"\n          inputMode=\"tel\"\n          autoComplete=\"tel\"\n          style={styles.input}\n          accessibilityLabel=\"Phone number with country code\"\n        />\n        \u003cButton\n          label=\"Continue with phone\"\n          onPress={sendCode}\n          loading={busy}\n          accessibilityHint=\"Sends a six digit code by SMS\"\n        />\n\n        \u003cText style={styles.legal}>\n          By continuing you agree to the NearMatch Terms and confirm you are at least 18.\n        \u003c/Text>\n      \u003c/View>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  hero: { flex: 1, justifyContent: 'flex-end', paddingBottom: spacing.xl, gap: spacing.sm },\n  wordmark: { ...typography.display, color: colors.primary },\n  tagline: { ...typography.body, color: colors.textMuted },\n  form: { paddingBottom: spacing.xl, gap: spacing.md },\n  appleButton: { height: 50, alignSelf: 'stretch' },\n  dividerRow: { flexDirection: 'row', alignItems: 'center', gap: spacing.md },\n  rule: { flex: 1, height: 1, backgroundColor: colors.border },\n  dividerText: { ...typography.caption, color: colors.textSubtle },\n  input: {\n    minHeight: 50,\n    paddingHorizontal: spacing.base,\n    borderRadius: radius.pill,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    ...typography.body,\n    color: colors.text,\n  },\n  legal: { ...typography.caption, color: colors.textSubtle, textAlign: 'center' },\n});\n"}, {"p": "firebase/frontend/app/(auth)/verify.tsx", "l": "typescript", "n": 93, "c": "/** SMS code confirmation for Firebase phone auth. */\nimport { useLocalSearchParams, useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { StyleSheet, Text, TextInput, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\nimport { phoneConfirmation } from './sign-in';\n\nexport default function Verify() {\n  const { phone } = useLocalSearchParams\u003c{ phone?: string }>();\n  const router = useRouter();\n  const [code, setCode] = useState('');\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  const verify = async () => {\n    if (code.trim().length !== 6) {\n      setError('Enter the 6-digit code.');\n      return;\n    }\n    if (!phoneConfirmation.current) {\n      setError('That code has expired. Start again.');\n      return;\n    }\n    setBusy(true);\n    setError(null);\n    try {\n      await phoneConfirmation.current.confirm(code.trim());\n      // AuthProvider picks up the new session and routes onward.\n    } catch (err) {\n      const code_ = (err as { code?: string }).code;\n      setError(\n        code_ === 'auth/invalid-verification-code'\n          ? 'That code did not work. Check it and try again.'\n          : 'Could not verify that code.',\n      );\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  return (\n    \u003cScreen>\n      \u003cView style={styles.body}>\n        \u003cText style={styles.title}>Check your messages\u003c/Text>\n        \u003cText style={styles.sub}>\n          We sent a 6-digit code to {phone ?? 'your phone'}.\n        \u003c/Text>\n\n        {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n\n        \u003cTextInput\n          value={code}\n          onChangeText={(text) => setCode(text.replace(/\\D/g, '').slice(0, 6))}\n          placeholder=\"123456\"\n          placeholderTextColor={colors.textSubtle}\n          keyboardType=\"number-pad\"\n          inputMode=\"numeric\"\n          autoComplete=\"sms-otp\"\n          textContentType=\"oneTimeCode\"\n          maxLength={6}\n          style={styles.codeInput}\n          accessibilityLabel=\"Six digit verification code\"\n        />\n\n        \u003cButton label=\"Verify and continue\" onPress={verify} loading={busy} />\n        \u003cButton label=\"Use a different number\" onPress={() => router.back()} variant=\"ghost\" />\n      \u003c/View>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  body: { flex: 1, justifyContent: 'center', gap: spacing.base },\n  title: { ...typography.title, color: colors.text },\n  sub: { ...typography.body, color: colors.textMuted },\n  codeInput: {\n    minHeight: 58,\n    borderRadius: radius.lg,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    ...typography.title,\n    textAlign: 'center',\n    letterSpacing: 10,\n    color: colors.text,\n  },\n});\n"}, {"p": "firebase/frontend/package.json.additions.json", "l": "json", "n": 19, "c": "{\n  \"_comment\": \"Merge into frontend/package.json. Remove @supabase/supabase-js.\",\n  \"dependencies\": {\n    \"firebase\": \"^11.1.0\"\n  },\n  \"_if_using_expo_go_also\": {\n    \"expo-firebase-recaptcha\": \"^2.3.1\",\n    \"_note\": \"Needed for phone auth in Expo Go. Not needed in a development build.\"\n  },\n  \"_if_moving_to_a_development_build_instead\": {\n    \"@react-native-firebase/app\": \"^21.6.1\",\n    \"@react-native-firebase/auth\": \"^21.6.1\",\n    \"@react-native-firebase/firestore\": \"^21.6.1\",\n    \"@react-native-firebase/messaging\": \"^21.6.1\",\n    \"_note\": \"Native SDKs. Required for background FCM. Cannot run in Expo Go.\"\n  },\n  \"remove\": [\"@supabase/supabase-js\"]\n}\n"}, {"p": "firebase/frontend/src/context/AuthProvider.tsx", "l": "typescript", "n": 98, "c": "/**\n * Session + profile gate, on Firebase Auth.\n *\n * Same three-state contract as the Supabase version, so every screen and both\n * route guards work unchanged: 'signed-out' | 'needs-onboarding' | 'ready'.\n */\nimport { createContext, useCallback, useContext, useEffect, useMemo, useState } from 'react';\nimport { onAuthStateChanged, signOut as fbSignOut, type User } from 'firebase/auth';\n\nimport { ApiError, api } from '@/lib/api';\nimport { auth } from '@/lib/firebase';\nimport type { MyProfile } from '@/types/models';\n\nexport type AuthStage = 'loading' | 'signed-out' | 'needs-onboarding' | 'ready';\n\ninterface AuthValue {\n  stage: AuthStage;\n  user: User | null;\n  profile: MyProfile | null;\n  refreshProfile: () => Promise\u003cvoid>;\n  signOut: () => Promise\u003cvoid>;\n}\n\nconst AuthContext = createContext\u003cAuthValue | null>(null);\n\nexport function AuthProvider({ children }: { children: React.ReactNode }) {\n  const [user, setUser] = useState\u003cUser | null>(null);\n  const [profile, setProfile] = useState\u003cMyProfile | null>(null);\n  const [authResolved, setAuthResolved] = useState(false);\n  const [profileResolved, setProfileResolved] = useState(false);\n\n  useEffect(() => {\n    const unsubscribe = onAuthStateChanged(auth, (next) => {\n      setUser(next);\n      setAuthResolved(true);\n      if (!next) {\n        setProfile(null);\n        setProfileResolved(true);\n      } else {\n        setProfileResolved(false);\n      }\n    });\n    return unsubscribe;\n  }, []);\n\n  const loadProfile = useCallback(async () => {\n    if (!auth.currentUser) {\n      setProfile(null);\n      setProfileResolved(true);\n      return;\n    }\n    try {\n      setProfile(await api.getMyProfile());\n    } catch (error) {\n      // 404 is the expected answer before onboarding finishes.\n      if (error instanceof ApiError && error.status === 404) {\n        setProfile(null);\n      } else if (error instanceof ApiError && error.isAuthError) {\n        await fbSignOut(auth);\n      } else {\n        setProfile(null);\n      }\n    } finally {\n      setProfileResolved(true);\n    }\n  }, []);\n\n  useEffect(() => {\n    // eslint-disable-next-line react-hooks/set-state-in-effect\n    if (user && !profileResolved) void loadProfile();\n  }, [user, profileResolved, loadProfile]);\n\n  const signOut = useCallback(async () => {\n    await fbSignOut(auth);\n    setProfile(null);\n  }, []);\n\n  const stage: AuthStage = useMemo(() => {\n    if (!authResolved || (user && !profileResolved)) return 'loading';\n    if (!user) return 'signed-out';\n    if (!profile?.is_onboarded) return 'needs-onboarding';\n    return 'ready';\n  }, [authResolved, profileResolved, user, profile]);\n\n  const value = useMemo(\n    () => ({ stage, user, profile, refreshProfile: loadProfile, signOut }),\n    [stage, user, profile, loadProfile, signOut],\n  );\n\n  return \u003cAuthContext.Provider value={value}>{children}\u003c/AuthContext.Provider>;\n}\n\nexport function useAuth(): AuthValue {\n  const context = useContext(AuthContext);\n  if (!context) throw new Error('useAuth must be used inside AuthProvider');\n  return context;\n}\n"}, {"p": "firebase/frontend/src/hooks/useChat.ts", "l": "typescript", "n": 143, "c": "/**\n * One conversation, on Firestore.\n *\n * Messages are written straight to Firestore (the rules enforce who may write\n * what), so there is no optimistic-then-confirm round-trip through the API —\n * Firestore's local cache echoes the write immediately and reconciles it with\n * the server copy itself. `hasPendingWrites` tells us which is which.\n */\nimport { useCallback, useEffect, useMemo, useState } from 'react';\nimport {\n  addDoc,\n  collection,\n  doc,\n  limit as fsLimit,\n  onSnapshot,\n  orderBy,\n  query,\n  serverTimestamp,\n  updateDoc,\n  type Timestamp,\n} from 'firebase/firestore';\n\nimport { auth, db } from '@/lib/firebase';\nimport type { Message } from '@/types/models';\n\nconst PAGE = 50;\n\ntype ChatMessage = Message & { pending?: true };\n\ninterface Row {\n  senderId: string;\n  body: string;\n  sentAt: Timestamp | null;\n  readAt: Timestamp | null;\n  clientId?: string | null;\n}\n\nexport function useChat(matchId: string, myId: string | undefined) {\n  const [messages, setMessages] = useState\u003cChatMessage[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [sending, setSending] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  const messagesRef = useMemo(\n    () => collection(db, 'matches', matchId, 'messages'),\n    [matchId],\n  );\n\n  useEffect(() => {\n    const q = query(messagesRef, orderBy('sentAt', 'desc'), fsLimit(PAGE));\n\n    const unsubscribe = onSnapshot(\n      q,\n      { includeMetadataChanges: true },\n      (snapshot) => {\n        const rows: ChatMessage[] = snapshot.docs\n          .map((d) => {\n            const row = d.data() as Row;\n            const pending = d.metadata.hasPendingWrites;\n            return {\n              id: d.id,\n              match_id: matchId,\n              sender_id: row.senderId,\n              body: row.body,\n              // A pending write has no server timestamp yet.\n              sent_at: (row.sentAt?.toDate() ?? new Date()).toISOString(),\n              read_at: row.readAt ? row.readAt.toDate().toISOString() : null,\n              client_id: row.clientId ?? null,\n              is_mine: row.senderId === myId,\n              ...(pending ? { pending: true as const } : {}),\n            };\n          })\n          .reverse();\n\n        setMessages(rows);\n        setLoading(false);\n        setError(null);\n\n        // Mark anything from the other person as read.\n        snapshot.docs\n          .filter((d) => {\n            const row = d.data() as Row;\n            return row.senderId !== myId && row.readAt === null && !d.metadata.hasPendingWrites;\n          })\n          .forEach((d) => {\n            void updateDoc(doc(messagesRef, d.id), { readAt: serverTimestamp() }).catch(\n              () => undefined,\n            );\n          });\n      },\n      (err) => {\n        setLoading(false);\n        setError(\n          err.code === 'permission-denied'\n            ? 'This conversation is closed.'\n            : 'Could not load this conversation.',\n        );\n      },\n    );\n\n    return unsubscribe;\n  }, [messagesRef, matchId, myId]);\n\n  const send = useCallback(\n    async (body: string) => {\n      const trimmed = body.trim();\n      if (!trimmed || !auth.currentUser) return;\n\n      setSending(true);\n      try {\n        await addDoc(messagesRef, {\n          senderId: auth.currentUser.uid,\n          body: trimmed,\n          sentAt: serverTimestamp(),\n          readAt: null,\n          clientId: `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`,\n        });\n        setError(null);\n      } catch (err) {\n        const code = (err as { code?: string }).code;\n        setError(\n          code === 'permission-denied'\n            ? 'This conversation is closed.'\n            : 'Message not sent.',\n        );\n      } finally {\n        setSending(false);\n      }\n    },\n    [messagesRef],\n  );\n\n  // Firestore retries pending writes itself, so an explicit retry is a resend.\n  const retry = useCallback(\n    async (_clientId: string) => {\n      setError(null);\n    },\n    [],\n  );\n\n  return { messages, loading, sending, error, send, retry, reload: async () => undefined };\n}\n"}, {"p": "firebase/frontend/src/hooks/useMatches.ts", "l": "typescript", "n": 105, "c": "/**\n * Chat list: profile data from the API, chat metadata from Firestore.\n *\n * Postgres owns who matched with whom; Firestore holds the denormalised\n * last-message and unread counters that Cloud Functions keep current. Merging\n * them here keeps the list to one API call plus one live subscription.\n */\nimport { useCallback, useEffect, useState } from 'react';\nimport { collection, onSnapshot, query, where, type Timestamp } from 'firebase/firestore';\n\nimport { ApiError, api } from '@/lib/api';\nimport { db } from '@/lib/firebase';\nimport type { MatchSummary } from '@/types/models';\n\ninterface MatchDoc {\n  participants: string[];\n  isActive: boolean;\n  lastMessageAt: Timestamp | null;\n  lastMessage: { body: string; senderId: string } | null;\n  unread?: Record\u003cstring, number>;\n}\n\nexport function useMatches(myId?: string) {\n  const [matches, setMatches] = useState\u003cMatchSummary[]>([]);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState\u003cstring | null>(null);\n  const [chatMeta, setChatMeta] = useState\u003cRecord\u003cstring, MatchDoc>>({});\n\n  const load = useCallback(async () => {\n    try {\n      setMatches(await api.getMatches());\n      setError(null);\n    } catch (err) {\n      setError(err instanceof ApiError ? err.message : 'Could not load your matches.');\n    } finally {\n      setLoading(false);\n    }\n  }, []);\n\n  useEffect(() => {\n    // eslint-disable-next-line react-hooks/set-state-in-effect\n    void load();\n  }, [load]);\n\n  useEffect(() => {\n    if (!myId) return;\n\n    const q = query(\n      collection(db, 'matches'),\n      where('participants', 'array-contains', myId),\n      where('isActive', '==', true),\n    );\n\n    const unsubscribe = onSnapshot(\n      q,\n      (snapshot) => {\n        const next: Record\u003cstring, MatchDoc> = {};\n        snapshot.docs.forEach((d) => {\n          next[d.id] = d.data() as MatchDoc;\n        });\n        setChatMeta(next);\n        // A new match document means the API list is stale.\n        if (snapshot.docChanges().some((c) => c.type === 'added')) void load();\n      },\n      () => setError('Live updates are unavailable.'),\n    );\n\n    return unsubscribe;\n  }, [myId, load]);\n\n  const merged: MatchSummary[] = matches.map((m) => {\n    const meta = chatMeta[m.id];\n    if (!meta) return m;\n    return {\n      ...m,\n      last_message_at: meta.lastMessageAt ? meta.lastMessageAt.toDate().toISOString() : null,\n      last_message_preview: meta.lastMessage?.body ?? null,\n      unread_count: (myId && meta.unread?.[myId]) || 0,\n      is_new: meta.lastMessage === null,\n    };\n  });\n\n  const unmatch = useCallback(\n    async (matchId: string) => {\n      setMatches((prev) => prev.filter((m) => m.id !== matchId));\n      try {\n        await api.unmatch(matchId);\n      } catch {\n        await load();\n      }\n    },\n    [load],\n  );\n\n  return {\n    matches: merged,\n    newMatches: merged.filter((m) => m.is_new),\n    conversations: merged.filter((m) => !m.is_new),\n    loading,\n    error,\n    reload: load,\n    unmatch,\n  };\n}\n"}, {"p": "firebase/frontend/src/hooks/usePushRegistration.ts", "l": "typescript", "n": 59, "c": "/**\n * Register this device for FCM and store the token in Firestore,\n * where the Cloud Functions look for it.\n *\n * Replaces the Expo-push version. Best effort: a user who declines\n * notifications still gets a fully working app.\n */\nimport { useEffect } from 'react';\nimport { Platform } from 'react-native';\nimport * as Notifications from 'expo-notifications';\nimport { doc, setDoc } from 'firebase/firestore';\n\nimport { auth, db } from '@/lib/firebase';\n\nexport function usePushRegistration(enabled: boolean) {\n  useEffect(() => {\n    if (!enabled || Platform.OS === 'web') return;\n\n    let cancelled = false;\n    let docId: string | null = null;\n\n    (async () => {\n      try {\n        const existing = await Notifications.getPermissionsAsync();\n        let status = existing.status;\n        if (status !== 'granted') {\n          status = (await Notifications.requestPermissionsAsync()).status;\n        }\n        if (status !== 'granted' || cancelled) return;\n\n        // getDevicePushTokenAsync returns the raw FCM/APNs token, which is what\n        // firebase-admin expects. getExpoPushTokenAsync would NOT work here.\n        const token = await Notifications.getDevicePushTokenAsync();\n        const uid = auth.currentUser?.uid;\n        if (!uid || cancelled) return;\n\n        // Key by token so re-registering the same device does not duplicate.\n        docId = `${uid}_${String(token.data).slice(-32)}`;\n        await setDoc(\n          doc(db, 'devices', docId),\n          {\n            uid,\n            token: token.data,\n            platform: Platform.OS,\n            updatedAt: new Date(),\n          },\n          { merge: true },\n        );\n      } catch {\n        // No push today; the app works regardless.\n      }\n    })();\n\n    return () => {\n      cancelled = true;\n    };\n  }, [enabled]);\n}\n"}, {"p": "firebase/functions/package.json", "l": "json", "n": 21, "c": "{\n  \"name\": \"nearmatch-functions\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"main\": \"lib/index.js\",\n  \"engines\": { \"node\": \"22\" },\n  \"scripts\": {\n    \"build\": \"tsc\",\n    \"typecheck\": \"tsc --noEmit\",\n    \"serve\": \"npm run build && firebase emulators:start --only functions\",\n    \"deploy\": \"firebase deploy --only functions\"\n  },\n  \"dependencies\": {\n    \"firebase-admin\": \"^13.0.2\",\n    \"firebase-functions\": \"^6.3.0\"\n  },\n  \"devDependencies\": {\n    \"typescript\": \"~5.7.2\"\n  }\n}\n"}, {"p": "firebase/functions/src/index.ts", "l": "typescript", "n": 171, "c": "/**\n * NearMatch Cloud Functions.\n *\n * Two jobs only:\n *   1. Deliver a push when a message arrives.\n *   2. Keep the match document's chat metadata (last message, unread counts)\n *      current, so the chat list is one cheap read instead of a fan-out.\n *\n * Match *creation* is not here. Matches are created in Postgres by the\n * reciprocal-like trigger and mirrored into Firestore by the API, because the\n * decision needs the swipes table.\n */\nimport { initializeApp } from 'firebase-admin/app';\nimport { FieldValue, getFirestore } from 'firebase-admin/firestore';\nimport { getMessaging } from 'firebase-admin/messaging';\nimport { onDocumentCreated, onDocumentUpdated } from 'firebase-functions/v2/firestore';\nimport { logger } from 'firebase-functions';\n\ninitializeApp();\nconst db = getFirestore();\n\nconst REGION = 'asia-south1'; // Mumbai — keep latency low for the primary market.\n\ninterface MessageData {\n  senderId: string;\n  body: string;\n  sentAt: FirebaseFirestore.Timestamp;\n  readAt: FirebaseFirestore.Timestamp | null;\n  clientId?: string | null;\n}\n\ninterface MatchData {\n  participants: string[];\n  isActive: boolean;\n}\n\n/** Every registered device token for a user. */\nasync function tokensFor(uid: string): Promise\u003cstring[]> {\n  const snap = await db.collection('devices').where('uid', '==', uid).get();\n  return snap.docs.map((d) => d.get('token') as string).filter(Boolean);\n}\n\n/** Remove tokens FCM reports as dead, so they don't accumulate forever. */\nasync function pruneTokens(tokens: string[], responses: { success: boolean; error?: { code: string } }[]) {\n  const dead = tokens.filter((_, i) => {\n    const err = responses[i]?.error?.code;\n    return (\n      err === 'messaging/registration-token-not-registered' ||\n      err === 'messaging/invalid-registration-token'\n    );\n  });\n  if (dead.length === 0) return;\n\n  const batch = db.batch();\n  const snap = await db.collection('devices').where('token', 'in', dead.slice(0, 10)).get();\n  snap.docs.forEach((d) => batch.delete(d.ref));\n  await batch.commit();\n  logger.info('pruned dead FCM tokens', { count: snap.size });\n}\n\n/**\n * A new message: bump the match's chat metadata and push to the recipient.\n */\nexport const onMessageCreated = onDocumentCreated(\n  { document: 'matches/{matchId}/messages/{messageId}', region: REGION },\n  async (event) => {\n    const snapshot = event.data;\n    if (!snapshot) return;\n\n    const message = snapshot.data() as MessageData;\n    const { matchId } = event.params;\n\n    const matchRef = db.doc(`matches/${matchId}`);\n    const matchSnap = await matchRef.get();\n    if (!matchSnap.exists) {\n      logger.warn('message in a match that does not exist', { matchId });\n      return;\n    }\n\n    const match = matchSnap.data() as MatchData;\n    const recipient = match.participants.find((p) => p !== message.senderId);\n    if (!recipient) return;\n\n    // Denormalise onto the match doc so the chat list is a single query.\n    await matchRef.update({\n      lastMessageAt: message.sentAt,\n      lastMessage: {\n        body: message.body.slice(0, 120),\n        senderId: message.senderId,\n        sentAt: message.sentAt,\n      },\n      [`unread.${recipient}`]: FieldValue.increment(1),\n    });\n\n    const tokens = await tokensFor(recipient);\n    if (tokens.length === 0) return;\n\n    const response = await getMessaging().sendEachForMulticast({\n      tokens,\n      notification: {\n        title: 'New message',\n        body: message.body.length > 80 ? `${message.body.slice(0, 77)}...` : message.body,\n      },\n      data: { type: 'message', matchId },\n      apns: { payload: { aps: { sound: 'default', badge: 1 } } },\n      android: { priority: 'high', notification: { sound: 'default' } },\n    });\n\n    await pruneTokens(tokens, response.responses);\n    logger.info('message push sent', { matchId, sent: response.successCount });\n  },\n);\n\n/**\n * A message marked read: decrement the reader's unread counter.\n */\nexport const onMessageRead = onDocumentUpdated(\n  { document: 'matches/{matchId}/messages/{messageId}', region: REGION },\n  async (event) => {\n    const before = event.data?.before.data() as MessageData | undefined;\n    const after = event.data?.after.data() as MessageData | undefined;\n    if (!before || !after) return;\n    if (before.readAt !== null || after.readAt === null) return; // not a read transition\n\n    const { matchId } = event.params;\n    const matchSnap = await db.doc(`matches/${matchId}`).get();\n    if (!matchSnap.exists) return;\n\n    const match = matchSnap.data() as MatchData;\n    const reader = match.participants.find((p) => p !== after.senderId);\n    if (!reader) return;\n\n    await db.doc(`matches/${matchId}`).update({\n      [`unread.${reader}`]: FieldValue.increment(-1),\n    });\n  },\n);\n\n/**\n * A new match document (mirrored in by the API): notify both people.\n */\nexport const onMatchCreated = onDocumentCreated(\n  { document: 'matches/{matchId}', region: REGION },\n  async (event) => {\n    const snapshot = event.data;\n    if (!snapshot) return;\n\n    const match = snapshot.data() as MatchData;\n    if (!match.isActive) return;\n\n    for (const uid of match.participants) {\n      const tokens = await tokensFor(uid);\n      if (tokens.length === 0) continue;\n\n      const response = await getMessaging().sendEachForMulticast({\n        tokens,\n        notification: {\n          title: \"It's a match!\",\n          body: 'You both liked each other. Say hello.',\n        },\n        data: { type: 'match', matchId: event.params.matchId },\n        apns: { payload: { aps: { sound: 'default' } } },\n        android: { priority: 'high', notification: { sound: 'default' } },\n      });\n      await pruneTokens(tokens, response.responses);\n    }\n\n    logger.info('match push sent', { matchId: event.params.matchId });\n  },\n);\n"}, {"p": "firebase/functions/tsconfig.json", "l": "json", "n": 17, "c": "{\n  \"compilerOptions\": {\n    \"module\": \"commonjs\",\n    \"target\": \"es2022\",\n    \"lib\": [\"es2022\"],\n    \"outDir\": \"lib\",\n    \"rootDir\": \"src\",\n    \"strict\": true,\n    \"noImplicitReturns\": true,\n    \"noUnusedLocals\": true,\n    \"esModuleInterop\": true,\n    \"skipLibCheck\": true,\n    \"sourceMap\": true\n  },\n  \"include\": [\"src\"]\n}\n"}, {"p": "firebase/rules-tests/package.json", "l": "json", "n": 15, "c": "{\n  \"name\": \"nearmatch-rules-tests\",\n  \"version\": \"1.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"scripts\": {\n    \"test\": \"firebase emulators:exec --only firestore --project nearmatch-test 'node --test rules.test.mjs'\"\n  },\n  \"devDependencies\": {\n    \"@firebase/rules-unit-testing\": \"^4.0.1\",\n    \"firebase\": \"^11.1.0\",\n    \"firebase-tools\": \"^13.29.1\"\n  }\n}\n"}, {"p": "firebase/rules-tests/rules.test.mjs", "l": "javascript", "n": 248, "c": "/**\n * NearMatch Firestore rules — security tests.\n *\n * Every test here is an attack. Run against the emulator:\n *   npm test\n */\nimport assert from 'node:assert/strict';\nimport { after, before, describe, it } from 'node:test';\nimport { readFileSync } from 'node:fs';\n\nimport {\n  assertFails,\n  assertSucceeds,\n  initializeTestEnvironment,\n} from '@firebase/rules-unit-testing';\nimport { doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp } from 'firebase/firestore';\n\nconst AARAV = 'uid-aarav';\nconst DIYA = 'uid-diya';\nconst KABIR = 'uid-kabir';          // matched with nobody\nconst MATCH = 'match-aarav-diya';\nconst CLOSED = 'match-closed';\n\nlet env;\n\nbefore(async () => {\n  env = await initializeTestEnvironment({\n    projectId: 'nearmatch-test',\n    firestore: {\n      rules: readFileSync(new URL('../firestore.rules', import.meta.url), 'utf8'),\n      host: '127.0.0.1',\n      port: 8080,\n    },\n  });\n\n  // Seed as the backend would (bypasses rules).\n  await env.withSecurityRulesDisabled(async (ctx) => {\n    const db = ctx.firestore();\n    await setDoc(doc(db, 'matches', MATCH), {\n      participants: [AARAV, DIYA],\n      isActive: true,\n      createdAt: new Date(),\n      lastMessageAt: new Date(),\n    });\n    await setDoc(doc(db, 'matches', CLOSED), {\n      participants: [AARAV, DIYA],\n      isActive: false,\n      createdAt: new Date(),\n    });\n    await setDoc(doc(db, 'matches', MATCH, 'messages', 'm1'), {\n      senderId: AARAV,\n      body: 'hello',\n      sentAt: new Date(),\n      readAt: null,\n      clientId: 'c1',\n    });\n  });\n});\n\nafter(async () => {\n  await env?.cleanup();\n});\n\nconst as = (uid) => env.authenticatedContext(uid).firestore();\nconst anon = () => env.unauthenticatedContext().firestore();\n\nconst validMessage = (senderId) => ({\n  senderId,\n  body: 'hi there',\n  sentAt: serverTimestamp(),\n  readAt: null,\n  clientId: 'c-new',\n});\n\ndescribe('match documents', () => {\n  it('a participant can read their match', async () => {\n    await assertSucceeds(getDoc(doc(as(AARAV), 'matches', MATCH)));\n  });\n\n  it('a stranger cannot read someone else\\'s match', async () => {\n    await assertFails(getDoc(doc(as(KABIR), 'matches', MATCH)));\n  });\n\n  it('an anonymous caller cannot read any match', async () => {\n    await assertFails(getDoc(doc(anon(), 'matches', MATCH)));\n  });\n\n  it('a client cannot forge a match document', async () => {\n    await assertFails(\n      setDoc(doc(as(KABIR), 'matches', 'match-forged'), {\n        participants: [KABIR, DIYA],\n        isActive: true,\n      }),\n    );\n  });\n\n  it('a participant cannot add themselves to another match', async () => {\n    await assertFails(\n      updateDoc(doc(as(KABIR), 'matches', MATCH), { participants: [AARAV, DIYA, KABIR] }),\n    );\n  });\n\n  it('a participant cannot reopen a closed match', async () => {\n    await assertFails(updateDoc(doc(as(AARAV), 'matches', CLOSED), { isActive: true }));\n  });\n});\n\ndescribe('reading messages', () => {\n  it('both participants can read the transcript', async () => {\n    await assertSucceeds(getDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'm1')));\n    await assertSucceeds(getDoc(doc(as(DIYA), 'matches', MATCH, 'messages', 'm1')));\n  });\n\n  it('a stranger cannot read the transcript', async () => {\n    await assertFails(getDoc(doc(as(KABIR), 'matches', MATCH, 'messages', 'm1')));\n  });\n\n  it('an anonymous caller cannot read the transcript', async () => {\n    await assertFails(getDoc(doc(anon(), 'matches', MATCH, 'messages', 'm1')));\n  });\n});\n\ndescribe('sending messages', () => {\n  it('a participant can send a message as themselves', async () => {\n    await assertSucceeds(\n      setDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'ok-1'), validMessage(AARAV)),\n    );\n  });\n\n  it('a stranger cannot inject a message', async () => {\n    await assertFails(\n      setDoc(doc(as(KABIR), 'matches', MATCH, 'messages', 'bad-1'), validMessage(KABIR)),\n    );\n  });\n\n  it('a participant cannot send a message attributed to the other person', async () => {\n    await assertFails(\n      setDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'bad-2'), validMessage(DIYA)),\n    );\n  });\n\n  it('nobody can send into a closed match', async () => {\n    await assertFails(\n      setDoc(doc(as(AARAV), 'matches', CLOSED, 'messages', 'bad-3'), validMessage(AARAV)),\n    );\n  });\n\n  it('an empty message is refused', async () => {\n    await assertFails(\n      setDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'bad-4'), {\n        ...validMessage(AARAV),\n        body: '',\n      }),\n    );\n  });\n\n  it('an oversized message is refused', async () => {\n    await assertFails(\n      setDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'bad-5'), {\n        ...validMessage(AARAV),\n        body: 'x'.repeat(2001),\n      }),\n    );\n  });\n\n  it('a backdated message is refused', async () => {\n    await assertFails(\n      setDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'bad-6'), {\n        ...validMessage(AARAV),\n        sentAt: new Date('2020-01-01'),\n      }),\n    );\n  });\n\n  it('a message pre-marked as read is refused', async () => {\n    await assertFails(\n      setDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'bad-7'), {\n        ...validMessage(AARAV),\n        readAt: serverTimestamp(),\n      }),\n    );\n  });\n\n  it('unknown fields are refused', async () => {\n    await assertFails(\n      setDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'bad-8'), {\n        ...validMessage(AARAV),\n        isAdmin: true,\n      }),\n    );\n  });\n});\n\ndescribe('editing messages', () => {\n  it('the recipient can mark a message read', async () => {\n    await assertSucceeds(\n      updateDoc(doc(as(DIYA), 'matches', MATCH, 'messages', 'm1'), {\n        readAt: serverTimestamp(),\n      }),\n    );\n  });\n\n  it('the sender cannot mark their own message read', async () => {\n    await assertFails(\n      updateDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'm1'), {\n        readAt: serverTimestamp(),\n      }),\n    );\n  });\n\n  it('a sent message cannot be rewritten by its sender', async () => {\n    await assertFails(\n      updateDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'm1'), { body: 'rewritten' }),\n    );\n  });\n\n  it('the recipient cannot rewrite a message while marking it read', async () => {\n    await assertFails(\n      updateDoc(doc(as(DIYA), 'matches', MATCH, 'messages', 'm1'), {\n        readAt: serverTimestamp(),\n        body: 'tampered',\n      }),\n    );\n  });\n\n  it('a stranger cannot mark a message read', async () => {\n    await assertFails(\n      updateDoc(doc(as(KABIR), 'matches', MATCH, 'messages', 'm1'), {\n        readAt: serverTimestamp(),\n      }),\n    );\n  });\n\n  it('a message cannot be deleted', async () => {\n    await assertFails(deleteDoc(doc(as(AARAV), 'matches', MATCH, 'messages', 'm1')));\n    await assertFails(deleteDoc(doc(as(DIYA), 'matches', MATCH, 'messages', 'm1')));\n  });\n});\n\ndescribe('collections that belong to Postgres', () => {\n  for (const path of ['profiles', 'swipes', 'blocks', 'reports', 'preferences']) {\n    it(`${path} is unreachable from a client`, async () => {\n      await assertFails(getDoc(doc(as(AARAV), path, 'anything')));\n      await assertFails(setDoc(doc(as(AARAV), path, 'anything'), { x: 1 }));\n    });\n  }\n});\n"}, {"p": "firebase/storage.rules", "l": "javascript", "n": 32, "c": "rules_version = '2';\n\n// NearMatch — Cloud Storage rules.\n//\n// Photos are keyed \"profiles/\u003cuid>/\u003cfilename>\", so ownership is the second\n// path segment. The bucket is private: the API hands out V4 signed URLs for\n// reads, and the owner may write their own prefix directly from the device.\n\nservice firebase.storage {\n  match /b/{bucket}/o {\n\n    match /profiles/{userId}/{fileName} {\n\n      // A user reads their own photos directly. Everyone else — including a\n      // match — gets a short-lived signed URL from the API instead, so photo\n      // access can be revoked by unmatching without touching Storage.\n      allow read: if request.auth != null && request.auth.uid == userId;\n\n      allow write: if request.auth != null\n                   && request.auth.uid == userId\n                   && request.resource.size \u003c 8 * 1024 * 1024\n                   && request.resource.contentType.matches('image/(jpeg|png|webp|heic)');\n\n      allow delete: if request.auth != null && request.auth.uid == userId;\n    }\n\n    match /{allPaths=**} {\n      allow read, write: if false;\n    }\n  }\n}\n"}, {"p": "frontend/.env.example", "l": "bash", "n": 7, "c": "# FastAPI service. No trailing slash.\nEXPO_PUBLIC_BACKEND_URL=http://localhost:8000\n\n# Supabase project (auth + realtime chat)\nEXPO_PUBLIC_SUPABASE_URL=https://your-project.supabase.co\nEXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_xxx\n"}, {"p": "frontend/app/(auth)/_layout.tsx", "l": "typescript", "n": 14, "c": "import { Redirect, Stack } from 'expo-router';\n\nimport { useAuth } from '@/context/AuthProvider';\n\nexport default function AuthLayout() {\n  const { stage } = useAuth();\n\n  // Already signed in: never show the sign-in screen again.\n  if (stage === 'needs-onboarding') return \u003cRedirect href=\"/(onboarding)/basics\" />;\n  if (stage === 'ready') return \u003cRedirect href=\"/(tabs)\" />;\n\n  return \u003cStack screenOptions={{ headerShown: false }} />;\n}\n"}, {"p": "frontend/app/(auth)/sign-in.tsx", "l": "typescript", "n": 148, "c": "import * as AppleAuthentication from 'expo-apple-authentication';\nimport { useRouter } from 'expo-router';\nimport { useEffect, useState } from 'react';\nimport { Platform, StyleSheet, Text, TextInput, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { supabase } from '@/lib/supabase';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\nexport default function SignIn() {\n  const router = useRouter();\n  const [email, setEmail] = useState('');\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n  const [appleAvailable, setAppleAvailable] = useState(false);\n\n  useEffect(() => {\n    if (Platform.OS !== 'ios') return;\n    void AppleAuthentication.isAvailableAsync().then(setAppleAvailable);\n  }, []);\n\n  const signInWithApple = async () => {\n    setError(null);\n    setBusy(true);\n    try {\n      const credential = await AppleAuthentication.signInAsync({\n        requestedScopes: [\n          AppleAuthentication.AppleAuthenticationScope.FULL_NAME,\n          AppleAuthentication.AppleAuthenticationScope.EMAIL,\n        ],\n      });\n      if (!credential.identityToken) throw new Error('Apple did not return a token.');\n\n      const { error: authError } = await supabase.auth.signInWithIdToken({\n        provider: 'apple',\n        token: credential.identityToken,\n      });\n      if (authError) throw authError;\n      // The auth listener in AuthProvider handles navigation from here.\n    } catch (err) {\n      const message = err instanceof Error ? err.message : 'Sign in failed.';\n      // A user tapping \"Cancel\" is not an error worth showing.\n      if (!/canceled|cancelled|1001/i.test(message)) setError(message);\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  const sendEmailCode = async () => {\n    const address = email.trim().toLowerCase();\n    if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(address)) {\n      setError('Enter a valid email address.');\n      return;\n    }\n    setError(null);\n    setBusy(true);\n    try {\n      const { error: otpError } = await supabase.auth.signInWithOtp({\n        email: address,\n        options: { shouldCreateUser: true },\n      });\n      if (otpError) throw otpError;\n      router.push({ pathname: '/(auth)/verify', params: { email: address } });\n    } catch (err) {\n      setError(err instanceof Error ? err.message : 'Could not send the code.');\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  return (\n    \u003cScreen>\n      \u003cView style={styles.hero}>\n        \u003cText style={styles.wordmark}>NearMatch\u003c/Text>\n        \u003cText style={styles.tagline}>Meet people who are actually nearby.\u003c/Text>\n      \u003c/View>\n\n      {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n\n      \u003cView style={styles.form}>\n        {appleAvailable ? (\n          \u003c>\n            \u003cAppleAuthentication.AppleAuthenticationButton\n              buttonType={AppleAuthentication.AppleAuthenticationButtonType.SIGN_IN}\n              buttonStyle={AppleAuthentication.AppleAuthenticationButtonStyle.BLACK}\n              cornerRadius={999}\n              style={styles.appleButton}\n              onPress={signInWithApple}\n            />\n            \u003cView style={styles.dividerRow}>\n              \u003cView style={styles.rule} />\n              \u003cText style={styles.dividerText}>or\u003c/Text>\n              \u003cView style={styles.rule} />\n            \u003c/View>\n          \u003c/>\n        ) : null}\n\n        \u003cTextInput\n          value={email}\n          onChangeText={setEmail}\n          placeholder=\"you@example.com\"\n          placeholderTextColor={colors.textSubtle}\n          autoCapitalize=\"none\"\n          autoComplete=\"email\"\n          keyboardType=\"email-address\"\n          inputMode=\"email\"\n          style={styles.input}\n          accessibilityLabel=\"Email address\"\n        />\n        \u003cButton\n          label=\"Continue with email\"\n          onPress={sendEmailCode}\n          loading={busy}\n          accessibilityHint=\"Sends a six digit code to your email\"\n        />\n\n        \u003cText style={styles.legal}>\n          By continuing you agree to the NearMatch Terms and confirm you are at least 18.\n        \u003c/Text>\n      \u003c/View>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  hero: { flex: 1, justifyContent: 'flex-end', paddingBottom: spacing.xl, gap: spacing.sm },\n  wordmark: { ...typography.display, color: colors.primary },\n  tagline: { ...typography.body, color: colors.textMuted },\n  form: { paddingBottom: spacing.xl, gap: spacing.md },\n  appleButton: { height: 50, alignSelf: 'stretch' },\n  dividerRow: { flexDirection: 'row', alignItems: 'center', gap: spacing.md },\n  rule: { flex: 1, height: 1, backgroundColor: colors.border },\n  dividerText: { ...typography.caption, color: colors.textSubtle },\n  input: {\n    minHeight: 50,\n    paddingHorizontal: spacing.base,\n    borderRadius: radius.pill,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    ...typography.body,\n    color: colors.text,\n  },\n  legal: { ...typography.caption, color: colors.textSubtle, textAlign: 'center' },\n});\n"}, {"p": "frontend/app/(auth)/verify.tsx", "l": "typescript", "n": 92, "c": "import { useLocalSearchParams, useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { StyleSheet, Text, TextInput, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { supabase } from '@/lib/supabase';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\nexport default function Verify() {\n  const { email } = useLocalSearchParams\u003c{ email?: string }>();\n  const router = useRouter();\n  const [code, setCode] = useState('');\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  const verify = async () => {\n    if (!email) {\n      setError('Start again from the sign-in screen.');\n      return;\n    }\n    if (code.trim().length !== 6) {\n      setError('Enter the 6-digit code.');\n      return;\n    }\n    setBusy(true);\n    setError(null);\n    try {\n      const { error: verifyError } = await supabase.auth.verifyOtp({\n        email,\n        token: code.trim(),\n        type: 'email',\n      });\n      if (verifyError) throw verifyError;\n      // AuthProvider picks up the new session and routes onward.\n    } catch (err) {\n      setError(err instanceof Error ? err.message : 'That code did not work.');\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  return (\n    \u003cScreen>\n      \u003cView style={styles.body}>\n        \u003cText style={styles.title}>Check your email\u003c/Text>\n        \u003cText style={styles.sub}>\n          We sent a 6-digit code to {email ?? 'your inbox'}. It expires in 10 minutes.\n        \u003c/Text>\n\n        {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n\n        \u003cTextInput\n          value={code}\n          onChangeText={(text) => setCode(text.replace(/\\D/g, '').slice(0, 6))}\n          placeholder=\"123456\"\n          placeholderTextColor={colors.textSubtle}\n          keyboardType=\"number-pad\"\n          inputMode=\"numeric\"\n          autoComplete=\"one-time-code\"\n          textContentType=\"oneTimeCode\"\n          maxLength={6}\n          style={styles.codeInput}\n          accessibilityLabel=\"Six digit verification code\"\n        />\n\n        \u003cButton label=\"Verify and continue\" onPress={verify} loading={busy} />\n        \u003cButton label=\"Use a different email\" onPress={() => router.back()} variant=\"ghost\" />\n      \u003c/View>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  body: { flex: 1, justifyContent: 'center', gap: spacing.base },\n  title: { ...typography.title, color: colors.text },\n  sub: { ...typography.body, color: colors.textMuted },\n  codeInput: {\n    minHeight: 58,\n    borderRadius: radius.lg,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    ...typography.title,\n    // Must follow the spread: typography.title sets its own letterSpacing.\n    textAlign: 'center',\n    letterSpacing: 10,\n    color: colors.text,\n  },\n});\n"}, {"p": "frontend/app/(onboarding)/_layout.tsx", "l": "typescript", "n": 22, "c": "import { Redirect, Stack } from 'expo-router';\n\nimport { useAuth } from '@/context/AuthProvider';\nimport { colors } from '@/theme/tokens';\n\nexport default function OnboardingLayout() {\n  const { stage } = useAuth();\n\n  if (stage === 'signed-out') return \u003cRedirect href=\"/(auth)/sign-in\" />;\n  if (stage === 'ready') return \u003cRedirect href=\"/(tabs)\" />;\n\n  return (\n    \u003cStack\n      screenOptions={{\n        headerShown: false,\n        contentStyle: { backgroundColor: colors.background },\n        gestureEnabled: false,\n      }}\n    />\n  );\n}\n"}, {"p": "frontend/app/(onboarding)/basics.tsx", "l": "typescript", "n": 215, "c": "import { useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Chip } from '@/components/ui/Chip';\nimport { Screen } from '@/components/ui/Screen';\nimport {\n  BIO_MAX,\n  GENDER_OPTIONS,\n  INTEREST_SUGGESTIONS,\n  MAX_INTERESTS,\n  MIN_AGE,\n  SHOW_ME_OPTIONS,\n} from '@/lib/constants';\nimport { ageFromDob, prettyInterest } from '@/lib/format';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\nimport type { Gender, InterestedIn } from '@/types/models';\n\n/** Step 1 of 3: who you are. Nothing is sent until the final step. */\nexport default function Basics() {\n  const router = useRouter();\n  const [name, setName] = useState('');\n  const [dob, setDob] = useState('');\n  const [gender, setGender] = useState\u003cGender | null>(null);\n  const [showMe, setShowMe] = useState\u003cInterestedIn[]>(['everyone']);\n  const [bio, setBio] = useState('');\n  const [job, setJob] = useState('');\n  const [interests, setInterests] = useState\u003cstring[]>([]);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  const toggleInterest = (tag: string) =>\n    setInterests((prev) =>\n      prev.includes(tag)\n        ? prev.filter((t) => t !== tag)\n        : prev.length >= MAX_INTERESTS\n          ? prev\n          : [...prev, tag],\n    );\n\n  const toggleShowMe = (value: InterestedIn) =>\n    setShowMe(value === 'everyone' ? ['everyone'] : [value]);\n\n  const next = () => {\n    if (name.trim().length \u003c 2) return setError('Enter your name.');\n    if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(dob)) return setError('Enter your date of birth as YYYY-MM-DD.');\n    const age = ageFromDob(dob);\n    if (Number.isNaN(age)) return setError('That date of birth is not valid.');\n    if (age \u003c MIN_AGE) return setError(`You must be at least ${MIN_AGE} to use NearMatch.`);\n    if (age >
