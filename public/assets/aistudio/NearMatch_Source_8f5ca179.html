120) return setError('That date of birth is not valid.');\n    if (!gender) return setError('Select how you identify.');\n\n    setError(null);\n    router.push({\n      pathname: '/(onboarding)/photos',\n      params: {\n        display_name: name.trim(),\n        dob,\n        gender,\n        interested_in: showMe.join(','),\n        bio: bio.trim(),\n        job_title: job.trim(),\n        interests: interests.join(','),\n      },\n    });\n  };\n\n  return (\n    \u003cScreen>\n      \u003cScrollView contentContainerStyle={styles.scroll} keyboardShouldPersistTaps=\"handled\">\n        \u003cView style={styles.header}>\n          \u003cText style={styles.step}>Step 1 of 3\u003c/Text>\n          \u003cText style={styles.title}>Tell us about you\u003c/Text>\n        \u003c/View>\n\n        {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n\n        \u003cField label=\"First name\">\n          \u003cTextInput\n            value={name}\n            onChangeText={setName}\n            placeholder=\"Aarav\"\n            placeholderTextColor={colors.textSubtle}\n            style={styles.input}\n            maxLength={40}\n            accessibilityLabel=\"First name\"\n          />\n        \u003c/Field>\n\n        \u003cField label=\"Date of birth\" hint=\"Your age is shown on your profile, never your birthday.\">\n          \u003cTextInput\n            value={dob}\n            onChangeText={setDob}\n            placeholder=\"1996-04-12\"\n            placeholderTextColor={colors.textSubtle}\n            keyboardType=\"numbers-and-punctuation\"\n            style={styles.input}\n            maxLength={10}\n            accessibilityLabel=\"Date of birth, year month day\"\n          />\n        \u003c/Field>\n\n        \u003cField label=\"I am\">\n          \u003cView style={styles.chipRow}>\n            {GENDER_OPTIONS.map((option) => (\n              \u003cChip\n                key={option.value}\n                label={option.label}\n                selected={gender === option.value}\n                onPress={() => setGender(option.value as Gender)}\n              />\n            ))}\n          \u003c/View>\n        \u003c/Field>\n\n        \u003cField label=\"Show me\">\n          \u003cView style={styles.chipRow}>\n            {SHOW_ME_OPTIONS.map((option) => (\n              \u003cChip\n                key={option.value}\n                label={option.label}\n                selected={showMe.includes(option.value as InterestedIn)}\n                onPress={() => toggleShowMe(option.value as InterestedIn)}\n              />\n            ))}\n          \u003c/View>\n        \u003c/Field>\n\n        \u003cField label=\"Work\" hint=\"Optional\">\n          \u003cTextInput\n            value={job}\n            onChangeText={setJob}\n            placeholder=\"Product designer\"\n            placeholderTextColor={colors.textSubtle}\n            style={styles.input}\n            maxLength={60}\n            accessibilityLabel=\"Job title\"\n          />\n        \u003c/Field>\n\n        \u003cField label=\"About you\" hint={`${bio.length}/${BIO_MAX}`}>\n          \u003cTextInput\n            value={bio}\n            onChangeText={(text) => setBio(text.slice(0, BIO_MAX))}\n            placeholder=\"Filter coffee, long drives, weekend treks.\"\n            placeholderTextColor={colors.textSubtle}\n            style={[styles.input, styles.textarea]}\n            multiline\n            accessibilityLabel=\"About you\"\n          />\n        \u003c/Field>\n\n        \u003cField label=\"Interests\" hint={`Pick up to ${MAX_INTERESTS} — they drive your matches.`}>\n          \u003cView style={styles.chipRow}>\n            {INTEREST_SUGGESTIONS.map((tag) => (\n              \u003cChip\n                key={tag}\n                label={prettyInterest(tag)}\n                selected={interests.includes(tag)}\n                onPress={() => toggleInterest(tag)}\n              />\n            ))}\n          \u003c/View>\n        \u003c/Field>\n\n        \u003cButton label=\"Continue\" onPress={next} />\n      \u003c/ScrollView>\n    \u003c/Screen>\n  );\n}\n\nfunction Field({\n  label,\n  hint,\n  children,\n}: {\n  label: string;\n  hint?: string;\n  children: React.ReactNode;\n}) {\n  return (\n    \u003cView style={styles.field}>\n      \u003cView style={styles.fieldHead}>\n        \u003cText style={styles.label}>{label}\u003c/Text>\n        {hint ? \u003cText style={styles.hint}>{hint}\u003c/Text> : null}\n      \u003c/View>\n      {children}\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  scroll: { paddingVertical: spacing.lg, gap: spacing.lg },\n  header: { gap: spacing.xs },\n  step: { ...typography.caption, color: colors.primary, textTransform: 'uppercase' },\n  title: { ...typography.title, color: colors.text },\n  field: { gap: spacing.sm },\n  fieldHead: { flexDirection: 'row', justifyContent: 'space-between', alignItems: 'baseline' },\n  label: { ...typography.label, color: colors.text },\n  hint: { ...typography.caption, color: colors.textSubtle, flexShrink: 1, textAlign: 'right' },\n  input: {\n    minHeight: 48,\n    paddingHorizontal: spacing.base,\n    borderRadius: radius.md,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    ...typography.body,\n    color: colors.text,\n  },\n  textarea: { minHeight: 96, paddingTop: spacing.md, textAlignVertical: 'top' },\n  chipRow: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.sm },\n});\n"}, {"p": "frontend/app/(onboarding)/location.tsx", "l": "typescript", "n": 112, "c": "import { useLocalSearchParams } from 'expo-router';\nimport { useState } from 'react';\nimport { StyleSheet, Text, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { useAuth } from '@/context/AuthProvider';\nimport { ApiError, api } from '@/lib/api';\nimport { captureAndSyncLocation } from '@/lib/location';\nimport { uploadPhoto } from '@/lib/photos';\nimport { colors, spacing, typography } from '@/theme/tokens';\n\n/**\n * Step 3 of 3: create the profile, upload photos, capture location.\n *\n * Order matters. The profile row must exist before photos upload, because\n * Storage paths are keyed by profile id and the policy checks that prefix.\n */\nexport default function LocationStep() {\n  const params = useLocalSearchParams\u003cRecord\u003cstring, string>>();\n  const { refreshProfile } = useAuth();\n  const [busy, setBusy] = useState(false);\n  const [status, setStatus] = useState\u003cstring | null>(null);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  const finish = async () => {\n    setBusy(true);\n    setError(null);\n\n    try {\n      setStatus('Creating your profile…');\n      await api.createProfile({\n        display_name: params.display_name ?? '',\n        dob: params.dob ?? '',\n        gender: params.gender ?? 'other',\n        interested_in: (params.interested_in ?? 'everyone').split(',').filter(Boolean),\n        bio: params.bio ?? '',\n        job_title: params.job_title || null,\n        interests: (params.interests ?? '').split(',').filter(Boolean),\n      });\n\n      const photos: { uri: string; mimeType: string }[] = params.photos\n        ? JSON.parse(params.photos)\n        : [];\n\n      for (const [index, photo] of photos.entries()) {\n        setStatus(`Uploading photo ${index + 1} of ${photos.length}…`);\n        await uploadPhoto(photo.uri, photo.mimeType, index === 0);\n      }\n\n      setStatus('Finding people near you…');\n      const outcome = await captureAndSyncLocation();\n      if (outcome.status === 'denied') {\n        setError(\n          'NearMatch needs your location to show people nearby. Turn it on in Settings, then pull to refresh.',\n        );\n      } else if (outcome.status === 'error') {\n        setError('Could not read your location. You can set it later from Settings.');\n      }\n\n      // Flips the gate to \"ready\", which routes into the tabs.\n      await refreshProfile();\n    } catch (err) {\n      setError(\n        err instanceof ApiError\n          ? err.message\n          : err instanceof Error\n            ? err.message\n            : 'Something went wrong. Try again.',\n      );\n    } finally {\n      setBusy(false);\n      setStatus(null);\n    }\n  };\n\n  return (\n    \u003cScreen>\n      \u003cView style={styles.body}>\n        \u003cText style={styles.step}>Step 3 of 3\u003c/Text>\n        \u003cText style={styles.title}>Find matches near you\u003c/Text>\n        \u003cText style={styles.sub}>\n          NearMatch sorts people by how close they are. Your exact location is never shown — others\n          only ever see a rounded distance like &ldquo;6 km away&rdquo;.\n        \u003c/Text>\n\n        {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n        {status ? \u003cText style={styles.status}>{status}\u003c/Text> : null}\n      \u003c/View>\n\n      \u003cView style={styles.footer}>\n        \u003cButton\n          label=\"Allow location and finish\"\n          onPress={finish}\n          loading={busy}\n          accessibilityHint=\"Creates your profile and asks for location access\"\n        />\n      \u003c/View>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  body: { flex: 1, justifyContent: 'center', gap: spacing.md },\n  step: { ...typography.caption, color: colors.primary, textTransform: 'uppercase' },\n  title: { ...typography.title, color: colors.text },\n  sub: { ...typography.body, color: colors.textMuted },\n  status: { ...typography.label, color: colors.secondary },\n  footer: { paddingBottom: spacing.xl },\n});\n"}, {"p": "frontend/app/(onboarding)/photos.tsx", "l": "typescript", "n": 162, "c": "import { Image } from 'expo-image';\nimport { useLocalSearchParams, useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { Pressable, ScrollView, StyleSheet, Text, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { MAX_PHOTOS } from '@/lib/constants';\nimport { pickFromLibrary, takePhoto } from '@/lib/photos';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\ntype Local = { uri: string; mimeType: string };\n\n/**\n * Step 2 of 3. Photos are held locally and uploaded on the final step, once the\n * profile row exists — Storage paths are keyed by profile id.\n */\nexport default function Photos() {\n  const router = useRouter();\n  const params = useLocalSearchParams\u003cRecord\u003cstring, string>>();\n  const [photos, setPhotos] = useState\u003cLocal[]>([]);\n  const [error, setError] = useState\u003cstring | null>(null);\n\n  const add = async (source: 'camera' | 'library') => {\n    if (photos.length >= MAX_PHOTOS) {\n      setError(`You can add up to ${MAX_PHOTOS} photos.`);\n      return;\n    }\n    const result = source === 'camera' ? await takePhoto() : await pickFromLibrary();\n    if (result.status === 'denied') {\n      setError(\n        source === 'camera'\n          ? 'Camera access is off. Turn it on in Settings to take a photo.'\n          : 'Photo access is off. Turn it on in Settings to add photos.',\n      );\n      return;\n    }\n    if (result.status === 'cancelled') return;\n    setError(null);\n    setPhotos((prev) => [...prev, { uri: result.uri, mimeType: result.mimeType }]);\n  };\n\n  const remove = (index: number) =>\n    setPhotos((prev) => prev.filter((_, i) => i !== index));\n\n  const next = () => {\n    if (!photos.length) {\n      setError('Add at least one photo so people know who they are matching with.');\n      return;\n    }\n    router.push({\n      pathname: '/(onboarding)/location',\n      params: { ...params, photos: JSON.stringify(photos) },\n    });\n  };\n\n  return (\n    \u003cScreen>\n      \u003cScrollView contentContainerStyle={styles.scroll}>\n        \u003cView style={styles.header}>\n          \u003cText style={styles.step}>Step 2 of 3\u003c/Text>\n          \u003cText style={styles.title}>Add your photos\u003c/Text>\n          \u003cText style={styles.sub}>\n            The first one is your main photo. Profiles with three or more photos get noticeably more\n            matches.\n          \u003c/Text>\n        \u003c/View>\n\n        {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n\n        \u003cView style={styles.grid}>\n          {photos.map((photo, index) => (\n            \u003cView key={photo.uri} style={styles.tile}>\n              \u003cImage source={{ uri: photo.uri }} style={styles.tileImage} contentFit=\"cover\" />\n              {index === 0 ? (\n                \u003cView style={styles.mainBadge}>\n                  \u003cText style={styles.mainBadgeText}>Main\u003c/Text>\n                \u003c/View>\n              ) : null}\n              \u003cPressable\n                onPress={() => remove(index)}\n                style={styles.removeButton}\n                hitSlop={8}\n                accessibilityRole=\"button\"\n                accessibilityLabel={`Remove photo ${index + 1}`}\n              >\n                \u003cText style={styles.removeGlyph}>✕\u003c/Text>\n              \u003c/Pressable>\n            \u003c/View>\n          ))}\n\n          {photos.length \u003c MAX_PHOTOS ? (\n            \u003cPressable\n              onPress={() => add('library')}\n              style={[styles.tile, styles.addTile]}\n              accessibilityRole=\"button\"\n              accessibilityLabel=\"Add a photo from your library\"\n            >\n              \u003cText style={styles.addGlyph}>+\u003c/Text>\n              \u003cText style={styles.addLabel}>Add\u003c/Text>\n            \u003c/Pressable>\n          ) : null}\n        \u003c/View>\n\n        \u003cButton label=\"Take a photo\" onPress={() => add('camera')} variant=\"secondary\" />\n        \u003cButton label=\"Continue\" onPress={next} />\n      \u003c/ScrollView>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  scroll: { paddingVertical: spacing.lg, gap: spacing.base },\n  header: { gap: spacing.xs },\n  step: { ...typography.caption, color: colors.primary, textTransform: 'uppercase' },\n  title: { ...typography.title, color: colors.text },\n  sub: { ...typography.body, color: colors.textMuted },\n  grid: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.sm },\n  tile: {\n    width: '31%',\n    aspectRatio: 0.8,\n    borderRadius: radius.md,\n    overflow: 'hidden',\n    backgroundColor: colors.surfaceSunken,\n  },\n  tileImage: { width: '100%', height: '100%' },\n  addTile: {\n    alignItems: 'center',\n    justifyContent: 'center',\n    borderWidth: 1,\n    borderStyle: 'dashed',\n    borderColor: colors.borderStrong,\n    backgroundColor: colors.surfaceMuted,\n    gap: 2,\n  },\n  addGlyph: { ...typography.title, color: colors.textSubtle },\n  addLabel: { ...typography.caption, color: colors.textSubtle },\n  mainBadge: {\n    position: 'absolute',\n    bottom: spacing.xs,\n    left: spacing.xs,\n    paddingHorizontal: spacing.sm,\n    paddingVertical: 2,\n    borderRadius: radius.pill,\n    backgroundColor: colors.overlay,\n  },\n  mainBadgeText: { ...typography.caption, color: colors.onDark, fontSize: 10 },\n  removeButton: {\n    position: 'absolute',\n    top: spacing.xs,\n    right: spacing.xs,\n    width: 24,\n    height: 24,\n    borderRadius: 12,\n    backgroundColor: colors.overlay,\n    alignItems: 'center',\n    justifyContent: 'center',\n  },\n  removeGlyph: { color: colors.onDark, fontSize: 12 },\n});\n"}, {"p": "frontend/app/(tabs)/_layout.tsx", "l": "typescript", "n": 48, "c": "import { Redirect, Tabs } from 'expo-router';\nimport { Text, type ColorValue } from 'react-native';\n\nimport { useAuth } from '@/context/AuthProvider';\nimport { usePushRegistration } from '@/hooks/usePushRegistration';\nimport { colors, typography } from '@/theme/tokens';\n\nexport default function TabsLayout() {\n  const { stage } = useAuth();\n  usePushRegistration(stage === 'ready');\n\n  if (stage === 'signed-out') return \u003cRedirect href=\"/(auth)/sign-in\" />;\n  if (stage === 'needs-onboarding') return \u003cRedirect href=\"/(onboarding)/basics\" />;\n\n  return (\n    \u003cTabs\n      screenOptions={{\n        headerShown: false,\n        tabBarActiveTintColor: colors.primary,\n        tabBarInactiveTintColor: colors.textSubtle,\n        tabBarStyle: {\n          backgroundColor: colors.background,\n          borderTopColor: colors.border,\n        },\n        tabBarLabelStyle: typography.caption,\n        sceneStyle: { backgroundColor: colors.background },\n      }}\n    >\n      \u003cTabs.Screen\n        name=\"index\"\n        options={{ title: 'Discover', tabBarIcon: ({ color }) => \u003cGlyph glyph=\"◎\" color={color} /> }}\n      />\n      \u003cTabs.Screen\n        name=\"matches\"\n        options={{ title: 'Matches', tabBarIcon: ({ color }) => \u003cGlyph glyph=\"♥\" color={color} /> }}\n      />\n      \u003cTabs.Screen\n        name=\"profile\"\n        options={{ title: 'You', tabBarIcon: ({ color }) => \u003cGlyph glyph=\"☺\" color={color} /> }}\n      />\n    \u003c/Tabs>\n  );\n}\n\nfunction Glyph({ glyph, color }: { glyph: string; color: ColorValue }) {\n  return \u003cText style={{ color, fontSize: 20 }}>{glyph}\u003c/Text>;\n}\n"}, {"p": "frontend/app/(tabs)/index.tsx", "l": "typescript", "n": 103, "c": "import { useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { ActivityIndicator, StyleSheet, Text, View } from 'react-native';\n\nimport { MatchCelebration } from '@/components/discover/MatchCelebration';\nimport { ProfileCard } from '@/components/discover/ProfileCard';\nimport { SwipeControls } from '@/components/discover/SwipeControls';\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { EmptyState } from '@/components/ui/EmptyState';\nimport { Screen } from '@/components/ui/Screen';\nimport { useDiscoverDeck } from '@/hooks/useDiscoverDeck';\nimport { colors, spacing, typography } from '@/theme/tokens';\nimport type { PublicProfile, SwipeAction } from '@/types/models';\n\nexport default function Discover() {\n  const router = useRouter();\n  const deck = useDiscoverDeck();\n  const [celebrating, setCelebrating] = useState\u003c{ profile: PublicProfile; matchId: string } | null>(\n    null,\n  );\n\n  const onSwipe = async (action: SwipeAction) => {\n    const swiped = deck.current;\n    if (!swiped) return;\n    const result = await deck.swipe(action);\n    if (result?.is_match && result.match_id) {\n      setCelebrating({ profile: swiped.profile, matchId: result.match_id });\n    }\n  };\n\n  return (\n    \u003cScreen padded={false}>\n      \u003cView style={styles.header}>\n        \u003cText style={styles.wordmark}>NearMatch\u003c/Text>\n      \u003c/View>\n\n      {deck.error ? \u003cBanner message={deck.error} onDismiss={deck.clearError} /> : null}\n\n      \u003cView style={styles.deck}>\n        {deck.loading ? (\n          \u003cView style={styles.center}>\n            \u003cActivityIndicator color={colors.primary} />\n          \u003c/View>\n        ) : deck.current ? (\n          \u003cProfileCard\n            card={deck.current}\n            onOpenProfile={() =>\n              router.push({\n                pathname: '/profile/[userId]',\n                params: { userId: deck.current!.profile.id },\n              })\n            }\n          />\n        ) : (\n          \u003cEmptyState\n            title=\"That's everyone nearby\"\n            body={\n              deck.suggestion ??\n              'Widen your distance or age range and more people will show up here.'\n            }\n            actionLabel=\"Adjust filters\"\n            onAction={() => router.push('/settings/preferences')}\n          />\n        )}\n      \u003c/View>\n\n      {deck.current ? (\n        \u003cView style={styles.controls}>\n          \u003cSwipeControls\n            onSwipe={onSwipe}\n            disabled={deck.loading}\n            remainingLikes={deck.remainingLikes}\n          />\n        \u003c/View>\n      ) : (\n        \u003cView style={styles.controls}>\n          \u003cButton label=\"Refresh\" onPress={deck.reload} variant=\"secondary\" fullWidth={false} />\n        \u003c/View>\n      )}\n\n      \u003cMatchCelebration\n        visible={celebrating !== null}\n        profile={celebrating?.profile ?? null}\n        onMessage={() => {\n          const matchId = celebrating?.matchId;\n          setCelebrating(null);\n          if (matchId) router.push({ pathname: '/chat/[matchId]', params: { matchId } });\n        }}\n        onKeepSwiping={() => setCelebrating(null)}\n      />\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  header: { paddingHorizontal: spacing.base, paddingVertical: spacing.sm },\n  wordmark: { ...typography.heading, color: colors.primary },\n  deck: { flex: 1, paddingHorizontal: spacing.base, paddingBottom: spacing.md },\n  center: { flex: 1, alignItems: 'center', justifyContent: 'center' },\n  controls: { paddingVertical: spacing.base, alignItems: 'center' },\n});\n"}, {"p": "frontend/app/(tabs)/matches.tsx", "l": "typescript", "n": 77, "c": "import { useRouter } from 'expo-router';\nimport { ActivityIndicator, FlatList, RefreshControl, StyleSheet, Text, View } from 'react-native';\n\nimport { MatchRow } from '@/components/matches/MatchRow';\nimport { NewMatchStrip } from '@/components/matches/NewMatchStrip';\nimport { Banner } from '@/components/ui/Banner';\nimport { EmptyState } from '@/components/ui/EmptyState';\nimport { Screen } from '@/components/ui/Screen';\nimport { useMatches } from '@/hooks/useMatches';\nimport { colors, spacing, typography } from '@/theme/tokens';\n\nexport default function Matches() {\n  const router = useRouter();\n  const { newMatches, conversations, loading, error, reload } = useMatches();\n\n  const openChat = (matchId: string) =>\n    router.push({ pathname: '/chat/[matchId]', params: { matchId } });\n\n  if (loading) {\n    return (\n      \u003cScreen>\n        \u003cView style={styles.center}>\n          \u003cActivityIndicator color={colors.primary} />\n        \u003c/View>\n      \u003c/Screen>\n    );\n  }\n\n  return (\n    \u003cScreen padded={false}>\n      \u003cView style={styles.header}>\n        \u003cText style={styles.title}>Matches\u003c/Text>\n      \u003c/View>\n\n      {error ? \u003cBanner message={error} /> : null}\n\n      \u003cFlatList\n        data={conversations}\n        keyExtractor={(item) => item.id}\n        refreshControl={\n          \u003cRefreshControl refreshing={false} onRefresh={reload} tintColor={colors.primary} />\n        }\n        ListHeaderComponent={\u003cNewMatchStrip matches={newMatches} onPress={openChat} />}\n        renderItem={({ item }) => \u003cMatchRow match={item} onPress={() => openChat(item.id)} />}\n        ItemSeparatorComponent={() => \u003cView style={styles.separator} />}\n        ListEmptyComponent={\n          newMatches.length ? (\n            \u003cView style={styles.hint}>\n              \u003cText style={styles.hintText}>\n                Start a conversation with one of your new matches above.\n              \u003c/Text>\n            \u003c/View>\n          ) : (\n            \u003cEmptyState\n              title=\"No matches yet\"\n              body=\"Keep swiping in Discover. When someone likes you back, they land here.\"\n              actionLabel=\"Go to Discover\"\n              onAction={() => router.push('/(tabs)')}\n            />\n          )\n        }\n        contentContainerStyle={conversations.length ? undefined : styles.emptyContainer}\n      />\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  header: { paddingHorizontal: spacing.base, paddingVertical: spacing.sm },\n  title: { ...typography.title, color: colors.text },\n  center: { flex: 1, alignItems: 'center', justifyContent: 'center' },\n  separator: { height: 1, backgroundColor: colors.border, marginLeft: 84 },\n  emptyContainer: { flexGrow: 1 },\n  hint: { padding: spacing.lg },\n  hintText: { ...typography.body, color: colors.textMuted, textAlign: 'center' },\n});\n"}, {"p": "frontend/app/(tabs)/profile.tsx", "l": "typescript", "n": 138, "c": "import { Image } from 'expo-image';\nimport { useRouter } from 'expo-router';\nimport { ScrollView, StyleSheet, Text, View } from 'react-native';\n\nimport { Button } from '@/components/ui/Button';\nimport { Chip } from '@/components/ui/Chip';\nimport { Screen } from '@/components/ui/Screen';\nimport { useAuth } from '@/context/AuthProvider';\nimport { prettyInterest } from '@/lib/format';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\nexport default function MyProfileTab() {\n  const router = useRouter();\n  const { profile, signOut } = useAuth();\n\n  if (!profile) return null;\n\n  const photoCount = profile.photos.length;\n  const completeness = Math.round(\n    (Math.min(1, photoCount / 3) * 0.5 +\n      Math.min(1, profile.bio.length / 140) * 0.3 +\n      Math.min(1, profile.interests.length / 5) * 0.2) *\n      100,\n  );\n\n  return (\n    \u003cScreen padded={false}>\n      \u003cScrollView contentContainerStyle={styles.scroll}>\n        \u003cView style={styles.hero}>\n          {profile.photos[0]?.url ? (\n            \u003cImage source={{ uri: profile.photos[0].url }} style={styles.heroPhoto} contentFit=\"cover\" />\n          ) : (\n            \u003cView style={[styles.heroPhoto, styles.heroFallback]}>\n              \u003cText style={styles.heroFallbackText}>Add a photo\u003c/Text>\n            \u003c/View>\n          )}\n          \u003cText style={styles.name}>\n            {profile.display_name}, {profile.age}\n          \u003c/Text>\n          {profile.job_title ? \u003cText style={styles.job}>{profile.job_title}\u003c/Text> : null}\n          {profile.city ? \u003cText style={styles.city}>{profile.city}\u003c/Text> : null}\n        \u003c/View>\n\n        {completeness \u003c 100 ? (\n          \u003cView style={styles.nudge}>\n            \u003cText style={styles.nudgeTitle}>Profile {completeness}% complete\u003c/Text>\n            \u003cText style={styles.nudgeBody}>\n              {photoCount \u003c 3\n                ? `Add ${3 - photoCount} more photo${3 - photoCount === 1 ? '' : 's'} — it is the single biggest thing you can do for your matches.`\n                : profile.bio.length \u003c 140\n                  ? 'A fuller bio gives people something to open with.'\n                  : 'Add a few more interests to sharpen your matches.'}\n            \u003c/Text>\n          \u003c/View>\n        ) : null}\n\n        {!profile.has_location ? (\n          \u003cView style={[styles.nudge, styles.nudgeWarn]}>\n            \u003cText style={styles.nudgeTitle}>Location is off\u003c/Text>\n            \u003cText style={styles.nudgeBody}>\n              Discovery is sorted by distance, so nothing will show until you share your location.\n            \u003c/Text>\n          \u003c/View>\n        ) : null}\n\n        {profile.bio ? (\n          \u003cSection title=\"About\">\n            \u003cText style={styles.body}>{profile.bio}\u003c/Text>\n          \u003c/Section>\n        ) : null}\n\n        {profile.interests.length ? (\n          \u003cSection title=\"Interests\">\n            \u003cView style={styles.chips}>\n              {profile.interests.map((tag) => (\n                \u003cChip key={tag} label={prettyInterest(tag)} tone=\"accent\" />\n              ))}\n            \u003c/View>\n          \u003c/Section>\n        ) : null}\n\n        \u003cView style={styles.actions}>\n          \u003cButton label=\"Edit profile\" onPress={() => router.push('/settings/edit-profile')} />\n          \u003cButton\n            label=\"Discovery settings\"\n            onPress={() => router.push('/settings/preferences')}\n            variant=\"secondary\"\n          />\n          \u003cButton label=\"Settings\" onPress={() => router.push('/settings')} variant=\"secondary\" />\n          \u003cButton label=\"Sign out\" onPress={signOut} variant=\"ghost\" />\n        \u003c/View>\n      \u003c/ScrollView>\n    \u003c/Screen>\n  );\n}\n\nfunction Section({ title, children }: { title: string; children: React.ReactNode }) {\n  return (\n    \u003cView style={styles.section}>\n      \u003cText style={styles.sectionTitle}>{title}\u003c/Text>\n      {children}\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  scroll: { paddingBottom: spacing.xl },\n  hero: { alignItems: 'center', gap: spacing.xs, paddingTop: spacing.base },\n  heroPhoto: {\n    width: 128,\n    height: 128,\n    borderRadius: 64,\n    backgroundColor: colors.surfaceSunken,\n    marginBottom: spacing.sm,\n  },\n  heroFallback: { alignItems: 'center', justifyContent: 'center' },\n  heroFallbackText: { ...typography.caption, color: colors.textSubtle },\n  name: { ...typography.title, color: colors.text },\n  job: { ...typography.label, color: colors.secondary },\n  city: { ...typography.caption, color: colors.textSubtle },\n  nudge: {\n    margin: spacing.base,\n    marginBottom: 0,\n    padding: spacing.base,\n    borderRadius: radius.md,\n    backgroundColor: colors.secondarySoft,\n    gap: spacing.xs,\n  },\n  nudgeWarn: { backgroundColor: colors.warningSoft },\n  nudgeTitle: { ...typography.bodyStrong, color: colors.text },\n  nudgeBody: { ...typography.label, color: colors.textMuted },\n  section: { paddingHorizontal: spacing.base, paddingTop: spacing.lg, gap: spacing.sm },\n  sectionTitle: { ...typography.caption, color: colors.textMuted, textTransform: 'uppercase' },\n  body: { ...typography.body, color: colors.text },\n  chips: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.sm },\n  actions: { padding: spacing.base, paddingTop: spacing.xl, gap: spacing.sm },\n});\n"}, {"p": "frontend/app/+not-found.tsx", "l": "typescript", "n": 31, "c": "import { useRouter } from 'expo-router';\nimport { StyleSheet, Text, View } from 'react-native';\n\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { colors, spacing, typography } from '@/theme/tokens';\n\nexport default function NotFound() {\n  const router = useRouter();\n\n  return (\n    \u003cScreen>\n      \u003cView style={styles.body}>\n        \u003cText style={styles.title}>That page does not exist\u003c/Text>\n        \u003cText style={styles.sub}>The link may be old or mistyped.\u003c/Text>\n        \u003cButton\n          label=\"Back to Discover\"\n          onPress={() => router.replace('/(tabs)')}\n          fullWidth={false}\n        />\n      \u003c/View>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  body: { flex: 1, alignItems: 'center', justifyContent: 'center', gap: spacing.base },\n  title: { ...typography.heading, color: colors.text, textAlign: 'center' },\n  sub: { ...typography.body, color: colors.textMuted, textAlign: 'center' },\n});\n"}, {"p": "frontend/app/_layout.tsx", "l": "typescript", "n": 56, "c": "import { Stack } from 'expo-router';\nimport { StatusBar } from 'expo-status-bar';\nimport * as SplashScreen from 'expo-splash-screen';\nimport { useEffect } from 'react';\nimport { GestureHandlerRootView } from 'react-native-gesture-handler';\nimport { SafeAreaProvider } from 'react-native-safe-area-context';\n\nimport { AuthProvider, useAuth } from '@/context/AuthProvider';\nimport { colors } from '@/theme/tokens';\n\nvoid SplashScreen.preventAutoHideAsync();\n\nfunction RootNavigator() {\n  const { stage } = useAuth();\n\n  useEffect(() => {\n    if (stage !== 'loading') void SplashScreen.hideAsync();\n  }, [stage]);\n\n  if (stage === 'loading') return null;\n\n  return (\n    \u003cStack\n      screenOptions={{\n        headerShown: false,\n        contentStyle: { backgroundColor: colors.background },\n        animation: 'slide_from_right',\n      }}\n    >\n      {/* Guards live in each group's layout, so a deep link cannot skip them. */}\n      \u003cStack.Screen name=\"(auth)\" />\n      \u003cStack.Screen name=\"(onboarding)\" />\n      \u003cStack.Screen name=\"(tabs)\" />\n      \u003cStack.Screen name=\"chat/[matchId]\" options={{ animation: 'slide_from_bottom' }} />\n      \u003cStack.Screen name=\"profile/[userId]\" options={{ presentation: 'modal' }} />\n      \u003cStack.Screen name=\"settings/index\" />\n      \u003cStack.Screen name=\"settings/preferences\" />\n      \u003cStack.Screen name=\"settings/edit-profile\" />\n      \u003cStack.Screen name=\"settings/blocked\" />\n    \u003c/Stack>\n  );\n}\n\nexport default function RootLayout() {\n  return (\n    \u003cGestureHandlerRootView style={{ flex: 1 }}>\n      \u003cSafeAreaProvider>\n        \u003cAuthProvider>\n          \u003cStatusBar style=\"dark\" />\n          \u003cRootNavigator />\n        \u003c/AuthProvider>\n      \u003c/SafeAreaProvider>\n    \u003c/GestureHandlerRootView>\n  );\n}\n"}, {"p": "frontend/app/chat/[matchId].tsx", "l": "typescript", "n": 164, "c": "import { useLocalSearchParams, useRouter } from 'expo-router';\nimport { useEffect, useMemo, useRef } from 'react';\nimport {\n  ActivityIndicator,\n  FlatList,\n  KeyboardAvoidingView,\n  Platform,\n  Pressable,\n  StyleSheet,\n  Text,\n  View,\n} from 'react-native';\nimport { SafeAreaView } from 'react-native-safe-area-context';\n\nimport { Composer } from '@/components/chat/Composer';\nimport { MessageBubble } from '@/components/chat/MessageBubble';\nimport { Avatar } from '@/components/ui/Avatar';\nimport { Banner } from '@/components/ui/Banner';\nimport { useAuth } from '@/context/AuthProvider';\nimport { useChat } from '@/hooks/useChat';\nimport { useMatches } from '@/hooks/useMatches';\nimport { dayLabel } from '@/lib/format';\nimport { colors, spacing, typography } from '@/theme/tokens';\n\nexport default function Chat() {\n  const { matchId } = useLocalSearchParams\u003c{ matchId: string }>();\n  const router = useRouter();\n  const { profile } = useAuth();\n  const { matches } = useMatches();\n  const listRef = useRef\u003cFlatList>(null);\n\n  const match = matches.find((m) => m.id === matchId);\n  const { messages, loading, sending, error, send, retry } = useChat(matchId!, profile?.id);\n\n  // Insert day separators without mutating the message list.\n  const rows = useMemo(() => {\n    const out: ({ kind: 'day'; key: string; label: string } | { kind: 'message'; key: string; message: (typeof messages)[number] })[] = [];\n    let lastDay = '';\n    for (const message of messages) {\n      const label = dayLabel(message.sent_at);\n      if (label !== lastDay) {\n        out.push({ kind: 'day', key: `day-${label}-${message.id}`, label });\n        lastDay = label;\n      }\n      out.push({ kind: 'message', key: message.id, message });\n    }\n    return out;\n  }, [messages]);\n\n  useEffect(() => {\n    if (rows.length) {\n      requestAnimationFrame(() => listRef.current?.scrollToEnd({ animated: true }));\n    }\n  }, [rows.length]);\n\n  return (\n    \u003cSafeAreaView style={styles.safe} edges={['top', 'bottom']}>\n      \u003cView style={styles.header}>\n        \u003cPressable onPress={() => router.back()} hitSlop={12} accessibilityLabel=\"Back\">\n          \u003cText style={styles.back}>‹\u003c/Text>\n        \u003c/Pressable>\n\n        {match ? (\n          \u003cPressable\n            style={styles.headerIdentity}\n            onPress={() =>\n              router.push({ pathname: '/profile/[userId]', params: { userId: match.other.id } })\n            }\n            accessibilityRole=\"button\"\n            accessibilityLabel={`View ${match.other.display_name}'s profile`}\n          >\n            \u003cAvatar uri={match.other.photos[0]?.url} name={match.other.display_name} size={34} />\n            \u003cView>\n              \u003cText style={styles.headerName}>{match.other.display_name}\u003c/Text>\n              {match.other.last_active_label ? (\n                \u003cText style={styles.headerStatus}>{match.other.last_active_label}\u003c/Text>\n              ) : null}\n            \u003c/View>\n          \u003c/Pressable>\n        ) : (\n          \u003cText style={styles.headerName}>Chat\u003c/Text>\n        )}\n      \u003c/View>\n\n      {error ? \u003cBanner message={error} /> : null}\n\n      \u003cKeyboardAvoidingView\n        style={styles.flex}\n        behavior={Platform.OS === 'ios' ? 'padding' : undefined}\n      >\n        {loading ? (\n          \u003cView style={styles.center}>\n            \u003cActivityIndicator color={colors.primary} />\n          \u003c/View>\n        ) : (\n          \u003cFlatList\n            ref={listRef}\n            data={rows}\n            keyExtractor={(row) => row.key}\n            contentContainerStyle={styles.list}\n            renderItem={({ item }) =>\n              item.kind === 'day' ? (\n                \u003cText style={styles.day}>{item.label}\u003c/Text>\n              ) : (\n                \u003cMessageBubble\n                  message={item.message}\n                  onRetry={\n                    item.message.failed && item.message.client_id\n                      ? () => retry(item.message.client_id!)\n                      : undefined\n                  }\n                />\n              )\n            }\n            ListEmptyComponent={\n              \u003cView style={styles.opener}>\n                \u003cText style={styles.openerTitle}>\n                  You matched with {match?.other.display_name ?? 'them'}\n                \u003c/Text>\n                \u003cText style={styles.openerBody}>\n                  {match?.other.interests.length\n                    ? `Ask about ${match.other.interests[0]} — it is on their profile.`\n                    : 'Open with something about their profile, not just \"hey\".'}\n                \u003c/Text>\n              \u003c/View>\n            }\n          />\n        )}\n\n        \u003cComposer onSend={send} sending={sending} />\n      \u003c/KeyboardAvoidingView>\n    \u003c/SafeAreaView>\n  );\n}\n\nconst styles = StyleSheet.create({\n  safe: { flex: 1, backgroundColor: colors.background },\n  flex: { flex: 1 },\n  header: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    gap: spacing.md,\n    paddingHorizontal: spacing.base,\n    paddingBottom: spacing.sm,\n    borderBottomWidth: 1,\n    borderBottomColor: colors.border,\n  },\n  back: { fontSize: 32, lineHeight: 34, color: colors.primary },\n  headerIdentity: { flexDirection: 'row', alignItems: 'center', gap: spacing.sm, flex: 1 },\n  headerName: { ...typography.bodyStrong, color: colors.text },\n  headerStatus: { ...typography.caption, color: colors.success },\n  center: { flex: 1, alignItems: 'center', justifyContent: 'center' },\n  list: { paddingVertical: spacing.base, flexGrow: 1 },\n  day: {\n    ...typography.caption,\n    color: colors.textSubtle,\n    textAlign: 'center',\n    marginVertical: spacing.md,\n  },\n  opener: { flex: 1, justifyContent: 'center', padding: spacing.lg, gap: spacing.sm },\n  openerTitle: { ...typography.heading, color: colors.text, textAlign: 'center' },\n  openerBody: { ...typography.body, color: colors.textMuted, textAlign: 'center' },\n});\n"}, {"p": "frontend/app/index.tsx", "l": "typescript", "n": 13, "c": "import { Redirect } from 'expo-router';\n\nimport { useAuth } from '@/context/AuthProvider';\n\n/** Entry point: sends each session to the right place and nowhere else. */\nexport default function Index() {\n  const { stage } = useAuth();\n\n  if (stage === 'signed-out') return \u003cRedirect href=\"/(auth)/sign-in\" />;\n  if (stage === 'needs-onboarding') return \u003cRedirect href=\"/(onboarding)/basics\" />;\n  return \u003cRedirect href=\"/(tabs)\" />;\n}\n"}, {"p": "frontend/app/profile/[userId].tsx", "l": "typescript", "n": 168, "c": "import { Image } from 'expo-image';\nimport { useLocalSearchParams, useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { Alert, ScrollView, StyleSheet, Text, View } from 'react-native';\n\nimport { Button } from '@/components/ui/Button';\nimport { Chip } from '@/components/ui/Chip';\nimport { Screen } from '@/components/ui/Screen';\nimport { useMatches } from '@/hooks/useMatches';\nimport { api } from '@/lib/api';\nimport { REPORT_REASONS } from '@/lib/constants';\nimport { prettyInterest } from '@/lib/format';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\nimport type { ReportReason } from '@/types/models';\n\n/**\n * Full profile for someone you are matched with.\n *\n * Report and block live here because this is where a user looks when something\n * feels wrong — not buried in a settings menu.\n */\nexport default function ProfileDetail() {\n  const { userId } = useLocalSearchParams\u003c{ userId: string }>();\n  const router = useRouter();\n  const { matches } = useMatches();\n  const [busy, setBusy] = useState(false);\n\n  const match = matches.find((m) => m.other.id === userId);\n  const person = match?.other;\n\n  const confirmBlock = () => {\n    if (!userId) return;\n    Alert.alert(\n      'Block this person?',\n      'They will not see you in Discover and your conversation will close. This cannot be undone from the app.',\n      [\n        { text: 'Cancel', style: 'cancel' },\n        {\n          text: 'Block',\n          style: 'destructive',\n          onPress: async () => {\n            setBusy(true);\n            try {\n              await api.block(userId);\n              router.replace('/(tabs)/matches');\n            } finally {\n              setBusy(false);\n            }\n          },\n        },\n      ],\n    );\n  };\n\n  const openReport = () => {\n    if (!userId) return;\n    Alert.alert('Report this profile', 'What is the problem?', [\n      ...REPORT_REASONS.map((reason) => ({\n        text: reason.label,\n        onPress: async () => {\n          setBusy(true);\n          try {\n            await api.report(userId, reason.value as ReportReason, undefined, true);\n            Alert.alert(\n              'Thanks for telling us',\n              'Our team will review this profile. They have also been blocked.',\n            );\n            router.replace('/(tabs)/matches');\n          } finally {\n            setBusy(false);\n          }\n        },\n      })),\n      { text: 'Cancel', style: 'cancel' as const },\n    ]);\n  };\n\n  if (!person) {\n    return (\n      \u003cScreen>\n        \u003cView style={styles.center}>\n          \u003cText style={styles.unavailable}>This profile is not available.\u003c/Text>\n          \u003cButton label=\"Go back\" onPress={() => router.back()} variant=\"secondary\" fullWidth={false} />\n        \u003c/View>\n      \u003c/Screen>\n    );\n  }\n\n  return (\n    \u003cScreen padded={false}>\n      \u003cScrollView contentContainerStyle={styles.scroll}>\n        {person.photos.filter((p) => p.url).map((photo) => (\n          \u003cImage\n            key={photo.id}\n            source={{ uri: photo.url! }}\n            style={styles.photo}\n            contentFit=\"cover\"\n            transition={200}\n            accessibilityLabel={`Photo of ${person.display_name}`}\n          />\n        ))}\n\n        \u003cView style={styles.body}>\n          \u003cText style={styles.name}>\n            {person.display_name}, {person.age}\n          \u003c/Text>\n          \u003cText style={styles.meta}>\n            {person.distance_label}\n            {person.city ? ` · ${person.city}` : ''}\n          \u003c/Text>\n          {person.job_title ? \u003cText style={styles.job}>{person.job_title}\u003c/Text> : null}\n\n          {person.bio ? (\n            \u003cView style={styles.section}>\n              \u003cText style={styles.sectionTitle}>About\u003c/Text>\n              \u003cText style={styles.text}>{person.bio}\u003c/Text>\n            \u003c/View>\n          ) : null}\n\n          {person.interests.length ? (\n            \u003cView style={styles.section}>\n              \u003cText style={styles.sectionTitle}>Interests\u003c/Text>\n              \u003cView style={styles.chips}>\n                {person.interests.map((tag) => (\n                  \u003cChip key={tag} label={prettyInterest(tag)} tone=\"accent\" />\n                ))}\n              \u003c/View>\n            \u003c/View>\n          ) : null}\n\n          \u003cView style={styles.actions}>\n            \u003cButton\n              label=\"Send a message\"\n              onPress={() =>\n                router.replace({ pathname: '/chat/[matchId]', params: { matchId: match!.id } })\n              }\n            />\n            \u003cButton label=\"Report\" onPress={openReport} variant=\"ghost\" disabled={busy} />\n            \u003cButton label=\"Block\" onPress={confirmBlock} variant=\"danger\" disabled={busy} />\n          \u003c/View>\n        \u003c/View>\n      \u003c/ScrollView>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  scroll: { paddingBottom: spacing.xl },\n  photo: {\n    width: '100%',\n    aspectRatio: 0.85,\n    backgroundColor: colors.surfaceSunken,\n    marginBottom: spacing.xs,\n  },\n  body: { padding: spacing.base, gap: spacing.xs },\n  name: { ...typography.title, color: colors.text },\n  meta: { ...typography.caption, color: colors.textSubtle },\n  job: { ...typography.label, color: colors.secondary },\n  section: { paddingTop: spacing.lg, gap: spacing.sm },\n  sectionTitle: { ...typography.caption, color: colors.textMuted, textTransform: 'uppercase' },\n  text: { ...typography.body, color: colors.text },\n  chips: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.sm },\n  actions: { paddingTop: spacing.xl, gap: spacing.sm },\n  center: { flex: 1, alignItems: 'center', justifyContent: 'center', gap: spacing.base },\n  unavailable: { ...typography.body, color: colors.textMuted },\n  radius: { borderRadius: radius.md },\n});\n"}, {"p": "frontend/app/settings/blocked.tsx", "l": "typescript", "n": 96, "c": "import { useRouter } from 'expo-router';\nimport { useEffect, useState } from 'react';\nimport { ActivityIndicator, FlatList, Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { EmptyState } from '@/components/ui/EmptyState';\nimport { Screen } from '@/components/ui/Screen';\nimport { api } from '@/lib/api';\nimport { colors, spacing, typography } from '@/theme/tokens';\n\ntype Blocked = { blocked_id: string; display_name: string; created_at: string };\n\nexport default function BlockedList() {\n  const router = useRouter();\n  const [people, setPeople] = useState\u003cBlocked[]>([]);\n  const [loading, setLoading] = useState(true);\n\n  useEffect(() => {\n    api\n      .listBlocked()\n      .then(setPeople)\n      .catch(() => setPeople([]))\n      .finally(() => setLoading(false));\n  }, []);\n\n  const unblock = async (id: string) => {\n    setPeople((prev) => prev.filter((p) => p.blocked_id !== id));\n    try {\n      await api.unblock(id);\n    } catch {\n      setPeople(await api.listBlocked());\n    }\n  };\n\n  if (loading) {\n    return (\n      \u003cScreen>\n        \u003cView style={styles.center}>\n          \u003cActivityIndicator color={colors.primary} />\n        \u003c/View>\n      \u003c/Screen>\n    );\n  }\n\n  return (\n    \u003cScreen>\n      \u003cPressable onPress={() => router.back()} hitSlop={12} accessibilityLabel=\"Back\">\n        \u003cText style={styles.back}>‹ Back\u003c/Text>\n      \u003c/Pressable>\n      \u003cText style={styles.title}>Blocked people\u003c/Text>\n\n      \u003cFlatList\n        data={people}\n        keyExtractor={(item) => item.blocked_id}\n        renderItem={({ item }) => (\n          \u003cView style={styles.row}>\n            \u003cText style={styles.name}>{item.display_name}\u003c/Text>\n            \u003cPressable\n              onPress={() => unblock(item.blocked_id)}\n              hitSlop={8}\n              accessibilityRole=\"button\"\n              accessibilityLabel={`Unblock ${item.display_name}`}\n            >\n              \u003cText style={styles.action}>Unblock\u003c/Text>\n            \u003c/Pressable>\n          \u003c/View>\n        )}\n        ListEmptyComponent={\n          \u003cEmptyState title=\"Nobody blocked\" body=\"People you block will be listed here.\" />\n        }\n        contentContainerStyle={people.length ? styles.list : styles.emptyList}\n      />\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  center: { flex: 1, alignItems: 'center', justifyContent: 'center' },\n  back: { ...typography.body, color: colors.primary, paddingTop: spacing.base },\n  title: { ...typography.title, color: colors.text, paddingVertical: spacing.base },\n  list: { gap: spacing.sm },\n  emptyList: { flexGrow: 1 },\n  row: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'space-between',\n    minHeight: 48,\n    paddingHorizontal: spacing.base,\n    borderRadius: 12,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n  },\n  name: { ...typography.body, color: colors.text },\n  action: { ...typography.label, color: colors.primary },\n});\n"}, {"p": "frontend/app/settings/edit-profile.tsx", "l": "typescript", "n": 177, "c": "import { useRouter } from 'expo-router';\nimport { useState } from 'react';\nimport { ScrollView, StyleSheet, Text, TextInput, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Button } from '@/components/ui/Button';\nimport { Chip } from '@/components/ui/Chip';\nimport { Screen } from '@/components/ui/Screen';\nimport { useAuth } from '@/context/AuthProvider';\nimport { ApiError, api } from '@/lib/api';\nimport { BIO_MAX, INTEREST_SUGGESTIONS, MAX_INTERESTS } from '@/lib/constants';\nimport { captureAndSyncLocation } from '@/lib/location';\nimport { prettyInterest } from '@/lib/format';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\n\nexport default function EditProfile() {\n  const router = useRouter();\n  const { profile, refreshProfile } = useAuth();\n\n  const [name, setName] = useState(profile?.display_name ?? '');\n  const [bio, setBio] = useState(profile?.bio ?? '');\n  const [job, setJob] = useState(profile?.job_title ?? '');\n  const [interests, setInterests] = useState\u003cstring[]>(profile?.interests ?? []);\n  const [busy, setBusy] = useState(false);\n  const [error, setError] = useState\u003cstring | null>(null);\n  const [saved, setSaved] = useState(false);\n\n  const toggleInterest = (tag: string) =>\n    setInterests((prev) =>\n      prev.includes(tag)\n        ? prev.filter((t) => t !== tag)\n        : prev.length >= MAX_INTERESTS\n          ? prev\n          : [...prev, tag],\n    );\n\n  const save = async () => {\n    if (name.trim().length \u003c 2) {\n      setError('Enter your name.');\n      return;\n    }\n    setBusy(true);\n    setError(null);\n    try {\n      await api.patchProfile({\n        display_name: name.trim(),\n        bio: bio.trim(),\n        job_title: job.trim() || null,\n        interests,\n      });\n      await refreshProfile();\n      setSaved(true);\n      router.back();\n    } catch (err) {\n      setError(err instanceof ApiError ? err.message : 'Could not save your changes.');\n    } finally {\n      setBusy(false);\n    }\n  };\n\n  const refreshLocation = async () => {\n    setBusy(true);\n    const outcome = await captureAndSyncLocation();\n    setBusy(false);\n    if (outcome.status === 'granted') {\n      await refreshProfile();\n      setError(null);\n    } else {\n      setError('Location access is off. Turn it on in your device settings.');\n    }\n  };\n\n  return (\n    \u003cScreen>\n      \u003cScrollView contentContainerStyle={styles.scroll} keyboardShouldPersistTaps=\"handled\">\n        \u003cText style={styles.title}>Edit profile\u003c/Text>\n\n        {error ? \u003cBanner message={error} onDismiss={() => setError(null)} /> : null}\n        {saved ? \u003cBanner message=\"Saved.\" tone=\"success\" /> : null}\n\n        \u003cView style={styles.field}>\n          \u003cText style={styles.label}>Name\u003c/Text>\n          \u003cTextInput\n            value={name}\n            onChangeText={setName}\n            style={styles.input}\n            maxLength={40}\n            accessibilityLabel=\"Name\"\n          />\n        \u003c/View>\n\n        \u003cView style={styles.field}>\n          \u003cText style={styles.label}>Work\u003c/Text>\n          \u003cTextInput\n            value={job}\n            onChangeText={setJob}\n            style={styles.input}\n            maxLength={60}\n            placeholder=\"Optional\"\n            placeholderTextColor={colors.textSubtle}\n            accessibilityLabel=\"Job title\"\n          />\n        \u003c/View>\n\n        \u003cView style={styles.field}>\n          \u003cView style={styles.fieldHead}>\n            \u003cText style={styles.label}>About you\u003c/Text>\n            \u003cText style={styles.hint}>\n              {bio.length}/{BIO_MAX}\n            \u003c/Text>\n          \u003c/View>\n          \u003cTextInput\n            value={bio}\n            onChangeText={(text) => setBio(text.slice(0, BIO_MAX))}\n            style={[styles.input, styles.textarea]}\n            multiline\n            accessibilityLabel=\"About you\"\n          />\n        \u003c/View>\n\n        \u003cView style={styles.field}>\n          \u003cText style={styles.label}>Interests\u003c/Text>\n          \u003cView style={styles.chipRow}>\n            {Array.from(new Set([...interests, ...INTEREST_SUGGESTIONS])).map((tag) => (\n              \u003cChip\n                key={tag}\n                label={prettyInterest(tag)}\n                selected={interests.includes(tag)}\n                onPress={() => toggleInterest(tag)}\n              />\n            ))}\n          \u003c/View>\n        \u003c/View>\n\n        \u003cView style={styles.field}>\n          \u003cText style={styles.label}>Location\u003c/Text>\n          \u003cText style={styles.hint}>\n            {profile?.has_location\n              ? `Set${profile.city ? ` to ${profile.city}` : ''}. Refresh it when you move.`\n              : 'Not set. Discovery needs this.'}\n          \u003c/Text>\n          \u003cButton\n            label={profile?.has_location ? 'Refresh my location' : 'Set my location'}\n            onPress={refreshLocation}\n            variant=\"secondary\"\n            disabled={busy}\n          />\n        \u003c/View>\n\n        \u003cButton label=\"Save changes\" onPress={save} loading={busy} />\n        \u003cButton label=\"Cancel\" onPress={() => router.back()} variant=\"ghost\" />\n      \u003c/ScrollView>\n    \u003c/Screen>\n  );\n}\n\nconst styles = StyleSheet.create({\n  scroll: { paddingVertical: spacing.base, gap: spacing.lg },\n  title: { ...typography.title, color: colors.text },\n  field: { gap: spacing.sm },\n  fieldHead: { flexDirection: 'row', justifyContent: 'space-between', alignItems: 'baseline' },\n  label: { ...typography.label, color: colors.text },\n  hint: { ...typography.caption, color: colors.textSubtle },\n  input: {\n    minHeight: 48,\n    paddingHorizontal: spacing.base,\n    borderRadius: radius.md,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    ...typography.body,\n    color: colors.text,\n  },\n  textarea: { minHeight: 96, paddingTop: spacing.md, textAlignVertical: 'top' },\n  chipRow: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.sm },\n});\n"}, {"p": "frontend/app/settings/index.tsx", "l": "typescript", "n": 153, "c": "import { useRouter } from 'expo-router';\nimport { Alert, Pressable, ScrollView, StyleSheet, Text, View } from 'react-native';\n\nimport { Button } from '@/components/ui/Button';\nimport { Screen } from '@/components/ui/Screen';\nimport { useAuth } from '@/context/AuthProvider';\nimport { usePreferences } from '@/hooks/usePreferences';\nimport { colors, spacing, typography } from '@/theme/tokens';\n\nexport default function Settings() {\n  const router = useRouter();\n  const { profile, signOut } = useAuth();\n  const { preferences, save, saving } = usePreferences();\n\n  const toggleVisibility = () => {\n    if (!preferences) return;\n    void save({ hide_profile: !preferences.hide_profile });\n  };\n\n  return (\n    \u003cScreen>\n      \u003cScrollView contentContainerStyle={styles.scroll}>\n        \u003cText style={styles.title}>Settings\u003c/Text>\n\n        \u003cGroup title=\"Account\">\n          \u003cRow label=\"Email\" value={profile ? 'Signed in' : '—'} />\n          \u003cRow\n            label=\"Edit profile\"\n            onPress={() => router.push('/settings/edit-profile')}\n            chevron\n          />\n          \u003cRow\n            label=\"Discovery filters\"\n            onPress={() => router.push('/settings/preferences')}\n            chevron\n          />\n        \u003c/Group>\n\n        \u003cGroup title=\"Privacy\">\n          \u003cRow\n            label={preferences?.hide_profile ? 'Profile hidden' : 'Profile visible'}\n            value={preferences?.hide_profile ? 'Tap to show' : 'Tap to hide'}\n            onPress={toggleVisibility}\n            disabled={saving}\n          />\n          \u003cRow label=\"Blocked people\" onPress={() => router.push('/settings/blocked')} chevron />\n          \u003cText style={styles.note}>\n            Your exact location is never stored or shown. Others only see a rounded distance.\n          \u003c/Text>\n        \u003c/Group>\n\n        \u003cGroup title=\"Danger zone\">\n          \u003cButton label=\"Sign out\" onPress={signOut} variant=\"secondary\" />\n          \u003cButton\n            label=\"Delete my account\"\n            variant=\"danger\"\n            onPress={() =>\n              Alert.alert(\n                'Delete your account?',\n                'Your profile, photos, matches and messages are removed. This cannot be undone.',\n                [\n                  { text: 'Cancel', style: 'cancel' },\n                  {\n                    text: 'Delete',\n                    style: 'destructive',\n                    onPress: () =>\n                      Alert.alert(\n                        'Contact support',\n                        'Account deletion is handled by our team so we can confirm it is you. Email support@nearmatch.in from this address.',\n                      ),\n                  },\n                ],\n              )\n            }\n          />\n        \u003c/Group>\n      \u003c/ScrollView>\n    \u003c/Screen>\n  );\n}\n\nfunction Group({ title, children }: { title: string; children: React.ReactNode }) {\n  return (\n    \u003cView style={styles.group}>\n      \u003cText style={styles.groupTitle}>{title}\u003c/Text>\n      \u003cView style={styles.groupBody}>{children}\u003c/View>\n    \u003c/View>\n  );\n}\n\nfunction Row({\n  label,\n  value,\n  onPress,\n  chevron = false,\n  disabled = false,\n}: {\n  label: string;\n  value?: string;\n  onPress?: () => void;\n  chevron?: boolean;\n  disabled?: boolean;\n}) {\n  const content = (\n    \u003cView style={styles.row}>\n      \u003cText style={styles.rowLabel}>{label}\u003c/Text>\n      \u003cView style={styles.rowRight}>\n        {value ? \u003cText style={styles.rowValue}>{value}\u003c/Text> : null}\n        {chevron ? \u003cText style={styles.chevron}>›\u003c/Text> : null}\n      \u003c/View>\n    \u003c/View>\n  );\n\n  if (!onPress) return content;\n\n  return (\n    \u003cPressable\n      onPress={onPress}\n      disabled={disabled}\n      accessibilityRole=\"button\"\n      style={({ pressed }) => [pressed && styles.rowPressed, disabled && styles.rowDisabled]}\n    >\n      {content}\n    \u003c/Pressable>\n  );\n}\n\nconst styles = StyleSheet.create({\n  scroll: { paddingVertical: spacing.base, gap: spacing.lg },\n  title: { ...typography.title, color: colors.text },\n  group: { gap: spacing.sm },\n  groupTitle: { ...typography.caption, color: colors.textMuted, textTransform: 'uppercase' },\n  groupBody: { gap: spacing.sm },\n  row: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'space-between',\n    minHeight: 48,\n    paddingHorizontal: spacing.base,\n    borderRadius: 12,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n  },\n  rowPressed: { opacity: 0.7 },\n  rowDisabled: { opacity: 0.5 },\n  rowLabel: { ...typography.body, color: colors.text },\n  rowRight: { flexDirection: 'row', alignItems: 'center', gap: spacing.sm },\n  rowValue: { ...typography.label, color: colors.textSubtle },\n  chevron: { fontSize: 22, color: colors.textSubtle },\n  note: { ...typography.caption, color: colors.textSubtle, paddingHorizontal: spacing.xs },\n});\n"}, {"p": "frontend/app/settings/preferences.tsx", "l": "typescript", "n": 180, "c": "import { useRouter } from 'expo-router';\nimport { ActivityIndicator, Pressable, ScrollView, StyleSheet, Text, View } from 'react-native';\n\nimport { Banner } from '@/components/ui/Banner';\nimport { Chip } from '@/components/ui/Chip';\nimport { Screen } from '@/components/ui/Screen';\nimport { usePreferences } from '@/hooks/usePreferences';\nimport { MAX_AGE, MIN_AGE, SHOW_ME_OPTIONS } from '@/lib/constants';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\nimport type { InterestedIn } from '@/types/models';\n\nconst DISTANCES = [5, 10, 25, 50, 100, 250, 500];\nconst AGE_STEP = 1;\n\nexport default function PreferencesScreen() {\n  const router = useRouter();\n  const { preferences, loading, saving, error, save } = usePreferences();\n\n  if (loading || !preferences) {\n    return (\n      \u003cScreen>\n        \u003cView style={styles.center}>\n          \u003cActivityIndicator color={colors.primary} />\n        \u003c/View>\n      \u003c/Screen>\n    );\n  }\n\n  const adjust = (field: 'min_age' | 'max_age', delta: number) => {\n    const next = preferences[field] + delta;\n    if (next \u003c MIN_AGE || next > MAX_AGE) return;\n    if (field === 'min_age' && next > preferences.max_age) return;\n    if (field === 'max_age' && next \u003c preferences.min_age) return;\n    void save({ [field]: next });\n  };\n\n  return (\n    \u003cScreen>\n      \u003cScrollView contentContainerStyle={styles.scroll}>\n        \u003cPressable onPress={() => router.back()} hitSlop={12} accessibilityLabel=\"Back\">\n          \u003cText style={styles.back}>‹ Back\u003c/Text>\n        \u003c/Pressable>\n\n        \u003cText style={styles.title}>Discovery filters\u003c/Text>\n        \u003cText style={styles.sub}>\n          Widening these is the fastest way to see more people. Changes apply to your next deck.\n        \u003c/Text>\n\n        {error ? \u003cBanner message={error} /> : null}\n\n        \u003cView style={styles.block}>\n          \u003cText style={styles.label}>Show me\u003c/Text>\n          \u003cView style={styles.chipRow}>\n            {SHOW_ME_OPTIONS.map((option) => (\n              \u003cChip\n                key={option.value}\n                label={option.label}\n                selected={preferences.show_me.includes(option.value as InterestedIn)}\n                onPress={() => void save({ show_me: [option.value as InterestedIn] })}\n              />\n            ))}\n          \u003c/View>\n        \u003c/View>\n\n        \u003cView style={styles.block}>\n          \u003cText style={styles.label}>\n            Age range: {preferences.min_age}–{preferences.max_age}\n          \u003c/Text>\n          \u003cView style={styles.steppers}>\n            \u003cStepper\n              caption=\"Youngest\"\n              value={preferences.min_age}\n              onDecrease={() => adjust('min_age', -AGE_STEP)}\n              onIncrease={() => adjust('min_age', AGE_STEP)}\n              disabled={saving}\n            />\n            \u003cStepper\n              caption=\"Oldest\"\n              value={preferences.max_age}\n              onDecrease={() => adjust('max_age', -AGE_STEP)}\n              onIncrease={() => adjust('max_age', AGE_STEP)}\n              disabled={saving}\n            />\n          \u003c/View>\n        \u003c/View>\n\n        \u003cView style={styles.block}>\n          \u003cText style={styles.label}>Maximum distance: {preferences.max_distance_km} km\u003c/Text>\n          \u003cView style={styles.chipRow}>\n            {DISTANCES.map((km) => (\n              \u003cChip\n                key={km}\n                label={`${km} km`}\n                selected={preferences.max_distance_km === km}\n                onPress={() => void save({ max_distance_km: km })}\n              />\n            ))}\n          \u003c/View>\n        \u003c/View>\n      \u003c/ScrollView>\n    \u003c/Screen>\n  );\n}\n\nfunction Stepper({\n  caption,\n  value,\n  onDecrease,\n  onIncrease,\n  disabled,\n}: {\n  caption: string;\n  value: number;\n  onDecrease: () => void;\n  onIncrease: () => void;\n  disabled: boolean;\n}) {\n  return (\n    \u003cView style={styles.stepper}>\n      \u003cText style={styles.stepperCaption}>{caption}\u003c/Text>\n      \u003cView style={styles.stepperRow}>\n        \u003cPressable\n          onPress={onDecrease}\n          disabled={disabled}\n          hitSlop={10}\n          style={styles.stepperButton}\n          accessibilityRole=\"button\"\n          accessibilityLabel={`Decrease ${caption.toLowerCase()} age`}\n        >\n          \u003cText style={styles.stepperGlyph}>−\u003c/Text>\n        \u003c/Pressable>\n        \u003cText style={styles.stepperValue}>{value}\u003c/Text>\n        \u003cPressable\n          onPress={onIncrease}\n          disabled={disabled}\n          hitSlop={10}\n          style={styles.stepperButton}\n          accessibilityRole=\"button\"\n          accessibilityLabel={`Increase ${caption.toLowerCase()} age`}\n        >\n          \u003cText style={styles.stepperGlyph}>+\u003c/Text>\n        \u003c/Pressable>\n      \u003c/View>\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  scroll: { paddingVertical: spacing.base, gap: spacing.lg },\n  center: { flex: 1, alignItems: 'center', justifyContent: 'center' },\n  back: { ...typography.body, color: colors.primary },\n  title: { ...typography.title, color: colors.text },\n  sub: { ...typography.body, color: colors.textMuted },\n  block: { gap: spacing.sm },\n  label: { ...typography.label, color: colors.text },\n  chipRow: { flexDirection: 'row', flexWrap: 'wrap', gap: spacing.sm },\n  steppers: { flexDirection: 'row', gap: spacing.base },\n  stepper: {\n    flex: 1,\n    gap: spacing.xs,\n    padding: spacing.md,\n    borderRadius: radius.md,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n  },\n  stepperCaption: { ...typography.caption, color: colors.textSubtle },\n  stepperRow: { flexDirection: 'row', alignItems: 'center', justifyContent: 'space-between' },\n  stepperButton: {\n    width: 36,\n    height: 36,\n    borderRadius: 18,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: colors.surfaceMuted,\n  },\n  stepperGlyph: { ...typography.heading, color: colors.text },\n  stepperValue: { ...typography.heading, color: colors.text },\n});\n"}, {"p": "frontend/app.json", "l": "json", "n": 68, "c": "{\n  \"expo\": {\n    \"name\": \"NearMatch\",\n    \"slug\": \"nearmatch\",\n    \"version\": \"1.0.0\",\n    \"orientation\": \"portrait\",\n    \"icon\": \"./assets/images/icon.png\",\n    \"scheme\": \"nearmatch\",\n    \"userInterfaceStyle\": \"light\",\n    \"ios\": {\n      \"supportsTablet\": false,\n      \"bundleIdentifier\": \"com.kumravi253.nearmatch\",\n      \"usesAppleSignIn\ ;\n};\n"}, {"p": "frontend/eslint.config.js", "l": "javascript", "n": 28, "c": "// ESLint 9 flat config\nconst expoConfig = require('eslint-config-expo/flat');\n\nmodule.exports = [\n  ...expoConfig,\n  { ignores: ['dist/*', 'node_modules/*', '.expo/*', 'coverage/*'] },\n  {\n    rules: { 'no-console': ['warn', { allow: ['warn', 'error'] }] },\n  },\n  {\n    // Test setup runs under Jest, which supplies these globals.\n    files: ['jest.setup.js', '**/*.test.ts', '**/*.test.tsx'],\n    languageOptions: {\n      globals: {\n        jest: 'readonly',\n        describe: 'readonly',\n        it: 'readonly',\n        test: 'readonly',\n        expect: 'readonly',\n        beforeEach: 'readonly',\n        afterEach: 'readonly',\n        beforeAll: 'readonly',\n        afterAll: 'readonly',\n      },\n    },\n  },\n];\n"}, {"p": "frontend/jest.setup.js", "l": "javascript", "n": 19, "c": "jest.mock('expo-secure-store', () => {\n  const store = new Map();\n  return {\n    getItemAsync: jest.fn(async (k) => store.get(k) ?? null),\n    setItemAsync: jest.fn(async (k, v) => void store.set(k, v)),\n    deleteItemAsync: jest.fn(async (k) => void store.delete(k)),\n    isAvailableAsync: jest.fn(async () => true),\n  };\n});\n\njest.mock('expo-location', () => ({\n  requestForegroundPermissionsAsync: jest.fn(async () => ({ status: 'granted' })),\n  getCurrentPositionAsync: jest.fn(async () => ({\n    coords: { latitude: 19.0544, longitude: 72.8296 },\n  })),\n  reverseGeocodeAsync: jest.fn(async () => [{ city: 'Mumbai' }]),\n  Accuracy: { Balanced: 3 },\n}));\n"}, {"p": "frontend/metro.config.js", "l": "javascript", "n": 7, "c": "const { getDefaultConfig } = require('expo/metro-config');\n\nconst config = getDefaultConfig(__dirname);\nconfig.resolver.sourceExts = [...config.resolver.sourceExts, 'cjs'];\n\nmodule.exports = config;\n"}, {"p": "frontend/package.json", "l": "json", "n": 64, "c": "{\n  \"name\": \"nearmatch\",\n  \"version\": \"1.0.0\",\n  \"main\": \"expo-router/entry Composer.tsx", "l": "typescript", "n": 91, "c": "import { useState } from 'react';\nimport { Platform, Pressable, StyleSheet, Text, TextInput, View } from 'react-native';\n\nimport { MIN_TOUCH, colors, radius, spacing, typography } from '@/theme/tokens';\n\ninterface Props {\n  onSend: (body: string) => void;\n  sending?: boolean;\n  placeholder?: string;\n}\n\nexport function Composer({ onSend, sending = false, placeholder = 'Message' }: Props) {\n  const [draft, setDraft] = useState('');\n  const canSend = draft.trim().length > 0 && !sending;\n\n  const submit = () => {\n    if (!canSend) return;\n    onSend(draft);\n    setDraft('');\n  };\n\n  return (\n    \u003cView style={styles.wrap}>\n      \u003cTextInput\n        value={draft}\n        onChangeText={setDraft}\n        placeholder={placeholder}\n        placeholderTextColor={colors.textSubtle}\n        style={styles.input}\n        multiline\n        maxLength={2000}\n        returnKeyType={Platform.OS === 'ios' ? 'default' : 'send'}\n        onSubmitEditing={Platform.OS === 'android' ? submit : undefined}\n        accessibilityLabel=\"Message text\"\n      />\n      \u003cPressable\n        onPress={submit}\n        disabled={!canSend}\n        accessibilityRole=\"button\"\n        accessibilityLabel=\"Send message\"\n        accessibilityState={{ disabled: !canSend }}\n        style={({ pressed }) => [\n          styles.send,\n          !canSend && styles.sendDisabled,\n          pressed && canSend && styles.sendPressed,\n        ]}\n      >\n        \u003cText style={styles.sendGlyph}>↑\u003c/Text>\n      \u003c/Pressable>\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  wrap: {\n    flexDirection: 'row',\n    alignItems: 'flex-end',\n    gap: spacing.sm,\n    padding: spacing.sm,\n    paddingHorizontal: spacing.base,\n    borderTopWidth: 1,\n    borderTopColor: colors.border,\n    backgroundColor: colors.background,\n  },\n  input: {\n    flex: 1,\n    minHeight: MIN_TOUCH,\n    maxHeight: 120,\n    paddingHorizontal: spacing.base,\n    paddingTop: spacing.md,\n    paddingBottom: spacing.md,\n    borderRadius: radius.lg,\n    backgroundColor: colors.surface,\n    borderWidth: 1,\n    borderColor: colors.border,\n    ...typography.body,\n    color: colors.text,\n  },\n  send: {\n    width: MIN_TOUCH,\n    height: MIN_TOUCH,\n    borderRadius: MIN_TOUCH / 2,\n    backgroundColor: colors.primary,\n    alignItems: 'center',\n    justifyContent: 'center',\n  },\n  sendPressed: { backgroundColor: colors.primaryPressed },\n  sendDisabled: { backgroundColor: colors.surfaceSunken },\n  sendGlyph: { ...typography.bodyStrong, color: colors.onPrimary, fontSize: 20 },\n});\n"}, {"p": "frontend/src/components/chat/MessageBubble.tsx", "l": "typescript", "n": 59, "c": "import { Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { clockTime } from '@/lib/format';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\nimport type { Message } from '@/types/models';\n\ninterface Props {\n  message: Message & { pending?: true; failed?: true };\n  onRetry?: () => void;\n}\n\nexport function MessageBubble({ message, onRetry }: Props) {\n  const mine = message.is_mine;\n\n  return (\n    \u003cView style={[styles.row, mine ? styles.rowMine : styles.rowTheirs]}>\n      \u003cView style={[styles.bubble, mine ? styles.mine : styles.theirs, message.failed && styles.failed]}>\n        \u003cText style={[styles.body, mine && styles.bodyMine]}>{message.body}\u003c/Text>\n        \u003cView style={styles.meta}>\n          \u003cText style={[styles.time, mine && styles.timeMine]}>\n            {message.pending ? 'Sending…' : clockTime(message.sent_at)}\n          \u003c/Text>\n          {mine && message.read_at && !message.pending ? (\n            \u003cText style={[styles.time, styles.timeMine]}>· Read\u003c/Text>\n          ) : null}\n        \u003c/View>\n      \u003c/View>\n\n      {message.failed && onRetry ? (\n        \u003cPressable onPress={onRetry} hitSlop={8} accessibilityRole=\"button\">\n          \u003cText style={styles.retry}>Not sent. Tap to retry\u003c/Text>\n        \u003c/Pressable>\n      ) : null}\n    \u003c/View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  row: { paddingHorizontal: spacing.base, marginBottom: spacing.sm, maxWidth: '100%' },\n  rowMine: { alignItems: 'flex-end' },\n  rowTheirs: { alignItems: 'flex-start' },\n  bubble: {\n    maxWidth: '82%',\n    paddingVertical: spacing.sm,\n    paddingHorizontal: spacing.md,\n    borderRadius: radius.lg,\n    gap: 2,\n  },\n  mine: { backgroundColor: colors.primary, borderBottomRightRadius: radius.sm },\n  theirs: { backgroundColor: colors.surface, borderBottomLeftRadius: radius.sm, borderWidth: 1, borderColor: colors.border },\n  failed: { opacity: 0.6 },\n  body: { ...typography.body, color: colors.text },\n  bodyMine: { color: colors.onPrimary },\n  meta: { flexDirection: 'row', gap: spacing.xs, justifyContent: 'flex-end' },\n  time: { ...typography.caption, color: colors.textSubtle, fontSize: 11 },\n  timeMine: { color: 'rgba(255,248,236,0.8)' },\n  retry: { ...typography.caption, color: colors.danger, marginTop: spacing.xxs },\n});\n"}, {"p": "frontend/src/components/discover/MatchCelebration.tsx", "l": "typescript", "n": 60, "c": "import { Modal, StyleSheet, Text, View } from 'react-native';\n\nimport { Avatar } from '@/components/ui/Avatar';\nimport { Button } from '@/components/ui/Button';\nimport { colors, radius, spacing, typography } from '@/theme/tokens';\nimport type { PublicProfile } from '@/types/models';\n\ninterface Props {\n  visible: boolean;\n  profile: PublicProfile | null;\n  onMessage: () => void;\n  onKeepSwiping: () => void;\n}\n\nexport function MatchCelebration({ visible, profile, onMessage, onKeepSwiping }: Props) {\n  if (!profile) return null;\n\n  return (\n    \u003cModal visible={visible} transparent animationType=\"fade\" onRequestClose={onKeepSwiping}>\n      \u003cView style={styles.backdrop}>\n        \u003cView style={styles.sheet}>\n          \u003cText style={styles.kicker}>It&rsquo;s a match\u003c/Text>\n          \u003cAvatar uri={profile.photos[0]?.url} name={profile.display_name} size={96} />\n          \u003cText style={styles.title}>You and {profile.display_name} liked each other\u003c/Text>\n          \u003cText style={styles.body}>\n            {profile.distance_label.charAt(0).toUpperCase() + profile.distance_label.slice(1)}. Start\n            with something better than &ldquo;hey&rdquo;.\n          \u003c/Text>\n          \u003cView style={styles.actions}>\n            \u003cButton label={`Message ${profile.display_name}`} onPress={onMessage} />\n            \u003cButton label=\"Keep swiping\" onPress={onKeepSwiping} variant=\"ghost\" />\n          \u003c/View>\n        \u003c/View>\n      \u003c/View>\n    \u003c/Modal>\n  );\n}\n\nconst styles = StyleSheet.create({\n  backdrop: {\n    flex: 1,\n    backgroundColor: colors.overlay,\n    alignItems: 'center',\n    justifyContent: 'center',\n    padding: spacing.lg,\n  },\n  sheet: {\n    backgroundColor: colors.background,\n    borderRadius: radius.xl,\n    padding: spacing.lg,\n    alignItems: 'center',\n    gap: spacing.md,\n    alignSelf: 'stretch',\n  },\n  kicker: { ...typography.caption, color: colors.primary, textTransform: 'uppercase' },\n  title: { ...typography.heading, color: colors.text, textAlign: 'center' },\n  body: { ...typography.body, color: colors.textMuted, textAlign: 'center' },\n  actions: { alignSelf: 'stretch', gap: spacing.sm, marginTop: spacing.sm },\n});\n"}, {"p": "frontend/src/components/discover/ProfileCard.tsx", "l": "typescript", "n": 157, "c": "/**\n * The card at the top of the deck.\n *\n * Distance is shown as the coarse label the API returns — never coordinates.\n */\nimport { Image } from 'expo-image';\nimport { useState } from 'react';\nimport { Pressable, StyleSheet, Text, View } from 'react-native';\n\nimport { Chip } from '@/components/ui/Chip';\nimport { prettyInterest, truncate } from '@/lib/format';\nimport { colors, radius, shadow, spacing, typography } from '@/theme/tokens';\nimport type { DiscoverCard } from '@/types/models';\n\ninterface Props {\n  card: DiscoverCard;\n  onOpenProfile?: () => void;\n}\n\nexport function ProfileCard({ card, onOpenProfile }: Props) {\n  const { profile, reasons } = card;\n  const [photoIndex, setPhotoIndex] = useState(0);\n  const photos = profile.photos.filter((p) => p.url);\n  const photo = photos[photoIndex];\n\n  const cyclePhoto = (direction: 1 | -1) => {\n    if (photos.length \u003c 2) return;\n    setPhotoIndex((current) => (current + direction + photos.length) % photos.length);\n  };\n\n  return (\n    \u003cView style={styles.card}>\n      \u003cView style={styles.photoWrap}>\n        {photo?.url ? (\n          \u003cImage\n            source={{ uri: photo.url }}\n            style={styles.photo}\n            contentFit=\"cover\"\n            transition={200}\n            accessibilityLabel={`Photo of ${profile.display_name}`}\n          />\n        ) : (\n          \u003cView style={[styles.photo, styles.photoFallback]}>\n            \u003cText style={styles.photoFallbackText}>{profile.display_name}\u003c/Text>\n          \u003c/View>\n        )}\n\n        {photos.length > 1 ? (\n          \u003c>\n            \u003cPressable\n              style={[styles.tapZone, styles.tapLeft]}\n              onPress={() => cyclePhoto(-1)}\n              accessibilityLabel=\"Previous photo\"\n            />\n            \u003cPressable\n              style={[styles.tapZone, styles.tapRight]}\n              onPress={() => cyclePhoto(1)}\n              accessibilityLabel=\"Next photo\"\n            />\n            \u003cView style={styles.dots}>\n              {photos.map((p, index) => (\n                \u003cView\n                  key={p.id}\n                  style={[styles.dot, index === photoIndex && styles.dotActive]}\n                />\n              ))}\n
