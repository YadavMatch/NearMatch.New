<script id="data" type="application/json">[{"p": ".gitignore", "l": "bash", "n": 54, "c": "# --- secrets ---\n.env\n.env.*\n!.env.example\n*.pem\n*.p8\n*.keystore\n\n# --- python ---\n__pycache__/\n*.py[cod]\n.venv/\nvenv/\n.pytest_cache/\n.coverage\n.coverage.*\nhtmlcov/\n.mypy_cache/\n.ruff_cache/\n\n# --- node / expo ---\nnode_modules/\n.expo/\n.expo-shared/\ndist/\nweb-build/\n*.tsbuildinfo\ncoverage/\n.eslintcache\n\n# --- native builds ---\nios/\nandroid/\n*.ipa\n*.apk\n*.aab\n\n# --- supabase ---\nsupabase/.branches\nsupabase/.temp\n\n# --- test output ---\n# Reports are committed under test_reports/latest so a reviewer can read them\n# without running anything; raw HTML coverage dumps are not.\ntest_reports/latest/coverage/\ntest_reports/history/*/coverage/\n\n# --- editors / os ---\n.DS_Store\nThumbs.db\n.idea/\n.vscode/\n*.swp\n"}, {"p": "README.md", "l": "markdown", "n": 196, "c": "# NearMatch\n\nA location-based matching app. Create a profile, share your location, swipe\nthrough people nearby, and chat when you both like each other.\n\n```\nExpo (React Native)  ──►  FastAPI  ──►  Postgres + PostGIS\n         │                                   ▲\n         └──────── Supabase Auth / Storage / Realtime ────┘\n```\n\n| | |\n|---|---|\n| **Mobile** | Expo SDK 58, expo-router (typed routes), TypeScript strict |\n| **API** | FastAPI, asyncpg, Pydantic v2 |\n| **Data** | Supabase — Postgres 16 + PostGIS, Auth, Storage, Realtime |\n| **Bundle id** | `com.kumravi253.nearmatch` · scheme `nearmatch://` |\n| **Tests** | 273 passing (139 unit, 51 API, 56 database, 27 frontend) |\n\n---\n\n## Quick start\n\n### 1. Database\n\n```bash\nsupabase start\nsupabase db reset          # applies supabase/migrations, then seed.sql\n```\n\nThe seed creates six profiles around Mumbai, one deliberately in Pune so the\ndistance filter has something to exclude.\n\n### 2. API\n\n```bash\ncd backend\npython -m venv .venv && source .venv/bin/activate\npip install -r requirements.txt\ncp .env.example .env       # fill in the Supabase values\nuvicorn server:app --reload --port 8000\n```\n\n`http://localhost:8000/docs` for the interactive API, `/api/health` for a\nliveness check.\n\n### 3. App\n\n```bash\ncd frontend\nnpm install\ncp .env.example .env       # EXPO_PUBLIC_BACKEND_URL + Supabase URL and anon key\nnpx expo start\n```\n\n> On a physical device, `EXPO_PUBLIC_BACKEND_URL` must be your machine's LAN\n> address, not `localhost`.\n\n---\n\n## How matching works\n\nTwo stages, deliberately separate.\n\n**Gates** decide who is *eligible*. Age (18 floor, enforced by a database check\nconstraint as well as the API), distance, mutual orientation, blocks in either\ndirection, already-swiped, hidden, banned, has-photos. Failing any one removes\na candidate entirely.\n\n**Scores** decide the *order* of whoever survived. A transparent weighted blend:\n\n| Component | Weight |\n|---|---:|\n| Distance (half-life 25 km) | 0.34 |\n| Shared interests (Jaccard) | 0.24 |\n| Age fit | 0.16 |\n| Recent activity | 0.14 |\n| Profile completeness | 0.12 |\n\nA score can never surface someone a gate excluded. `GET /api/v1/discover?explain=true`\nreturns the per-component breakdown, which is also what drives the \"You both\nlike coffee\" lines on a card.\n\nThe filtering runs in Postgres (GiST index on `geography`), the scoring runs in\nPython. Rationale in `memory/architecture_decisions.md`.\n\n### Matches are made by the database\n\nTwo people can like each other in the same instant. If match creation lived\nonly in the API, each request could miss the other's like. A trigger\n(`create_match_on_reciprocal_like`) makes it atomic, and matches are stored\nonce per pair with the lower UUID first so a pair cannot exist twice.\n\n---\n\n## Privacy and safety\n\nThese are design constraints, not features:\n\n- **Exact location is never stored.** Coordinates are snapped onto a ~300 m\n  grid before they are written. Users see `\"7 km away\"`, never a coordinate or\n  a decimal distance.\n- **Incoming likes are hidden** until they are mutual. There is no\n  \"who liked you\" endpoint, by choice.\n- **RLS is the real boundary.** The client reads chat straight from Postgres\n  over Realtime, so every table has row level security and\n  `tests/sql/test_rls.py` attacks each policy: reading a stranger's profile,\n  injecting a message, forging a swipe, reading the moderation queue.\n- **Photos bypass the API.** The device uploads to Supabase Storage with a\n  signed URL; Storage policies key ownership on the path prefix, and the API\n  refuses to register a path that is not the caller's own.\n- **Blocking is immediate and mutual** — it closes the conversation, removes\n  each from the other's deck, and cannot be undone from inside the app.\n\n---\n\n## API\n\nAll routes are under `/api/v1` and require a Supabase bearer token, except\n`/api/health`.\n\n| Method | Path | |\n|---|---|---|\n| `GET` | `/me/profile` | Current profile with signed photo URLs |\n| `PUT` | `/me/profile` | Create or replace (ends onboarding) |\n| `PATCH` | `/me/profile` | Partial update |\n| `PUT` | `/me/location` | Push a location (snapped before storage) |\n| `POST` | `/me/photos/upload-url` | Signed Storage upload ticket |\n| `POST` | `/me/photos` | Register an uploaded photo |\n| `DELETE` | `/me/photos/{id}` | Remove a photo |\n| `GET`/`PUT` | `/me/preferences` | Discovery filters |\n| `GET` | `/discover` | The deck (`?explain=true` for score breakdowns) |\n| `POST` | `/swipes` | Like / pass / superlike → `{is_match, match_id}` |\n| `POST` | `/swipes/undo` | Undo, within 3 minutes |\n| `GET` | `/matches` | Matches with unread counts |\n| `DELETE` | `/matches/{id}` | Unmatch |\n| `GET`/`POST` | `/matches/{id}/messages` | Chat |\n| `POST` | `/matches/{id}/messages/read` | Mark read |\n| `POST`/`GET`/`DELETE` | `/blocks` | Block list |\n| `POST` | `/reports` | Report a profile |\n| `POST` | `/devices` | Register a push token |\n\nErrors are uniform:\n\n```json\n{ \"error\": { \"code\": \"profile_incomplete\", \"message\": \"Share your location to see people near you.\" } }\n```\n\n---\n\n## Layout\n\n```\nbackend/     FastAPI service\n  app/matching/   pure matching core — no DB, no network, no framework\n  app/services/   orchestration\n  app/db/         repositories (SQL lives here, not in services)\nfrontend/    Expo app\n  app/            expo-router routes\n  src/            lib, hooks, components, theme\nsupabase/    migrations, RLS policies, RPC, edge functions, seed\nmemory/      project context, decisions, glossary\ntests/       unit · integration · sql\ntest_reports/ generated output\n```\n\n`backend/app/matching/` is intentionally dependency-free: no database, no HTTP,\nno FastAPI. That is what makes the ranking logic cheap to test and safe to\nchange.\n\n---\n\n## Testing\n\n```bash\n./scripts/db_test_setup.sh                 # local Postgres + PostGIS + schema\nexport NEARMATCH_TEST_DSN=\"postgresql://postgres@/nearmatch_test?host=/tmp&port=55432\"\n(cd tests && pytest)                       # 246 backend tests\n\ncd frontend && npx tsc --noEmit && npx eslint . && npx jest\n```\n\nWithout `NEARMATCH_TEST_DSN` the 56 database tests skip; the rest still run.\n\n**Read `test_result.md` before trusting any of this.** It states exactly what\nis verified, what is only partially covered, and what has never been executed —\nincluding the fact that the app itself has not yet been rendered on a device.\n\n---\n\n## Status\n\nFeature-complete for a first release. Not yet built: self-service account\ndeletion, a moderation dashboard, photo scanning, any paid tier.\nSee `memory/project_context.md` for the current gaps.\n"}, {"p": "START_HERE.md", "l": "markdown", "n": 94, "c": "# NearMatch — start here\n\nA location-based matching app, plus a Firebase deployment overlay.\n`node_modules`, caches and build output are excluded — `npm install` and\n`pip install -r requirements.txt` restore them.\n\n## Pick a path first\n\nTwo deployment targets live here. They share the whole app; only auth, chat\ntransport, storage and push differ.\n\n| | Supabase (built and tested) | Firebase (overlay) |\n|---|---|---|\n| Where | `backend/`, `frontend/`, `supabase/` | `firebase/` |\n| Auth | Email OTP + Apple | Phone OTP + Apple |\n| Chat | Postgres + Realtime, RLS | Firestore + rules |\n| Photos | Supabase Storage | Cloud Storage |\n| Matching | Postgres + PostGIS | **identical** — Cloud SQL |\n\n**Start with Supabase.** It is the one with the passing test suite. Move to\nFirebase if you specifically want Google's ecosystem, FCM or phone auth;\n`firebase/README.md` explains the swap — five frontend files, four backend.\n\n## Folders\n\n```\nbackend/      FastAPI service. app/matching/ is the dependency-free core.\nfrontend/     Expo SDK 58 app, expo-router, TypeScript strict.\nsupabase/     16 migrations, RLS policies, RPC, edge function, seed data.\nfirebase/     GCP/Firebase overlay. Nothing in it modifies the above.\ntests/        269 backend tests: unit, API, database.\nmemory/       Project context, architecture decisions, glossary.\ntest_reports/ Generated output from the last run.\nscripts/      db_test_setup.sh — local Postgres + PostGIS for the db tests.\n```\n\n## Run it\n\n```bash\n# 1. database\nsupabase start && supabase db reset\n\n# 2. api\ncd backend && python -m venv .venv && source .venv/bin/activate\npip install -r requirements.txt && cp .env.example .env   # fill it in\nuvicorn server:app --reload --port 8000\n\n# 3. app\ncd frontend && npm install && cp .env.example .env        # fill it in\nnpx expo start\n```\n\n## Run the tests\n\n```bash\n./scripts/db_test_setup.sh\nexport NEARMATCH_TEST_DSN=\"postgresql://postgres@/nearmatch_test?host=/tmp&port=55432\"\n(cd tests && pytest)                                       # 269 tests\n\ncd frontend && npx tsc --noEmit && npx eslint . && npx jest # 27 tests\n```\n\n296 passing in total. Without the DSN the 71 database tests skip.\n\n## Read this before trusting any of it\n\n**`test_result.md`** states exactly what is verified, what is partial, and what\nhas never been executed. The headline: **the app has never been rendered on a\ndevice.** There was no simulator available while it was built. Typecheck, lint\nand the route tree are all clean, but no screen has been seen working.\n\n## What is left\n\n1. **Run it.** Nothing else on this list matters as much.\n2. No self-service account deletion — blocks App Store review.\n3. No photo moderation.\n4. Frontend test coverage is 5.8%; only pure helpers are covered.\n5. No end-to-end test of sign-in → onboarding → swipe → match → chat.\n6. Batch photo signing is tested against a fake, not a live Supabase. Confirm\n   the batch endpoint's request shape against a real project.\n\nSix earlier P0/P1 defects are fixed, with regression tests — including an N+1\nthat cost up to 120 serial HTTPS calls per deck, a banned user being able to\nclear their own ban, and a rate limiter that granted 5 of 6 concurrent\nrequests against a limit of 3. Details in `test_result.md`.\n\n## Git history\n\n`nearmatch.bundle` carries all commits:\n\n```bash\ngit clone -b claude/amazing-sagan-hw7mqw nearmatch.bundle NearMatch\n```\n"}, {"p": "backend/.env.example", "l": "bash", "n": 22, "c": "# --- Supabase ---\nSUPABASE_URL=https://your-project.supabase.co\nSUPABASE_ANON_KEY=sb_publishable_xxx\nSUPABASE_SERVICE_ROLE_KEY=sb_secret_xxx\nSUPABASE_JWT_SECRET=your-jwt-secret\nDATABASE_URL=postgresql://postgres:password@db.your-project.supabase.co:5432/postgres\n\n# --- App ---\nENVIRONMENT=development\nLOG_LEVEL=INFO\nCORS_ORIGINS=http://localhost:8081,https://nearmatch.in,https://www.nearmatch.in\nAPI_PREFIX=/api\n\n# --- Matching tunables ---\nDEFAULT_MAX_DISTANCE_KM=50\nDISCOVER_PAGE_SIZE=20\nDISTANCE_HALF_LIFE_KM=25\nINACTIVE_AFTER_DAYS=30\n\n# --- Push ---\nEXPO_PUSH_URL=https://exp.host/--/api/v2/push/send\n"}, {"p": "backend/Dockerfile", "l": "plaintext", "n": 21, "c": "FROM python:3.12-slim\n\nENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1\n\nWORKDIR /app\n\nRUN apt-get update \\\n && apt-get install -y --no-install-recommends build-essential libpq-dev curl \\\n && rm -rf /var/lib/apt/lists/*\n\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\n\nCOPY . .\n\nEXPOSE 8000\nHEALTHCHECK --interval=30s --timeout=5s --start-period=10s \\\n  CMD curl -fsS http://localhost:8000/api/health || exit 1\n\nCMD [\"uvicorn\", \"server:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n"}, {"p": "backend/app/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/app/api/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/app/api/router.py", "l": "python", "n": 12, "c": "from fastapi import APIRouter\n\nfrom app.api.v1 import discover, health, matches, messages, profiles, safety, swipes\n\napi_router = APIRouter()\napi_router.include_router(health.router)\n\nv1 = APIRouter(prefix=\"/v1\")\nfor module in (profiles, discover, swipes, matches, messages, safety):\n    v1.include_router(module.router)\napi_router.include_router(v1)\n"}, {"p": "backend/app/api/v1/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/app/api/v1/discover.py", "l": "python", "n": 20, "c": "from fastapi import APIRouter, Query\n\nfrom app.config import settings\nfrom app.deps import ActiveUser\nfrom app.models.discover import DiscoverDeck\nfrom app.services import discover_service\n\nrouter = APIRouter(prefix=\"/discover\", tags=[\"discover\"])\n\n\n@router.get(\"\", response_model=DiscoverDeck)\nasync def get_deck(\n    user_id: ActiveUser,\n    limit: int = Query(default=0, ge=0, le=50),\n    explain: bool = Query(default=False, description=\"Include the score breakdown per card.\"),\n) -> DiscoverDeck:\n    return await discover_service.build_deck(\n        user_id, limit=limit or settings.discover_page_size, explain=explain\n    )\n"}, {"p": "backend/app/api/v1/health.py", "l": "python", "n": 21, "c": "from fastapi import APIRouter\n\nfrom app.config import settings\nfrom app.core import db\n\nrouter = APIRouter(tags=[\"health\"])\n\n\n@router.get(\"/health\")\nasync def health() -> dict:\n    return {\"status\": \"ok\", \"environment\": settings.environment}\n\n\n@router.get(\"/health/ready\")\nasync def ready() -> dict:\n    try:\n        await db.fetchval(\"SELECT 1\")\n        return {\"status\": \"ready\", \"database\": \"up\"}\n    except Exception as exc:  # noqa: BLE001\n        return {\"status\": \"degraded\", \"database\": \"down\", \"detail\": str(exc)[:200]}\n"}, {"p": "backend/app/api/v1/matches.py", "l": "python", "n": 22, "c": "from typing import List\n\nfrom fastapi import APIRouter\n\nfrom app.deps import ActiveUser\nfrom app.models.common import Ok\nfrom app.models.match import MatchSummary\nfrom app.services import match_service\n\nrouter = APIRouter(prefix=\"/matches\", tags=[\"matches\"])\n\n\n@router.get(\"\", response_model=List[MatchSummary])\nasync def list_matches(user_id: ActiveUser) -> List[MatchSummary]:\n    return await match_service.list_matches(user_id)\n\n\n@router.delete(\"/{match_id}\", response_model=Ok)\nasync def unmatch(match_id: str, user_id: ActiveUser) -> Ok:\n    await match_service.unmatch(match_id, user_id)\n    return Ok()\n"}, {"p": "backend/app/api/v1/messages.py", "l": "python", "n": 32, "c": "from typing import List, Optional\n\nfrom fastapi import APIRouter, Query, status\n\nfrom app.deps import ActiveUser\nfrom app.models.common import Ok\nfrom app.models.message import Message, MessageCreate\nfrom app.services import message_service\n\nrouter = APIRouter(prefix=\"/matches/{match_id}/messages\", tags=[\"messages\"])\n\n\n@router.get(\"\", response_model=List[Message])\nasync def list_messages(\n    match_id: str,\n    user_id: ActiveUser,\n    limit: int = Query(default=50, ge=1, le=100),\n    before: Optional[str] = Query(default=None, description=\"Message id to page back from.\"),\n) -> List[Message]:\n    return await message_service.list_messages(match_id, user_id, limit=limit, before=before)\n\n\n@router.post(\"\", response_model=Message, status_code=status.HTTP_201_CREATED)\nasync def send_message(match_id: str, payload: MessageCreate, user_id: ActiveUser) -> Message:\n    return await message_service.send(match_id, user_id, payload.body, payload.client_id)\n\n\n@router.post(\"/read\", response_model=Ok)\nasync def mark_read(match_id: str, user_id: ActiveUser) -> Ok:\n    await message_service.mark_read(match_id, user_id)\n    return Ok()\n"}, {"p": "backend/app/api/v1/profiles.py", "l": "python", "n": 64, "c": "from fastapi import APIRouter, status\n\nfrom app.deps import ActiveUser, CurrentUser\nfrom app.models.common import Coordinates, Ok\nfrom app.models.preference import Preferences, PreferencesUpdate\nfrom app.models.profile import MyProfile, Photo, ProfileCreate, ProfileUpdate\nfrom app.models.upload import PhotoConfirm, PhotoUploadRequest, PhotoUploadTicket\nfrom app.services import profile_service\n\nrouter = APIRouter(prefix=\"/me\", tags=[\"profile\"])\n\n\n@router.get(\"/profile\", response_model=MyProfile)\nasync def get_my_profile(user_id: ActiveUser) -> MyProfile:\n    return await profile_service.get_my_profile(user_id)\n\n\n@router.put(\"/profile\", response_model=MyProfile, status_code=status.HTTP_200_OK)\nasync def create_or_replace_profile(payload: ProfileCreate, user_id: CurrentUser) -> MyProfile:\n    \"\"\"Used at the end of onboarding and for full profile replacement.\"\"\"\n    return await profile_service.create_or_update(user_id, payload.model_dump(mode=\"python\"))\n\n\n@router.patch(\"/profile\", response_model=MyProfile)\nasync def patch_profile(payload: ProfileUpdate, user_id: ActiveUser) -> MyProfile:\n    return await profile_service.patch_profile(\n        user_id, payload.model_dump(exclude_unset=True, mode=\"python\")\n    )\n\n\n@router.put(\"/location\", response_model=Ok)\nasync def update_location(coords: Coordinates, user_id: ActiveUser, city: str | None = None) -> Ok:\n    await profile_service.update_location(user_id, coords.latitude, coords.longitude, city)\n    return Ok()\n\n\n@router.post(\"/photos/upload-url\", response_model=PhotoUploadTicket)\nasync def request_photo_upload(payload: PhotoUploadRequest, user_id: CurrentUser) -> PhotoUploadTicket:\n    slot = await profile_service.request_photo_slot(user_id, payload.content_type)\n    return PhotoUploadTicket(**slot)\n\n\n@router.post(\"/photos\", response_model=Photo, status_code=status.HTTP_201_CREATED)\nasync def confirm_photo(payload: PhotoConfirm, user_id: CurrentUser) -> Photo:\n    return await profile_service.confirm_photo(user_id, payload.storage_path, payload.make_primary)\n\n\n@router.delete(\"/photos/{photo_id}\", response_model=Ok)\nasync def delete_photo(photo_id: str, user_id: CurrentUser) -> Ok:\n    await profile_service.remove_photo(user_id, photo_id)\n    return Ok()\n\n\n@router.get(\"/preferences\", response_model=Preferences)\nasync def get_preferences(user_id: CurrentUser) -> Preferences:\n    return await profile_service.get_preferences(user_id)\n\n\n@router.put(\"/preferences\", response_model=Preferences)\nasync def update_preferences(payload: PreferencesUpdate, user_id: ActiveUser) -> Preferences:\n    return await profile_service.update_preferences(\n        user_id, payload.model_dump(exclude_unset=True, mode=\"json\")\n    )\n"}, {"p": "backend/app/api/v1/safety.py", "l": "python", "n": 44, "c": "from typing import Any, Dict, List\n\nfrom fastapi import APIRouter, status\n\nfrom app.deps import CurrentUser\nfrom app.models.common import Ok\nfrom app.models.device import DeviceRegister\nfrom app.models.report import BlockCreate, ReportCreate\nfrom app.db.repositories import safety_repo\nfrom app.services import moderation_service\n\nrouter = APIRouter(tags=[\"safety\"])\n\n\n@router.post(\"/blocks\", response_model=Ok, status_code=status.HTTP_201_CREATED)\nasync def block(payload: BlockCreate, user_id: CurrentUser) -> Ok:\n    await moderation_service.block_user(user_id, payload.blocked_id)\n    return Ok()\n\n\n@router.get(\"/blocks\", response_model=List[Dict[str, Any]])\nasync def list_blocks(user_id: CurrentUser) -> List[Dict[str, Any]]:\n    return await moderation_service.list_blocked(user_id)\n\n\n@router.delete(\"/blocks/{blocked_id}\", response_model=Ok)\nasync def unblock(blocked_id: str, user_id: CurrentUser) -> Ok:\n    await moderation_service.unblock_user(user_id, blocked_id)\n    return Ok()\n\n\n@router.post(\"/reports\", status_code=status.HTTP_201_CREATED)\nasync def report(payload: ReportCreate, user_id: CurrentUser) -> Dict[str, str]:\n    report_id = await moderation_service.report_user(\n        user_id, payload.reported_id, payload.reason.value, payload.details, payload.block_too\n    )\n    return {\"report_id\": report_id}\n\n\n@router.post(\"/devices\", response_model=Ok, status_code=status.HTTP_201_CREATED)\nasync def register_device(payload: DeviceRegister, user_id: CurrentUser) -> Ok:\n    await safety_repo.register_device(user_id, payload.expo_push_token, payload.platform.value)\n    return Ok()\n"}, {"p": "backend/app/api/v1/swipes.py", "l": "python", "n": 20, "c": "from fastapi import APIRouter, status\n\nfrom app.deps import ActiveUser\nfrom app.models.common import Ok\nfrom app.models.swipe import SwipeCreate, SwipeResult\nfrom app.services import swipe_service\n\nrouter = APIRouter(prefix=\"/swipes\", tags=[\"swipes\"])\n\n\n@router.post(\"\", response_model=SwipeResult, status_code=status.HTTP_201_CREATED)\nasync def create_swipe(payload: SwipeCreate, user_id: ActiveUser) -> SwipeResult:\n    return await swipe_service.swipe(user_id, payload.target_id, payload.action)\n\n\n@router.post(\"/undo\", response_model=Ok)\nasync def undo_swipe(user_id: ActiveUser) -> Ok:\n    await swipe_service.undo(user_id)\n    return Ok()\n"}, {"p": "backend/app/config.py", "l": "python", "n": 52, "c": "\"\"\"Application settings, loaded from environment.\"\"\"\nfrom functools import lru_cache\nfrom typing import List\n\nfrom pydantic import Field, field_validator\nfrom pydantic_settings import BaseSettings, SettingsConfigDict\n\n\nclass Settings(BaseSettings):\n    model_config = SettingsConfigDict(env_file=\".env\", extra=\"ignore\")\n\n    # Supabase\n    supabase_url: str = Field(default=\"http://localhost:54321\")\n    supabase_anon_key: str = Field(default=\"\")\n    supabase_service_role_key: str = Field(default=\"\")\n    supabase_jwt_secret: str = Field(default=\"\")\n    database_url: str = Field(default=\"postgresql://postgres:postgres@localhost:54322/postgres\")\n\n    # App\n    environment: str = \"development\"\n    log_level: str = \"INFO\"\n    api_prefix: str = \"/api\"\n    cors_origins: List[str] = Field(default_factory=lambda: [\"http://localhost:8081\"])\n\n    # Matching\n    default_max_distance_km: int = 50\n    discover_page_size: int = 20\n    distance_half_life_km: float = 25.0\n    inactive_after_days: int = 30\n\n    # Push\n    expo_push_url: str = \"https://exp.host/--/api/v2/push/send\"\n\n    @field_validator(\"cors_origins\", mode=\"before\")\n    @classmethod\n    def _split_origins(cls, v):\n        if isinstance(v, str):\n            return [o.strip() for o in v.split(\",\") if o.strip()]\n        return v\n\n    @property\n    def is_production(self) -> bool:\n        return self.environment.lower() == \"production\"\n\n\n@lru_cache\ndef get_settings() -> Settings:\n    return Settings()\n\n\nsettings = get_settings()\n"}, {"p": "backend/app/core/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/app/core/db.py", "l": "python", "n": 64, "c": "\"\"\"Postgres connection pool over the Supabase database.\"\"\"\nfrom typing import Any, Optional, Sequence\n\nimport asyncpg\n\nfrom app.config import settings\nfrom app.core.logging import get_logger\n\nlog = get_logger(__name__)\n_pool: Optional[asyncpg.Pool] = None\n\n\nasync def init_pool() -> asyncpg.Pool:\n    global _pool\n    if _pool is None:\n        log.info(\"db.pool.create\")\n        _pool = await asyncpg.create_pool(\n            dsn=settings.database_url,\n            min_size=1,\n            max_size=10,\n            command_timeout=20,\n            statement_cache_size=0,  # pgbouncer-safe\n        )\n    return _pool\n\n\nasync def close_pool() -> None:\n    global _pool\n    if _pool is not None:\n        await _pool.close()\n        _pool = None\n        log.info(\"db.pool.closed\")\n\n\ndef pool() -> asyncpg.Pool:\n    if _pool is None:\n        raise RuntimeError(\"DB pool not initialised; call init_pool() on startup.\")\n    return _pool\n\n\nasync def fetch(query: str, *args: Any) -> list[asyncpg.Record]:\n    async with pool().acquire() as conn:\n        return await conn.fetch(query, *args)\n\n\nasync def fetchrow(query: str, *args: Any) -> Optional[asyncpg.Record]:\n    async with pool().acquire() as conn:\n        return await conn.fetchrow(query, *args)\n\n\nasync def fetchval(query: str, *args: Any) -> Any:\n    async with pool().acquire() as conn:\n        return await conn.fetchval(query, *args)\n\n\nasync def execute(query: str, *args: Any) -> str:\n    async with pool().acquire() as conn:\n        return await conn.execute(query, *args)\n\n\nasync def executemany(query: str, args: Sequence[Sequence[Any]]) -> None:\n    async with pool().acquire() as conn:\n        await conn.executemany(query, args)\n"}, {"p": "backend/app/core/errors.py", "l": "python", "n": 68, "c": "\"\"\"Typed application errors mapped to HTTP problem responses.\"\"\"\nfrom typing import Any, Dict, Optional\n\nfrom fastapi import FastAPI, Request\nfrom fastapi.responses import JSONResponse\n\n\nclass AppError(Exception):\n    status_code = 500\n    code = \"internal_error\"\n    message = \"Something went wrong.\"\n\n    def __init__(self, message: Optional[str] = None, **extra: Any) -> None:\n        self.message = message or self.message\n        self.extra: Dict[str, Any] = extra\n        super().__init__(self.message)\n\n\nclass NotFound(AppError):\n    status_code = 404\n    code = \"not_found\"\n    message = \"Resource not found.\"\n\n\nclass Forbidden(AppError):\n    status_code = 403\n    code = \"forbidden\"\n    message = \"You do not have access to this resource.\"\n\n\nclass Unauthorized(AppError):\n    status_code = 401\n    code = \"unauthorized\"\n    message = \"Authentication required.\"\n\n\nclass Conflict(AppError):\n    status_code = 409\n    code = \"conflict\"\n    message = \"That action conflicts with the current state.\"\n\n\nclass ValidationFailed(AppError):\n    status_code = 422\n    code = \"validation_failed\"\n    message = \"The request was not valid.\"\n\n\nclass ProfileIncomplete(AppError):\n    status_code = 409\n    code = \"profile_incomplete\"\n    message = \"Finish onboarding before using discovery.\"\n\n\nclass RateLimited(AppError):\n    status_code = 429\n    code = \"rate_limited\"\n    message = \"Too many requests. Slow down.\"\n\n\ndef register_error_handlers(app: FastAPI) -> None:\n    @app.exception_handler(AppError)\n    async def _handle_app_error(_: Request, exc: AppError) -> JSONResponse:\n        body = {\"error\": {\"code\": exc.code, \"message\": exc.message}}\n        if exc.extra:\n            body[\"error\"][\"details\"] = exc.extra\n        return JSONResponse(status_code=exc.status_code, content=body)\n"}, {"p": "backend/app/core/logging.py", "l": "python", "n": 44, "c": "\"\"\"Structured logging with request correlation.\"\"\"\nimport logging\nimport sys\nimport uuid\nfrom contextvars import ContextVar\n\nimport structlog\n\nrequest_id_var: ContextVar[str] = ContextVar(\"request_id\", default=\"-\")\n\n\ndef new_request_id() -> str:\n    rid = str(uuid.uuid4())\n    request_id_var.set(rid)\n    return rid\n\n\ndef _inject_request_id(_, __, event_dict):\n    event_dict[\"request_id\"] = request_id_var.get()\n    return event_dict\n\n\ndef configure_logging(level: str = \"INFO\") -> None:\n    logging.basicConfig(format=\"%(message)s\", stream=sys.stdout, level=level.upper())\n    structlog.configure(\n        processors=[\n            structlog.contextvars.merge_contextvars,\n            _inject_request_id,\n            structlog.processors.add_log_level,\n            structlog.processors.TimeStamper(fmt=\"iso\"),\n            structlog.processors.StackInfoRenderer(),\n            structlog.processors.format_exc_info,\n            structlog.processors.JSONRenderer(),\n        ],\n        wrapper_class=structlog.make_filtering_bound_logger(\n            logging.getLevelName(level.upper())\n        ),\n        cache_logger_on_first_use=True,\n    )\n\n\ndef get_logger(name: str = \"nearmatch\"):\n    return structlog.get_logger(name)\n"}, {"p": "backend/app/core/rate_limit.py", "l": "python", "n": 79, "c": "\"\"\"Rate limiting.\n\nTwo backends:\n\n* **Postgres** (`check`) — the real one. The window lives in a shared table, so\n  the limit holds no matter how many API instances are running. An earlier\n  in-process version was correct with one container and silently wrong with\n  two: each enforced its own allowance.\n\n* **In-process** (`hit`) — kept for unit tests and for the case where the\n  database is unreachable. Never rely on it in production with more than one\n  replica.\n\nThe Postgres path does one round-trip per call. For swipes and messages, which\nare already writing to the database, that is not a meaningful cost.\n\"\"\"\nfrom __future__ import annotations\n\nimport time\nfrom collections import defaultdict, deque\nfrom typing import Deque, Dict, Tuple\n\nfrom app.core import db\nfrom app.core.errors import RateLimited\nfrom app.core.logging import get_logger\n\nlog = get_logger(__name__)\n\n_buckets: Dict[Tuple[str, str], Deque[float]] = defaultdict(deque)\n\n\nasync def check(subject: str, scope: str, limit: int, window_seconds: int) -> int:\n    \"\"\"Record a hit against the shared window. Raises RateLimited when over.\n\n    Returns how many hits are now in the window.\n    \"\"\"\n    try:\n        row = await db.fetchrow(\n            \"SELECT allowed, used, retry_after_seconds FROM rate_limit_hit($1, $2, $3, $4)\",\n            subject, scope, int(limit), int(window_seconds),\n        )\n    except Exception as exc:  # noqa: BLE001\n        # A limiter that fails closed would take the whole app down with the\n        # database. Fall back to the in-process window and say so loudly.\n        log.error(\"rate_limit.db_unavailable\", scope=scope, error=str(exc))\n        hit(subject, scope, limit, window_seconds)\n        return -1\n\n    if row is None:\n        return -1\n\n    if not row[\"allowed\"]:\n        retry = int(row[\"retry_after_seconds\"] or 1)\n        raise RateLimited(\n            f\"Too many {scope} requests. Try again in {retry}s.\",\n            retry_after_seconds=retry,\n        )\n    return int(row[\"used\"])\n\n\ndef hit(key: str, scope: str, limit: int, window_seconds: int) -> None:\n    \"\"\"In-process sliding window. Single instance only.\"\"\"\n    now = time.monotonic()\n    bucket = _buckets[(key, scope)]\n    cutoff = now - window_seconds\n    while bucket and bucket[0] \u003c cutoff:\n        bucket.popleft()\n    if len(bucket) >= limit:\n        retry_in = int(window_seconds - (now - bucket[0])) + 1\n        raise RateLimited(\n            f\"Too many {scope} requests. Try again in {retry_in}s.\",\n            retry_after_seconds=retry_in,\n        )\n    bucket.append(now)\n\n\ndef reset() -> None:\n    _buckets.clear()\n"}, {"p": "backend/app/core/security.py", "l": "python", "n": 33, "c": "\"\"\"Supabase JWT verification.\"\"\"\nfrom typing import Any, Dict\n\nimport jwt\n\nfrom app.config import settings\nfrom app.core.errors import Unauthorized\n\n_ALGORITHMS = [\"HS256\"]\n_AUDIENCE = \"authenticated\"\n\n\ndef decode_token(token: str) -> Dict[str, Any]:\n    \"\"\"Verify a Supabase access token and return its claims.\"\"\"\n    if not settings.supabase_jwt_secret:\n        raise Unauthorized(\"Server is missing SUPABASE_JWT_SECRET.\")\n    try:\n        return jwt.decode(\n            token,\n            settings.supabase_jwt_secret,\n            algorithms=_ALGORITHMS,\n            audience=_AUDIENCE,\n            options={\"require\": [\"sub\", \"exp\"]},\n        )\n    except jwt.ExpiredSignatureError as exc:\n        raise Unauthorized(\"Session expired. Sign in again.\") from exc\n    except jwt.InvalidTokenError as exc:\n        raise Unauthorized(\"Invalid session token.\") from exc\n\n\ndef user_id_from_token(token: str) -> str:\n    return str(decode_token(token)[\"sub\"])\n"}, {"p": "backend/app/core/supabase_client.py", "l": "python", "n": 108, "c": "\"\"\"Thin async client for Supabase REST, Auth and Storage.\"\"\"\nfrom typing import Any, Dict, List, Optional\n\nimport httpx\n\nfrom app.config import settings\nfrom app.core.errors import AppError\nfrom app.core.logging import get_logger\n\nlog = get_logger(__name__)\n\n\nclass SupabaseClient:\n    def __init__(self, service_key: Optional[str] = None) -> None:\n        self._base = settings.supabase_url.rstrip(\"/\")\n        self._key = service_key or settings.supabase_service_role_key\n\n    def _headers(self, extra: Optional[Dict[str, str]] = None) -> Dict[str, str]:\n        headers = {\n            \"apikey\": self._key,\n            \"Authorization\": f\"Bearer {self._key}\",\n            \"Content-Type\": \"application/json\",\n        }\n        if extra:\n            headers.update(extra)\n        return headers\n\n    async def get_auth_user(self, access_token: str) -> Dict[str, Any]:\n        async with httpx.AsyncClient(timeout=10) as client:\n            resp = await client.get(\n                f\"{self._base}/auth/v1/user\",\n                headers={\"apikey\": self._key, \"Authorization\": f\"Bearer {access_token}\"},\n            )\n        if resp.status_code != 200:\n            raise AppError(\"Could not load the Supabase user.\")\n        return resp.json()\n\n    async def create_signed_upload_url(\n        self, bucket: str, path: str\n    ) -> Dict[str, Any]:\n        \"\"\"Hand the client a one-shot upload URL so photo bytes never touch this API.\"\"\"\n        async with httpx.AsyncClient(timeout=10) as client:\n            resp = await client.post(\n                f\"{self._base}/storage/v1/object/upload/sign/{bucket}/{path}\",\n                headers=self._headers(),\n                json={},\n            )\n        if resp.status_code not in (200, 201):\n            log.error(\"supabase.signed_upload.failed\", status=resp.status_code, body=resp.text)\n            raise AppError(\"Could not create an upload URL.\")\n        return resp.json()\n\n    async def create_signed_urls(\n        self, bucket: str, paths: List[str], expires_in: int = 3600\n    ) -> Dict[str, Optional[str]]:\n        \"\"\"Sign many objects in ONE request.\n\n        The per-object endpoint cost a round-trip each, so a 20-card deck with\n        six photos apiece meant up to 120 serial HTTPS calls before a single\n        card could be returned. Storage exposes a batch form; use it.\n        \"\"\"\n        if not paths:\n            return {}\n\n        async with httpx.AsyncClient(timeout=15) as client:\n            resp = await client.post(\n                f\"{self._base}/storage/v1/object/sign/{bucket}\",\n                headers=self._headers(),\n                json={\"paths\": list(paths), \"expiresIn\": expires_in},\n            )\n\n        if resp.status_code != 200:\n            log.error(\"supabase.batch_sign.failed\", status=resp.status_code, body=resp.text[:300])\n            return {path: None for path in paths}\n\n        signed: Dict[str, Optional[str]] = {path: None for path in paths}\n        for entry in resp.json():\n            path = entry.get(\"path\")\n            url = entry.get(\"signedURL\") or entry.get(\"signedUrl\")\n            # A per-object error is reported inline; a missing photo must not\n            # fail the whole deck.\n            if path and url and not entry.get(\"error\"):\n                signed[path] = f\"{self._base}/storage/v1{url}\"\n        return signed\n\n    async def create_signed_url(\n        self, bucket: str, path: str, expires_in: int = 3600\n    ) -> str:\n        async with httpx.AsyncClient(timeout=10) as client:\n            resp = await client.post(\n                f\"{self._base}/storage/v1/object/sign/{bucket}/{path}\",\n                headers=self._headers(),\n                json={\"expiresIn\": expires_in},\n            )\n        if resp.status_code != 200:\n            raise AppError(\"Could not sign the photo URL.\")\n        return f\"{self._base}/storage/v1{resp.json()['signedURL']}\"\n\n    async def delete_object(self, bucket: str, path: str) -> None:\n        async with httpx.AsyncClient(timeout=10) as client:\n            await client.delete(\n                f\"{self._base}/storage/v1/object/{bucket}/{path}\",\n                headers=self._headers(),\n            )\n\n\nsupabase = SupabaseClient()\n"}, {"p": "backend/app/db/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/app/db/repositories/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/app/db/repositories/discover_repo.py", "l": "python", "n": 88, "c": "\"\"\"Candidate generation. The expensive part runs in Postgres.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Dict, List\n\nfrom app.core import db\n\n\nasync def nearby_candidates(\n    viewer_id: str,\n    max_distance_km: float,\n    min_age: int,\n    max_age: int,\n    show_me: List[str],\n    limit: int,\n) -> List[Dict[str, Any]]:\n    \"\"\"Hard-filtered candidates with exact distance, nearest first.\n\n    Mirrors app.matching.filters.rejection_reason. The GiST index on\n    profiles.location keeps ST_DWithin cheap even with a large table.\n    \"\"\"\n    rows = await db.fetch(\n        \"\"\"\n        WITH me AS (\n            SELECT p.id, p.gender, p.location, p.interests\n              FROM profiles p WHERE p.id = $1\n        )\n        SELECT c.id,\n               c.display_name,\n               c.dob,\n               date_part('year', age(c.dob))::int AS age,\n               c.gender,\n               c.interested_in,\n               c.bio,\n               c.job_title,\n               c.city,\n               c.interests,\n               c.last_active_at,\n               ST_Distance(c.location, me.location) / 1000.0 AS distance_km,\n               (SELECT count(*) FROM profile_photos ph WHERE ph.profile_id = c.id) AS photo_count\n          FROM profiles c\n         CROSS JOIN me\n         WHERE c.id \u003c> me.id\n           AND c.is_onboarded\n           AND c.is_visible\n           AND NOT c.is_banned\n           AND NOT c.is_deleted\n           AND c.location IS NOT NULL\n           AND me.location IS NOT NULL\n           AND ST_DWithin(c.location, me.location, $2 * 1000.0)\n           AND date_part('year', age(c.dob))::int BETWEEN $3 - 2 AND $4 + 2\n           AND date_part('year', age(c.dob))::int >= 18\n           -- viewer is open to the candidate's gender\n           AND ('everyone' = ANY($5::text[]) OR c.gender::text = ANY($5::text[]))\n           -- candidate is open to the viewer's gender\n           AND ('everyone' = ANY(c.interested_in::text[]) OR me.gender::text = ANY(c.interested_in::text[]))\n           -- never shown twice\n           AND NOT EXISTS (SELECT 1 FROM swipes s WHERE s.actor_id = me.id AND s.target_id = c.id)\n           -- blocks in either direction\n           AND NOT EXISTS (\n                SELECT 1 FROM blocks b\n                 WHERE (b.blocker_id = me.id AND b.blocked_id = c.id)\n                    OR (b.blocker_id = c.id AND b.blocked_id = me.id))\n           AND EXISTS (SELECT 1 FROM profile_photos ph WHERE ph.profile_id = c.id)\n         ORDER BY c.location \u003c-> me.location\n         LIMIT $6\n        \"\"\",\n        viewer_id, float(max_distance_km), int(min_age), int(max_age), show_me, int(limit),\n    )\n    return [dict(r) for r in rows]\n\n\nasync def count_remaining(viewer_id: str, max_distance_km: float) -> int:\n    return int(\n        await db.fetchval(\n            \"\"\"\n            WITH me AS (SELECT id, location FROM profiles WHERE id = $1)\n            SELECT count(*) FROM profiles c CROSS JOIN me\n             WHERE c.id \u003c> me.id AND c.is_onboarded AND c.is_visible\n               AND NOT c.is_banned AND NOT c.is_deleted\n               AND c.location IS NOT NULL AND me.location IS NOT NULL\n               AND ST_DWithin(c.location, me.location, $2 * 1000.0)\n               AND NOT EXISTS (SELECT 1 FROM swipes s WHERE s.actor_id = me.id AND s.target_id = c.id)\n            \"\"\",\n            viewer_id, float(max_distance_km),\n        ) or 0\n    )\n"}, {"p": "backend/app/db/repositories/matches_repo.py", "l": "python", "n": 110, "c": "\"\"\"Match creation and listing.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Dict, List, Optional, Tuple\n\nfrom app.core import db\n\n\ndef ordered_pair(a: str, b: str) -> Tuple[str, str]:\n    \"\"\"Matches are stored once, with the lower uuid first.\"\"\"\n    return (a, b) if str(a) \u003c str(b) else (b, a)\n\n\nasync def create(user_a: str, user_b: str) -> Dict[str, Any]:\n    low, high = ordered_pair(user_a, user_b)\n    row = await db.fetchrow(\n        \"\"\"\n        INSERT INTO matches (user_low, user_high)\n        VALUES ($1, $2)\n        ON CONFLICT (user_low, user_high) DO UPDATE SET is_active = TRUE\n        RETURNING id, user_low, user_high, created_at\n        \"\"\",\n        low, high,\n    )\n    return dict(row)  # type: ignore[arg-type]\n\n\nasync def get_for_user(match_id: str, user_id: str) -> Optional[Dict[str, Any]]:\n    row = await db.fetchrow(\n        \"\"\"\n        SELECT id, user_low, user_high, created_at, last_message_at, is_active,\n               CASE WHEN user_low = $2 THEN user_high ELSE user_low END AS other_id\n          FROM matches\n         WHERE id = $1 AND (user_low = $2 OR user_high = $2)\n        \"\"\",\n        match_id, user_id,\n    )\n    return dict(row) if row else None\n\n\nasync def list_for_user(user_id: str, limit: int = 50) -> List[Dict[str, Any]]:\n    rows = await db.fetch(\n        \"\"\"\n        SELECT m.id,\n               m.created_at AS matched_at,\n               m.last_message_at,\n               CASE WHEN m.user_low = $1 THEN m.user_high ELSE m.user_low END AS other_id,\n               p.display_name,\n               date_part('year', age(p.dob))::int AS age,\n               p.gender, p.bio, p.job_title, p.city, p.interests, p.last_active_at,\n               -- Real distance, so a match does not render \"less than 1 km away\"\n               -- for everyone. NULL when either side has no location yet.\n               CASE\n                   WHEN p.location IS NOT NULL AND me.location IS NOT NULL\n                   THEN ST_Distance(p.location, me.location) / 1000.0\n               END AS distance_km,\n               lm.body AS last_message_preview,\n               lm.sender_id AS last_sender_id,\n               (SELECT count(*) FROM messages msg\n                 WHERE msg.match_id = m.id AND msg.sender_id \u003c> $1 AND msg.read_at IS NULL\n               ) AS unread_count\n          FROM matches m\n          JOIN profiles p\n            ON p.id = CASE WHEN m.user_low = $1 THEN m.user_high ELSE m.user_low END\n          CROSS JOIN (SELECT location FROM profiles WHERE id = $1) me\n          LEFT JOIN LATERAL (\n                SELECT body, sender_id FROM messages\n                 WHERE match_id = m.id ORDER BY sent_at DESC LIMIT 1\n          ) lm ON TRUE\n         WHERE (m.user_low = $1 OR m.user_high = $1)\n           AND m.is_active\n           AND NOT p.is_deleted\n         ORDER BY COALESCE(m.last_message_at, m.created_at) DESC\n         LIMIT $2\n        \"\"\",\n        user_id, limit,\n    )\n    return [dict(r) for r in rows]\n\n\nasync def deactivate(match_id: str, user_id: str) -> bool:\n    row = await db.fetchrow(\n        \"\"\"\n        UPDATE matches SET is_active = FALSE, unmatched_by = $2, unmatched_at = now()\n         WHERE id = $1 AND (user_low = $2 OR user_high = $2) AND is_active\n        RETURNING id\n        \"\"\",\n        match_id, user_id,\n    )\n    return row is not None\n\n\nasync def active_between(user_a: str, user_b: str) -> bool:\n    \"\"\"Is there a live match between these two?\"\"\"\n    low, high = ordered_pair(user_a, user_b)\n    return bool(\n        await db.fetchval(\n            \"SELECT TRUE FROM matches WHERE user_low = $1 AND user_high = $2 AND is_active\",\n            low, high,\n        )\n    )\n\n\nasync def deactivate_between(user_a: str, user_b: str) -> None:\n    low, high = ordered_pair(user_a, user_b)\n    await db.execute(\n        \"UPDATE matches SET is_active = FALSE, unmatched_at = now() WHERE user_low = $1 AND user_high = $2\",\n        low, high,\n    )\n"}, {"p": "backend/app/db/repositories/messages_repo.py", "l": "python", "n": 74, "c": "\"\"\"Chat message persistence.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Dict, List, Optional\n\nfrom app.core import db\n\n\nasync def create(match_id: str, sender_id: str, body: str, client_id: Optional[str]) -> Dict[str, Any]:\n    row = await db.fetchrow(\n        \"\"\"\n        WITH inserted AS (\n            INSERT INTO messages (match_id, sender_id, body, client_id)\n            VALUES ($1, $2, $3, $4)\n            ON CONFLICT (match_id, sender_id, client_id) DO NOTHING\n            RETURNING id, match_id, sender_id, body, sent_at, read_at, client_id\n        )\n        SELECT * FROM inserted\n        UNION ALL\n        SELECT id, match_id, sender_id, body, sent_at, read_at, client_id\n          FROM messages\n         WHERE $4 IS NOT NULL AND match_id = $1 AND sender_id = $2 AND client_id = $4\n         LIMIT 1\n        \"\"\",\n        match_id, sender_id, body, client_id,\n    )\n    # matches.last_message_at is maintained by the bump_match_last_message\n    # trigger; updating it here as well was a redundant second write.\n    return dict(row) if row else {}\n\n\nasync def list_for_match(match_id: str, limit: int = 50, before: Optional[str] = None) -> List[Dict[str, Any]]:\n    if before:\n        rows = await db.fetch(\n            \"\"\"\n            SELECT id, match_id, sender_id, body, sent_at, read_at, client_id\n              FROM messages\n             WHERE match_id = $1 AND sent_at \u003c (SELECT sent_at FROM messages WHERE id = $3)\n             ORDER BY sent_at DESC LIMIT $2\n            \"\"\",\n            match_id, limit, before,\n        )\n    else:\n        rows = await db.fetch(\n            \"\"\"\n            SELECT id, match_id, sender_id, body, sent_at, read_at, client_id\n              FROM messages\n             WHERE match_id = $1\n             ORDER BY sent_at DESC LIMIT $2\n            \"\"\",\n            match_id, limit,\n        )\n    return [dict(r) for r in reversed(rows)]\n\n\nasync def mark_read(match_id: str, reader_id: str) -> int:\n    result = await db.execute(\n        \"\"\"\n        UPDATE messages SET read_at = now()\n         WHERE match_id = $1 AND sender_id \u003c> $2 AND read_at IS NULL\n        \"\"\",\n        match_id, reader_id,\n    )\n    return int(result.split()[-1]) if result.startswith(\"UPDATE\") else 0\n\n\nasync def count_in_last_minute(sender_id: str) -> int:\n    return int(\n        await db.fetchval(\n            \"SELECT count(*) FROM messages WHERE sender_id = $1 AND sent_at > now() - interval '1 minute'\",\n            sender_id,\n        ) or 0\n    )\n"}, {"p": "backend/app/db/repositories/profiles_repo.py", "l": "python", "n": 218, "c": "\"\"\"Profile, photo and preference persistence.\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import date\nfrom typing import Any, Dict, List, Optional, Sequence\n\nfrom app.core import db\n\nPROFILE_COLUMNS = \"\"\"\n    p.id, p.display_name, p.dob, p.gender, p.interested_in, p.bio, p.job_title,\n    p.city, p.interests, p.is_onboarded, p.is_visible, p.is_banned,\n    p.last_active_at, p.created_at, p.updated_at,\n    (p.location IS NOT NULL) AS has_location\n\"\"\"\n\n\nasync def get_by_id(profile_id: str) -> Optional[Dict[str, Any]]:\n    row = await db.fetchrow(f\"SELECT {PROFILE_COLUMNS} FROM profiles p WHERE p.id = $1\", profile_id)\n    return dict(row) if row else None\n\n\nasync def upsert(profile_id: str, data: Dict[str, Any]) -> Dict[str, Any]:\n    row = await db.fetchrow(\n        \"\"\"\n        INSERT INTO profiles (id, display_name, dob, gender, interested_in, bio,\n                              job_title, city, interests, is_onboarded, last_active_at)\n        VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9, TRUE, now())\n        ON CONFLICT (id) DO UPDATE SET\n            display_name  = EXCLUDED.display_name,\n            dob           = EXCLUDED.dob,\n            gender        = EXCLUDED.gender,\n            interested_in = EXCLUDED.interested_in,\n            bio           = EXCLUDED.bio,\n            job_title     = EXCLUDED.job_title,\n            city          = EXCLUDED.city,\n            interests     = EXCLUDED.interests,\n            is_onboarded  = TRUE,\n            updated_at    = now()\n        RETURNING id\n        \"\"\",\n        profile_id,\n        data[\"display_name\"],\n        data[\"dob\"],\n        data[\"gender\"],\n        data[\"interested_in\"],\n        data.get(\"bio\", \"\"),\n        data.get(\"job_title\"),\n        data.get(\"city\"),\n        data.get(\"interests\", []),\n    )\n    return await get_by_id(str(row[\"id\"]))  # type: ignore[arg-type]\n\n\nasync def patch(profile_id: str, fields: Dict[str, Any]) -> Optional[Dict[str, Any]]:\n    if not fields:\n        return await get_by_id(profile_id)\n    allowed = {\n        \"display_name\", \"bio\", \"job_title\", \"city\",\n        \"interested_in\", \"interests\", \"is_visible\",\n    }\n    sets, args = [], []\n    for i, (key, value) in enumerate((k, v) for k, v in fields.items() if k in allowed):\n        sets.append(f\"{key} = ${i + 2}\")\n        args.append(value)\n    if not sets:\n        return await get_by_id(profile_id)\n    await db.execute(\n        f\"UPDATE profiles SET {', '.join(sets)}, updated_at = now() WHERE id = $1\",\n        profile_id,\n        *args,\n    )\n    return await get_by_id(profile_id)\n\n\nasync def set_location(profile_id: str, latitude: float, longitude: float, city: Optional[str]) -> None:\n    await db.execute(\n        \"\"\"\n        UPDATE profiles\n           SET location = ST_SetSRID(ST_MakePoint($3, $2), 4326)::geography,\n               city = COALESCE($4, city),\n               location_updated_at = now(),\n               updated_at = now()\n         WHERE id = $1\n        \"\"\",\n        profile_id, latitude, longitude, city,\n    )\n\n\nasync def touch_activity(profile_id: str) -> None:\n    await db.execute(\"UPDATE profiles SET last_active_at = now() WHERE id = $1\", profile_id)\n\n\nasync def soft_delete(profile_id: str) -> None:\n    await db.execute(\n        \"\"\"\n        UPDATE profiles\n           SET is_visible = FALSE, is_deleted = TRUE, display_name = 'Deleted user',\n               bio = '', job_title = NULL, interests = '{}', location = NULL,\n               updated_at = now()\n         WHERE id = $1\n        \"\"\",\n        profile_id,\n    )\n\n\n# ---------- photos ----------\n\nasync def list_photos(profile_id: str) -> List[Dict[str, Any]]:\n    rows = await db.fetch(\n        \"\"\"\n        SELECT id, profile_id, storage_path, position, is_primary\n          FROM profile_photos\n         WHERE profile_id = $1\n         ORDER BY is_primary DESC, position ASC, created_at ASC\n        \"\"\",\n        profile_id,\n    )\n    return [dict(r) for r in rows]\n\n\nasync def photos_for_many(profile_ids: Sequence[str]) -> Dict[str, List[Dict[str, Any]]]:\n    if not profile_ids:\n        return {}\n    rows = await db.fetch(\n        \"\"\"\n        SELECT id, profile_id, storage_path, position, is_primary\n          FROM profile_photos\n         WHERE profile_id = ANY($1::uuid[])\n         ORDER BY is_primary DESC, position ASC\n        \"\"\",\n        list(profile_ids),\n    )\n    grouped: Dict[str, List[Dict[str, Any]]] = {pid: [] for pid in profile_ids}\n    for r in rows:\n        grouped.setdefault(str(r[\"profile_id\"]), []).append(dict(r))\n    return grouped\n\n\nasync def count_photos(profile_id: str) -> int:\n    return int(await db.fetchval(\"SELECT count(*) FROM profile_photos WHERE profile_id = $1\", profile_id) or 0)\n\n\nasync def add_photo(profile_id: str, storage_path: str, make_primary: bool) -> Dict[str, Any]:\n    if make_primary:\n        await db.execute(\"UPDATE profile_photos SET is_primary = FALSE WHERE profile_id = $1\", profile_id)\n    row = await db.fetchrow(\n        \"\"\"\n        INSERT INTO profile_photos (profile_id, storage_path, position, is_primary)\n        VALUES ($1, $2,\n                COALESCE((SELECT max(position) + 1 FROM profile_photos WHERE profile_id = $1), 0),\n                $3 OR NOT EXISTS (SELECT 1 FROM profile_photos WHERE profile_id = $1))\n        RETURNING id, profile_id, storage_path, position, is_primary\n        \"\"\",\n        profile_id, storage_path, make_primary,\n    )\n    return dict(row)  # type: ignore[arg-type]\n\n\nasync def get_photo(profile_id: str, photo_id: str) -> Optional[Dict[str, Any]]:\n    row = await db.fetchrow(\n        \"SELECT id, profile_id, storage_path, position, is_primary FROM profile_photos WHERE id = $1 AND profile_id = $2\",\n        photo_id, profile_id,\n    )\n    return dict(row) if row else None\n\n\nasync def delete_photo(profile_id: str, photo_id: str) -> None:\n    await db.execute(\"DELETE FROM profile_photos WHERE id = $1 AND profile_id = $2\", photo_id, profile_id)\n    await db.execute(\n        \"\"\"\n        UPDATE profile_photos SET is_primary = TRUE\n         WHERE id = (SELECT id FROM profile_photos WHERE profile_id = $1 ORDER BY position LIMIT 1)\n           AND NOT EXISTS (SELECT 1 FROM profile_photos WHERE profile_id = $1 AND is_primary)\n        \"\"\",\n        profile_id,\n    )\n\n\nasync def reorder_photos(profile_id: str, ordered_ids: Sequence[str]) -> None:\n    await db.executemany(\n        \"UPDATE profile_photos SET position = $3 WHERE id = $1 AND profile_id = $2\",\n        [(pid, profile_id, idx) for idx, pid in enumerate(ordered_ids)],\n    )\n\n\n# ---------- preferences ----------\n\nasync def get_preferences(profile_id: str) -> Optional[Dict[str, Any]]:\n    row = await db.fetchrow(\n        \"\"\"\n        SELECT profile_id, min_age, max_age, max_distance_km, show_me, hide_profile\n          FROM preferences WHERE profile_id = $1\n        \"\"\",\n        profile_id,\n    )\n    return dict(row) if row else None\n\n\nasync def upsert_preferences(profile_id: str, prefs: Dict[str, Any]) -> Dict[str, Any]:\n    row = await db.fetchrow(\n        \"\"\"\n        INSERT INTO preferences (profile_id, min_age, max_age, max_distance_km, show_me, hide_profile)\n        VALUES ($1, $2, $3, $4, $5, $6)\n        ON CONFLICT (profile_id) DO UPDATE SET\n            min_age = EXCLUDED.min_age,\n            max_age = EXCLUDED.max_age,\n            max_distance_km = EXCLUDED.max_distance_km,\n            show_me = EXCLUDED.show_me,\n            hide_profile = EXCLUDED.hide_profile,\n            updated_at = now()\n        RETURNING profile_id, min_age, max_age, max_distance_km, show_me, hide_profile\n        \"\"\",\n        profile_id,\n        prefs[\"min_age\"], prefs[\"max_age\"], prefs[\"max_distance_km\"],\n        prefs[\"show_me\"], prefs.get(\"hide_profile\", False),\n    )\n    return dict(row)  # type: ignore[arg-type]\n"}, {"p": "backend/app/db/repositories/safety_repo.py", "l": "python", "n": 75, "c": "\"\"\"Blocks, reports and push-token storage.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Any, Dict, List\n\nfrom app.core import db\n\n\nasync def block(blocker_id: str, blocked_id: str) -> None:\n    await db.execute(\n        \"\"\"\n        INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $2)\n        ON CONFLICT (blocker_id, blocked_id) DO NOTHING\n        \"\"\",\n        blocker_id, blocked_id,\n    )\n\n\nasync def unblock(blocker_id: str, blocked_id: str) -> None:\n    await db.execute(\"DELETE FROM blocks WHERE blocker_id = $1 AND blocked_id = $2\", blocker_id, blocked_id)\n\n\nasync def list_blocked(blocker_id: str) -> List[Dict[str, Any]]:\n    rows = await db.fetch(\n        \"\"\"\n        SELECT b.blocked_id, p.display_name, b.created_at\n          FROM blocks b JOIN profiles p ON p.id = b.blocked_id\n         WHERE b.blocker_id = $1 ORDER BY b.created_at DESC\n        \"\"\",\n        blocker_id,\n    )\n    return [dict(r) for r in rows]\n\n\nasync def blocked_ids(user_id: str) -> List[str]:\n    rows = await db.fetch(\n        \"\"\"\n        SELECT blocked_id AS id FROM blocks WHERE blocker_id = $1\n        UNION\n        SELECT blocker_id AS id FROM blocks WHERE blocked_id = $1\n        \"\"\",\n        user_id,\n    )\n    return [str(r[\"id\"]) for r in rows]\n\n\nasync def report(reporter_id: str, reported_id: str, reason: str, details: str | None) -> str:\n    row = await db.fetchrow(\n        \"\"\"\n        INSERT INTO reports (reporter_id, reported_id, reason, details)\n        VALUES ($1, $2, $3, $4) RETURNING id\n        \"\"\",\n        reporter_id, reported_id, reason, details,\n    )\n    return str(row[\"id\"])  # type: ignore[index]\n\n\nasync def register_device(profile_id: str, token: str, platform: str) -> None:\n    await db.execute(\n        \"\"\"\n        INSERT INTO devices (profile_id, expo_push_token, platform, last_seen_at)\n        VALUES ($1, $2, $3, now())\n        ON CONFLICT (expo_push_token) DO UPDATE SET\n            profile_id = EXCLUDED.profile_id,\n            platform = EXCLUDED.platform,\n            last_seen_at = now()\n        \"\"\",\n        profile_id, token, platform,\n    )\n\n\nasync def push_tokens_for(profile_id: str) -> List[str]:\n    rows = await db.fetch(\"SELECT expo_push_token FROM devices WHERE profile_id = $1\", profile_id)\n    return [str(r[\"expo_push_token\"]) for r in rows]\n"}, {"p": "backend/app/db/repositories/swipes_repo.py", "l": "python", "n": 76, "c": "\"\"\"Swipe recording and reciprocity checks.\"\"\"\nfrom __future__ import annotations\n\nfrom datetime import datetime, timedelta, timezone\nfrom typing import Optional\n\nfrom app.core import db\n\n\nasync def record(actor_id: str, target_id: str, action: str) -> bool:\n    \"\"\"Insert a swipe. Returns False if this pair was already swiped.\"\"\"\n    row = await db.fetchrow(\n        \"\"\"\n        INSERT INTO swipes (actor_id, target_id, action)\n        VALUES ($1, $2, $3)\n        ON CONFLICT (actor_id, target_id) DO NOTHING\n        RETURNING id\n        \"\"\",\n        actor_id, target_id, action,\n    )\n    return row is not None\n\n\nasync def has_liked(actor_id: str, target_id: str) -> bool:\n    return bool(\n        await db.fetchval(\n            \"\"\"\n            SELECT TRUE FROM swipes\n             WHERE actor_id = $1 AND target_id = $2 AND action IN ('like', 'superlike')\n            \"\"\",\n            actor_id, target_id,\n        )\n    )\n\n\nasync def likes_in_last_day(actor_id: str) -> int:\n    return int(\n        await db.fetchval(\n            \"\"\"\n            SELECT count(*) FROM swipes\n             WHERE actor_id = $1 AND action IN ('like', 'superlike')\n               AND created_at > now() - interval '24 hours'\n            \"\"\",\n            actor_id,\n        ) or 0\n    )\n\n\nasync def peek_last(actor_id: str) -> Optional[str]:\n    \"\"\"Who the most recent undoable swipe was aimed at, without removing it.\"\"\"\n    row = await db.fetchrow(\n        \"\"\"\n        SELECT target_id FROM swipes\n         WHERE actor_id = $1 AND created_at > now() - interval '3 minutes'\n         ORDER BY created_at DESC LIMIT 1\n        \"\"\",\n        actor_id,\n    )\n    return str(row[\"target_id\"]) if row else None\n\n\nasync def undo_last(actor_id: str) -> Optional[str]:\n    \"\"\"Remove the most recent swipe if it is under 3 minutes old.\"\"\"\n    row = await db.fetchrow(\n        \"\"\"\n        DELETE FROM swipes\n         WHERE id = (\n            SELECT id FROM swipes\n             WHERE actor_id = $1 AND created_at > now() - interval '3 minutes'\n             ORDER BY created_at DESC LIMIT 1)\n        RETURNING target_id\n        \"\"\",\n        actor_id,\n    )\n    return str(row[\"target_id\"]) if row else None\n"}, {"p": "backend/app/deps.py", "l": "python", "n": 31, "c": "\"\"\"FastAPI dependencies.\"\"\"\nfrom typing import Annotated\n\nfrom fastapi import Depends, Header\n\nfrom app.core.errors import Unauthorized\nfrom app.core.security import user_id_from_token\nfrom app.db.repositories import profiles_repo\n\n\nasync def current_user_id(authorization: Annotated[str | None, Header()] = None) -> str:\n    \"\"\"Resolve the caller from a Supabase bearer token.\"\"\"\n    if not authorization or not authorization.lower().startswith(\"bearer \"):\n        raise Unauthorized(\"Missing bearer token.\")\n    token = authorization.split(\" \", 1)[1].strip()\n    if not token:\n        raise Unauthorized(\"Missing bearer token.\")\n    return user_id_from_token(token)\n\n\nCurrentUser = Annotated[str, Depends(current_user_id)]\n\n\nasync def active_user_id(user_id: CurrentUser) -> str:\n    \"\"\"Same as CurrentUser, but also stamps last_active_at.\"\"\"\n    await profiles_repo.touch_activity(user_id)\n    return user_id\n\n\nActiveUser = Annotated[str, Depends(active_user_id)]\n"}, {"p": "backend/app/matching/__init__.py", "l": "python", "n": 1, "c": ""}, {"p": "backend/app/matching/filters.py", "l": "python", "n": 83, "c": "\"\"\"Hard filters. These are gates, not scores: failing one removes a candidate.\n\nAnything here must also be enforced in SQL (see the nearby_profiles RPC) — this\nmodule is the readable spec and the thing tests assert against.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom datetime import date\nfrom typing import Optional, Sequence, Set\n\nfrom app.matching.scoring import age_from_dob\n\nMIN_LEGAL_AGE = 18\n\n\n@dataclass\nclass Viewer:\n    id: str\n    gender: str\n    interested_in: Sequence[str]\n    min_age: int\n    max_age: int\n    max_distance_km: float\n    blocked_ids: Set[str]\n    swiped_ids: Set[str]\n\n\n@dataclass\nclass Candidate:\n    id: str\n    gender: str\n    interested_in: Sequence[str]\n    dob: date\n    distance_km: float\n    is_visible: bool\n    is_onboarded: bool\n    is_banned: bool = False\n    blocked_ids: Set[str] = None  # type: ignore[assignment]\n\n    def __post_init__(self) -> None:\n        if self.blocked_ids is None:\n            self.blocked_ids = set()\n\n\ndef rejection_reason(viewer: Viewer, candidate: Candidate) -> Optional[str]:\n    \"\"\"Return why a candidate is ineligible, or None if they pass.\"\"\"\n    if candidate.id == viewer.id:\n        return \"self\"\n    if not candidate.is_onboarded:\n        return \"not_onboarded\"\n    if not candidate.is_visible:\n        return \"hidden\"\n    if candidate.is_banned:\n        return \"banned\"\n    if candidate.id in viewer.blocked_ids or viewer.id in candidate.blocked_ids:\n        return \"blocked\"\n    if candidate.id in viewer.swiped_ids:\n        return \"already_seen\"\n\n    age = age_from_dob(candidate.dob)\n    if age \u003c MIN_LEGAL_AGE:\n        return \"underage\"\n    # Age preference is a hard gate with a small grace band; scoring handles the rest.\n    if age \u003c viewer.min_age - 2 or age > viewer.max_age + 2:\n        return \"age_out_of_range\"\n\n    if candidate.distance_km > viewer.max_distance_km:\n        return \"too_far\"\n\n    # Mutual orientation: each must be open to the other's gender.\n    if viewer.interested_in and \"everyone\" not in viewer.interested_in:\n        if candidate.gender not in viewer.interested_in:\n            return \"orientation_viewer\"\n    if candidate.interested_in and \"everyone\" not in candidate.interested_in:\n        if viewer.gender not in candidate.interested_in:\n            return \"orientation_candidate\"\n    return None\n\n\ndef is_eligible(viewer: Viewer, candidate: Candidate) -> bool:\n    return rejection_reason(viewer, candidate) is None\n"}, {"p": "backend/app/matching/geo.py", "l": "python", "n": 81, "c": "\"\"\"Geospatial helpers.\n\nPostgres does the heavy lifting (PostGIS `geography` + GiST index). These\nhelpers exist for scoring, display rounding and tests, so the Python side\nnever needs a DB round-trip to reason about distance.\n\"\"\"\nfrom __future__ import annotations\n\nimport math\nfrom dataclasses import dataclass\n\nEARTH_RADIUS_KM = 6371.0088\n\n\n@dataclass(frozen=True)\nclass Coordinates:\n    latitude: float\n    longitude: float\n\n    def __post_init__(self) -> None:\n        if not -90.0 \u003c= self.latitude \u003c= 90.0:\n            raise ValueError(f\"latitude out of range: {self.latitude}\")\n        if not -180.0 \u003c= self.longitude \u003c= 180.0:\n            raise ValueError(f\"longitude out of range: {self.longitude}\")\n\n\ndef haversine_km(a: Coordinates, b: Coordinates) -> float:\n    \"\"\"Great-circle distance in kilometres.\"\"\"\n    lat1, lon1 = math.radians(a.latitude), math.radians(a.longitude)\n    lat2, lon2 = math.radians(b.latitude), math.radians(b.longitude)\n    dlat, dlon = lat2 - lat1, lon2 - lon1\n    h = math.sin(dlat / 2) ** 2 + math.cos(lat1) * math.cos(lat2) * math.sin(dlon / 2) ** 2\n    return 2 * EARTH_RADIUS_KM * math.asin(min(1.0, math.sqrt(h)))\n\n\ndef bounding_box(center: Coordinates, radius_km: float) -> tuple[float, float, float, float]:\n    \"\"\"(min_lat, min_lon, max_lat, max_lon) — a cheap pre-filter before exact distance.\"\"\"\n    lat_delta = math.degrees(radius_km / EARTH_RADIUS_KM)\n    cos_lat = math.cos(math.radians(center.latitude))\n    lon_delta = 180.0 if abs(cos_lat) \u003c 1e-9 else math.degrees(radius_km / (EARTH_RADIUS_KM * abs(cos_lat)))\n    return (\n        max(-90.0, center.latitude - lat_delta),\n        max(-180.0, center.longitude - lon_delta),\n        min(90.0, center.latitude + lat_delta),\n        min(180.0, center.longitude + lon_delta),\n    )\n\n\ndef display_distance(km: float) -> str:\n    \"\"\"Coarse, privacy-preserving distance label.\n\n    Never reveals a precise location: under 1km reads as \"less than 1 km away\",\n    and everything else is rounded to the nearest kilometre.\n    \"\"\"\n    if km \u003c 1:\n        return \"less than 1 km away\"\n    if km \u003c 10:\n        return f\"{round(km)} km away\"\n    if km \u003c 100:\n        return f\"{int(round(km / 5) * 5)} km away\"\n    return f\"{int(round(km / 50) * 50)}+ km away\"\n\n\ndef jitter_for_privacy(coords: Coordinates, meters: float = 300.0) -> Coordinates:\n    \"\"\"Snap a coordinate onto a fixed ~300m grid.\n\n    Every point inside a cell collapses onto the same representative, so a\n    stored location cannot be narrowed below the cell. The longitude grid is\n    derived from the *snapped* latitude, not the input latitude — otherwise the\n    grid width varies slightly per point, two people in one cell still get\n    distinguishable longitudes, and the function is not idempotent.\n    \"\"\"\n    grid_deg_lat = meters / 111_320.0\n    snapped_lat = round(coords.latitude / grid_deg_lat) * grid_deg_lat\n\n    cos_lat = max(0.01, math.cos(math.radians(snapped_lat)))\n    grid_deg_lon = meters / (111_320.0 * cos_lat)\n    snapped_lon = round(coords.longitude / grid_deg_lon) * grid_deg_lon\n\n    return Coordinates(latitude=snapped_lat, longitude=snapped_lon)\n"}, {"p": "backend/app/matching/ranking.py", "l": "python", "n": 58, "c": "\"\"\"Turn scored candidates into the deck the client swipes through.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import List, Sequence\n\nfrom app.matching.scoring import ScoreBreakdown\n\n\n@dataclass\nclass RankedCandidate:\n    profile_id: str\n    score: float\n    distance_km: float\n    breakdown: ScoreBreakdown\n\n\nBAND_WIDTH_KM = 5\n\n\ndef _band(candidate: RankedCandidate) -> int:\n    return int(candidate.distance_km // BAND_WIDTH_KM)\n\n\ndef diversify(\n    ranked: Sequence[RankedCandidate], window: int = 3, max_per_window: int = 2\n) -> List[RankedCandidate]:\n    \"\"\"Avoid handing back a run of near-identical distances.\n\n    At each position, take the highest-scoring candidate that keeps the recent\n    window varied; if every remaining candidate would breach the cap (because\n    they are all in one band), fall back to score order rather than stalling.\n\n    An earlier version deferred candidates and appended them at the end, which\n    simply moved the run to the tail. Interleaving is what actually varies the\n    deck, and it costs at most O(n^2) on a deck of ~20.\n    \"\"\"\n    remaining = list(ranked)\n    out: List[RankedCandidate] = []\n\n    while remaining:\n        recent = [_band(c) for c in out[-window:]]\n        chosen = 0  # default: best remaining score\n        for index, candidate in enumerate(remaining):\n            if recent.count(_band(candidate)) \u003c max_per_window:\n                chosen = index\n                break\n        out.append(remaining.pop(chosen))\n\n    return out\n\n\ndef rank(candidates: Sequence[RankedCandidate], limit: int, apply_diversity: bool = True) -> List[RankedCandidate]:\n    ordered = sorted(candidates, key=lambda c: (-c.score, c.distance_km, c.profile_id))\n    if apply_diversity:\n        ordered = diversify(ordered)\n    return ordered[:limit]\n"}, {"p": "backend/app/matching/scoring.py", "l": "python", "n": 148, "c": "\"\"\"Compatibility scoring for discovery ranking.\n\nThe score is a transparent weighted blend in [0, 1]. Every component is\nindependently testable and every weight is named, so a ranking decision can\nalways be explained to a user (\"you both like X, and they're 3 km away\").\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom datetime import date, datetime, timezone\nfrom typing import Dict, Iterable, List, Sequence\n\n# Component weights. Must sum to 1.0 — asserted in tests.\nWEIGHTS: Dict[str, float] = {\n    \"distance\": 0.34,\n    \"interests\": 0.24,\n    \"age\": 0.16,\n    \"activity\": 0.14,\n    \"completeness\": 0.12,\n}\n\n\n@dataclass\nclass ScoreBreakdown:\n    \"\"\"Per-component contributions, kept for the explain endpoint.\"\"\"\n\n    components: Dict[str, float] = field(default_factory=dict)\n    total: float = 0.0\n    reasons: List[str] = field(default_factory=list)\n\n    def as_dict(self) -> Dict[str, object]:\n        return {\n            \"total\": round(self.total, 4),\n            \"components\": {k: round(v, 4) for k, v in self.components.items()},\n            \"reasons\": self.reasons,\n        }\n\n\ndef distance_score(distance_km: float, max_distance_km: float, half_life_km: float = 25.0) -> float:\n    \"\"\"1.0 at zero distance, decaying smoothly, 0.0 beyond the user's limit.\"\"\"\n    if distance_km \u003c 0:\n        raise ValueError(\"distance cannot be negative\")\n    if max_distance_km \u003c= 0:\n        return 0.0\n    if distance_km >= max_distance_km:\n        return 0.0\n    decay = 0.5 ** (distance_km / max(1e-6, half_life_km))\n    edge_taper = 1.0 - (distance_km / max_distance_km) ** 3\n    return max(0.0, min(1.0, decay * edge_taper))\n\n\ndef interest_score(mine: Iterable[str], theirs: Iterable[str]) -> float:\n    \"\"\"Jaccard overlap of interest tags.\"\"\"\n    a, b = {s.lower().strip() for s in mine if s}, {s.lower().strip() for s in theirs if s}\n    if not a or not b:\n        return 0.0\n    return len(a & b) / len(a | b)\n\n\ndef age_from_dob(dob: date, today: date | None = None) -> int:\n    today = today or datetime.now(timezone.utc).date()\n    return today.year - dob.year - ((today.month, today.day) \u003c (dob.month, dob.day))\n\n\ndef age_score(candidate_age: int, min_age: int, max_age: int) -> float:\n    \"\"\"1.0 inside the preferred band, tapering just outside it.\"\"\"\n    if min_age > max_age:\n        min_age, max_age = max_age, min_age\n    if min_age \u003c= candidate_age \u003c= max_age:\n        return 1.0\n    gap = min_age - candidate_age if candidate_age \u003c min_age else candidate_age - max_age\n    return max(0.0, 1.0 - (gap / 5.0))\n\n\ndef activity_score(last_active_at: datetime | None, now: datetime | None = None) -> float:\n    \"\"\"Recently-active people rank higher; nobody is zeroed out for a quiet week.\"\"\"\n    if last_active_at is None:\n        return 0.0\n    now = now or datetime.now(timezone.utc)\n    if last_active_at.tzinfo is None:\n        last_active_at = last_active_at.replace(tzinfo=timezone.utc)\n    hours = max(0.0, (now - last_active_at).total_seconds() / 3600.0)\n    if hours \u003c= 24:\n        return 1.0\n    if hours \u003c= 72:\n        return 0.8\n    if hours \u003c= 24 * 7:\n        return 0.6\n    if hours \u003c= 24 * 30:\n        return 0.3\n    return 0.1\n\n\ndef completeness_score(photo_count: int, bio_length: int, interest_count: int) -> float:\n    \"\"\"Rewards a profile that gives other people something to go on.\"\"\"\n    photos = min(1.0, photo_count / 3.0)\n    bio = min(1.0, bio_length / 140.0)\n    interests = min(1.0, interest_count / 5.0)\n    return 0.5 * photos + 0.3 * bio + 0.2 * interests\n\n\ndef _reasons(components: Dict[str, float], shared: Sequence[str], distance_km: float) -> List[str]:\n    out: List[str] = []\n    if shared:\n        head = \", \".join(shared[:3])\n        out.append(f\"You both like {head}\")\n    if components.get(\"distance\", 0) > 0.6:\n        from app.matching.geo import display_distance\n\n        out.append(display_distance(distance_km).capitalize())\n    if components.get(\"activity\", 0) >= 0.8:\n        out.append(\"Active recently\")\n    if components.get(\"completeness\", 0) >= 0.7:\n        out.append(\"Detailed profile\")\n    return out\n\n\ndef score_candidate(\n    *,\n    distance_km: float,\n    max_distance_km: float,\n    my_interests: Sequence[str],\n    their_interests: Sequence[str],\n    candidate_age: int,\n    min_age: int,\n    max_age: int,\n    last_active_at: datetime | None,\n    photo_count: int,\n    bio_length: int,\n    half_life_km: float = 25.0,\n) -> ScoreBreakdown:\n    components = {\n        \"distance\": distance_score(distance_km, max_distance_km, half_life_km),\n        \"interests\": interest_score(my_interests, their_interests),\n        \"age\": age_score(candidate_age, min_age, max_age),\n        \"activity\": activity_score(last_active_at),\n        \"completeness\": completeness_score(photo_count, bio_length, len(their_interests)),\n    }\n    total = sum(components[k] * WEIGHTS[k] for k in WEIGHTS)\n    shared = sorted(\n        {s.lower().strip() for s in my_interests} & {s.lower().strip() for s in their_interests}\n    )\n    return ScoreBreakdown(\n        components=components,\n        total=round(total, 6),\n        reasons=_reasons(components, shared, distance_km),\n    )\n"}, {"p": "backend/app/models/__init__.py", "l": "python", "n": 2, "c": "\"\"\"Pydantic request/response models.\"\"\"\n"}, {"p": "backend/app/models/common.py", "l": "python", "n": 27, "c": "from datetime import datetime\nfrom typing import Generic, List, Optional, TypeVar\n\nfrom pydantic import BaseModel, Field\n\nT = TypeVar(\"T\")\n\n\nclass Page(BaseModel, Generic[T]):\n    items: List[T]\n    next_cursor: Optional[str] = None\n    has_more: bool = False\n\n\nclass Ok(BaseModel):\n    ok: bool = True\n\n\nclass Timestamped(BaseModel):\n    created_at: datetime\n    updated_at: Optional[datetime] = None\n\n\nclass Coordinates(BaseModel):\n    latitude: float = Field(ge=-90, le=90)\n    longitude: float = Field(ge=-180, le=180)\n"}, {"p": "backend/app/models/device.py", "l": "python", "n": 15, "c": "from enum import Enum\n\nfrom pydantic import BaseModel, Field\n\n\nclass Platform(str, Enum):\n    ios = \"ios\"\n    android = \"android\"\n    web = \"web\"\n\n\nclass DeviceRegister(BaseModel):\n    expo_push_token: str = Field(min_length=10, max_length=200)\n    platform: Platform\n"}, {"p": "backend/app/models/discover.py", "l": "python", "n": 20, "c": "from typing import Any, Dict, List, Optional\n\nfrom pydantic import BaseModel\n\nfrom app.models.profile import PublicProfile\n\n\nclass DiscoverCard(BaseModel):\n    profile: PublicProfile\n    distance_km: float\n    score: float\n    reasons: List[str] = []\n    breakdown: Optional[Dict[str, Any]] = None\n\n\nclass DiscoverDeck(BaseModel):\n    cards: List[DiscoverCard]\n    exhausted: bool = False\n    suggestion: Optional[str] = None\n"}, {"p": "backend/app/models/match.py", "l": "python", "n": 17, "c": "from datetime import datetime\nfrom typing import Optional\n\nfrom pydantic import BaseModel\n\nfrom app.models.profile import PublicProfile\n\n\nclass MatchSummary(BaseModel):\n    id: str\n    other: PublicProfile\n    matched_at: datetime\n    last_message_at: Optional[datetime] = None\n    last_message_preview: Optional[str] = None\n    unread_count: int = 0\n    is_new: bool = False\n"}, {"p": "backend/app/models/message.py", "l": "python", "n": 29, "c": "from datetime import datetime\nfrom typing import Optional\n\nfrom pydantic import BaseModel, Field, field_validator\n\n\nclass MessageCreate(BaseModel):\n    body: str = Field(min_length=1, max_length=2000)\n    client_id: Optional[str] = Field(default=None, max_length=64)\n\n    @field_validator(\"body\")\n    @classmethod\n    def _strip(cls, v: str) -> str:\n        cleaned = v.strip()\n        if not cleaned:\n            raise ValueError(\"Message cannot be empty.\")\n        return cleaned\n\n\nclass Message(BaseModel):\n    id: str\n    match_id: str\n    sender_id: str\n    body: str\n    sent_at: datetime\n    read_at: Optional[datetime] = None\n    is_mine: bool = False\n    client_id: Optional[str] = None\n"}, {"p": "backend/app/models/preference.py", "l": "python", "n": 28, "c": "from typing import List, Optional\n\nfrom pydantic import BaseModel, Field, model_validator\n\nfrom app.models.profile import InterestedIn\n\n\nclass Preferences(BaseModel):\n    min_age: int = Field(default=18, ge=18, le=99)\n    max_age: int = Field(default=45, ge=18, le=99)\n    max_distance_km: int = Field(default=50, ge=1, le=500)\n    show_me: List[InterestedIn] = Field(default_factory=lambda: [InterestedIn.everyone])\n    hide_profile: bool = False\n\n    @model_validator(mode=\"after\")\n    def _ordered_ages(self) -> \"Preferences\":\n        if self.min_age > self.max_age:\n            raise ValueError(\"min_age cannot be greater than max_age\")\n        return self\n\n\nclass PreferencesUpdate(BaseModel):\n    min_age: Optional[int] = Field(default=None, ge=18, le=99)\n    max_age: Optional[int] = Field(default=None, ge=18, le=99)\n    max_distance_km: Optional[int] = Field(default=None, ge=1, le=500)\n    show_me: Optional[List[InterestedIn]] = None\n    hide_profile: Optional[bool] = None\n"}, {"p": "backend/app/models/profile.py", "l": "python", "n": 111, "c": "from datetime import date, datetime\nfrom enum import Enum\nfrom typing import List, Optional\n\nfrom pydantic import BaseModel, Field, field_validator\n\nfrom app.matching.filters import MIN_LEGAL_AGE\nfrom app.matching.scoring import age_from_dob\n\n\nclass Gender(str, Enum):\n    male = \"male\"\n    female = \"female\"\n    nonbinary = \"nonbinary\"\n    other = \"other\"\n\n\nclass InterestedIn(str, Enum):\n    male = \"male\"\n
