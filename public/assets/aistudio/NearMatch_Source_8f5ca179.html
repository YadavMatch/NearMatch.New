 people.aarav)\n        names = {r[\"display_name\"] for r in await conn.fetch(\"SELECT display_name FROM profiles\")}\n        await as_owner(conn)\n        assert names == {\"TestAarav\", \"TestDiya\"}\n\n    async def test_unmatching_hides_the_profile_again(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await conn.execute(\"UPDATE matches SET is_active = FALSE WHERE id = $1\", match_id)\n        await as_user(conn, people.aarav)\n        names = {r[\"display_name\"] for r in await conn.fetch(\"SELECT display_name FROM profiles\")}\n        await as_owner(conn)\n        assert names == {\"TestAarav\"}\n\n    async def test_you_cannot_edit_someone_elses_profile(self, conn, people):\n        await make_match(conn, people.aarav, people.diya)\n        await as_user(conn, people.aarav)\n        result = await conn.execute(\n            \"UPDATE profiles SET bio = 'tampered' WHERE id = $1\", people.diya\n        )\n        await as_owner(conn)\n        assert result == \"UPDATE 0\"\n        assert await conn.fetchval(\"SELECT bio FROM profiles WHERE id = $1\", people.diya) != \"tampered\"\n\n    async def test_you_cannot_create_a_profile_for_someone_else(self, conn, people):\n        await as_user(conn, people.aarav)\n        await assert_denied(\n            conn,\n            \"\"\"\n            INSERT INTO profiles (id, display_name, dob, gender)\n            VALUES ($1, 'Imposter', date '1990-01-01', 'other')\n            \"\"\",\n            people.kabir,\n        )\n        await as_owner(conn)\n\n    async def test_you_cannot_unban_yourself(self, conn, people):\n        \"\"\"A banned user must not be able to clear their own ban.\n\n        RLS alone cannot express this — an UPDATE policy sees the old row in\n        USING and the new row in WITH CHECK, never both — so a BEFORE UPDATE\n        trigger reverts the protected columns instead.\n        \"\"\"\n        await conn.execute(\"UPDATE profiles SET is_banned = TRUE WHERE id = $1\", people.aarav)\n        await as_user(conn, people.aarav)\n        await conn.execute(\n            \"UPDATE profiles SET is_banned = FALSE, bio = 'edited' WHERE id = $1\", people.aarav\n        )\n        await as_owner(conn)\n        assert await conn.fetchval(\n            \"SELECT is_banned FROM profiles WHERE id = $1\", people.aarav\n        ) is True, \"a banned user cleared their own ban\"\n        # The ordinary part of the same update must still have applied.\n        assert await conn.fetchval(\"SELECT bio FROM profiles WHERE id = $1\", people.aarav) == \"edited\"\n\n    async def test_you_cannot_delete_flag_yourself_back(self, conn, people):\n        await conn.execute(\"UPDATE profiles SET is_deleted = TRUE WHERE id = $1\", people.aarav)\n        await as_user(conn, people.aarav)\n        await conn.execute(\"UPDATE profiles SET is_deleted = FALSE WHERE id = $1\", people.aarav)\n        await as_owner(conn)\n        assert await conn.fetchval(\n            \"SELECT is_deleted FROM profiles WHERE id = $1\", people.aarav\n        ) is True\n\n    async def test_you_cannot_change_your_date_of_birth(self, conn, people):\n        \"\"\"Age is a safety property, not a preference — an adult account must\n        not be able to become a minor account, or vice versa.\"\"\"\n        original = await conn.fetchval(\"SELECT dob FROM profiles WHERE id = $1\", people.aarav)\n        await as_user(conn, people.aarav)\n        await conn.execute(\n            \"UPDATE profiles SET dob = date '2010-01-01' WHERE id = $1\", people.aarav\n        )\n        await as_owner(conn)\n        assert await conn.fetchval(\"SELECT dob FROM profiles WHERE id = $1\", people.aarav) == original\n\n    async def test_moderation_still_works_for_the_backend(self, conn, people):\n        # The API connects as its own role, not `authenticated`, so it is exempt.\n        await conn.execute(\"UPDATE profiles SET is_banned = TRUE WHERE id = $1\", people.diya)\n        assert await conn.fetchval(\n            \"SELECT is_banned FROM profiles WHERE id = $1\", people.diya\n        ) is True\n\n\nclass TestLikePrivacy:\n    async def test_you_cannot_see_who_liked_you(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.kabir,\n        )\n        await as_user(conn, people.kabir)\n        count = await conn.fetchval(\"SELECT count(*) FROM swipes\")\n        await as_owner(conn)\n        assert count == 0, \"incoming likes must stay hidden until they are mutual\"\n\n    async def test_you_can_see_your_own_swipes(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.kabir,\n        )\n        await as_user(conn, people.aarav)\n        count = await conn.fetchval(\"SELECT count(*) FROM swipes\")\n        await as_owner(conn)\n        assert count == 1\n\n    async def test_you_cannot_forge_a_swipe_as_another_user(self, conn, people):\n        await as_user(conn, people.kabir)\n        await assert_denied(\n            conn,\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.kabir,\n        )\n        await as_owner(conn)\n\n    async def test_you_cannot_swipe_on_someone_who_blocked_you(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $2)\",\n            people.diya, people.aarav,\n        )\n        await as_user(conn, people.aarav)\n        await assert_denied(\n            conn,\n            \"INSERT INTO swipes (actor_id, target_id, action) VALUES ($1, $2, 'like')\",\n            people.aarav, people.diya,\n        )\n        await as_owner(conn)\n\n\nclass TestChatIsolation:\n    async def test_a_stranger_cannot_read_your_messages(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await conn.execute(\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'private')\",\n            match_id, people.aarav,\n        )\n        await as_user(conn, people.kabir)\n        count = await conn.fetchval(\"SELECT count(*) FROM messages\")\n        await as_owner(conn)\n        assert count == 0\n\n    async def test_both_participants_can_read_the_thread(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await conn.execute(\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'hello')\",\n            match_id, people.aarav,\n        )\n        for uid in (people.aarav, people.diya):\n            await as_user(conn, uid)\n            assert await conn.fetchval(\"SELECT count(*) FROM messages\") == 1\n            await as_owner(conn)\n\n    async def test_a_stranger_cannot_inject_a_message(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await as_user(conn, people.kabir)\n        await assert_denied(\n            conn,\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'intruder')\",\n            match_id, people.kabir,\n        )\n        await as_owner(conn)\n\n    async def test_you_cannot_send_a_message_as_your_match(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await as_user(conn, people.aarav)\n        await assert_denied(\n            conn,\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'forged')\",\n            match_id, people.diya,\n        )\n        await as_owner(conn)\n\n    async def test_you_cannot_message_a_closed_conversation(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await conn.execute(\"UPDATE matches SET is_active = FALSE WHERE id = $1\", match_id)\n        await as_user(conn, people.aarav)\n        await assert_denied(\n            conn,\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'still here')\",\n            match_id, people.aarav,\n        )\n        await as_owner(conn)\n\n    async def test_you_cannot_edit_your_own_sent_message(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await conn.execute(\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'original')\",\n            match_id, people.aarav,\n        )\n        await as_user(conn, people.aarav)\n        result = await conn.execute(\n            \"UPDATE messages SET body = 'rewritten' WHERE match_id = $1\", match_id\n        )\n        await as_owner(conn)\n        assert result == \"UPDATE 0\", \"a sent message must not be rewritable\"\n        assert await conn.fetchval(\"SELECT body FROM messages WHERE match_id = $1\", match_id) == \"original\"\n\n    async def test_the_recipient_can_mark_a_message_read(self, conn, people):\n        match_id = await make_match(conn, people.aarav, people.diya)\n        await conn.execute(\n            \"INSERT INTO messages (match_id, sender_id, body) VALUES ($1, $2, 'hi')\",\n            match_id, people.aarav,\n        )\n        await as_user(conn, people.diya)\n        result = await conn.execute(\n            \"UPDATE messages SET read_at = now() WHERE match_id = $1 AND sender_id \u003c> $2\",\n            match_id, people.diya,\n        )\n        await as_owner(conn)\n        assert result == \"UPDATE 1\"\n\n\nclass TestSafetyTables:\n    async def test_you_cannot_read_another_users_blocks(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO blocks (blocker_id, blocked_id) VALUES ($1, $2)\",\n            people.diya, people.kabir,\n        )\n        await as_user(conn, people.aarav)\n        count = await conn.fetchval(\"SELECT count(*) FROM blocks\")\n        await as_owner(conn)\n        assert count == 0\n\n    async def test_you_cannot_read_the_moderation_queue(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO reports (reporter_id, reported_id, reason) VALUES ($1, $2, 'spam')\",\n            people.diya, people.kabir,\n        )\n        await as_user(conn, people.aarav)\n        count = await conn.fetchval(\"SELECT count(*) FROM reports\")\n        await as_owner(conn)\n        assert count == 0\n\n    async def test_you_cannot_file_a_report_as_someone_else(self, conn, people):\n        await as_user(conn, people.aarav)\n        await assert_denied(\n            conn,\n            \"INSERT INTO reports (reporter_id, reported_id, reason) VALUES ($1, $2, 'spam')\",\n            people.diya, people.kabir,\n        )\n        await as_owner(conn)\n\n    async def test_you_cannot_read_another_users_push_tokens(self, conn, people):\n        await conn.execute(\n            \"INSERT INTO devices (profile_id, expo_push_token, platform) VALUES ($1, $2, 'ios')\",\n            people.diya, \"ExponentPushToken[secret]\",\n        )\n        await as_user(conn, people.aarav)\n        count = await conn.fetchval(\"SELECT count(*) FROM devices\")\n        await as_owner(conn)\n        assert count == 0\n"}, {"p": "tests/unit/test_filters.py", "l": "python", "n": 99, "c": "\"\"\"Hard eligibility filters. Each of these is a safety or correctness gate.\"\"\"\nfrom dataclasses import replace\nfrom datetime import date\n\nimport pytest\n\nfrom app.matching.filters import MIN_LEGAL_AGE, Candidate, is_eligible, rejection_reason\n\n\nclass TestEligibility:\n    def test_a_matching_pair_passes(self, viewer, candidate):\n        assert rejection_reason(viewer, candidate) is None\n        assert is_eligible(viewer, candidate)\n\n    def test_never_shows_you_to_yourself(self, viewer, candidate):\n        same = replace(candidate, id=viewer.id)\n        assert rejection_reason(viewer, same) == \"self\"\n\n    def test_skips_incomplete_profiles(self, viewer, candidate):\n        assert rejection_reason(viewer, replace(candidate, is_onboarded=False)) == \"not_onboarded\"\n\n    def test_respects_a_hidden_profile(self, viewer, candidate):\n        assert rejection_reason(viewer, replace(candidate, is_visible=False)) == \"hidden\"\n\n    def test_excludes_banned_accounts(self, viewer, candidate):\n        assert rejection_reason(viewer, replace(candidate, is_banned=True)) == \"banned\"\n\n\nclass TestBlocking:\n    def test_blocked_by_the_viewer(self, viewer, candidate):\n        blocker = replace(viewer, blocked_ids={candidate.id})\n        assert rejection_reason(blocker, candidate) == \"blocked\"\n\n    def test_blocked_by_the_candidate(self, viewer, candidate):\n        blocked = replace(candidate, blocked_ids={viewer.id})\n        assert rejection_reason(viewer, blocked) == \"blocked\"\n\n    def test_blocking_beats_every_other_match_signal(self, viewer, candidate):\n        # A perfect match who blocked you must still never appear.\n        perfect = replace(candidate, distance_km=0.1, blocked_ids={viewer.id})\n        assert not is_eligible(viewer, perfect)\n\n\nclass TestRepeatViews:\n    def test_an_already_swiped_profile_never_returns(self, viewer, candidate):\n        seen = replace(viewer, swiped_ids={candidate.id})\n        assert rejection_reason(seen, candidate) == \"already_seen\"\n\n\nclass TestAgeGates:\n    def test_rejects_anyone_under_eighteen(self, viewer, candidate):\n        minor = replace(candidate, dob=date(2015, 1, 1))\n        assert rejection_reason(viewer, minor) == \"underage\"\n\n    def test_underage_check_runs_even_with_a_wide_preference(self, candidate, viewer):\n        permissive = replace(viewer, min_age=MIN_LEGAL_AGE, max_age=99)\n        minor = replace(candidate, dob=date(2015, 1, 1))\n        assert rejection_reason(permissive, minor) == \"underage\"\n\n    def test_rejects_far_outside_the_preferred_band(self, viewer, candidate):\n        older = replace(candidate, dob=date(1960, 1, 1))\n        assert rejection_reason(viewer, older) == \"age_out_of_range\"\n\n    def test_allows_a_small_grace_band(self, viewer, candidate):\n        # viewer wants 24-36; a 37-year-old is inside the +2 grace band.\n        edge = replace(candidate, dob=date(1989, 1, 1))\n        assert rejection_reason(viewer, edge) is None\n\n\nclass TestDistanceGate:\n    def test_rejects_beyond_the_radius(self, viewer, candidate):\n        far = replace(candidate, distance_km=120.0)\n        assert rejection_reason(viewer, far) == \"too_far\"\n\n    def test_accepts_exactly_at_the_radius(self, viewer, candidate):\n        edge = replace(candidate, distance_km=50.0)\n        assert rejection_reason(viewer, edge) is None\n\n\nclass TestOrientation:\n    def test_respects_the_viewers_preference(self, viewer, candidate):\n        wrong_gender = replace(candidate, gender=\"male\")\n        assert rejection_reason(viewer, wrong_gender) == \"orientation_viewer\"\n\n    def test_respects_the_candidates_preference(self, viewer, candidate):\n        not_interested = replace(candidate, interested_in=[\"female\"])\n        assert rejection_reason(viewer, not_interested) == \"orientation_candidate\"\n\n    def test_everyone_matches_any_gender(self, viewer, candidate):\n        open_viewer = replace(viewer, interested_in=[\"everyone\"])\n        open_candidate = replace(candidate, gender=\"nonbinary\", interested_in=[\"everyone\"])\n        assert rejection_reason(open_viewer, open_candidate) is None\n\n    def test_matching_is_mutual_not_one_sided(self, viewer, candidate):\n        # The viewer is open to everyone, but the candidate is not open to them.\n        open_viewer = replace(viewer, interested_in=[\"everyone\"])\n        picky = replace(candidate, interested_in=[\"female\"])\n        assert rejection_reason(open_viewer, picky) == \"orientation_candidate\"\n"}, {"p": "tests/unit/test_geo.py", "l": "python", "n": 120, "c": "\"\"\"Distance maths. Reference values are real Mumbai neighbourhoods.\"\"\"\nimport math\n\nimport pytest\n\nfrom app.matching.geo import (\n    Coordinates,\n    bounding_box,\n    display_distance,\n    haversine_km,\n    jitter_for_privacy,\n)\n\n\nclass TestCoordinates:\n    def test_rejects_impossible_latitude(self):\n        with pytest.raises(ValueError, match=\"latitude\"):\n            Coordinates(latitude=91.0, longitude=0.0)\n\n    def test_rejects_impossible_longitude(self):\n        with pytest.raises(ValueError, match=\"longitude\"):\n            Coordinates(latitude=0.0, longitude=181.0)\n\n    def test_accepts_the_poles_and_antimeridian(self):\n        assert Coordinates(latitude=90.0, longitude=180.0)\n        assert Coordinates(latitude=-90.0, longitude=-180.0)\n\n\nclass TestHaversine:\n    def test_identical_points_are_zero(self, mumbai):\n        assert haversine_km(mumbai, mumbai) == 0.0\n\n    def test_bandra_to_pune_is_about_123km(self, mumbai, pune):\n        # Great-circle from Bandra; PostGIS ST_Distance agrees to 0.1 km.\n        # Road distance is ~150 km, which is not what this measures.\n        assert haversine_km(mumbai, pune) == pytest.approx(123.4, abs=0.5)\n\n    def test_is_symmetric(self, mumbai, pune):\n        assert haversine_km(mumbai, pune) == pytest.approx(haversine_km(pune, mumbai))\n\n    def test_antipodal_points_are_half_the_circumference(self):\n        a = Coordinates(latitude=0.0, longitude=0.0)\n        b = Coordinates(latitude=0.0, longitude=180.0)\n        assert haversine_km(a, b) == pytest.approx(math.pi * 6371.0088, rel=1e-6)\n\n    def test_one_degree_of_latitude_is_about_111km(self):\n        a = Coordinates(latitude=0.0, longitude=0.0)\n        b = Coordinates(latitude=1.0, longitude=0.0)\n        assert haversine_km(a, b) == pytest.approx(111.2, abs=0.5)\n\n    def test_never_returns_nan_for_near_identical_points(self):\n        a = Coordinates(latitude=19.0544, longitude=72.8296)\n        b = Coordinates(latitude=19.05440000001, longitude=72.82960000001)\n        result = haversine_km(a, b)\n        assert not math.isnan(result)\n        assert result \u003c 0.001\n\n\nclass TestDisplayDistance:\n    @pytest.mark.parametrize(\n        \"km,expected\",\n        [\n            (0.0, \"less than 1 km away\"),\n            (0.9, \"less than 1 km away\"),\n            (1.0, \"1 km away\"),\n            (6.6, \"7 km away\"),\n            (42.0, \"40 km away\"),\n            (380.0, \"400+ km away\"),\n        ],\n    )\n    def test_labels(self, km, expected):\n        assert display_distance(km) == expected\n\n    def test_never_leaks_a_precise_value(self):\n        # A label must not contain a decimal point, which would narrow a location.\n        for km in (0.4, 3.7, 12.34, 88.88, 512.5):\n            assert \".\" not in display_distance(km)\n\n\nclass TestBoundingBox:\n    def test_box_contains_the_centre(self, mumbai):\n        min_lat, min_lon, max_lat, max_lon = bounding_box(mumbai, 50)\n        assert min_lat \u003c mumbai.latitude \u003c max_lat\n        assert min_lon \u003c mumbai.longitude \u003c max_lon\n\n    def test_box_is_wide_enough_to_hold_the_radius(self, mumbai):\n        min_lat, _, max_lat, _ = bounding_box(mumbai, 50)\n        north = Coordinates(latitude=max_lat, longitude=mumbai.longitude)\n        assert haversine_km(mumbai, north) >= 49.0\n\n    def test_clamps_at_the_pole(self):\n        pole = Coordinates(latitude=89.9, longitude=0.0)\n        min_lat, min_lon, max_lat, max_lon = bounding_box(pole, 500)\n        assert max_lat \u003c= 90.0\n        assert min_lon >= -180.0 and max_lon \u003c= 180.0\n\n\nclass TestPrivacyJitter:\n    def test_snapped_point_stays_within_about_300m(self, mumbai):\n        snapped = jitter_for_privacy(mumbai, meters=300)\n        assert haversine_km(mumbai, snapped) \u003c 0.3\n\n    def test_snapping_is_deterministic(self, mumbai):\n        assert jitter_for_privacy(mumbai) == jitter_for_privacy(mumbai)\n\n    def test_snapping_is_idempotent(self, mumbai):\n        # A snapped point is already on the grid, so snapping again is a no-op.\n        # This is what guarantees a cell has exactly one representative; it was\n        # false while the longitude grid came from the unsnapped latitude.\n        once = jitter_for_privacy(mumbai, meters=300)\n        assert jitter_for_privacy(once, meters=300) == once\n\n    def test_points_in_the_same_cell_collapse_together(self):\n        # Two points well inside one cell must be indistinguishable once stored.\n        # (Points straddling a cell boundary still differ — inherent to snapping,\n        # and harmless: neither can be narrowed below the cell.)\n        base = jitter_for_privacy(Coordinates(latitude=19.0544, longitude=72.8296))\n        nudged = Coordinates(latitude=base.latitude + 0.0002, longitude=base.longitude + 0.0002)\n        assert jitter_for_privacy(nudged) == base\n"}, {"p": "tests/unit/test_models.py", "l": "python", "n": 117, "c": "\"\"\"Model validation — the first line of defence on untrusted input.\"\"\"\nfrom datetime import date\n\nimport pytest\nfrom pydantic import ValidationError\n\nfrom app.models.message import MessageCreate\nfrom app.models.preference import Preferences\nfrom app.models.profile import ProfileCreate\nfrom app.models.upload import PhotoUploadRequest\n\n\ndef valid_profile(**overrides):\n    payload = dict(\n        display_name=\"Aarav\",\n        dob=date(1996, 4, 12),\n        gender=\"male\",\n        interested_in=[\"female\"],\n        bio=\"Filter coffee and weekend treks.\",\n        interests=[\"coffee\", \"trekking\"],\n    )\n    payload.update(overrides)\n    return payload\n\n\nclass TestProfileCreate:\n    def test_accepts_a_valid_profile(self):\n        assert ProfileCreate(**valid_profile()).display_name == \"Aarav\"\n\n    def test_rejects_a_minor(self):\n        with pytest.raises(ValidationError, match=\"at least 18\"):\n            ProfileCreate(**valid_profile(dob=date(2015, 1, 1)))\n\n    def test_rejects_an_absurd_birth_year(self):\n        with pytest.raises(ValidationError):\n            ProfileCreate(**valid_profile(dob=date(1850, 1, 1)))\n\n    def test_rejects_a_one_character_name(self):\n        with pytest.raises(ValidationError):\n            ProfileCreate(**valid_profile(display_name=\"A\"))\n\n    def test_collapses_whitespace_in_a_name(self):\n        assert ProfileCreate(**valid_profile(display_name=\"  Aarav   Sharma \")).display_name == \"Aarav Sharma\"\n\n    def test_requires_at_least_one_orientation(self):\n        with pytest.raises(ValidationError):\n            ProfileCreate(**valid_profile(interested_in=[]))\n\n    def test_rejects_an_unknown_gender(self):\n        with pytest.raises(ValidationError):\n            ProfileCreate(**valid_profile(gender=\"martian\"))\n\n    def test_caps_the_bio_length(self):\n        with pytest.raises(ValidationError):\n            ProfileCreate(**valid_profile(bio=\"x\" * 501))\n\n    def test_normalises_and_deduplicates_interests(self):\n        profile = ProfileCreate(**valid_profile(interests=[\"Coffee\", \" coffee \", \"BOOKS\"]))\n        assert profile.interests == [\"coffee\", \"books\"]\n\n    def test_caps_the_interest_count(self):\n        with pytest.raises(ValidationError):\n            ProfileCreate(**valid_profile(interests=[f\"tag{i}\" for i in range(13)]))\n\n\nclass TestPreferences:\n    def test_defaults_are_sane(self):\n        prefs = Preferences()\n        assert prefs.min_age == 18\n        assert prefs.max_distance_km == 50\n\n    def test_rejects_an_inverted_age_range(self):\n        with pytest.raises(ValidationError, match=\"min_age\"):\n            Preferences(min_age=40, max_age=25)\n\n    def test_rejects_an_under_eighteen_floor(self):\n        with pytest.raises(ValidationError):\n            Preferences(min_age=16)\n\n    def test_rejects_an_unbounded_radius(self):\n        with pytest.raises(ValidationError):\n            Preferences(max_distance_km=10_000)\n\n    def test_allows_equal_min_and_max(self):\n        assert Preferences(min_age=30, max_age=30).min_age == 30\n\n\nclass TestMessageCreate:\n    def test_trims_surrounding_whitespace(self):\n        assert MessageCreate(body=\"  hello  \").body == \"hello\"\n\n    def test_rejects_a_whitespace_only_message(self):\n        with pytest.raises(ValidationError):\n            MessageCreate(body=\"   \")\n\n    def test_rejects_an_empty_message(self):\n        with pytest.raises(ValidationError):\n            MessageCreate(body=\"\")\n\n    def test_caps_the_message_length(self):\n        with pytest.raises(ValidationError):\n            MessageCreate(body=\"x\" * 2001)\n\n    def test_keeps_the_client_id_for_idempotency(self):\n        assert MessageCreate(body=\"hi\", client_id=\"abc\").client_id == \"abc\"\n\n\nclass TestPhotoUpload:\n    @pytest.mark.parametrize(\"mime\", [\"image/jpeg\", \"image/png\", \"image/webp\", \"image/heic\"])\n    def test_accepts_supported_image_types(self, mime):\n        assert PhotoUploadRequest(content_type=mime).content_type == mime\n\n    @pytest.mark.parametrize(\"mime\", [\"image/gif\", \"application/pdf\", \"text/html\", \"image/svg+xml\"])\n    def test_rejects_everything_else(self, mime):\n        with pytest.raises(ValidationError):\n            PhotoUploadRequest(content_type=mime)\n"}, {"p": "tests/unit/test_photo_signing.py", "l": "python", "n": 120, "c": "\"\"\"Batch photo-URL signing.\n\nThe original implementation signed one URL per HTTPS call, so a 20-card deck\nwith six photos each cost up to 120 serial round-trips before a single card\ncould be returned. These tests pin the batching down.\n\"\"\"\nimport pytest\n\nfrom app.services import profile_service\n\n\nclass RecordingSupabase:\n    \"\"\"Counts how many signing requests are made.\"\"\"\n\n    def __init__(self, fail: bool = False, missing: set[str] | None = None):\n        self.calls: list[list[str]] = []\n        self.fail = fail\n        self.missing = missing or set()\n\n    async def create_signed_urls(self, bucket, paths, expires_in=3600):\n        self.calls.append(list(paths))\n        if self.fail:\n            raise RuntimeError(\"storage unavailable\")\n        return {\n            p: (None if p in self.missing else f\"https://signed.example/{p}\")\n            for p in paths\n        }\n\n\n@pytest.fixture\ndef fake_storage(monkeypatch):\n    fake = RecordingSupabase()\n    monkeypatch.setattr(profile_service, \"supabase\", fake)\n    return fake\n\n\nclass TestSignPaths:\n    async def test_signs_everything_in_one_request(self, fake_storage):\n        paths = [f\"user-{i}/photo-{j}.jpg\" for i in range(20) for j in range(6)]\n        signed = await profile_service.sign_paths(paths)\n\n        assert len(fake_storage.calls) == 1, (\n            f\"expected 1 signing request for {len(paths)} photos, \"\n            f\"got {len(fake_storage.calls)}\"\n        )\n        assert len(signed) == 120\n        assert all(url for url in signed.values())\n\n    async def test_no_request_at_all_for_an_empty_deck(self, fake_storage):\n        assert await profile_service.sign_paths([]) == {}\n        assert fake_storage.calls == []\n\n    async def test_a_storage_outage_degrades_instead_of_raising(self, monkeypatch):\n        monkeypatch.setattr(profile_service, \"supabase\", RecordingSupabase(fail=True))\n        signed = await profile_service.sign_paths([\"a/1.jpg\", \"b/2.jpg\"])\n        # Profiles must still render, just without photos.\n        assert signed == {\"a/1.jpg\": None, \"b/2.jpg\": None}\n\n    async def test_one_missing_object_does_not_sink_the_rest(self, monkeypatch):\n        fake = RecordingSupabase(missing={\"b/2.jpg\"})\n        monkeypatch.setattr(profile_service, \"supabase\", fake)\n        signed = await profile_service.sign_paths([\"a/1.jpg\", \"b/2.jpg\", \"c/3.jpg\"])\n        assert signed[\"b/2.jpg\"] is None\n        assert signed[\"a/1.jpg\"] is not None\n        assert signed[\"c/3.jpg\"] is not None\n\n\nclass TestToPhotos:\n    def test_maps_urls_onto_rows(self):\n        rows = [\n            {\"id\": \"p1\", \"storage_path\": \"u/1.jpg\", \"position\": 0, \"is_primary\": True},\n            {\"id\": \"p2\", \"storage_path\": \"u/2.jpg\", \"position\": 1, \"is_primary\": False},\n        ]\n        photos = profile_service._to_photos(rows, {\"u/1.jpg\": \"https://x/1\", \"u/2.jpg\": None})\n        assert photos[0].url == \"https://x/1\"\n        assert photos[1].url is None\n        assert photos[0].is_primary is True\n\n    def test_does_no_io(self):\n        # Pure function: safe to call per card once the batch is signed.\n        rows = [{\"id\": \"p1\", \"storage_path\": \"u/1.jpg\", \"position\": 0, \"is_primary\": True}]\n        assert profile_service._to_photos(rows, {}) [0].url is None\n\n\nclass TestToPublicAcceptsASignedMap:\n    async def test_uses_the_supplied_map_without_signing_again(self, fake_storage):\n        row = {\n            \"id\": \"u1\",\n            \"display_name\": \"Diya\",\n            \"age\": 28,\n            \"gender\": \"female\",\n            \"bio\": \"\",\n            \"interests\": [],\n            \"last_active_at\": None,\n            \"dob\": None,\n        }\n        photos = [{\"id\": \"p1\", \"storage_path\": \"u1/1.jpg\", \"position\": 0, \"is_primary\": True}]\n        signed = {\"u1/1.jpg\": \"https://pre-signed/1\"}\n\n        public = await profile_service.to_public(row, 5.0, photos, signed)\n\n        assert public.photos[0].url == \"https://pre-signed/1\"\n        assert fake_storage.calls == [], \"to_public signed again despite being given a map\"\n\n    async def test_signs_on_its_own_when_no_map_is_given(self, fake_storage):\n        row = {\n            \"id\": \"u1\",\n            \"display_name\": \"Diya\",\n            \"age\": 28,\n            \"gender\": \"female\",\n            \"bio\": \"\",\n            \"interests\": [],\n            \"last_active_at\": None,\n            \"dob\": None,\n        }\n        photos = [{\"id\": \"p1\", \"storage_path\": \"u1/1.jpg\", \"position\": 0, \"is_primary\": True}]\n        public = await profile_service.to_public(row, 5.0, photos)\n        assert len(fake_storage.calls) == 1\n        assert public.photos[0].url is not None\n"}, {"p": "tests/unit/test_ranking.py", "l": "python", "n": 111, "c": "\"\"\"Deck ordering and diversification.\"\"\"\nfrom app.matching.ranking import BAND_WIDTH_KM, RankedCandidate, diversify, rank\nfrom app.matching.scoring import ScoreBreakdown\n\n\ndef make(profile_id: str, score: float, distance_km: float) -> RankedCandidate:\n    return RankedCandidate(\n        profile_id=profile_id,\n        score=score,\n        distance_km=distance_km,\n        breakdown=ScoreBreakdown(components={}, total=score, reasons=[]),\n    )\n\n\ndef bands(candidates) -> list[int]:\n    return [int(c.distance_km // BAND_WIDTH_KM) for c in candidates]\n\n\nclass TestRank:\n    def test_orders_by_descending_score(self):\n        ranked = rank(\n            [make(\"a\", 0.4, 10), make(\"b\", 0.9, 10), make(\"c\", 0.6, 10)],\n            limit=3,\n            apply_diversity=False,\n        )\n        assert [c.profile_id for c in ranked] == [\"b\", \"c\", \"a\"]\n\n    def test_breaks_ties_on_distance(self):\n        ranked = rank([make(\"far\", 0.5, 30), make(\"near\", 0.5, 2)], limit=2, apply_diversity=False)\n        assert [c.profile_id for c in ranked] == [\"near\", \"far\"]\n\n    def test_is_deterministic_for_identical_candidates(self):\n        pair = [make(\"b\", 0.5, 5), make(\"a\", 0.5, 5)]\n        assert [c.profile_id for c in rank(pair, 2)] == [c.profile_id for c in rank(pair, 2)]\n\n    def test_honours_the_limit(self):\n        many = [make(str(i), 0.5, i) for i in range(30)]\n        assert len(rank(many, limit=10)) == 10\n\n    def test_handles_an_empty_pool(self):\n        assert rank([], limit=10) == []\n\n    def test_limit_larger_than_the_pool_is_fine(self):\n        assert len(rank([make(\"a\", 0.5, 1)], limit=10)) == 1\n\n    def test_the_top_card_is_always_the_best_scorer(self):\n        pool = [make(\"best\", 0.95, 30), make(\"mid\", 0.6, 2), make(\"low\", 0.2, 1)]\n        assert rank(pool, limit=3)[0].profile_id == \"best\"\n\n\nclass TestDiversify:\n    def test_loses_nobody(self):\n        pool = [make(str(i), 0.9 - i * 0.01, 1.0) for i in range(10)]\n        result = diversify(pool)\n        assert len(result) == len(pool)\n        assert {c.profile_id for c in result} == {c.profile_id for c in pool}\n\n    @staticmethod\n    def _three_band_pool():\n        \"\"\"Twelve candidates: four each at ~1 km, ~20 km and ~40 km.\"\"\"\n        pool = []\n        for band, base_km in enumerate([1.0, 20.0, 40.0]):\n            for i in range(4):\n                pool.append(make(f\"b{band}-{i}\", 0.9 - band * 0.1 - i * 0.01, base_km + i * 0.1))\n        pool.sort(key=lambda c: -c.score)\n        return pool\n\n    def test_respects_the_window_cap_across_the_front_of_the_deck(self):\n        \"\"\"No run of three from one band while other bands are still available.\n\n        The cap can only hold while at least two bands remain unexhausted — the\n        tail of any deck is forced into whichever band is left. The front is\n        what a user actually swipes through, so that is what is asserted.\n        \"\"\"\n        seq = bands(diversify(self._three_band_pool(), window=3, max_per_window=2))[:8]\n        assert not any(seq[i] == seq[i + 1] == seq[i + 2] for i in range(len(seq) - 2))\n\n    def test_front_of_the_deck_is_more_varied_than_score_order(self):\n        pool = self._three_band_pool()\n        plain = set(bands(pool)[:4])\n        varied = set(bands(diversify(pool, window=3, max_per_window=2))[:4])\n        assert len(varied) > len(plain)\n\n    def test_the_tail_keeps_whatever_band_remains(self):\n        # Not a flaw: once one band is exhausted there is nothing to interleave.\n        result = diversify(self._three_band_pool(), window=3, max_per_window=2)\n        assert len(result) == 12\n\n    def test_promotes_variety_ahead_of_raw_score(self):\n        # Five nearby candidates all outscore the one distant candidate, but the\n        # distant one should still be pulled forward to break the run.\n        pool = [make(f\"near{i}\", 0.9 - i * 0.01, 1.0 + i * 0.1) for i in range(5)]\n        pool.append(make(\"far\", 0.5, 40.0))\n        order = [c.profile_id for c in diversify(pool, window=3, max_per_window=2)]\n        assert order.index(\"far\") \u003c order.index(\"near4\")\n\n    def test_falls_back_to_score_order_when_everyone_shares_a_band(self):\n        # Nothing can satisfy the cap here; it must not stall or drop anyone.\n        pool = [make(f\"n{i}\", 0.9 - i * 0.01, 1.0 + i * 0.1) for i in range(6)]\n        assert [c.profile_id for c in diversify(pool)] == [c.profile_id for c in pool]\n\n    def test_leaves_an_already_varied_list_alone(self):\n        pool = [make(\"a\", 0.9, 1), make(\"b\", 0.8, 12), make(\"c\", 0.7, 30)]\n        assert [c.profile_id for c in diversify(pool)] == [\"a\", \"b\", \"c\"]\n\n    def test_handles_an_empty_pool(self):\n        assert diversify([]) == []\n\n    def test_handles_a_single_candidate(self):\n        assert [c.profile_id for c in diversify([make(\"only\", 0.5, 3)])] == [\"only\"]\n"}, {"p": "tests/unit/test_rate_limit.py", "l": "python", "n": 58, "c": "\"\"\"Sliding-window rate limiter.\"\"\"\nimport pytest\n\nfrom app.core import rate_limit\nfrom app.core.errors import RateLimited\n\n\n@pytest.fixture(autouse=True)\ndef clean():\n    rate_limit.reset()\n    yield\n    rate_limit.reset()\n\n\ndef test_allows_requests_up_to_the_limit():\n    for _ in range(5):\n        rate_limit.hit(\"user-1\", \"swipe\", limit=5, window_seconds=60)\n\n\ndef test_blocks_the_request_past_the_limit():\n    for _ in range(5):\n        rate_limit.hit(\"user-1\", \"swipe\", limit=5, window_seconds=60)\n    with pytest.raises(RateLimited):\n        rate_limit.hit(\"user-1\", \"swipe\", limit=5, window_seconds=60)\n\n\ndef test_limits_are_per_user():\n    for _ in range(5):\n        rate_limit.hit(\"user-1\", \"swipe\", limit=5, window_seconds=60)\n    # A different user is unaffected.\n    rate_limit.hit(\"user-2\", \"swipe\", limit=5, window_seconds=60)\n\n\ndef test_limits_are_per_scope():\n    for _ in range(5):\n        rate_limit.hit(\"user-1\", \"swipe\", limit=5, window_seconds=60)\n    rate_limit.hit(\"user-1\", \"message\", limit=5, window_seconds=60)\n\n\ndef test_the_error_says_when_to_retry():\n    rate_limit.hit(\"user-1\", \"swipe\", limit=1, window_seconds=60)\n    with pytest.raises(RateLimited) as caught:\n        rate_limit.hit(\"user-1\", \"swipe\", limit=1, window_seconds=60)\n    assert caught.value.extra[\"retry_after_seconds\"] > 0\n    assert caught.value.status_code == 429\n\n\ndef test_window_expiry_frees_the_bucket(monkeypatch):\n    clock = {\"t\": 1000.0}\n    monkeypatch.setattr(rate_limit.time, \"monotonic\", lambda: clock[\"t\"])\n\n    rate_limit.hit(\"user-1\", \"swipe\", limit=1, window_seconds=60)\n    with pytest.raises(RateLimited):\n        rate_limit.hit(\"user-1\", \"swipe\", limit=1, window_seconds=60)\n\n    clock[\"t\"] += 61\n    rate_limit.hit(\"user-1\", \"swipe\", limit=1, window_seconds=60)\n"}, {"p": "tests/unit/test_scoring.py", "l": "python", "n": 187, "c": "\"\"\"Compatibility scoring.\"\"\"\nfrom datetime import datetime, timedelta, timezone\n\nimport pytest\n\nfrom app.matching.scoring import (\n    WEIGHTS,\n    activity_score,\n    age_from_dob,\n    age_score,\n    completeness_score,\n    distance_score,\n    interest_score,\n    score_candidate,\n)\n\n\ndef test_weights_sum_to_one():\n    # If this drifts, every total score silently changes scale.\n    assert sum(WEIGHTS.values()) == pytest.approx(1.0)\n\n\nclass TestDistanceScore:\n    def test_zero_distance_scores_one(self):\n        assert distance_score(0, 50) == pytest.approx(1.0)\n\n    def test_at_the_limit_scores_zero(self):\n        assert distance_score(50, 50) == 0.0\n\n    def test_beyond_the_limit_scores_zero(self):\n        assert distance_score(80, 50) == 0.0\n\n    def test_decreases_monotonically(self):\n        scores = [distance_score(km, 50) for km in range(0, 51, 5)]\n        assert scores == sorted(scores, reverse=True)\n\n    def test_closer_always_beats_further(self):\n        assert distance_score(2, 50) > distance_score(20, 50)\n\n    def test_rejects_negative_distance(self):\n        with pytest.raises(ValueError):\n            distance_score(-1, 50)\n\n    def test_zero_radius_does_not_divide_by_zero(self):\n        assert distance_score(0, 0) == 0.0\n\n    def test_stays_in_range(self):\n        for km in (0, 0.5, 5, 25, 49.9):\n            assert 0.0 \u003c= distance_score(km, 50) \u003c= 1.0\n\n\nclass TestInterestScore:\n    def test_identical_sets_score_one(self):\n        assert interest_score([\"coffee\", \"books\"], [\"books\", \"coffee\"]) == 1.0\n\n    def test_disjoint_sets_score_zero(self):\n        assert interest_score([\"coffee\"], [\"cricket\"]) == 0.0\n\n    def test_is_case_insensitive(self):\n        assert interest_score([\"Coffee\"], [\"coffee\"]) == 1.0\n\n    def test_ignores_surrounding_whitespace(self):\n        assert interest_score([\" coffee \"], [\"coffee\"]) == 1.0\n\n    def test_empty_input_scores_zero(self):\n        assert interest_score([], [\"coffee\"]) == 0.0\n        assert interest_score([\"coffee\"], []) == 0.0\n\n    def test_partial_overlap_is_jaccard(self):\n        # {a,b} vs {b,c} -> 1 shared / 3 union\n        assert interest_score([\"a\", \"b\"], [\"b\", \"c\"]) == pytest.approx(1 / 3)\n\n\nclass TestAgeScore:\n    def test_inside_the_band_scores_one(self):\n        assert age_score(30, 24, 36) == 1.0\n\n    def test_on_the_boundary_scores_one(self):\n        assert age_score(24, 24, 36) == 1.0\n        assert age_score(36, 24, 36) == 1.0\n\n    def test_tapers_just_outside(self):\n        assert 0 \u003c age_score(38, 24, 36) \u003c 1\n\n    def test_far_outside_scores_zero(self):\n        assert age_score(50, 24, 36) == 0.0\n\n    def test_tolerates_a_reversed_band(self):\n        assert age_score(30, 36, 24) == 1.0\n\n\nclass TestActivityScore:\n    def test_missing_activity_scores_zero(self):\n        assert activity_score(None) == 0.0\n\n    def test_active_now_scores_one(self, now):\n        assert activity_score(now - timedelta(minutes=5), now) == 1.0\n\n    def test_decays_over_time(self, now):\n        ladder = [\n            activity_score(now - timedelta(hours=1), now),\n            activity_score(now - timedelta(days=2), now),\n            activity_score(now - timedelta(days=5), now),\n            activity_score(now - timedelta(days=20), now),\n            activity_score(now - timedelta(days=90), now),\n        ]\n        assert ladder == sorted(ladder, reverse=True)\n\n    def test_treats_a_naive_datetime_as_utc(self, now):\n        naive = (now - timedelta(minutes=5)).replace(tzinfo=None)\n        assert activity_score(naive, now) == 1.0\n\n    def test_dormant_users_are_not_zeroed_out(self, now):\n        assert activity_score(now - timedelta(days=365), now) > 0\n\n\nclass TestCompletenessScore:\n    def test_empty_profile_scores_zero(self):\n        assert completeness_score(0, 0, 0) == 0.0\n\n    def test_full_profile_scores_one(self):\n        assert completeness_score(6, 300, 10) == pytest.approx(1.0)\n\n    def test_photos_carry_the_most_weight(self):\n        photos_only = completeness_score(3, 0, 0)\n        bio_only = completeness_score(0, 140, 0)\n        assert photos_only > bio_only\n\n\nclass TestAgeFromDob:\n    def test_birthday_passed_this_year(self, today):\n        assert age_from_dob(__import__(\"datetime\").date(1996, 4, 12), today) == 30\n\n    def test_birthday_still_to_come(self, today):\n        assert age_from_dob(__import__(\"datetime\").date(1996, 12, 31), today) == 29\n\n    def test_on_the_birthday_itself(self, today):\n        assert age_from_dob(__import__(\"datetime\").date(2000, 11, 15), today) == 26\n\n\nclass TestScoreCandidate:\n    def _score(self, **overrides):\n        args = dict(\n            distance_km=5.0,\n            max_distance_km=50.0,\n            my_interests=[\"coffee\", \"books\"],\n            their_interests=[\"coffee\", \"running\"],\n            candidate_age=28,\n            min_age=24,\n            max_age=36,\n            last_active_at=datetime.now(timezone.utc),\n            photo_count=3,\n            bio_length=160,\n        )\n        args.update(overrides)\n        return score_candidate(**args)\n\n    def test_total_is_within_range(self):\n        assert 0.0 \u003c= self._score().total \u003c= 1.0\n\n    def test_reports_every_component(self):\n        assert set(self._score().components) == set(WEIGHTS)\n\n    def test_a_nearer_candidate_outscores_a_distant_one(self):\n        assert self._score(distance_km=2.0).total > self._score(distance_km=45.0).total\n\n    def test_shared_interests_appear_in_the_reasons(self):\n        assert any(\"coffee\" in reason.lower() for reason in self._score().reasons)\n\n    def test_no_shared_interests_yields_no_interest_reason(self):\n        result = self._score(their_interests=[\"cricket\"])\n        assert not any(\"both like\" in reason.lower() for reason in result.reasons)\n\n    def test_a_candidate_past_the_limit_loses_the_distance_component(self):\n        assert self._score(distance_km=60.0).components[\"distance\"] == 0.0\n\n    def test_breakdown_serialises_for_the_api(self):\n        payload = self._score().as_dict()\n        assert set(payload) == {\"total\", \"components\", \"reasons\"}\n        assert isinstance(payload[\"total\"], float)\n\n    def test_an_empty_profile_still_scores(self):\n        result = self._score(\n            their_interests=[], photo_count=0, bio_length=0, last_active_at=None\n        )\n        assert result.total >= 0.0\n"}, {"p": "tests/unit/test_security.py", "l": "python", "n": 78, "c": "\"\"\"Supabase JWT verification.\"\"\"\nimport time\n\nimport jwt\nimport pytest\n\nfrom app.config import settings\nfrom app.core.errors import Unauthorized\nfrom app.core.security import decode_token, user_id_from_token\n\nUSER_ID = \"11111111-1111-1111-1111-111111111111\"\n\n\ndef make_token(**overrides) -> str:\n    claims = {\n        \"sub\": USER_ID,\n        \"aud\": \"authenticated\",\n        \"exp\": int(time.time()) + 3600,\n        \"role\": \"authenticated\",\n    }\n    claims.update(overrides)\n    return jwt.encode(claims, settings.supabase_jwt_secret, algorithm=\"HS256\")\n\n\ndef test_accepts_a_valid_token():\n    assert decode_token(make_token())[\"sub\"] == USER_ID\n\n\ndef test_extracts_the_user_id():\n    assert user_id_from_token(make_token()) == USER_ID\n\n\ndef test_rejects_an_expired_token():\n    expired = make_token(exp=int(time.time()) - 10)\n    with pytest.raises(Unauthorized, match=\"expired\"):\n        decode_token(expired)\n\n\ndef test_rejects_a_token_signed_with_the_wrong_secret():\n    forged = jwt.encode(\n        {\"sub\": USER_ID, \"aud\": \"authenticated\", \"exp\": int(time.time()) + 60},\n        \"not-the-real-secret\",\n        algorithm=\"HS256\",\n    )\n    with pytest.raises(Unauthorized):\n        decode_token(forged)\n\n\ndef test_rejects_the_wrong_audience():\n    with pytest.raises(Unauthorized):\n        decode_token(make_token(aud=\"anon\"))\n\n\ndef test_rejects_an_unsigned_token():\n    # The classic alg=none downgrade must not be accepted.\n    unsigned = jwt.encode(\n        {\"sub\": USER_ID, \"aud\": \"authenticated\", \"exp\": int(time.time()) + 60},\n        key=\"\",\n        algorithm=\"none\",\n    )\n    with pytest.raises(Unauthorized):\n        decode_token(unsigned)\n\n\ndef test_rejects_garbage():\n    with pytest.raises(Unauthorized):\n        decode_token(\"not-a-jwt\")\n\n\ndef test_rejects_a_token_with_no_subject():\n    no_sub = jwt.encode(\n        {\"aud\": \"authenticated\", \"exp\": int(time.time()) + 60},\n        settings.supabase_jwt_secret,\n        algorithm=\"HS256\",\n    )\n    with pytest.raises(Unauthorized):\n        decode_token(no_sub)\n"}]</script>
<script>
(function () {
  var FILES = JSON.parse(document.getElementById('data').textContent);
  var byPath = {};
  FILES.forEach(function (f) { byPath[f.p] = f; });

  document.getElementById('stats').textContent =
    FILES.length + ' files · ' + (14317).toLocaleString() + ' lines';

  // ---- group into top-level folders
  function group(list) {
    var groups = {}, order = [];
    list.forEach(function (f) {
      var parts = f.p.split('/');
      var key = parts.length > 1 ? parts[0] : '(root)';
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(f);
    });
    return { groups: groups, order: order };
  }

  var collapsed = {};
  var current = null;
  var treeScroll = document.getElementById('treeScroll');

  function renderTree(filter) {
    var list = FILES;
    if (filter) {
      var q = filter.toLowerCase();
      list = FILES.filter(function (f) { return f.p.toLowerCase().indexOf(q) !== -1; });
    }
    var g = group(list);
    treeScroll.textContent = '';

    g.order.forEach(function (key) {
      var items = g.groups[key];
      var fold = document.createElement('button');
      fold.className = 'folder';
      fold.type = 'button';
      var isOpen = filter ? true : !collapsed[key];
      fold.setAttribute('aria-expanded', String(isOpen));

      var caret = document.createElement('span');
      caret.className = 'caret';
      caret.textContent = isOpen ? '\u25BC' : '\u25B6';
      fold.appendChild(caret);
      fold.appendChild(document.createTextNode(key));

      var count = document.createElement('span');
      count.className = 'count';
      count.textContent = items.length;
      fold.appendChild(count);

      fold.addEventListener('click', function () {
        collapsed[key] = !collapsed[key];
        renderTree(document.getElementById('search').value.trim());
      });
      treeScroll.appendChild(fold);

      if (!isOpen) return;

      items.forEach(function (f) {
        var b = document.createElement('button');
        b.className = 'file';
        b.type = 'button';
        var parts = f.p.split('/');
        var name = parts.pop();
        if (parts.length > 1) {
          var dim = document.createElement('span');
          dim.className = 'dim';
          dim.textContent = parts.slice(1).join('/') + '/';
          b.appendChild(dim);
        }
        b.appendChild(document.createTextNode(name));
        b.title = f.p;
        if (current === f.p) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () { show(f.p); });
        treeScroll.appendChild(b);
      });
    });

    if (!list.length) {
      var none = document.createElement('div');
      none.className = 'empty';
      none.textContent = 'No file matches that.';
      treeScroll.appendChild(none);
    }
  }

  function show(path) {
    var f = byPath[path];
    if (!f) return;
    current = path;

    var head = document.getElementById('path');
    head.textContent = '';
    var parts = path.split('/');
    var name = parts.pop();
    if (parts.length) {
      var dim = document.createElement('span');
      dim.className = 'dim';
      dim.textContent = parts.join('/') + '/';
      head.appendChild(dim);
    }
    head.appendChild(document.createTextNode(name));

    document.getElementById('meta').textContent =
      f.n.toLocaleString() + ' lines · ' + f.l;

    var highlighted;
    try {
      highlighted = window.hljs
        ? window.hljs.highlight(f.c, { language: f.l, ignoreIllegals: true }).value
        : null;
    } catch (e) { highlighted = null; }

    var lines = (highlighted !== null ? highlighted : escapeHtml(f.c)).split('\n');
    var rows = lines.map(function (line, i) {
      return '<tr><td class="ln">' + (i + 1) + '</td><td class="src">' +
             (line || ' ') + '</td></tr>';
    }).join('');

    var wrap = document.getElementById('codeWrap');
    wrap.innerHTML = '<table class="code"><tbody>' + rows + '</tbody></table>';
    wrap.scrollTop = 0;
    wrap.scrollLeft = 0;

    document.body.classList.remove('open');
    renderTree(document.getElementById('search').value.trim());
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---- controls
  document.getElementById('search').addEventListener('input', function (e) {
    renderTree(e.target.value.trim());
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    if (!current) return;
    var btn = this;
    var text = byPath[current].c;
    function done(msg) {
      btn.textContent = msg;
      setTimeout(function () { btn.textContent = 'Copy file'; }, 1600);
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done('Copied'); },
        function () { selectCode(); done('Selected'); });
    } catch (e) { selectCode(); done('Selected'); }
  });

  function selectCode() {
    var table = document.querySelector('table.code');
    if (!table) return;
    var range = document.createRange();
    range.selectNodeContents(table);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  var themeBtn = document.getElementById('themeBtn');
  themeBtn.addEventListener('click', function () {
    var root = document.documentElement;
    var now = root.getAttribute('data-theme');
    var next = now === 'dark' ? 'light' : now === 'light' ? 'dark'
      : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('nm-theme', next); } catch (e) {}
  });
  try {
    var saved = localStorage.getItem('nm-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}

  var drawerBtn = document.getElementById('drawerBtn');
  drawerBtn.addEventListener('click', function () { document.body.classList.toggle('open'); });
  document.getElementById('backdrop').addEventListener('click', function () {
    document.body.classList.remove('open');
  });

  // ---- start on the orientation doc, so the page is useful at rest
  renderTree('');
  if (byPath['START_HERE.md']) show('START_HERE.md');
})();
</script>
